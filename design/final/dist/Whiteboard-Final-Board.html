    return esc(o.label) + (o.required ? '<span class="wb-field__req"> (required)</span>' : "");
  }

  // Each option needs a non-empty label and a string or number value. "" is allowed for a placeholder; values must be distinct.
  function checkSelectOptions(options) {
    var seen = new Set();
    options.forEach(function (op) {
      if (!op || typeof op !== "object") WB.fail("field", "each select option needs a value and a label");
      if (typeof op.label !== "string" || op.label === "") WB.fail("field", "select option label must be a non-empty string");
      if (typeof op.value !== "string" && typeof op.value !== "number") WB.fail("field", "select option value must be a string or number");
      if (seen.has(String(op.value))) WB.fail("field", "duplicate select option value '" + op.value + "'");
      seen.add(String(op.value));
    });
  }

  // Every control has a real <label for>; help, reason and error are tied in by aria-describedby.
  K.field = function (o) {
    WB.need("field", o, ["label"]);
    var id = WB.checkId("field", o.id);
    var type = o.type === undefined ? "text" : o.type;
    if (type === "radio") WB.fail("field", "use K.choiceGroup for radio options");
    WB.oneOf("field", "type", type, FIELD_TYPES);
    if (o.disabled && !o.reason) WB.fail("field", "disabled requires a reason");
    var bounds = {};
    ["min", "max", "step"].forEach(function (key) {
      if (o[key] === undefined) return;
      if (type !== "number") WB.fail("field", key + " is only supported for number fields");
      bounds[key] = finite("field", key, o[key]);
    });
    if (bounds.min !== undefined && bounds.max !== undefined && bounds.min > bounds.max) WB.fail("field", "min must not exceed max");
    if (bounds.step !== undefined && bounds.step <= 0) WB.fail("field", "step must be above 0");
    var h = hints(id, o);
    var common = { id: id, name: o.name || id, "aria-describedby": h.describedby, "aria-invalid": o.error ? "true" : null, required: Boolean(o.required), disabled: Boolean(o.disabled) };
    var label = '<label class="wb-field__label" for="' + esc(id) + '">' + labelText(o) + "</label>";
    if (type === "checkbox" || type === "toggle") {
      var boxValue = o.value === undefined ? null : String(o.value);
      var box = "<input" + attrs(Object.assign({ type: "checkbox", class: type === "toggle" ? "wb-check wb-toggle" : "wb-check", role: type === "toggle" ? "switch" : null, value: boxValue, checked: Boolean(o.checked) }, common)) + ">";
      return '<div class="wb-field wb-field--check">' + box + label + h.html + "</div>";
    }
    var control;
    if (type === "textarea") {
      control = "<textarea" + attrs(Object.assign({ class: "wb-input wb-textarea", rows: "4" }, common)) + ">" + esc(o.value) + "</textarea>";
    } else if (type === "select") {
      if (!Array.isArray(o.options) || !o.options.length) WB.fail("field", "select requires options");
      // value, when given, picks the selected option and takes precedence over option.selected.
      var hasValue = o.value !== undefined && o.value !== null;
      checkSelectOptions(o.options);
      if (hasValue && !o.options.some(function (op) { return String(op.value) === String(o.value); })) WB.fail("field", "value '" + o.value + "' matches no select option");
      control =
        "<select" + attrs(Object.assign({ class: "wb-select" }, common)) + ">" +
        o.options.map(function (op) {
          var selected = hasValue ? String(op.value) === String(o.value) : Boolean(op.selected);
          return "<option" + attrs({ value: op.value, selected: selected }) + ">" + esc(op.label) + "</option>";
        }).join("") +
        "</select>";
    } else {
      // Secret fields never block paste (UX rule 12): no paste handlers, a normal autocomplete hint.
      control = "<input" + attrs(Object.assign({ type: type, class: "wb-input", value: o.value === undefined ? null : String(o.value), autocomplete: autocompleteFor(type) }, bounds, common)) + ">";
    }
    return '<div class="wb-field">' + label + control + h.html + "</div>";
  };

  // A fieldset of radios or checkboxes sharing one name (A-R2). Option ids and values must be distinct.
  K.choiceGroup = function (o) {
    WB.need("choiceGroup", o, ["legend", "name"]);
    var id = WB.checkId("choiceGroup", o.id);
    var type = WB.oneOf("choiceGroup", "type", o.type, ["radio", "checkbox"]);
    if (!Array.isArray(o.options) || o.options.length < 2) WB.fail("choiceGroup", "options needs at least two entries");
    // The fieldset id and its derived hint ids are reserved before any option id is checked.
    var reserved = new Set([id, id + "-help", id + "-error"]);
    var seenIds = new Set();
    var seenValues = new Set();
    var h = hints(id, o);
    var items = o.options.map(function (op) {
      WB.need("choiceGroup", op, ["value", "label"]);
      WB.checkId("choiceGroup", op.id);
      if (reserved.has(op.id)) WB.fail("choiceGroup", "option id '" + op.id + "' collides with the group id or its help/error id");
      if (seenIds.has(op.id)) WB.fail("choiceGroup", "duplicate option id '" + op.id + "'");
      if (seenValues.has(String(op.value))) WB.fail("choiceGroup", "duplicate option value '" + op.value + "'");
      seenIds.add(op.id);
      seenValues.add(String(op.value));
      var input = "<input" + attrs({ type: type, class: "wb-check", id: op.id, name: o.name, value: op.value, checked: Boolean(op.checked), required: type === "radio" && o.required ? true : null }) + ">";
      return '<div class="wb-choice">' + input + '<label class="wb-choice__label" for="' + esc(op.id) + '">' + esc(op.label) + "</label></div>";
    });
    return (
      "<fieldset" + attrs({ class: "wb-choicegroup", id: id, "aria-describedby": h.describedby, "aria-invalid": o.error ? "true" : null }) + ">" +
      '<legend class="wb-field__label">' + esc(o.legend) + (o.required ? '<span class="wb-field__req"> (required)</span>' : "") + "</legend>" +
      items.join("") + h.html + "</fieldset>"
    );
  };

<script>/* kit/signature.js */
/* Whiteboard final kit: signature components with contracts the board lacked (deep dive, Component gaps):
   receipt slip, work trail, context line, save status (C12), honest figure, timer and course banner/card. */
(function (root) {
  "use strict";
  var WB = (root.WB = root.WB || {});
  var K = (WB.K = WB.K || {});
  var esc = WB.esc;

  function kvRow(label, valueHtml) {
    return '<div class="wb-kv__row"><dt>' + esc(label) + "</dt><dd>" + valueHtml + "</dd></div>";
  }

  // Immutable receipt facts as plain, selectable text. No spinner and no pending look (UX rule 2).
  K.receipt = function (o) {
    WB.need("receipt", o, ["ref", "item", "course", "acceptedAt", "timeZone"]);
    var files = "";
    if (o.files !== undefined) {
      if (!Array.isArray(o.files) || !o.files.length) WB.fail("receipt", "files must be a non-empty array when given");
      files = kvRow("Files", '<ul class="wb-receipt__files">' + o.files.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>");
    }
    return (
      '<section class="wb-receipt" aria-label="Receipt">' +
      '<p class="wb-receipt__head">' + K.icon("check-circle") + '<span class="wb-receipt__title">' + esc(WB.STATUS.received.label) + "</span>" +
      (o.late ? '<span class="wb-status__late">' + K.icon(WB.STATUS.late.icon) + esc(WB.STATUS.late.label) + "</span>" : "") + "</p>" +
      '<dl class="wb-kv wb-receipt__fields">' +
      kvRow("Receipt", '<span class="wb-receipt__ref">' + esc(o.ref) + "</span>") +
      kvRow("Item", esc(o.item)) +
      kvRow("Course", esc(o.course)) +
      kvRow("Accepted", esc(o.acceptedAt) + ' <span class="wb-receipt__tz">' + esc(o.timeZone) + "</span>") +
      (o.attempt !== undefined ? kvRow("Attempt", esc(o.attempt)) : "") +
      files +
      "</dl></section>"
    );
  };

  var TRAIL_STATES = { done: ["check-circle", "Done"], current: ["clock", "Current step"], todo: ["doc", "Not done yet"] };

  K.trail = function (o) {
    if (!o || !Array.isArray(o.steps) || !o.steps.length) WB.fail("trail", "steps must be a non-empty array");
    var steps = o.steps.map(function (s) {
      WB.need("trail", s, ["label", "state"]);
      var st = TRAIL_STATES[s.state];
      if (!st) WB.fail("trail", "unknown step state '" + s.state + "'");
      return (
        '<li class="wb-trail__step wb-trail__step--' + s.state + '"' + (s.state === "current" ? ' aria-current="step"' : "") + ">" + K.icon(st[0]) +
        '<span class="wb-trail__label">' + esc(s.label) + '<span class="wb-sr"> (' + st[1] + ")</span></span>" +
        (s.meta ? '<span class="wb-trail__meta">' + esc(s.meta) + "</span>" : "") + "</li>"
      );
    });
    return '<ol class="wb-trail" aria-label="' + esc(o.label || "Work trail") + '">' + steps.join("") + "</ol>";
  };

  WB.crumbs = function (fn, crumbs) {

    saving: Object.freeze({ label: "Saving…", icon: "hourglass", tone: "neutral" }),
    saved: Object.freeze({ label: "Saved", icon: "check", tone: "success" }),
    savedLocal: Object.freeze({ label: "Saved locally", icon: "offline", tone: "warning" }),
    failed: Object.freeze({ label: "Save failed", icon: "alert", tone: "error" }),

    );

<script>/* kit/adaptive.js */
/* Whiteboard final kit: adaptive components that change form by render context (plan §2 platform model),
   plus the shared pieces the three shells use. Switching is by ctx, never by media query. */
(function (root) {
  "use strict";
  var WB = (root.WB = root.WB || {});
  var K = (WB.K = WB.K || {});
  var esc = WB.esc;
  var attrs = WB.attrs;

  var DIALOG_KINDS = ["confirm", "form", "destructive", "capture"];

  function dialogVariant(ctx, o) {
    if (ctx.platform === "web") return "modal";
    if (ctx.platform === "ipad") return o.presentation === "popover" ? "popover" : "formsheet";

  }

  // Modal on web, form sheet or popover on iPad, bottom sheet (full screen for capture) on iPhone.
  K.dialog = function (ctx, o) {
    WB.checkCtx("dialog", ctx);
    WB.need("dialog", o, ["title", "body"]);

    var kind = o.kind === undefined ? "confirm" : WB.oneOf("dialog", "kind", o.kind, DIALOG_KINDS);
    if (o.presentation !== undefined) WB.oneOf("dialog", "presentation", o.presentation, ["popover"]);
    if (o.actions !== undefined && !Array.isArray(o.actions)) WB.fail("dialog", "actions must be an array");
    if (o.cancelLabel !== undefined && (typeof o.cancelLabel !== "string" || !o.cancelLabel.trim())) WB.fail("dialog", "cancelLabel must be a non-empty string");
    var variant = dialogVariant(ctx, o);
    var actions = (o.actions || []).map(function (a) {
      WB.checkId("dialog", a.id);
      if (kind === "destructive" && (a.kind === undefined || a.kind === "primary")) return WB.renderAction("dialog", Object.assign({}, a, { kind: "danger" }));
      return WB.renderAction("dialog", a);
    });
    var close = K.button({ label: o.cancelLabel === undefined ? (kind === "capture" ? "Close" : "Cancel") : o.cancelLabel, kind: "secondary", act: "close-dialog", target: id });

      "<div" + attrs({ class: "wb-scrim", "data-dialog": id, hidden: hidden }) + "></div>" +

      '<div class="wb-dialog__head"><h2 class="wb-dialog__title" id="' + esc(id) + '-title">' + esc(o.title) + "</h2></div>" +
      '<div class="wb-dialog__body">' + o.body + "</div>" +
      '<div class="wb-dialog__actions">' + close + actions.join("") + "</div></div>"
    );
  };

  // ---------- Layout primitives (Phase 2 gate M6): pages lay out with these, never with style attributes ----------
  // Items are trusted HTML strings from kit calls; empty strings are dropped and anything else throws.
  function layoutItems(fn, items) {
    if (!Array.isArray(items)) WB.fail(fn, "items must be an array of HTML strings");
    items.forEach(function (x) { if (typeof x !== "string") WB.fail(fn, "every item must be an HTML string"); });
    return items.filter(function (x) { return x !== ""; });
  }

  K.stack = function (ctx, o) {
    WB.checkCtx("stack", ctx);
    var gap = o.gap === undefined ? "md" : o.gap;
    WB.oneOf("stack", "gap", gap, ["sm", "md", "lg"]);
    return '<div class="wb-stack wb-stack--' + gap + '">' + layoutItems("stack", o.items).join("") + "</div>";
  };

  // A grid of cols columns when regular and compactCols when compact.
  K.grid = function (ctx, o) {
    WB.checkCtx("grid", ctx);
    var cols = o.cols === undefined ? 3 : o.cols;
    var compact = o.compactCols === undefined ? 1 : o.compactCols;

    WB.oneOf("grid", "compactCols", compact, [1, 2]);

  };

  // with the rail first when railFirst.

  };

  K.split = function (ctx, o) {
    WB.checkCtx("split", ctx);
    WB.need("split", o, ["listLabel", "detailLabel", "list", "detail"]);

      return (
        '<section class="wb-split__pane wb-split__pane--' + which + '" aria-labelledby="' + esc(id) + "-" + which + '-title">' + (extra || "") +
        '<h2 class="wb-split__title" id="' + esc(id) + "-" + which + '-title">' + esc(label) + "</h2>" + html + "</section>"
      );
    }

    }

      ? pane("detail", o.detailLabel, o.detail, K.button({ label: "Back to " + o.listLabel, kind: "quiet", icon: "chev-l", act: "back" }))
      : pane("list", o.listLabel, o.list);

  };

  function cell(row, key) {
    if (!row.cells || !Object.prototype.hasOwnProperty.call(row.cells, key)) WB.fail("table", "row '" + row.id + "' has no cell '" + key + "'");
    return String(row.cells[key]);
  }
  function primaryHtml(row, key) {
    var html = cell(row, key);
    return row.go ? '<a class="wb-link" href="' + WB.goHref(row.go, "table") + '" data-go="' + esc(row.go) + '">' + html + "</a>" : html;
  }
  function sortText(col, dir) {
    var labels = col.sortLabels || { asc: "ascending", desc: "descending" };

      var cls = c.numeric ? ' class="wb-table__num"' : "";

      var current = o.sort && o.sort.key === c.key;
      var ariaSort = current ? (o.sort.dir === "desc" ? "descending" : "ascending") : "none";
      var btn = "<button" + attrs({ type: "button", class: "wb-sortbtn", "data-act": "sort", "data-target": id, "data-key": c.key }) + ">" + esc(c.label) + K.icon("sort") + "</button>";
      return '<th scope="col" aria-sort="' + ariaSort + '"' + cls + ">" + btn + "</th>";
    });
    var body = o.rows.map(function (r) {
      var sel = o.selectedId !== undefined && r.id === o.selectedId;

        "<tr" + attrs({ class: sel ? "is-selected" : null, "aria-current": sel ? "true" : null }) + ">" +

      '<div class="wb-table-wrap"><table class="wb-table" id="' + esc(id) + '"><caption>' + esc(o.caption) + "</caption><thead><tr>" + head.join("") +
      "</tr></thead><tbody>" + body.join("") + "</tbody></table></div>"
    );
  }

  // A-R10: compact tables keep a labelled sort control above the row-cards.
  function sortControl(id, o, cols) {

    sortable.forEach(function (c) {

      '<div class="wb-field wb-sort"><label class="wb-field__label" for="' + esc(id) + '-sort">Sort by</label>' +

    );
  }

  function compactTable(id, o, cols, primary) {

      var sel = o.selectedId !== undefined && r.id === o.selectedId;
      return (
        "<li" + attrs({ class: "wb-rowcard" + (sel ? " is-selected" : ""), "aria-current": sel ? "true" : null }) + '><p class="wb-rowcard__title">' + primaryHtml(r, primary.key) + "</p>" +
        '<dl class="wb-rowcard__fields">' + others.map(function (c) { return '<div class="wb-kv__row"><dt>' + esc(c.label) + "</dt><dd>" + cell(r, c.key) + "</dd></div>"; }).join("") + "</dl></li>"

  K.table = function (ctx, o) {
    WB.checkCtx("table", ctx);
    WB.need("table", o, ["caption", "empty"]);
    var id = WB.checkId("table", o.id);

    if (!Array.isArray(o.rows)) WB.fail("table", "rows must be an array");
    o.columns.forEach(function (c) { WB.need("table", c, ["key", "label"]); });
    var primaries = o.columns.filter(function (c) { return c.primary; });
    if (primaries.length > 1) WB.fail("table", "only one column may be primary");
    var primary = primaries[0] || o.columns[0];

      if (!o.columns.some(function (c) { return c.sortable && c.key === o.sort.key; })) WB.fail("table", "sort key must be a sortable column");

  };

  K.actionsPlacement = function (ctx) {
    WB.checkCtx("actionsPlacement", ctx);
    return ctx.platform === "iphone" ? "dock" : "header";
  };

  // Header toolbar on web and iPad; bottom dock on iPhone with one primary, at most one secondary,
  // and the rest under "More actions".
  K.actions = function (ctx, actions, opts) {
    WB.checkCtx("actions", ctx);
    if (!Array.isArray(actions)) WB.fail("actions", "actions must be an array");
    if (!actions.length) return "";

    if (K.actionsPlacement(ctx) === "header") return '<div class="wb-toolbar" role="toolbar" aria-label="' + esc(label) + '">' + WB.renderActions("actions", actions) + "</div>";
    var pIndex = actions.findIndex(function (a) { return a.kind === "primary"; });
    if (pIndex < 0) pIndex = 0;
    var rest = actions.filter(function (_, i) { return i !== pIndex; });
    var shown = [actions[pIndex]].concat(rest.slice(0, 1));
    var more = rest.slice(1);
    var menu = more.length
      ? '<details class="wb-more"><summary class="wb-more__summary">' + K.icon("more") + "More actions</summary><div class=\"wb-more__menu\">" + WB.renderActions("actions", more) + "</div></details>"
      : "";
    return '<div class="wb-dock" role="group" aria-label="' + esc(label) + '">' + WB.renderActions("actions", shown) + menu + "</div>";
  };

  // BD6 / BD11: review and handoff tiers show the last result, protective actions and a larger-screen pointer.
  K.handoff = function (ctx, o) {
    WB.checkCtx("handoff", ctx);
    if (ctx.tier === "full") WB.fail("handoff", "only for the review and handoff tiers");
    WB.need("handoff", o, ["title"]);
    var protective = o.protectiveActions && o.protectiveActions.length && ctx.tier === "review" ? K.actions(ctx, o.protectiveActions, { label: "Protective actions" }) : "";
    return (
      '<section class="wb-handoff wb-handoff--' + ctx.tier + '" aria-label="' + esc(o.title) + '"><p class="wb-handoff__title">' + K.icon("screen") + esc(o.title) + "</p>" +
      (o.lastResult ? '<div class="wb-handoff__result">' + o.lastResult + "</div>" : "") +
      (o.note ? '<p class="wb-handoff__note">' + esc(o.note) + "</p>" : "") + protective +

    );
  };

  K.shell = function (ctx, opts) {
    WB.checkCtx("shell", ctx);
    var render = WB.shells[ctx.platform];

  };

  // ---------- Shared shell pieces ----------
  var NAV_IDS = WB.NAV_GLOBAL.concat(WB.NAV_UTILITY).map(function (n) { return n.id; });

  WB.shellOpts = function (fn, ctx, o) {
    WB.checkCtx(fn, ctx);

      WB.need(fn, o.course, ["key", "code", "title"]);

  };

  WB.nsId = function (o, part) { return o.ns + "-" + part; };

  WB.navLink = function (o, item, cls, showLabel) {

    return "<a" + attrs({ class: cls, href: WB.safeHref(o.hrefs[item.id], "shell"), "data-nav": item.id, "aria-current": current ? "page" : null }) + ">" + K.icon(item.icon) + label + "</a>";
  };

  WB.navList = function (o, items, cls, listCls) {
    return '<ul class="' + listCls + '">' + items.map(function (n) { return "<li>" + WB.navLink(o, n, cls) + "</li>"; }).join("") + "</ul>";
  };

  WB.mainNav = function (o, cls, listCls, navCls, role) {
    var labels = role === "instructor" ? { today: "Teaching", courses: "My courses" } : role === "ta" ? { today: "My grading", courses: "My courses" } : {};

  };

  WB.utilityNav = function (o, cls) {
    return '<nav class="wb-utility' + (cls ? " " + cls : "") + '" aria-label="Utility">' + WB.navList(o, WB.NAV_UTILITY, "wb-navitem wb-navitem--utility", "wb-utility__list") + "</nav>";
  };

  WB.courseTabs = function (o) {

    var core = o.course.tabs.filter(function (t) { return primary.indexOf(t.id) >= 0; });
    var other = o.course.tabs.filter(function (t) { return primary.indexOf(t.id) < 0; });
    var active = other.filter(function (t) { return t.current; })[0];
    var more = other.length ? '<details class="wb-course-more" id="' + esc(WB.nsId(o, "course-more")) + '"><summary' + attrs({ class: active ? "is-current" : null, "aria-label": (active ? active.label + ", " : "") + "More course sections" }) + '>' + esc(active ? active.label : "More") + K.icon("chev-d") + '</summary>' + WB.linkList("shell", other, "More course sections", "wb-course-more__list") + '</details>' : "";

      '<nav class="' + cls + '" aria-label="' + esc(label) + '"><ul>' +
      items.map(function (t) {
        WB.need(fn, t, ["label"]);

        return "<li><a" + attrs({ class: "wb-navitem", href: a.href, "data-go": a["data-go"], "aria-current": t.current ? "page" : null }) + ">" + esc(t.label) + "</a></li>";
      }).join("") +
      "</ul></nav>"
    );
  };

  WB.staffTools = function (ctx, o) {
    if (!o.course || !o.course.tools || WB.STAFF.indexOf(ctx.role) < 0) return "";
    var links = WB.linkList("shell", o.course.tools, "Course tools", "wb-nav wb-nav--tools");

<script>/* manifest/define.js */
/* Whiteboard Phase 2b: namespaces and the frozen-registration helper for manifest/ and fixtures/.
   Source: design/reviews/final-design-plan-2026-11-15.md (Phase 2b); team plan §3 Step 1 and amendment A2.
   This extra file is chosen by Claude under owner delegation. Plain script, no dependencies; loads after
   the kit in a browser or a bare node:vm context. WB.manifest holds page, navigation, journey, state and
   status maps; WB.data holds fictional "reconstructed" records; WB.sel holds pure selectors. */
(function (root) {
  "use strict";
  var WB = (root.WB = root.WB || {});

  function deepFreeze(x) {
    if (x && (typeof x === "object" || typeof x === "function") && !Object.isFrozen(x)) {
      Object.freeze(x);
      Object.getOwnPropertyNames(x).forEach(function (k) {
        var d = Object.getOwnPropertyDescriptor(x, k);
        if (d && "value" in d) deepFreeze(d.value);
      });
    }
    return x;
  }

  function lock(obj, key, value) {
    Object.defineProperty(obj, key, { value: value, enumerable: true, writable: false, configurable: false });
  }

  ["manifest", "data", "sel"].forEach(function (name) {
    if (!WB[name]) WB[name] = {};
  });

  // Adds a deep-frozen value under ns[key]. A key is defined once; after manifest/finalize.js has frozen
  // the namespaces, every further definition is refused.
  function defineFrozen(ns, key, value) {
    if (!ns || typeof ns !== "object") throw new Error("WB.defineFrozen: namespace must be an object");
    if (typeof key !== "string" || key === "") throw new Error("WB.defineFrozen: key must be a non-empty string");
    if (Object.isFrozen(ns)) throw new Error("WB.defineFrozen: data is finalized ('" + key + "')");
    if (Object.prototype.hasOwnProperty.call(ns, key)) throw new Error("WB.defineFrozen: '" + key + "' already defined");
    lock(ns, key, deepFreeze(value));
    return ns[key];
  }

  lock(WB, "deepFreeze", deepFreeze);
  lock(WB, "defineFrozen", defineFrozen);
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* manifest/states.js */

    s("deviceDenied", "Denied device permission", "Offer a file, manual or keyboard alternative; do not re-request or blame the user."),

<script>/* manifest/status.js */
/* Whiteboard Phase 2b: the only bridge from record states to kit status keys.
   Source: design/final/decisions.md BD39 (who sees which word), C6 (no grading hint before release), C4 (no
   recall of a released snapshot); kit/API.md "Status vocabulary (ownership)". This file holds keys only; the
   kit (core.js) owns every word and its visibility. Team plan §3 Step 3 with amendments A1, A3 and B2, and fix R12
   (correctionHeld shows the student priorVisible). */
(function (root) {
  "use strict";
  var WB = root.WB;

  // Submission and result records (coursework submissions and scenario overrides of them).
  var RECORD_STATES = ["notStarted", "draft", "queued", "received", "graded", "held", "released", "correctionHeld", "feedbackUpdated", "missing", "excused"];
  // Announcement records (fixtures/comms.js).
  var ANNOUNCEMENT_STATES = ["published", "scheduled", "draft", "withdrawn"];

  // student: before the outcome is released; studentReleased: after; staff: instructor and TA.
  // "prior" means the student sees the snapshot in record.priorVisible {state, released}: an unreleased
  // excusal, and a held correction (R12: the latest released snapshot stays visible until the correction is
  // released; staff see held).
  var TABLE = {
    notStarted: { student: "notStarted", studentReleased: "notStarted", staff: null },
    draft: { student: "draft", studentReleased: "draft", staff: null },
    queued: { student: "queued", studentReleased: "queued", staff: null },
    received: { student: "receivedNotReleased", studentReleased: "receivedNotReleased", staff: "received" },
    graded: { student: "receivedNotReleased", studentReleased: "receivedNotReleased", staff: "graded" },
    held: { student: "receivedNotReleased", studentReleased: "receivedNotReleased", staff: "held" },
    released: { student: "released", studentReleased: "released", staff: "released" },
    correctionHeld: { student: "prior", studentReleased: "prior", staff: "held" },
    feedbackUpdated: { student: "released", studentReleased: "feedbackUpdated", staff: "released" },
    missing: { student: "notReceivedClosed", studentReleased: "missing", staff: "missing" },
    excused: { student: "prior", studentReleased: "excused", staff: "excused" },
  };
  var LATE_KEYS = ["received", "receivedNotReleased"];

  function fail(what) {
    throw new Error("WB.manifest.status.keyFor: " + what);
  }

  // Returns {key, late, released} or null. `released` is the release flag of the snapshot actually shown,
  // so callers pass it on to the kit's visibility rule unchanged.
  function keyFor(record, role, opts) {
    if (!record || typeof record !== "object") fail("record must be an object");
    var own = !opts || opts.own !== false;
    var row = TABLE[record.state];
    if (!row) fail("unknown record state '" + record.state + "'");
    if (role === "guest") return null;
    var isStaff = role === "instructor" || role === "ta";
    if (!isStaff && role !== "student") fail("unknown role '" + role + "'");
    if (role === "student" && !own) return null;
    var released = record.released === true;
    var key;
    if (isStaff) {
      key = row.staff;
    } else {
      key = released ? row.studentReleased : row.student;
      if (key === "prior") {
        var prior = record.priorVisible;
        if (!prior || typeof prior !== "object") fail("an unreleased excusal or a held correction needs priorVisible {state, released}");
        if (prior.state === "correctionHeld") fail("priorVisible cannot itself be 'correctionHeld'");
        // R16: a released excusal is terminal (it resolves to excused); an unreleased one would need recursion.
        if (prior.state === "excused" && prior.released !== true) fail("priorVisible 'excused' must be released");
        return keyFor({ state: prior.state, released: prior.released === true, late: record.late }, role, opts);
      }
    }
    if (key === null) return null;
    return { key: key, late: record.late === true && LATE_KEYS.indexOf(key) >= 0, released: released };
  }

  WB.defineFrozen(WB.manifest, "status", {
    RECORD_STATES: RECORD_STATES,
    ANNOUNCEMENT_STATES: ANNOUNCEMENT_STATES,
    TABLE: TABLE,
    keyFor: keyFor,
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>

<script>/* pages/seg1-access/W01.js */
/* W01 Institution sign-in (Phase 3 seg1). Guest only, access mode. The hand-off to the institution is drawn as a
   leaving dialog whose continue item is preview-only: a link would keep the guest role, and the tour carries the
   identity change to W02 (amendment A1). Blocking states draw no opener and no dialog. Contract: pages/PAGES.md. */

  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "filteredEmpty", "saving", "saveFailed", "offline", "permissionUnavailable"];
  var BLOCKING = ["filteredEmpty", "saving", "saveFailed", "offline", "permissionUnavailable"];

      a.K.button({ label: "Use another account", note: ROLE_NOTE }),
    ]);
  }

  function body(a) {
    if (a.state === "loading") {
      return P.stack(a, [
        '<p role="status">' + WB.esc("Verifying your sign-in with " + inst(a).name + "…") + "</p>",
        a.K.button({ label: "Continue", kind: "primary", disabled: true, reason: "Verification is still running", id: P.id(a, "continue") }),
      ]);
    }
    if (a.state === "sessionExpired") {
      return P.stack(a, [
        a.K.notice({ tone: "warning", title: "This sign-in link has expired or was already used", body: P.p("Nothing was submitted."), actions: [HELP] }),
        a.K.button({ label: "Sign in again", kind: "primary", note: ROLE_NOTE }),
      ]);
    }
    if (a.state === "permissionUnavailable") return noAccess(a);
    if (a.state === "offline") return a.K.notice({ tone: "warning", title: "Can't verify while offline. Nothing changed", actions: [{ label: "Check again", go: "W02" }] });
    if (guest(a)) return a.K.notice({ tone: "info", title: "Sign-in was not completed. Nothing was submitted", actions: [{ label: "Retry sign-in", go: "W01" }] });
    return signedIn(a);
  }

  WB.definePage("W02", {
    states: STATES,
    na: P.na(STATES, {
      firstUseEmpty: "Auth return always shows the result of one sign-in",
      success: "A confirmed sign-in is the default view of this page",
    }),
    variants: { "destination-gone": "Requested page no longer available" },
    render: function (a) {
      var out = { mode: "access", title: a.page.title, body: body(a), links: [HELP] };
      if (a.state === null && !guest(a) && a.variant !== "destination-gone") out.dialog = switchDialog(a);
      return out;
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg1-access/W03.js */
/* W03 Invitation (Phase 3 seg1). No invitation record exists in the fixtures, so the page states only the
   supported fact (access from the enrollment) and that the invitation cannot be verified; Accept stays disabled
   (amendment A7). Guests see the institution only. Identity changes are preview-only (A1). Contract: pages/PAGES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "permissionUnavailable"];
  var ROLE_NOTE = "Preview only: in this prototype, switch the role in the viewer bar or follow the tour";
  var HELP = { label: "Invitation help", go: "W12" };

  function inst(a) { return a.view.data.world.institution; }
  function guest(a) { return a.who.personId === null; }
  function accept(a, reason) {
    return a.K.button({ label: "Accept invitation", kind: "primary", disabled: true, reason: reason, id: P.id(a, "accept") });
  }
  function replacement(a) {
    return a.K.button({ label: "Request a replacement", note: "Preview only: a request is not an approval and nothing is sent" });
  }

  function guestBody(a) {
    var expired = a.state === "permissionUnavailable";
    return P.stack(a, [
      expired ? a.K.notice({ tone: "info", title: "This invitation has expired or was withdrawn. It cannot grant access" }) : "",
      a.K.kv([{ label: "Institution", value: inst(a).name }]),
      P.p("The recipient is hidden until you sign in."),
      expired
        ? a.K.button({ label: "Sign in to review", disabled: true, reason: "This invitation is no longer valid", id: P.id(a, "review") })
        : P.links(a, [{ label: "Sign in to review", go: "W01" }]),
      expired ? replacement(a) : "",
    ]);
  }

  function facts(a) {
    var c = a.sel.course(a.view, a.who.courseId);
    var rows = [
      { label: "Institution", value: inst(a).name },
      { label: "Course", value: c.code + " " + c.title + ", " + c.term },
      { label: "Role", value: WB.ROLE_LABELS[a.role] },
    ];
    var end = a.role === "ta" ? a.sel.accessEnd(a.view, a.who.personId, a.who.courseId) : null;
    if (end) rows.push({ label: "Grading access ends", value: P.when(a, end) });
    return a.K.kv(rows);
  }

  function current(a) {
    var course = P.recordGo("W14", "course", a.who.courseId);
    return P.stack(a, [
      facts(a),
      P.p("You already have access to this course as " + WB.ROLE_LABELS[a.role] + "."),
      P.p("This invitation's status cannot be checked in this prototype."),
      a.role === "ta" ? P.p("Accepting grants your allocated grading scope only, never policy or release.") : "",
      accept(a, "This invitation cannot be verified"),
      P.links(a, [course ? { label: "Open course", go: course } : null, { label: "Continue setup", go: "W04" }]),
    ]);
  }

  function signedBody(a) {
    if (P.taEnded(a)) return P.taEndedNotice(a);
    if (a.state === "loading") return P.loading(a, "the invitation");
    if (a.state === "permissionUnavailable") {
      return P.stack(a, [
        a.K.notice({ tone: "info", title: "This invitation has expired or was withdrawn. It cannot grant access", actions: [HELP] }),
        accept(a, "This invitation is no longer valid"), replacement(a),
      ]);
    }
    if (a.variant === "wrong-account") {
      return P.stack(a, [
        a.K.notice({ tone: "info", title: "This invitation is for a different account. You are signed in as " + a.sel.person(a.view, a.who.personId).name }),
        P.p("The recipient is hidden."),
        accept(a, "Signed in with a different account"),
        a.K.button({ label: "Use another account", note: ROLE_NOTE }),
      ]);
    }
    return current(a);
  }

  WB.definePage("W03", {
    states: STATES,
    na: P.na(STATES, {
      saveFailed: "No pending invitation exists in the fixtures, so no acceptance can be drawn (kit request)",
      success: "No pending invitation exists in the fixtures, so no acceptance can be drawn (kit request)",
      offline: "Nothing is sent from this page; the invitation cannot be verified here",
    }),
    variants: { "wrong-account": "Invitation for a different account" },
    render: function (a) {
      if (guest(a)) {
        return { mode: "access", title: a.page.title, body: a.state === "loading" ? P.loading(a, "the invitation") : guestBody(a), links: [HELP] };
      }
      return { title: a.page.title, body: signedBody(a), navActive: null };
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg1-access/W04.js */
/* W04 Onboarding (Phase 3 seg1). Three steps chosen by variant: confirm managed details, preferences, first
   task. Invalid forces step 1; saving, save failure and offline force step 2, where saving happens. Institution
   facts are read-only text; no control changes a role. A TA after access ends gets the notice, no queue link. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "firstUseEmpty", "invalid", "saving", "saveFailed", "offline"];
  var MAX_NAME = 80;
  var STEPS = ["Confirm details", "Preferences", "First task"];

  function inst(a) { return a.view.data.world.institution; }
  function stepOf(a) {
    if (a.state === "invalid") return 0;
    if (["saving", "saveFailed", "offline"].indexOf(a.state) >= 0) return 1;
    return a.variant === "preferences" ? 1 : a.variant === "first-task" ? 2 : 0;
  }
  function trail(a, step) {
    return a.K.trail({ label: "Setup steps", steps: STEPS.map(function (s, i) { return { label: s, state: i < step ? "done" : i === step ? "current" : "todo" }; }) });
  }
  function ownCourses(a) {
    var row = a.view.data.world.enrollments.filter(function (e) { return e.person_id === a.who.personId; })[0];
    return (row ? row.course_ids : []).map(function (id) { return a.sel.course(a.view, id); }).filter(Boolean);
  }

  function details(a) {
    var me = a.sel.person(a.view, a.who.personId);
    var c = a.sel.course(a.view, a.who.courseId);
    var kv = a.K.kv([
      { label: "Name", value: me.name }, { label: "Email", value: me.email },
      { label: "Role", value: WB.ROLE_LABELS[a.role] }, { label: "Course", value: c.code + " " + c.title },
    ]);
    var err = a.state === "invalid" ? "Use " + MAX_NAME + " characters or fewer" : undefined;
    return P.stack(a, [
      a.K.section({ title: "Managed by " + inst(a).name, body: kv, level: 2 }),
      a.K.field({ id: P.id(a, "name"), label: "Preferred name", error: err }),
      P.links(a, [{ label: "Continue", go: "W04:preferences" }, { label: "Something is wrong with these details", go: "W12" }]),
    ]);
  }

  function saveControls(a) {
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.button({ label: "Save preferences", kind: "primary", disabled: true, reason: "You're offline. Nothing has been saved", id: P.id(a, "save") })]);
    var save = a.K.button({ label: "Save preferences", kind: "primary", note: "Preview only: preferences are not stored in this prototype" });
    if (a.state === "saving") return P.stack(a, [a.K.saveStatus("saving"), save]);
    if (a.state === "saveFailed") {
      return P.stack(a, [
        a.K.saveStatus("failed"),
        a.K.notice({ tone: "error", title: "Preferences were not saved. Your choices are kept here" }),
        a.K.button({ label: "Retry", note: "Preview only: nothing is sent in this prototype" }),
      ]);
    }
    return save;
  }

  function preferences(a) {
    var zone = inst(a).timezone;
    var courses = ownCourses(a).map(function (c) { return { value: c.id || c.code, label: c.code }; });
    var next = a.role === "student" ? a.sel.nextDue(a.view, a.who.courseId, a.who) : null;
    return P.stack(a, [
      a.K.field({ id: P.id(a, "zone"), type: "select", label: "Time zone", options: [{ value: zone, label: zone }] }),
      a.K.field({ id: P.id(a, "landing"), type: "select", label: "Landing course", options: courses }),
      a.K.field({ id: P.id(a, "email"), type: "checkbox", label: "Optional email delivery" }),
      next ? P.p("Next deadline in this zone: " + P.when(a, next.due)) : "",
      saveControls(a),
      P.links(a, [{ label: "Back", go: "W04" }, { label: "Continue", go: "W04:first-task" }]),
    ]);
  }

  function firstTask(a) {
    if (P.taEnded(a)) return P.taEndedNotice(a);
    var task = a.role === "ta" ? a.sel.gradingTaskFor(a.view, a.who.personId) : null;
    var link = a.role === "student" ? { label: "Open your course", go: P.recordGo("W14", "course", a.who.courseId) }
      : a.role === "instructor" ? { label: "Open the course builder", go: "W35" }
        : { label: "Open your grading queue", go: task ? P.recordGo("W48", "assessment", task.assessment_id) : null };
    return P.links(a, [link.go ? link : null, { label: "Open Home", go: "W05" }]);
  }

  function skipDialog(a, step) {
    var left = STEPS.slice(step).join(", ");
    return a.K.dialog(a.ctx, {
      id: P.id(a, "skip"), title: "Skip setup for now", open: a.variant === "skip",
      body: P.p("Still to do: " + left + ". You can finish setup later from Account."),
      actions: [{ label: "Open Home", go: "W05", kind: "primary", id: P.id(a, "skip-home") }],
    });
  }

  function render(a) {
    var out = { title: a.page.title, navActive: null, body: "" };
    if (a.state === "loading") return Object.assign(out, { body: P.loading(a, "your setup") });
    if (!a.who.courseId || a.state === "firstUseEmpty") {
      return Object.assign(out, { body: a.K.empty({ title: "No course is assigned to this account yet", body: P.p("Your institution assigns courses."), action: { label: "Open Home", go: "W05" } }) });
    }
    var step = stepOf(a);
    var views = [details, preferences, firstTask];
    var skip = a.K.button({ label: "Skip for now", kind: "quiet", act: "open-dialog", target: P.id(a, "skip") });
    return Object.assign(out, { body: P.stack(a, [trail(a, step), views[step](a), skip]), dialog: skipDialog(a, step) });
  }

  WB.definePage("W04", {
    states: STATES,
    na: P.na(STATES, {
      conflict: "Preferences belong to one account and are edited by one person",
      sessionExpired: "Session expiry is drawn on Auth return and System states",
    }),
    variants: { preferences: "Step 2: preferences", "first-task": "Step 3: first task", skip: "Skip dialog open" },
    render: render,
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg1-access/W08.js */
/* W08 Activity and notification settings (Phase 3 seg1). Rows come from sel.activityFor and link with the
   fixture go unchanged (PAGES.md record links), so the J09 step opens the canonical thread W31, not W30. No row
   carries a score. A TA after access ends loses grading rows and gets the notice. Settings are preview-only. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "firstUseEmpty", "filteredEmpty", "saveFailed", "offline", "deviceDenied"];
  var KINDS = {
    feedbackReleased: "Feedback available", announcementPublished: "New announcement", announcementUpdated: "Announcement updated",
    discussionReply: "New reply", workReceived: "Work arrived for grading",
  };
  var REMINDERS = ["None", "At start", "10 minutes before", "30 minutes before"];

  function announcementTitle(a, id) {
    var ann = a.view.data.comms.announcements.filter(function (x) { return x.id === id && x.state === "published" && x.course_id === a.who.courseId; })[0];
    return ann ? ann.revisions[ann.revisions.length - 1].title : "";
  }
  // R02, R03: titles resolve only against records this viewer may see now; an unresolved row is not shown.
  function publishedTitle(a, id) { var x = P.assessments(a).filter(function (it) { return it.id === id; })[0]; return x ? x.title : ""; }
  function recordTitle(a, ref) {
    if (ref.type === "assessment") return publishedTitle(a, ref.id);
    if (ref.type === "announcement") return announcementTitle(a, ref.id);
    if (ref.type === "discussion") {
      var t = a.sel.visibleTopics(a.view, a.who.courseId, a.who.personId).filter(function (x) { return x.id === ref.id; })[0];
      return t ? t.title : "";
    }
    if (ref.type === "receipt") { var r = P.receiptById(a, ref.id); return r ? publishedTitle(a, r.assessment_id) : ""; }
    return "";
  }

  function rows(a) {
    var unread = a.sel.unreadAnnouncements(a.view, a.who.courseId, a.who.personId).map(function (u) { return u.id; });
    return a.sel.activityFor(a.view, a.who.personId).filter(function (x) { return !(P.taEnded(a) && x.kind === "workReceived"); }).map(function (x) {
      var title = recordTitle(a, x.ref);
      var isUnread = x.ref.type === "announcement" && unread.indexOf(x.ref.id) >= 0;
      return title ? { title: KINDS[x.kind] + ": " + title, meta: P.when(a, x.at) + (isUnread ? " · Unread" : ""), go: x.go } : null;
    }).filter(Boolean);
  }

  function emptyView(a) {
    return a.K.empty({ title: "No activity yet", body: P.p("Feedback, announcements, replies and work for grading appear here.") });
  }

  function filters(a) {
    var row = a.view.data.world.enrollments.filter(function (e) { return e.person_id === a.who.personId; })[0];
    var courses = (row ? row.course_ids : []).map(function (id) { var c = a.sel.course(a.view, id); return { value: id, label: c.code }; });
    var types = Object.keys(KINDS).map(function (k) { return { value: k, label: KINDS[k] }; });
    return a.K.grid(a.ctx, {
      cols: 3, compactCols: 1,
      items: [
        a.K.field({ id: P.id(a, "course"), type: "select", label: "Course", options: [{ value: "all", label: "All courses" }].concat(courses) }),
        a.K.field({ id: P.id(a, "type"), type: "select", label: "Type", options: [{ value: "all", label: "All types" }].concat(types) }),
        a.K.field({ id: P.id(a, "unread"), type: "checkbox", label: "Unread only" }),
      ],
    });
  }

  function settingsDialog(a) {
    var failed = a.state === "saveFailed";
    return a.K.dialog(a.ctx, {
      id: P.id(a, "settings"), title: "Delivery settings", kind: "form", open: a.variant === "settings" || failed,
      body: P.stack(a, [
        failed ? a.K.notice({ tone: "error", title: "Delivery settings were not saved. Your earlier settings still apply" }) : "",
        a.K.field({ id: P.id(a, "d-email"), type: "checkbox", label: "Email delivery" }),
        a.K.field({ id: P.id(a, "d-browser"), type: "checkbox", label: "Browser delivery" }),
        a.K.field({ id: P.id(a, "d-remind"), type: "select", label: "Class reminder", options: REMINDERS.map(function (r) { return { value: r, label: r }; }) }),
        P.p("In-app activity stays on whatever you choose."),
      ]),
      actions: [{ label: "Save delivery settings", kind: "primary", note: "Preview only: settings are not stored in this prototype", id: P.id(a, "d-save") }],
    });
  }

  function listBlock(a) {
    var list = rows(a);
    if (a.state === "firstUseEmpty" || !list.length) return emptyView(a);
    if (a.state === "filteredEmpty") return a.K.empty({ title: "No activity matches these filters", action: { label: "Clear filters", go: "W08" } });
    return P.stack(a, [a.K.list({ label: "Activity", items: list }), a.state === "loading" ? '<p role="status">Loading older activity…</p>' : ""]);
  }

  function body(a) {
    var offline = a.state === "offline";
    var tools = offline ? "" : P.stack(a, [
      a.K.button({ label: "Delivery settings", act: "open-dialog", target: P.id(a, "settings") }),
      a.K.button({ label: "Mark all as read", kind: "quiet", note: "Preview only: read markers are not changed in this prototype" }),
    ]);
    var denied = a.state === "deviceDenied" ? P.stack(a, [
      a.K.notice({ tone: "warning", title: "Browser notifications are blocked in this browser", body: P.p("Your preference is kept; in-app activity is unaffected.") }),
      a.K.button({ label: "Enable browser delivery", disabled: true, reason: "Allow notifications in your browser settings first", id: P.id(a, "enable") }),
    ]) : "";
    return P.stack(a, [
      P.taEnded(a) ? P.taEndedNotice(a) : "",
      offline ? P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]) : "",
      denied, filters(a), tools, listBlock(a),
    ]);
  }

  WB.definePage("W08", {
    states: STATES,
    na: P.na(STATES, {
      invalid: "Settings are choices from fixed lists; nothing is typed",
      saving: "Saving delivery settings is preview-only; the failure is drawn",
      conflict: "Activity and settings belong to one account",
      success: "Settings are preview-only; no save result is drawn",
    }),
    variants: { settings: "Delivery settings dialog open" },
    render: function (a) {
      var out = { title: a.page.title, navActive: "activity", body: body(a) };
      if (a.state !== "offline") out.dialog = settingsDialog(a);
      return out;
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg1-access/W09.js */
/* W09 Global academic search (Phase 3 seg1). The index is built per render from scoped sources only: published
   assessments in the viewer's course (A4), published announcements and sel.visibleTopics, so staff never see a
   group-only topic. Rows link with P.recordGo or are plain text (A10). The sample queries are presentation. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "filteredEmpty", "invalid", "conflict", "offline"];
  var QUERIES = { results: "projectile", "group-only": "orbit", invalid: "p" };
  var TYPES = { assessment: "Coursework", announcement: "Announcements", discussion: "Discussions" };

  function hit(q, texts) {
    var needle = q.toLowerCase();
    return texts.some(function (t) { return String(t || "").toLowerCase().indexOf(needle) >= 0; });
  }

  function index(a) {
    var cid = a.who.courseId;
    var items = P.assessments(a).map(function (x) {
      return { type: "assessment", title: x.title, texts: [x.title], go: P.recordGo("W19", "assessment", x.id) || P.recordGo("W25", "assessment", x.id) };
    });
    var anns = a.view.data.comms.announcements.filter(function (x) { return x.course_id === cid && x.state === "published"; }).map(function (x) {
      var rev = x.revisions[x.revisions.length - 1];
      return { type: "announcement", title: rev.title, texts: [rev.title, rev.body], go: P.recordGo("W29", "announcement", x.id) };
    });
    var topics = a.sel.visibleTopics(a.view, cid, a.who.personId).map(function (x) {
      return { type: "discussion", title: x.title, texts: [x.title].concat((x.posts || []).map(function (p) { return p.body; })), go: P.recordGo("W31", "discussion", x.id) };
    });
    return items.concat(anns, topics);
  }

  function query(a) {
    if (a.state === "invalid") return QUERIES.invalid;
    if (a.variant) return QUERIES[a.variant];
    return a.state ? QUERIES.results : "";
  }

  function controls(a, q) {
    var err = a.state === "invalid" ? "Enter at least 2 characters" : undefined;
    var search = a.state === "invalid" || a.state === "offline"
      ? a.K.button({ label: "Search", kind: "primary", disabled: true, reason: err || "You're offline. Search needs a connection", id: P.id(a, "go") })
      : a.K.button({ label: "Search", kind: "primary", note: "Preview only: the sample queries are drawn as views" });
    return P.stack(a, [
      a.K.field({ id: P.id(a, "q"), label: "Search", value: q, error: err }),
      a.K.grid(a.ctx, {
        cols: 3, compactCols: 1,
        items: [
          a.K.field({ id: P.id(a, "type"), type: "select", label: "Type", options: [{ value: "all", label: "All types" }].concat(Object.keys(TYPES).map(function (k) { return { value: k, label: TYPES[k] }; })) }),
          a.K.field({ id: P.id(a, "course"), type: "select", label: "Course", options: [{ value: "own", label: a.sel.course(a.view, a.who.courseId).code }] }),
          a.K.field({ id: P.id(a, "archived"), type: "checkbox", label: "Include archived terms" }),
        ],
      }),
      search,
    ]);
  }

  function results(a, q) {
    var code = a.sel.course(a.view, a.who.courseId).code;
    var found = index(a).filter(function (x) { return hit(q, x.texts); });
    if (!found.length) return a.K.empty({ title: "No results you can open match this search", body: P.p("Try another word.") });
    var groups = Object.keys(TYPES).map(function (t) {
      var list = found.filter(function (x) { return x.type === t; });
      if (!list.length) return "";
      var items = list.map(function (x) { return { title: x.title, meta: TYPES[t] + " · " + code, go: x.go || undefined }; });
      return a.K.section({ title: TYPES[t], body: a.K.list({ label: TYPES[t], items: items }), level: 2 });
    });
    var n = found.length + (found.length === 1 ? " result" : " results");
    var lost = a.state === "conflict" ? a.K.list({ label: "Changed access", items: [{ title: "A result can no longer be opened because access changed" }] }) : "";
    return P.stack(a, ['<p role="status">' + WB.esc(n + " you can open") + "</p>"].concat(groups, [lost]));
  }

  function body(a) {
    if (!a.who.courseId) return a.K.empty({ title: "No course is assigned to this account yet" });
    var q = query(a);
    var top = controls(a, q);

<script>/* pages/seg1-access/W12.js */

<script>/* pages/seg1-access/W13.js */
/* W13 System states (Phase 3 seg1). Default is the not-found view. Guests, an expired session and maintenance
   use access mode; other signed-in views keep the app shell with no nav item current. No view names a record,
   course or person. Signing in again is preview-only (amendment A1). Contract: pages/PAGES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["permissionUnavailable", "sessionExpired"];
  var ROLE_NOTE = "Preview only: in this prototype, switch the role in the viewer bar or follow the tour";
  var HELP = { label: "Get help", go: "W12" };
  var MAINTENANCE = ["maintenance", "retry-failed"];

  function guest(a) { return a.who.personId === null; }
  function home(a) { return guest(a) ? { label: "Sign in", go: "W01" } : { label: "Go to Home", go: "W05" }; }

  function notFound(a) {
    return { title: "Page not found", body: a.K.notice({ tone: "info", title: "This page does not exist or has moved", actions: [home(a), HELP] }) };
  }

  function forbidden(a) {
    if (guest(a)) return { title: "Sign in to continue", body: a.K.notice({ tone: "info", title: "Sign in to continue", actions: [{ label: "Sign in to continue", go: "W01" }, HELP] }) };
    if (P.taEnded(a)) return { title: "Access ended", body: P.stack(a, [P.taEndedNotice(a), P.p("Access cannot be restored by switching role.")]) };
    return { title: "Not available", body: a.K.notice({ tone: "info", title: "This page is not available to this account", actions: [{ label: "Go to Home", go: "W05" }, HELP] }) };
  }

  function expired(a) {
    return {
      title: "Session expired",
      body: P.stack(a, [
        a.K.notice({ tone: "warning", title: "Your session has expired. Nothing new was submitted" }),
        a.K.button({ label: "Continue to sign-in", kind: "primary", act: "open-dialog", target: P.id(a, "leave") }),
      ]),
      dialog: a.K.dialog(a.ctx, {
        id: P.id(a, "leave"), title: "Leave unsent work",
        body: P.p("Work that was not handed in stays unsent on this device."),
        actions: [{ label: "Sign in again", kind: "primary", note: ROLE_NOTE, id: P.id(a, "leave-go") }, { label: "Get help", go: "W12", id: P.id(a, "leave-help") }],
      }),

  function maintenance(a) {

  WB.definePage("W13", {
    states: STATES,
    na: P.na(STATES, {

<script>/* pages/seg2-course/W05.js */
/* W05 Today (Home). Global page, no course shell. Student: next due work and own counts. Instructor: PS4 progress
   and the grading and release links. TA: each grading task, read only through an active task scope (A6); after
   access ends, this page's own notice with no learner data and no self-link. Rail: upcoming events, unread
   announcements, activity and the latest release time, never a score. Contract: pages/PAGES.md, pages/SPINE.md;
   decisions in pages/seg2-course/NOTES.md (chosen by Claude under owner delegation). */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "firstUseEmpty", "offline", "permissionUnavailable"];
  var WEEK_MINUTES = 7 * 24 * 60;
  var ENDED = "Your grading access for this course has ended";
  var KINDS = {
    feedbackReleased: "Feedback is out", announcementUpdated: "Announcement changed", announcementPublished: "New announcement",
    discussionReply: "New reply", workReceived: "Work handed in",
  };

  function itemGo(id) { return P.recordGo("W19", "assessment", id) || P.recordGo("W25", "assessment", id); }

  // TA tasks for published course items, found through the selector (A4, A6).
  function taTasks(a) {
    return P.assessments(a).map(function (x) { return a.sel.gradingTaskFor(a.view, a.who.personId, x.id); }).filter(Boolean);
  }
  function taskActive(a, task) {
    return a.sel.taTaskAccess(a.view, task.assessment_id, a.who).active && Boolean(a.sel.taScope(a.view, task.assessment_id, a.who));
  }
  function itemTitle(a, id) { var x = a.sel.assessment(a.view, id); return x ? x.title : ""; }

  // ---------- Main: tasks ----------
  function studentTasks(a) {
    var next = a.sel.nextDue(a.view, a.who.courseId, a.who);
    var nextGo = next ? itemGo(next.assessmentId) : null;
    var priority = next ? a.K.section({ title: "Your next step", level: 2, actions: nextGo ? [{ label: a.sel.assessment(a.view, next.assessmentId).kind === "quiz" ? "View quiz rules" : "View assignment", go: nextGo, kind: "primary" }] : [], body: P.p(itemTitle(a, next.assessmentId)) + P.p("Due " + P.when(a, next.due)) + P.status(a, P.ownSubmission(a, next.assessmentId), true) })
      : a.K.empty({ title: "Nothing due", body: P.p("You have no open work with a due date ahead.") });
    var items = P.assessments(a).map(function (it) {
      var quiz = it.quiz_id ? a.sel.quiz(a.view, it.quiz_id) : null;
      return { item: it, due: quiz ? quiz.close : it.due };
    }).filter(function (row) { return row.due && (!next || row.item.id !== next.assessmentId) && !a.sel.isBefore(row.due, a.view.clock); })
      .sort(function (x, y) { return a.sel.minutesBetween(y.due, x.due); });

      var go = itemGo(row.item.id);
      return { title: row.item.title, meta: "Due " + P.when(a, row.due), go: go || undefined,
        trailing: P.status(a, P.ownSubmission(a, row.item.id), true) };
    }) }) : P.p("No upcoming coursework with a due date");
    var c = a.sel.courseworkCounts(a.view, a.who.courseId, a.who.personId);
    var progress = c.all ? a.K.progress({ label: "Submitted work", value: c.handedIn + c.released, max: c.all }) : P.p("No coursework is published yet");
    var stats = a.K.grid(a.ctx, { cols: 3, compactCols: 2, items: [
      a.K.stat({ label: "To do", value: String(c.toDo) }),
      a.K.stat({ label: "Awaiting feedback", value: String(c.handedIn) }),
      a.K.stat({ label: "Feedback available", value: String(c.released) }),
    ] });
    var course = P.recordGo("W14", "course", a.who.courseId);
    return '<div class="wb-overview"><div class="wb-priority">' + priority + '</div><div class="wb-tasklist">' + a.K.section({ title: "Other upcoming work", level: 2, body: upcoming }) + '</div>' + a.K.disclosure({ id: P.id(a, "progress"), summary: "Course progress", body: progress + P.p("Includes handed-in work and work with released feedback.") + stats }) + P.links(a, [{ label: "Coursework", go: "W18" }, course ? { label: "Course home", go: course } : null]) + '</div>';
  }

  function otherTeachingCourses(a) {
    var courses = a.sel.calendarCourses(a.view, a.who).filter(function (course) { return course.id !== a.who.courseId && !course.archived && a.sel.verifiedRole(a.view, a.who, course.id) === "instructor"; });
    return P.stack(a, courses.map(function (course) {

    return P.stack(a, [a.K.section({ title: "Review and release", level: 2, body: work }), a.K.section({ title: "Course workspace", level: 2, body: P.links(a, secondary) }), otherTeachingCourses(a)]);

  function taTask(a, task) {

<script>/* pages/seg2-course/W06.js */
/* W06 Courses and term archive. Global page, no course shell. The viewer's own enrollment lists their courses;
   only the anchored course opens its student home or staff builder; all enrolled courses have calendar actions. Past terms are the archived
   state, read-only. Enrollment and institution rows are read directly (SPINE A2; selector kit request).
   Contract: pages/PAGES.md, pages/SPINE.md; decisions in pages/seg2-course/NOTES.md (chosen by Claude under
   owner delegation). */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "firstUseEmpty", "filteredEmpty", "offline", "archived"];

  function myCourses(a) {
    var who = a.who;
    var row = a.view.data.world.enrollments.filter(function (e) { return e.person_id === who.personId && e.role === who.role; })[0];
    if (!row) return [];
    return row.course_ids.map(function (id) { return a.sel.course(a.view, id); }).filter(Boolean);
  }

  function meta(a, c) {
    var parts = [c.term, c.section, WB.ROLE_LABELS[a.role]];
    var next = a.role === "student" ? a.sel.nextDue(a.view, c.id, a.who) : null;
    var item = next ? a.sel.assessment(a.view, next.assessmentId) : null;
    if (item) parts.push("Next due " + item.title + ", " + P.when(a, next.due));
    if (a.role === "ta" && P.taEnded(a) && c.id === a.who.courseId) {
      var end = a.sel.accessEnd(a.view, a.who.personId, c.id);
      if (end) parts.push("Grading access ended " + P.when(a, end));

  function card(a, c, past) {

    var go = past ? null : a.role === "student" ? (home || WB.Teaching.go(a, "W14", { courseId: c.id, assessmentId: null, learnerId: null, receiptId: null })) : home ? "W35" : WB.Teaching.go(a, "W35", { courseId: c.id, assessmentId: null, learnerId: null, receiptId: null });
    var o = { key: c.key, code: c.code, title: c.title, meta: past ? [c.term, c.section].join(" · ") : meta(a, c) };
    if (go) o.go = go;
    var html = a.K.courseCard(a.ctx, o);
    var calendar = '<button type="button" class="wb-btn wb-btn--quiet" data-cal-op="open-course" data-cal-value="' + WB.esc(c.id) + '">Calendar<span class="wb-sr"> for ' + WB.esc(c.code) + '</span></button>';
    return P.stack(a, [html, calendar, past ? a.K.flag("readOnly") : ""]);
  }

  function grid(a, list, past) {

  }

  function controls(a, list, past) {
    var tabs = a.K.tabs({ label: "Course lists", items: [{ id: P.id(a, "tab-current"), label: "Current", go: "W06", current: !past }, { id: P.id(a, "tab-past"), label: "Past", go: "W06:archived", current: past }] });
    var terms = [];
    list.forEach(function (c) { if (terms.indexOf(c.term) < 0) terms.push(c.term); });
    var select = a.sizeClass === "regular" && terms.length
      ? a.K.field({ id: P.id(a, "term"), type: "select", label: "Term", help: "Preview only: term filtering does not run in this prototype", options: [{ value: "", label: "All terms" }].concat(terms.map(function (t) { return { value: t, label: t }; })) })
      : "";
    var search = a.K.field({ id: P.id(a, "search"), label: "Search courses", help: "Preview only: search does not run in this prototype" });
    return '<div class="wb-course-filters">' + tabs + a.K.disclosure({ id: P.id(a, "find"), summary: "Find a course", body: a.K.grid(a.ctx, { cols: 2, compactCols: 1, items: [select, search].filter(Boolean) }) }) + '</div>';
  }

  function pastView(a, all) {

<script>/* pages/seg2-course/W07.js */
/* W07 Combined calendar: shared month/week/schedule views and enrolled-course filtering.
   Authorized selector projection includes own private events only in the combined scope.
   Private save/delete actions remain explicit local prototype previews. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "firstUseEmpty", "filteredEmpty", "invalid", "offline", "deviceDenied", "destructive"];
  var PREVIEW = "Preview only: private events are not saved in this prototype";

  function tools(a) {
    var add = a.K.button({ label: "Add private event", act: "open-dialog", target: P.id(a, "event"), id: P.id(a, "add") });
    var links = [{ label: "Reminder settings", go: "W08" }, a.role === "instructor" ? { label: "Manage grading deadlines", go: "W57" } : null];
    var state = WB.calendar.normalize(a, a.calendar);
    var course = state.courseId || a.who.courseId;
    var open = '<button type="button" class="wb-btn wb-btn--secondary" data-cal-op="open-course" data-cal-value="' + esc(course) + '">Course calendar</button>';
    return '<div class="wb-cal-tools">' + add + open + P.links(a, links) + '</div>';
  }

  function eventDialog(a) {

    var body = [
      f("title", "Title", "text", { required: true }), f("start-date", "Start date", "date"), f("start-time", "Start time", "time"),
      f("end-date", "End date", "date"), f("end-time", "End time", "time", a.state === "invalid" ? { error: "End must be after start" } : null),
      f("repeat", "Repeat", "select", { options: [{ value: "none", label: "Does not repeat" }, { value: "weekly", label: "Every week" }] }),
      f("reminder", "Reminder", "select", { options: [{ value: "none", label: "No reminder" }, { value: "15", label: "15 minutes before" }] }),
      P.p("Only you can see a private event."),
    ].join("");
    return a.K.dialog(a.ctx, {
      id: P.id(a, "event"), kind: "form", title: "Add private event", open: a.variant === "add-event" || a.state === "invalid", body: body,
      actions: [{ id: P.id(a, "event-save"), label: "Save private event", kind: "primary", note: PREVIEW }],
    });
  }

  function deleteDialog(a, own) {
    return a.K.dialog(a.ctx, {
      id: P.id(a, "delete"), kind: "destructive", title: "Delete this private event?", open: true,
      body: P.p(own.name) + P.p(P.when(a, own.start)) + P.p("Only your own copy is removed. Course dates are not affected."),
      actions: [{ id: P.id(a, "delete-go"), label: "Delete this event", note: PREVIEW }],

  }

<script>/* pages/seg2-course/W14.js */

<script>/* pages/seg2-course/W16.js */
/* W16 Modules. Course modules in order; a module not open yet shows only its opening time. Item rows are the

(function (root) {

      .sort(function (x, y) { return x.position - y.position; });

  function moduleBody(a, m, current) {

    var list = items(a, m);
    var rows = list.length ? "<ul>" + list.map(function (x) { return itemRow(a, x); }).join("") + "</ul>" : P.p("Nothing is published in this module yet");
    var lesson = current ? P.links(a, [{ label: "Open lesson and materials", go: "W17" }]) : "";

  function lockedNotice(a, list) {

<script>/* pages/seg2-course/W17.js */
/* W17 Lesson and materials. Draws the current module (no lesson records exist yet; kit request): its span, the
   files shared in published course announcements and a link on to the module's first published item (A4).
   No completion control. Contract: pages/PAGES.md, pages/SPINE.md; decisions in pages/seg2-course/NOTES.md
   (chosen by Claude under owner delegation). */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "firstUseEmpty", "offline", "notYetAvailable", "permissionUnavailable"];
  var BACK = { label: "Back to modules", go: "W16" };

  function span(a, m) { return a.sel.fmtShortDate(m.starts) + " to " + a.sel.fmtShortDate(m.ends); }
  function firstLocked(a) {
    return a.view.data.coursework.modules.filter(function (m) { return m.course_id === a.who.courseId && a.sel.isBefore(a.view.clock, m.starts); })
      .sort(function (x, y) { return x.position - y.position; })[0] || null;
  }
  function locked(a) { return a.state === "notYetAvailable" ? firstLocked(a) : null; }
  function drawn(a) { return locked(a) || a.sel.currentModule(a.view, a.who.courseId); }

  function files(a) {
    var anns = a.state === "firstUseEmpty" ? [] : a.view.data.comms.announcements.filter(function (x) { return x.course_id === a.who.courseId && x.state === "published"; });
    var rows = [];
    anns.forEach(function (ann) {
      ann.attachments.forEach(function (f) {
        var go = P.recordGo("W29", "announcement", ann.id);
        var links = (go ? a.K.link({ label: "Open announcement", go: go }) : "") + a.K.button({ label: "Download", kind: "quiet", note: "Preview only: files are not downloaded in this prototype" });
        var meta = [f.pages ? f.pages + (f.pages === 1 ? " page" : " pages") : "", f.accessible_version ? "Accessible version available" : ""].filter(Boolean).join(" · ");
        rows.push({ title: f.name, meta: meta, trailing: links });
      });
    });
    var body = rows.length ? a.K.list({ label: "Shared files", items: rows }) : a.K.empty({ title: "No files are shared yet" });
    return a.K.section({ title: "Files shared in course announcements", body: a.state === "loading" ? P.loading(a, "files") : body });
  }

  function nextLinks(a, m) {
    var pub = P.assessments(a);
    var first = m.item_ids.map(function (id) { return pub.filter(function (x) { return x.id === id; })[0]; }).filter(Boolean)[0];
    var go = first ? WB.Teaching.courseworkGo(a, first) : null;
    var links = [go ? { label: first.title, go: go } : null, { label: "Coursework", go: "W18" }, BACK];
    return a.K.section({ title: "Next", level: 3, body: (first && !go ? P.p(first.title) : "") + P.links(a, links) });
  }

  function lockedView(a, m) {
    return P.stack(a, [a.K.flag("notOpen"), P.p("Opens " + P.when(a, m.starts)), P.links(a, [BACK])]);
  }

  function content(a) {
    var lock = locked(a);
    if (lock) return lockedView(a, lock);
    var m = a.sel.currentModule(a.view, a.who.courseId);
    var none = a.state === "notYetAvailable" ? a.K.notice({ tone: "info", title: "No module is locked at this point" }) : "";
    if (!m) return P.stack(a, [none, a.K.notice({ tone: "info", title: "No module is running at this point" }), P.links(a, [BACK])]);
    return P.stack(a, [
      none,
      a.role !== "student" ? a.K.flag("preview") : "",
      P.taEnded(a) ? P.taEndedNotice(a, P.assessmentId(a)) : "",
      P.p(span(a, m)),
      a.K.notice({ tone: "info", title: "Lesson text is not in the prototype data yet" }),
      files(a),
      nextLinks(a, m),
      a.role === "instructor" ? P.links(a, [{ label: "Edit lesson", go: "W38" }]) : "",

  function body(a) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "You are not enrolled in this course");
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown"), content(a)]);

  function render(a) {

    var m = a.state === "permissionUnavailable" ? null : drawn(a);
    var home = c ? P.recordGo("W14", "course", c.id) : null;
    var crumbs = home ? [{ label: c.code, go: home }, { label: "Modules", go: "W16" }] : undefined;
    return P.shell(a, { title: m ? m.title : a.page.title, body: body(a), crumbs: crumbs }, { page: "W17" });
  }

  WB.definePage("W17", {
    states: STATES,
    na: P.na(STATES, {
      saving: "Manual completion needs a lesson record this prototype's data does not have",
      saveFailed: "Manual completion needs a lesson record this prototype's data does not have",
    }),
    render: render,
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* pages/seg2-course/W18.js */
/* W18 Coursework list (Phase 3 spine). Course-level. Student: filter row from courseworkCounts and every
   published item with its personal due time and own status; row links follow the PAGES.md W18 rule. Staff:
   instructor planning includes unpublished items and record-matching editor/grading links; TAs see only active allocations. Contract: pages/PAGES.md, pages/SPINE.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "firstUseEmpty", "filteredEmpty", "offline", "permissionUnavailable"];
  var FILTERS = { todo: ["notStarted", "draft", "queued"], handed: ["received", "receivedNotReleased"], feedback: ["released", "feedbackUpdated"] };
  function filterName(a) { return a.state === "filteredEmpty" ? "todo" : (a.role === "student" && FILTERS[a.variant] ? a.variant : "all"); }
  function matches(a, item, filter) {
    if (filter === "all") return true;
    var sub = P.ownSubmission(a, item.id);
    var status = WB.manifest.status.keyFor(sub, "student", { own: true });
    return Boolean(status) && FILTERS[filter].indexOf(status.key) >= 0;
  }

  function dueOf(a, item) {
    var quiz = item.quiz_id ? a.sel.quiz(a.view, item.quiz_id) : null;
    var due = quiz ? quiz.close : item.due;
    return due ? P.when(a, due) : "No due date";

  // ps4 → W19 (W23 once released); motion → W19:motion; quiz3 → W25; quiz2 → W27:quiz2; others plain.
  function studentGo(a, item) {
    var res = a.sel.resultFor(a.view, a.who.personId, item.id, a.who);
    var sub = a.sel.submissionFor(a.view, a.who.personId, item.id);
    var legacy = P.recordGo(item.quiz_id ? "W25" : "W19", "assessment", item.id);
    if (!a.selection && legacy) {
      if (!item.quiz_id && res && res.status !== null && legacy.indexOf(":") < 0) return "W23";
      return legacy;
    }
    if (item.quiz_id && sub && sub.receipt_id) return WB.Teaching.go(a, "W27", { assessmentId: item.id, learnerId: a.who.personId, receiptId: sub.receipt_id });
    return WB.Teaching.go(a, item.quiz_id ? "W25" : res && res.status !== null ? "W23" : "W19", { assessmentId: item.id, learnerId: a.who.personId, receiptId: null });
  }

  function studentRow(a, item) {
    var row = { id: item.id, cells: { title: esc(item.title), due: esc(dueOf(a, item)), status: P.status(a, P.ownSubmission(a, item.id), true) } };
    var go = studentGo(a, item);
    return go ? { id: row.id, cells: row.cells, go: go } : row;
  }

  function activeTask(a, item) { return a.sel.taTaskAccess(a.view, item.id, a.who).active && Boolean(a.sel.taScope(a.view, item.id, a.who)); }
  function staffGo(a, item) {
    if (a.role === "instructor") return !a.selection && (P.recordGo("W40", "assessment", item.id) || P.recordGo("W41", "assessment", item.id)) || WB.Teaching.go(a, item.kind === "quiz" ? "W41" : "W40", { assessmentId: item.id, receiptId: null, learnerId: null });
    return P.gradingGo(a, item.id);
  }
  function staffRow(a, item, withCounts) {
    var task = a.role === "ta" ? a.sel.gradingTaskFor(a.view, a.who.personId, item.id) : null;
    var cells = { title: esc(item.title), due: esc(task ? P.when(a, task.grading_due) : dueOf(a, item)) };
    if (a.role === "instructor") { cells.publication = item.published ? "Published" : "Unpublished"; cells.intent = esc(a.sel.teachingAssessmentIntent(a.view, a.who, item.id) || ""); }
    if (withCounts) {
      var got = a.sel.receivedProgress(a.view, item.id, a.who);
      var done = a.sel.reviewProgress(a.view, item.id, a.who);
      cells.handed = got ? esc(got.received + " of " + got.of) : "";
      cells.reviewed = done ? esc(done.reviewed + " of " + done.of) : "";
    }
    if (a.role === "instructor") {
      var queue = WB.Teaching.go(a, "W48", { assessmentId: item.id, receiptId: null, learnerId: null });
      var release = WB.Teaching.go(a, "W53", { assessmentId: item.id, receiptId: null, learnerId: null });
      cells.actions = P.links(a, [queue ? { label: queue && queue.indexOf("W49") === 0 ? "Grade submission" : "Grade submissions", go: queue } : null, release ? { label: "Review release", go: release } : null]);
    }
    var go = staffGo(a, item);
    return go ? { id: item.id, cells: cells, go: go } : { id: item.id, cells: cells };
  }
  function columns(a, withCounts) {

    if (a.role === "student") return cols.concat([{ key: "status", label: "Status" }]);

  }

  function filterRow(a, current) {

    var items = [["all", "All", c.all], ["todo", "To do", a.state === "filteredEmpty" ? 0 : c.toDo], ["handed", "Handed in", c.handedIn], ["feedback", "Feedback out", c.released]];
    return a.K.tabs({
      label: "Filter coursework",
      items: items.map(function (x) { return { id: P.id(a, "filter-" + x[0]), label: x[1] + " (" + x[2] + ")", go: x[0] === "all" ? "W18" : "W18:" + x[0], current: x[0] === current }; }),
    });

<script>/* pages/seg3-submit/W19.js */
/* W19 Assignment detail (Phase 3 spine). Anchor: the problem-set assessment; variant motion (group work). Facts come from
   the assessment record and its rubric; the student rail picks one next action from the clock (draft, receipt,
   release, closed). Staff see facts only, with the TA access branches of R12. Contract: pages/SPINE.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "offline", "notYetAvailable", "permissionUnavailable"];

  function item(a) { return a.sel.assessment(a.view, P.assessmentId(a)); }

  function facts(a, it, essential) {
    var rows = [
      it.opens ? { label: "Opens", value: P.when(a, it.opens) } : null,
      it.due ? { label: "Due", value: P.when(a, it.due) } : null,
      it.close ? { label: "Closes", value: P.when(a, it.close) } : null,
      it.max !== undefined ? { label: "Points", value: String(it.max) } : null,
      it.max_attempts ? { label: "Attempts allowed", value: String(it.max_attempts) } : null,
      P.lateRuleText(it) ? { label: "Late work", value: P.lateRuleText(it) } : null,
      P.fileRuleText(it.sample_file_rule) ? { label: "Files", value: P.fileRuleText(it.sample_file_rule) } : null,
    ].filter(Boolean);
    rows = rows.filter(function (row) { var key = row.label === "Due" || row.label === "Closes" || row.label === "Points"; return essential ? key : !key; });
    return rows.length ? a.K.kv(rows) : "";
  }

  function rubric(a, it) {
    var r = a.sel.rubricFor(a.view, it.id, a.who);
    if (!r || !r.criteria || !r.criteria.length) return "";
    var rows = r.criteria.map(function (c) { return { label: "Question " + c.question_id + ": " + c.title, value: c.max + " points" }; });
    return a.K.section({ title: "Rubric", body: a.K.kv(rows), level: 2 });
  }

  function mainPart(a, it) {
    return P.stack(a, [it.body ? P.p(it.body) : "", a.K.disclosure({ id: P.id(a, "assignment-details"), summary: "Submission details and rubric", body: P.stack(a, [facts(a, it, false), rubric(a, it)]) })]);
  }

  function released(a, it) {
    var res = a.sel.resultFor(a.view, a.who.personId, it.id, a.who);
    return Boolean(res) && res.status !== null;
  }

  function trail(a, it, draft, receipt) {
    var out = released(a, it);
    var st = function (done, current) { return done ? "done" : current ? "current" : "todo"; };
    return a.K.trail({
      label: "Your progress on this assignment",
      steps: [
        { label: "Add work", state: st(Boolean(draft || receipt), !draft && !receipt) },
        { label: "Review", state: st(Boolean(receipt), Boolean(draft) && !receipt) },
        { label: "Receipt", state: st(Boolean(receipt), false) },
        { label: "Feedback", state: st(out, Boolean(receipt) && !out) },

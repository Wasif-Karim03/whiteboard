<script>/* pages/seg3-submit/W27.js */
/* W27 Quiz receipt/review (Phase 3 seg3-submit). Student only. Anchor: the persona's Quiz 3 receipt, home
   quiz_received; variant quiz2 (the released Quiz 2 receipt, home default). The receipt is read at the current
   clock; when it is not there yet the page says so and shows no reference (rule R-truth). Nothing here edits.
   The released review shows only resultFor values; a held result shows no score. The rules link is record-true
   (amendment A10). Contract: pages/SPINE.md and pages/seg3-submit/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "offline", "success", "permissionUnavailable"];
  var RELEASE = { instructor: "Scores are shown after the instructor releases them." };

  function items(quiz) { return quiz.items.map(function (x) { return typeof x === "string" ? x : x.id; }); }

  // R08: an unresolved receipt keeps its identity. Only the default anchor is declared as the receipt for W25's
  // quiz (manifest/anchors.js); any other receipt that does not resolve has no assessment and gets no quiz links.
  function context(a) {
    var variant = P.recordVariant(a);
    var anchor = a.sel.anchorFor("W27", variant);
    var selectedId = a.selection && a.selection.receiptId;
    var receipt = P.receiptById(a, selectedId || anchor.record.id);
    var itemId = receipt ? receipt.assessment_id : a.selection && a.selection.assessmentId ? a.selection.assessmentId : variant ? null : a.sel.anchorFor("W25").record.id;
    var item = itemId ? a.sel.assessment(a.view, itemId) : null;
    if (!item || !item.quiz_id) return { receipt: null, item: null };
    var quiz = a.sel.quiz(a.view, item.quiz_id);
    var attempt = receipt && a.sel.quizAttemptForReceipt ? a.sel.quizAttemptForReceipt(a.view, receipt.id, a.who) : a.sel.attemptFor(a.view, quiz.id, a.who.personId);
    if (receipt && attempt && attempt.receipt_id !== receipt.id) attempt = null;
    var latest = a.sel.attemptFor(a.view, quiz.id, a.who.personId);
    return { receipt: receipt, item: item, quiz: quiz, attempt: attempt, av: attempt && latest && attempt.id === latest.id ? a.sel.attemptView(a.view, quiz.id, a.who.personId) : null };
  }

  function rulesLink(a, c) {
    var go = P.recordGo("W25", "assessment", c.item.id) || (a.selection ? WB.Teaching.go(a, "W25", { assessmentId: c.item.id, receiptId: null }) : null);
    return go ? { label: "Quiz rules and attempts", go: go } : null;
  }

  // ---------- Present receipt ----------
  function slip(a, c) {
    var r = c.receipt;
    var course = a.sel.course(a.view, a.who.courseId);
    return a.K.receipt({ ref: r.id, item: c.item.title, course: course.code, acceptedAt: a.sel.fmtDateTime(r.accepted_at), timeZone: a.sel.zoneAbbr(r.accepted_at), attempt: r.attempt });
  }

  function answers(a, c) {
    if (!c.attempt || c.attempt.receipt_id !== c.receipt.id) return "";
    var rows = items(c.quiz).map(function (id, i) {
      var ans = c.attempt.answers.filter(function (x) { return x.item_id === id && x.acknowledged_at; })[0];
      return { label: "Question " + (i + 1), value: ans ? ans.value + " · saved " + a.sel.fmtTime(ans.acknowledged_at) : "No answer" };
    });
    return a.K.section({ title: "Submitted answers", body: a.K.kv(rows), level: 2 });
  }

  function review(a, c) {
    if (a.state === "offline") {
      return a.K.section({ title: "Released review", level: 3, body: P.p("The released review could not be loaded.") +
        a.K.button({ label: "Retry", note: "Preview only: nothing is loaded in this prototype" }) });
    }
    var res = a.sel.resultFor(a.view, a.who.personId, c.item.id, a.who);
    if (!res || res.status === null) {
      var rule = Object.prototype.hasOwnProperty.call(RELEASE, c.quiz.release_rule) ? RELEASE[c.quiz.release_rule] : "";
      return a.K.section({ title: "Released review", level: 3, body: (rule ? P.p(rule) : "") + P.p("Nothing about marking is shown before release.") });
    }
    var releases = a.sel.releasesFor(a.view, c.item.id, a.who);
    var sub = a.sel.submissionFor(a.view, a.who.personId, c.item.id);
    var matching = releases.filter(function (rel) { return rel.entries.some(function (entry) {
      return entry.person_id === a.who.personId && (entry.receipt_id === c.receipt.id || (!entry.receipt_id && sub && sub.receipt_id === c.receipt.id));
    }); });
    var last = matching.length ? matching[matching.length - 1] : null;
    if (!last) return a.K.section({ title: "Released review", level: 3, body: P.p("No released feedback for this attempt") });
    var snapshot = last.entries.filter(function (entry) { return entry.person_id === a.who.personId && (entry.receipt_id === c.receipt.id || (!entry.receipt_id && sub && sub.receipt_id === c.receipt.id)); })[0];
    var status = snapshot.status || res.status;
    var score = snapshot.score === undefined && !snapshot.receipt_id ? res.score : snapshot.score;
    var comment = snapshot.comment === undefined && !snapshot.receipt_id ? res.comment : snapshot.comment;
    var outcome = status === "excused" || status === "missing"
      ? a.K.status(status, a.ctx, { released: true, own: true }) : "";
    var rows = [];
    if (score !== null && score !== undefined) rows.push({ label: "Score", value: P.score(score, res.max) });
    if (comment) rows.push({ label: "Comment", value: comment });
    if (last.released_at) rows.push({ label: "Released on", value: P.when(a, last.released_at) });
    if (last) rows.push({ label: "Release version", value: String(last.version) });
    return a.K.section({ title: "Released review", level: 3, body: outcome + (rows.length ? a.K.kv(rows) : "") + P.p("Answer keys are not part of this review.") });
  }

  function details(a, c) {
    var rows = [];
    if (c.receipt.assessment_version !== undefined) rows.push({ label: "Question version", value: String(c.receipt.assessment_version) });
    if (c.av && c.attempt.receipt_id === c.receipt.id) rows.push({ label: "Answered", value: String(c.av.acknowledged) + " of " + c.quiz.items.length });
    var rules = rulesLink(a, c);
    return P.stack(a, [
      P.status(a, P.ownSubmission(a, c.item.id), true), rows.length ? a.K.kv(rows) : "", review(a, c),
      a.K.button({ label: "Download receipt", note: "Preview only: nothing is downloaded in this prototype" }),
      rules ? "" : P.p("The rules page is drawn for Quiz 3 only in this prototype."),
      P.links(a, [{ label: "View course grades", go: "W24" }, rules, { label: "Coursework", go: "W18" }]),
    ]);
  }

  function top(a, c) {
    if (a.state === "success") {
      return a.K.notice({ tone: "success", title: "Your quiz is handed in", body: P.p("Receipt " + c.receipt.id + " was issued at " + P.when(a, c.receipt.accepted_at) + ".") });
    }
    return a.state === "offline" ? P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]) : "";
  }

  function present(a, c) {
    var main = P.stack(a, [top(a, c), slip(a, c), P.p("This receipt does not change."), answers(a, c)]);
    return a.K.rail(a.ctx, { main: main, rail: details(a, c), railLabel: "Details" });
  }

  // ---------- Absent receipt ----------
  function absent(a, c) {
    var attemptGo = c.av && c.av.active ? P.recordGo("W26", "attempt", c.attempt.id) : null;
    var next = attemptGo ? { label: "Go to the attempt", go: attemptGo } : rulesLink(a, c) && { label: "Quiz rules", go: rulesLink(a, c).go };
    return P.stack(a, [
      a.K.empty({ title: "No confirmed receipt", body: P.p("Nothing has been handed in for this quiz yet.") }),
      P.status(a, P.ownSubmission(a, c.item.id), true), P.links(a, [next]), P.offHome(a, "The receipt is issued later in the prototype"),
    ]);
  }

  function unavailable(a) {
    return P.stack(a, [
      a.K.empty({ title: "This receipt is not available", body: P.p("It has not been issued to you at this point in the prototype.") }),
      P.links(a, [{ label: "Coursework", go: "W18" }]),
    ]);
  }

  function body(a, c) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "This receipt belongs to another person");
    if (a.state === "loading") return P.loading(a, "the receipt");
    if (!c.item) return unavailable(a);
    return c.receipt ? present(a, c) : absent(a, c);
  }

  WB.definePage("W27", {
    states: STATES,
    na: P.na(STATES, {
      firstUseEmpty: "A receipt page is about one receipt; without it the page says no receipt exists",
      saveFailed: "Nothing is saved here; a failed review load is drawn under offline",
    }),
    variants: { quiz2: WB.manifest.anchors.W27.variants.quiz2.label },
    render: function (a) {
      var c = context(a);
      var anchor = a.sel.anchorFor("W27", P.recordVariant(a));
      var owned = c.receipt && c.item ? a.sel.receiptsFor(a.view, c.item.id, a.who).filter(function (r) { return r.id === c.receipt.id; })[0] : null;
      var gate = P.publicationGate(a, c.item, owned);
      if (gate) return gate;
      return P.shell(a, { title: c.item ? "Quiz receipt: " + c.item.title : "Quiz receipt", body: body(a, c) }, { section: "coursework" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg4-community/W28.js */
/* W28 Announcement list (Phase 3 seg4). Course-level. Published and withdrawn announcements only, pinned first then
   newest; the read state is the student's own (unreadAnnouncements). Every row links its record-true detail or is
   plain text. Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "firstUseEmpty", "filteredEmpty", "offline", "permissionUnavailable"];
  var SHOWN = ["published", "withdrawn"];
  var COLS = [
    { key: "title", label: "Announcement", primary: true }, { key: "author", label: "Posted by" },
    { key: "at", label: "Published" }, { key: "state", label: "State" },
  ];

  function anns(a) {
    return a.view.data.comms.announcements.filter(function (x) { return x.course_id === a.who.courseId && SHOWN.indexOf(x.state) >= 0; });
  }
  function latest(x) { return x.revisions[x.revisions.length - 1]; }
  function ordered(a) {
    var pinned = anns(a).filter(function (x) { return x.pinned; });
    var rest = anns(a).filter(function (x) { return !x.pinned; });
    var newest = function (x, y) { return a.sel.isBefore(x.published_at, y.published_at) ? 1 : -1; };
    return pinned.sort(newest).concat(rest.sort(newest));
  }

  function readState(a, x) {
    if (x.state === "withdrawn") return esc("Withdrawn");
    if (a.role !== "student") return x.revisions.length > 1 ? a.K.badge({ label: "Updated", tone: "info" }) : "";
    var hit = a.sel.unreadAnnouncements(a.view, a.who.courseId, a.who.personId).filter(function (u) { return u.id === x.id; })[0];
    if (!hit) return esc("Read");
    return a.K.badge({ label: hit.reason === "new" ? "New" : "Updated", tone: "accent" });
  }

  function row(a, x) {
    var l = latest(x);
    var at = P.when(a, x.published_at) + (x.revisions.length > 1 ? " · Updated " + P.when(a, l.at) : "");
    var marks = [
      x.pinned ? a.K.badge({ label: "Pinned", tone: "neutral" }) : "", readState(a, x),
      x.attachments.length && x.state !== "withdrawn" ? a.K.badge({ label: "Attachment", tone: "neutral" }) : "",
    ].filter(Boolean).join(" ");
    var cells = { title: esc(l.title), author: esc(P.personName(a, x.author_id)), at: esc(at), state: marks };
    var go = P.recordGo("W29", "announcement", x.id);
    return go ? { id: x.id, cells: cells, go: go } : { id: x.id, cells: cells };
  }

  function emptyFor(a) {
    if (a.state === "filteredEmpty") return { title: "No announcements match", body: P.p("Other announcements are still in the list."), action: { label: "Clear filters", note: "Preview only: filters are not wired" } };
    return { title: "No announcements yet", body: P.p("Announcements from your instructor appear here."), action: { label: "Course overview", go: "W14" } };
  }

  function table(a) {
    var rows = a.state === "firstUseEmpty" || a.state === "filteredEmpty" ? [] : ordered(a).map(function (x) { return row(a, x); });
    return a.K.table(a.ctx, { id: P.id(a, "anns"), caption: "Announcements", columns: COLS, rows: rows, empty: emptyFor(a) });
  }

  function markAll(a) {
    if (a.role !== "student") return "";
    if (a.state === "offline") return a.K.button({ label: "Mark all as read", disabled: true, reason: "You're offline", id: P.id(a, "read-all") });
    return a.K.button({ label: "Mark all as read", note: "Preview only: nothing is marked as read in this prototype" });
  }

  function links(a) {
    var list = [{ label: "Notification settings", go: "W08" }];
    if (a.role === "instructor") list.push({ label: "Manage announcements", go: "W55" });
    return P.stack(a, [markAll(a), P.links(a, list), a.role === "ta" ? P.p("Publishing announcements is the instructor's step") : ""]);
  }

  function body(a) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "Announcements are not available for your course role");
    if (a.state === "loading") return P.loading(a, "announcements");
    var top = [P.taEnded(a) ? P.taEndedNotice(a) : "", a.state === "offline" ? P.offlineNotice(a) + a.K.flag("lastKnown") : ""];
    return P.stack(a, top.concat([table(a), links(a)]));
  }

  WB.definePage("W28", {
    states: STATES,
    na: P.na(STATES, {
      saving: "Read markers are preview only; nothing is saved from this list",
      saveFailed: "Read markers are preview only; nothing is saved from this list",
    }),
    render: function (a) {
      return P.shell(a, { title: "Announcements", body: body(a) }, { page: "W28" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg4-community/W29.js */
/* W29 Announcement detail (Phase 3 seg4). Anchor: the Quiz 3 announcement; variant office-hours. Shows the latest
   revision at the clock, its attachments and earlier versions. A withdrawn record shows a notice in place of its
   text; staff keep the version history. No reply or private message control. Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "offline", "permissionUnavailable", "notYetAvailable"];
  var SHOWN = ["published", "withdrawn"];

  function record(a) {
    var id = a.sel.anchorFor("W29", P.recordVariant(a)).record.id;
    return a.view.data.comms.announcements.filter(function (x) {
      return x.id === id && x.course_id === a.who.courseId && SHOWN.indexOf(x.state) >= 0;
    })[0] || null;
  }
  function latest(x) { return x.revisions[x.revisions.length - 1]; }

  function facts(a, x) {
    var l = latest(x);
    var rows = [{ label: "Posted by", value: P.personName(a, x.author_id) }, { label: "Published", value: P.when(a, x.published_at) }, { label: "Version", value: String(l.rev) }];
    if (l.rev > 1) rows.push({ label: "Updated", value: P.when(a, l.at) });
    return a.K.kv(rows);
  }

  function pagesText(n) { return n ? n + (n === 1 ? " page" : " pages") : ""; }
  function files(a, x) {
    if (!x.attachments.length) return "";
    return a.K.list({
      label: "Attachments",
      items: x.attachments.map(function (f) {
        var meta = [pagesText(f.pages), f.accessible_version ? "Accessible version available" : ""].filter(Boolean).join(" · ");
        return { title: f.name, meta: meta, trailing: a.K.button({ label: "Download", kind: "quiet", note: "Preview only: nothing is downloaded in this prototype" }) };
      }),
    });
  }

  // Earlier versions with their text; withText false keeps only version and time (a withdrawn record, staff only).
  function history(a, x, withText) {
    var earlier = withText ? x.revisions.slice(0, -1) : x.revisions.slice();
    if (!earlier.length || (withText && x.revisions.length < 2)) return "";
    var items = earlier.reverse().map(function (r) { return { title: "Version " + r.rev + " · " + P.when(a, r.at), meta: withText ? r.body : "" }; });
    return a.K.disclosure({ id: P.id(a, "history"), summary: withText ? "Earlier versions" : "Version history", body: a.K.list({ label: "Versions", items: items }) });
  }

  function markUnread(a, x) {
    if (a.role !== "student" || x.state === "withdrawn") return "";
    if (a.state === "offline") return a.K.button({ label: "Mark as unread", disabled: true, reason: "You're offline", id: P.id(a, "unread") });
    return a.K.button({ label: "Mark as unread", note: "Preview only: read markers are not saved in this prototype" });
  }

  function links(a) {
    var list = [{ label: "Back to announcements", go: "W28" }, { label: "Notification settings", go: "W08" }];
    if (a.role === "instructor") list.push({ label: "Manage announcements", go: "W55" });
    return P.links(a, list);
  }

  function content(a, x) {
    if (x.state === "withdrawn") {
      var notice = a.K.notice({ tone: "info", title: "Withdrawn", body: P.p("The instructor withdrew this announcement. Its text is no longer shown.") });
      return P.stack(a, [notice, a.role === "student" ? "" : history(a, x, false), links(a)]);
    }
    return P.stack(a, [facts(a, x), P.p(latest(x).body), files(a, x), history(a, x, true), markUnread(a, x), links(a)]);
  }

  function body(a, x) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "This announcement is not available for your course role");
    if (a.state === "loading") return P.loading(a, "the announcement");
    if (a.state === "notYetAvailable") return P.stack(a, [a.K.notice({ tone: "info", title: "This announcement is not available yet" }), links(a)]);
    if (!x) return P.stack(a, [P.offHome(a, "This announcement is not published at this point"), links(a)]);
    var top = [P.taEnded(a) ? P.taEndedNotice(a) : "", a.state === "offline" ? P.offlineNotice(a) + a.K.flag("lastKnown") : ""];
    return P.stack(a, top.concat([content(a, x)]));
  }

  WB.definePage("W29", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "This page shows one announcement; an empty course is drawn on the announcement list" }),
    variants: { "office-hours": WB.manifest.anchors.W29.variants["office-hours"].label },
    render: function (a) {
      var x = record(a);
      var open = x && ["loading", "notYetAvailable", "permissionUnavailable"].indexOf(a.state) < 0;
      return P.shell(a, { title: open ? latest(x).title : "Announcement", body: body(a, x), crumbs: [{ label: "Announcements", go: "W28" }] }, { section: "announcements" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg4-community/W30.js */
/* W30 Discussion list (Phase 3 seg4). Course-level. Topics come from visibleTopics, so a group topic reaches only its
   members. Reply counts, authors and last activity are selector values; only the anchored topic links to W31.
   Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "firstUseEmpty", "filteredEmpty", "offline", "permissionUnavailable"];
  var COLS = [
    { key: "topic", label: "Topic", primary: true }, { key: "by", label: "Started by" }, { key: "replies", label: "Replies", numeric: true },
    { key: "last", label: "Last activity" }, { key: "state", label: "State" },
  ];

  function topics(a) { return a.sel.visibleTopics(a.view, a.who.courseId, a.who.personId); }
  function groupName(a, t) {
    var hit = "";
    a.view.data.groups.group_sets.forEach(function (s) { s.groups.forEach(function (g) { if (g.id === t.group_id) hit = g.name; }); });
    return hit;
  }

  function row(a, t) {
    var last = a.sel.lastActivity(a.view, t.id);
    var state = (t.replies_closed ? a.K.flag("closed") : esc("Open")) +
      (t.audience === "group" ? " " + a.K.badge({ label: "Group only: " + groupName(a, t), tone: "neutral" }) : "");
    var cells = {
      topic: esc(t.title), by: esc(P.personName(a, a.sel.topicAuthor(a.view, t.id))), replies: esc(String(a.sel.replyCount(a.view, t.id))),
      last: last ? esc(P.when(a, last)) : "", state: state,
    };
    var go = P.recordGo("W31", "discussion", t.id);
    return go ? { id: t.id, cells: cells, go: go } : { id: t.id, cells: cells };
  }

  function emptyFor(a) {
    if (a.state === "filteredEmpty") return { title: "No topics match", body: P.p("Other topics are still in the list."), action: { label: "Clear filters", note: "Preview only: filters are not wired" } };
    return { title: "No discussions yet", body: P.p("Topics started in this course appear here.") };
  }

  function table(a) {
    var rows = a.state === "firstUseEmpty" || a.state === "filteredEmpty" ? [] : topics(a).map(function (t) { return row(a, t); });
    return a.K.table(a.ctx, { id: P.id(a, "topics"), caption: "Discussions", columns: COLS, rows: rows, empty: emptyFor(a) });
  }

  function rules(a) {
    var text = P.p("Posts are visible to everyone in the topic's audience: the whole course, or one group for a group topic.") +
      P.p("This is not private messaging. Ask about your own grades through the help page.");
    return a.K.disclosure({ id: P.id(a, "rules"), summary: "Posting rules", body: text });
  }

  function start(a) {
    if (P.taEnded(a)) return "";
    if (a.state === "offline") return a.K.button({ label: "Start a topic", disabled: true, reason: "You're offline", id: P.id(a, "start") });
    return a.K.button({ label: "Start a topic", note: "Preview only: no topic is started in this prototype" });
  }

  function body(a) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "Discussions are not available for your course role");
    if (a.state === "loading") return P.loading(a, "discussions");
    var top = [P.taEnded(a) ? P.taEndedNotice(a) : "", a.state === "offline" ? P.offlineNotice(a) + a.K.flag("lastKnown") : ""];
    var manage = a.role === "instructor" ? P.links(a, [{ label: "Manage discussions", go: "W56" }]) : "";
    return P.stack(a, top.concat([start(a), table(a), rules(a), manage]));
  }

  var PREVIEW = "Starting a topic is preview only in this prototype";
  WB.definePage("W30", {
    states: STATES,
    na: P.na(STATES, { invalid: PREVIEW, saving: PREVIEW, saveFailed: PREVIEW }),
    render: function (a) {

<script>/* pages/seg4-community/W31.js */
/* W31 Discussion thread (Phase 3 seg4). Anchor: the projectile topic, read through visibleTopics. Posts in order with
   author, role and time; the reply composer is preview only and never claims a post was sent. No composer when
   replies are closed, access has ended or the audience changed. Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "invalid", "saving", "saveFailed", "offline", "permissionUnavailable"];

  function topic(a) {
    var id = a.sel.anchorFor("W31").record.id;
    return a.sel.visibleTopics(a.view, a.who.courseId, a.who.personId).filter(function (t) { return t.id === id; })[0] || null;
  }
  function audience(a, t) {
    var course = a.sel.course(a.view, a.who.courseId);
    return t.audience === "group" ? "your group only" : "everyone in " + course.code;
  }
  function roleOf(a, personId) {
    var person = a.sel.person(a.view, personId);
    return person ? WB.ROLE_LABELS[person.role] || "" : "";
  }

  function header(a, t) {
    return a.K.kv([
      { label: "Audience", value: audience(a, t) },
      { label: "Replies", value: String(a.sel.replyCount(a.view, t.id)) },
      { label: "Last activity", value: P.when(a, a.sel.lastActivity(a.view, t.id)) },
    ]);
  }

  function report(a, post) {
    if (a.state === "offline") return a.K.button({ label: "Report", kind: "quiet", disabled: true, reason: "You're offline", id: P.id(a, "report-" + post.id) });
    return a.K.button({ label: "Report", kind: "quiet", note: "Preview only: nothing is reported in this prototype" });
  }
  function postCard(a, t, post) {
    var parent = post.parent_id ? t.posts.filter(function (x) { return x.id === post.parent_id; })[0] : null;
    var meta = P.when(a, post.at) + (parent ? " · In reply to " + P.personName(a, parent.author_id) : "");
    var title = P.personName(a, post.author_id) + " · " + roleOf(a, post.author_id);
    return a.K.card({ title: title, body: P.p(meta) + P.p(post.body), footer: report(a, post) });
  }
  function posts(a, t) {
    return a.K.section({ title: "Posts", level: 2, body: P.stack(a, t.posts.map(function (post) { return postCard(a, t, post); })) });
  }

  function postButton(a) {
    var id = P.id(a, "post");
    if (a.state === "offline") return a.K.button({ label: "Post reply", disabled: true, reason: "You're offline", id: id }) + P.p("Not posted");
    if (a.state === "saving") return a.K.saveStatus("saving") + a.K.button({ label: "Post reply", disabled: true, reason: "Your reply is still sending", id: id });
    return a.K.button({ label: "Post reply", kind: "primary", note: "Preview only: nothing is posted in this prototype" });
  }
  function failed(a) {
    if (a.state !== "saveFailed") return "";
    return a.K.notice({
      tone: "error", title: "We could not confirm your reply was posted. Check the thread before trying again",
      actions: [{ label: "Check thread", note: "Preview only: the thread is not reloaded in this prototype" }],
    });
  }
  function composer(a, t) {
    if (t.replies_closed) return P.stack(a, [a.K.flag("closed"), P.p("Replies are closed")]);
    if (P.taEnded(a)) return "";
    var field = a.K.field({ label: "Your reply", type: "textarea", id: P.id(a, "reply"), error: a.state === "invalid" ? "Write a reply before posting" : undefined });
    var line = P.p("Posting as " + P.personName(a, a.who.personId) + " to " + audience(a, t));
    return a.K.section({ title: "Reply", level: 2, body: P.stack(a, [failed(a), line, field, postButton(a)]) });
  }

  function links(a) {
    var list = [{ label: "Back to discussions", go: "W30" }];
    if (a.role === "instructor") list.push({ label: "Manage discussions", go: "W56" });
    return P.links(a, list);
  }

  function body(a, t) {
    if (a.state === "permissionUnavailable") return P.stack(a, [P.permissionNotice(a, "You no longer have access to this discussion"), links(a)]);
    if (a.state === "loading") return P.loading(a, "the discussion");
    if (!t) return P.stack(a, [P.offHome(a, "This discussion has not started at this point"), links(a)]);
    var top = [P.taEnded(a) ? P.taEndedNotice(a) : "", a.state === "offline" ? P.offlineNotice(a) + a.K.flag("lastKnown") : ""];
    return P.stack(a, top.concat([header(a, t), posts(a, t), composer(a, t), links(a)]));
  }

  WB.definePage("W31", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "A thread always has its opening post; an empty course is drawn on the discussion list" }),
    render: function (a) {
      var t = topic(a);
      var open = t && ["loading", "permissionUnavailable"].indexOf(a.state) < 0;
      return P.shell(a, { title: open ? t.title : "Discussion", body: body(a, t), crumbs: [{ label: "Discussions", go: "W30" }] }, { section: "discussions" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg4-community/W33.js */
/* W33 My course groups (Phase 3 seg4). Student only. Anchor: the lab-teams set; home group_work_in_progress. Shows
   only the viewer's own group (groupFor) and the set's published group work (A4). No Join control: the instructor
   assigns groups. Rules: pages/seg4-community/NOTES.md. */
(function (root) {

  function setOf(a) {

    var facts = a.K.kv([

    ]);

<script>/* pages/seg4-community/W34.js */
/* W34 Group workspace (Phase 3 seg4). Student only. Anchor: Team Orbit; home group_work_in_progress. The viewer's
   group must be the anchor group, else nothing about it is drawn. Per published group assignment (A4): the receipt
   with its captured members, or the shared draft with its membership version, or neither. Conflict blocks Add
   and Review and keeps any receipt unchanged. Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "firstUseEmpty", "conflict", "offline", "permissionUnavailable"];

  function groupId(a) { return a.sel.anchorFor("W34").record.id; }
  function setOf(a) {
    var gid = groupId(a);
    return a.view.data.groups.group_sets.filter(function (s) {
      return s.course_id === a.who.courseId && s.groups.some(function (g) { return g.id === gid; });
    })[0] || null;
  }
  function work(a, set) {
    var published = P.assessments(a).map(function (x) { return x.id; });
    return a.view.data.groups.group_assignments.filter(function (g) {
      return g.course_id === a.who.courseId && g.group_set_id === set.id && published.indexOf(g.id) >= 0;
    });
  }
  function namesOf(a, ids) { return ids.map(function (m) { return P.personName(a, m); }).filter(Boolean).join(", "); }
  function link(label, go) { return go ? { label: label, go: go } : null; }

  function receiptPart(a, r) {
    var facts = a.K.kv([
      { label: "Handed in by", value: P.personName(a, r.actor_id) }, { label: "Accepted", value: P.when(a, r.accepted_at) },
      { label: "Members on the receipt", value: namesOf(a, r.captured_members) },
      { label: "Membership version at hand-in", value: String(r.membership_version) },
    ]);
    var keep = a.state === "conflict" ? P.p("This receipt keeps its original members") : "";
    return P.stack(a, [facts, keep, P.links(a, [link("View receipt", P.recordGo("W22", "receipt", r.id))])]);
  }

  function blockReason(a) {
    if (a.state === "conflict") return "Refresh the group first";
    return a.state === "offline" ? "You're offline" : "";
  }
  function draftActions(a, draft) {
    var reason = blockReason(a);
    if (reason) {
      return P.stack(a, [
        a.K.button({ label: "Add group work", disabled: true, reason: reason, id: P.id(a, "add") }),
        a.K.button({ label: "Review and submit", disabled: true, reason: reason, id: P.id(a, "review") }),
      ]);
    }
    return P.links(a, [link("Continue group work", P.recordGo("W20", "draft", draft.id)), link("Review and submit", P.recordGo("W21", "draft", draft.id))]);
  }
  function draftPart(a, draft) {
    var files = a.K.list({ label: "Files in the shared draft", items: draft.files.map(function (f) { return { title: f.name, meta: P.fileMeta(a, f) }; }) });
    return P.stack(a, [
      P.p("Shared draft saved by " + P.personName(a, draft.actor_id) + " · " + P.when(a, draft.saved_at)), files,
      P.p("Prepared for membership version " + draft.membership_version), draftActions(a, draft),
    ]);
  }
  function nonePart(a) {
    var reason = blockReason(a);
    var add = reason ? a.K.button({ label: "Add group work", disabled: true, reason: reason, id: P.id(a, "add") }) : "";
    return P.stack(a, [P.p("No shared draft yet. Start it from the assignment page."), add]);
  }

  function block(a, it) {
    var r = a.sel.receiptsFor(a.view, it.id, a.who)[0] || null;
    var draft = r ? null : a.sel.draftFor(a.view, it.id, a.who);
    var part = r ? receiptPart(a, r) : draft ? draftPart(a, draft) : nonePart(a);
    var more = P.links(a, [link("Assignment details", P.recordGo("W19", "assessment", it.id))]);
    var body = P.stack(a, [P.status(a, P.ownSubmission(a, it.id), true), part, P.p("One submission counts for the whole group."), more]);
    return a.K.card({ title: it.title, body: body, level: 2 });
  }

  function conflictNotice(a, set, items) {
    var draft = items.map(function (it) { return a.sel.draftFor(a.view, it.id, a.who); }).filter(Boolean)[0];
    var text = "Current membership version " + set.version + (draft ? ". The shared draft was prepared for version " + draft.membership_version : "") + ".";
    return a.K.notice({
      tone: "warning", title: "Your group's membership changed. Review the members again before handing in", body: P.p(text),
      actions: [{ label: "Refresh group", note: "Preview only: the group is not reloaded in this prototype" }, { label: "My groups", go: "W33" }],
    });
  }

  function content(a, set, g) {
    var items = work(a, set).map(function (x) { return a.sel.assessment(a.view, x.id); });
    var facts = a.K.kv([
      { label: "Group", value: g.name }, { label: "Group set", value: set.name },
      { label: "Members", value: namesOf(a, g.members) }, { label: "Membership version", value: String(set.version) },
    ]);
    var empty = a.K.empty({ title: "No group work assigned yet", body: P.links(a, [{ label: "My groups", go: "W33" }]) });
    var top = a.state === "conflict" ? conflictNotice(a, set, items) : a.state === "offline" ? P.offlineNotice(a) + a.K.flag("lastKnown") : "";
    var list = a.state === "firstUseEmpty" || !items.length ? [empty] : items.map(function (it) { return block(a, it); });
    return P.stack(a, [top, facts].concat(list));
  }

  function body(a) {
    var set = setOf(a);
    var g = set ? a.sel.groupFor(a.view, a.who.personId, set.id) : null;
    if (a.state === "permissionUnavailable" || !g || g.id !== groupId(a)) return P.permissionNotice(a, "This group workspace is not available to you");
    if (a.state === "loading") return P.loading(a, "the group workspace");
    return content(a, set, g);
  }

  WB.definePage("W34", {
    states: STATES,
    na: P.na(STATES, { invalid: "Files are added on the add-work page; this workspace takes no typed input" }),
    render: function (a) {
      return P.shell(a, { title: "Group workspace", body: body(a), crumbs: [{ label: "My groups", go: "W33" }] }, { section: "groups" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg4-community/W47.js */
/* W47 Group sets and membership builder (Phase 3 seg4). Instructor and TA. Anchor: the lab-teams set. Authority first
   (staffGate on the group assignment, then the TA's own task access and scope, A6). The instructor edits on web
   (preview-only Move, Save and Publish); iPad and iPhone are the review tier with a read-only roster and the
   instructor's "Lock membership" protective action. Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "firstUseEmpty", "invalid", "saveFailed", "conflict", "offline", "permissionUnavailable"];
  var INVALID = "Every learner must be in exactly one group before publishing";
  var BLOCK = { conflict: "Refresh the roster first", offline: "You're offline", invalid: INVALID, saveFailed: "Retry the failed save first" };

  function setOf(a) {
    var id = a.sel.anchorFor("W47").record.id;
    return a.view.data.groups.group_sets.filter(function (s) { return s.id === id && s.course_id === a.who.courseId; })[0] || null;
  }
  function gaOf(a, set) {
    return a.view.data.groups.group_assignments.filter(function (g) { return g.course_id === a.who.courseId && g.group_set_id === set.id; })[0] || null;
  }
  function names(a, ids) { return ids.map(function (m) { return P.personName(a, m); }).filter(Boolean); }
  function blocked(a) { return Object.prototype.hasOwnProperty.call(BLOCK, a.state) ? BLOCK[a.state] : ""; }
  // R06: on the review tier every blocking state but form validation (no form is drawn there) blocks the protective action.
  function reviewBlocked(a) { return a.state === "invalid" ? "" : blocked(a); }

  function facts(a, set, ga) {
    var it = ga ? a.sel.assessment(a.view, ga.id) : null;
    var rows = [{ label: "Group set", value: set.name }, { label: "Membership version", value: String(set.version) }, { label: "Self-enrollment", value: set.self_enrollment ? "On" : "Off" }];
    if (it) rows.push({ label: "Used by", value: it.title + " · published with membership version " + ga.membership_version_at_publish });
    var go = it ? P.recordGo("W40", "assessment", it.id) : null;
    return P.stack(a, [a.K.kv(rows), go ? P.links(a, [{ label: "Open the assignment editor", go: go }]) : ""]);
  }

  function memberItem(a, m, editable) {
    var move = editable ? a.K.button({ label: "Move to group…", kind: "quiet", act: "open-dialog", target: P.id(a, "move") }) : "";
    return { title: P.personName(a, m), trailing: move || undefined };
  }
  function groupCard(a, g, editable) {
    var count = g.members.length + (g.members.length === 1 ? " member" : " members");
    var list = a.K.list({ label: g.name + " members", items: g.members.map(function (m) { return memberItem(a, m, editable); }) });
    return a.K.card({ title: g.name, body: P.p(count) + list });
  }
  function roster(a, set, groups, editable) {
    var ungrouped = set.ungrouped.length ? P.p(names(a, set.ungrouped).join(", ")) : P.p("Everyone is in a group");
    var cards = [a.K.card({ title: "Not in a group", body: ungrouped })].concat(groups.map(function (g) { return groupCard(a, g, editable); }));
    return a.K.grid(a.ctx, { items: cards, cols: 3, compactCols: 1 });
  }

  function receipts(a, set, ga) {
    var list = ga ? a.sel.receiptsFor(a.view, ga.id, a.who).filter(function (r) { return r.group_id; }) : [];
    if (!list.length) return "";
    var cards = list.map(function (r) {
      var g = set.groups.filter(function (x) { return x.id === r.group_id; })[0];
      var go = P.recordGo("W49", "receipt", r.id);
      var kv = a.K.kv([
        { label: "Members", value: names(a, r.captured_members).join(", ") }, { label: "Membership version", value: String(r.membership_version) },
        { label: "Accepted", value: P.when(a, r.accepted_at) },
      ]);
      return a.K.card({ title: g ? g.name : "Group", body: kv + P.p("These members are fixed on the receipt") + (go ? P.links(a, [{ label: "Open in grader", go: go }]) : "") });
    });
    return a.K.section({ title: "Group work handed in", level: 2, body: P.stack(a, cards) });
  }

  function actionButton(a, label, suffix, note) {
    var reason = blocked(a);
    if (reason) return a.K.button({ label: label, disabled: true, reason: reason, id: P.id(a, suffix) });
    return a.K.button({ label: label, kind: suffix === "publish" ? "primary" : "secondary", note: note });
  }
  function stateTop(a) {
    if (a.state === "invalid") return a.K.notice({ tone: "error", title: INVALID });
    if (a.state === "saveFailed") return a.K.saveStatus("failed") + a.K.button({ label: "Retry save", note: "Preview only: nothing is saved in this prototype" });
    if (a.state === "offline") return P.offlineNotice(a) + a.K.flag("lastKnown");
    if (a.state !== "conflict") return "";
    return a.K.notice({
      tone: "warning", title: "The course roster changed after this set was built. Refresh before publishing",
      actions: [{ label: "Refresh roster", note: "Preview only: the roster is not reloaded in this prototype" }],
    });
  }

  function moveDialog(a) {
    return a.K.dialog(a.ctx, {
      id: P.id(a, "move"), title: "Change membership after work", open: a.variant === "move",
      body: P.p("The change applies from now on. Work already handed in keeps the members it was handed in with."),
      actions: [{ label: "Apply from now on", kind: "primary", id: P.id(a, "move-apply"), note: "Preview only: membership does not change in this prototype" }],
    });
  }

  function instructorFull(a, set, ga) {
    if (a.state === "firstUseEmpty") {
      return { body: a.K.empty({ title: "No group sets yet", action: { label: "Create group set", note: "Preview only: no set is created in this prototype" } }), dialog: "" };
    }
    var editable = !blocked(a);
    var actions = P.stack(a, [
      editable ? "" : actionButton(a, "Move to group…", "move-btn"),
      actionButton(a, "Save draft", "save", "Preview only: nothing is saved in this prototype"),
      actionButton(a, "Publish group set", "publish", "Preview only: nothing is published in this prototype"),
    ]);
    var body = P.stack(a, [stateTop(a), facts(a, set, ga), roster(a, set, set.groups, editable), receipts(a, set, ga), actions]);
    return { body: body, dialog: editable ? moveDialog(a) : "" };
  }

  function instructorReview(a, set, ga) {
    var reason = reviewBlocked(a);
    var lock = [reason ? { label: "Lock membership for this set", disabled: true, reason: reason, id: P.id(a, "lock") }
      : { label: "Lock membership for this set", note: "Preview only: nothing is locked in this prototype" }];
    var handoff = P.handoff(a, { title: "Open on a larger screen", lastResult: P.p(set.name + " · membership version " + set.version), protectiveActions: lock });
    var top = reason ? stateTop(a) : "";
    var main = a.state === "firstUseEmpty" ? a.K.empty({ title: "No group sets yet" }) : P.stack(a, [facts(a, set, ga), roster(a, set, set.groups, false), receipts(a, set, ga)]);
    return P.stack(a, [handoff, top, main]);
  }

  // A6: a TA reads learners only through an active task and a non-null scope for this group assignment.
  function taView(a, set, ga) {
    var it = a.sel.assessment(a.view, ga.id);
    var access = a.sel.taTaskAccess(a.view, ga.id, a.who);
    var scope = access.active ? a.sel.taScope(a.view, ga.id, a.who) : null;
    var handoff = P.handoff(a, { title: "Open on a larger screen" });
    if (!scope) return P.stack(a, [handoff, a.K.notice({ tone: "info", title: "Access ended", body: P.p("Grading task: " + it.title + ". No learner data is shown.") })]);
    var groups = set.groups.filter(function (g) { return g.members.every(function (m) { return scope.learnerIds.indexOf(m) >= 0; }); });
    var cards = groups.map(function (g) { return groupCard(a, g, false); });
    return P.stack(a, [handoff, a.K.flag("readOnly"), P.p("Groups in your grading task for " + it.title), P.stack(a, cards), P.p("Changing membership is the instructor's step")]);
  }

  function view(a) {
    var set = setOf(a);
    var ga = set ? gaOf(a, set) : null;
    var gate = P.staffGate(a, ga ? ga.id : null);
    if (gate) return { body: gate, dialog: "" };
    if (a.state === "loading") return { body: P.stack(a, [P.handoff(a, { title: "Open on a larger screen" }), P.loading(a, "group sets")]), dialog: "" };
    if (!set) return { body: P.stack(a, [P.handoff(a, { title: "Open on a larger screen" }), a.K.empty({ title: "No group sets yet" })]), dialog: "" };
    if (a.role === "ta") return { body: ga ? taView(a, set, ga) : P.bareHandoff(a), dialog: "" };
    return a.tier === "full" ? instructorFull(a, set, ga) : { body: instructorReview(a, set, ga), dialog: "" };
  }

  WB.definePage("W47", {
    states: STATES,
    na: P.na(STATES, { saving: "Saving is drawn as preview only; the failed save is drawn instead" }),
    variants: { move: "Change membership dialog open" },
    render: function (a) {
      var v = view(a);
      return P.shell(a, { title: "Groups", body: v.body, dialog: v.dialog || undefined }, { page: "W47" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* pages/seg4-community/W55.js */
/* W55 Announcement editor (Phase 3 seg4). Instructor and TA. The subject is the W29 anchor announcement when it exists
   at the clock, else a new blank one. Publish and Withdraw open confirm dialogs whose primary item is preview only
   (no result scenario exists). A TA reads published announcements only. iPad and iPhone are the review tier with
   the instructor's "Withdraw announcement" protective action. Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "invalid", "saving", "saveFailed", "offline", "permissionUnavailable"];
  var SHOWN = ["published", "withdrawn"];
  var BLOCK = { invalid: "Add a title first", saving: "Your changes are still saving", saveFailed: "Save the draft first", offline: "You're offline" };

  function anns(a) { return a.view.data.comms.announcements.filter(function (x) { return x.course_id === a.who.courseId; }); }
  function latest(x) { return x.revisions[x.revisions.length - 1]; }
  function subject(a) {
    var id = a.sel.anchorFor("W29").record.id;
    return anns(a).filter(function (x) { return x.id === id; })[0] || null;
  }
  function blocked(a) { return Object.prototype.hasOwnProperty.call(BLOCK, a.state) ? BLOCK[a.state] : ""; }
  // R06: on the review tier every blocking state but form validation (no form is drawn there) blocks the protective action.
  function reviewBlocked(a) { return a.state === "invalid" ? "" : blocked(a); }
  function stateText(a, x) {
    if (!x || x.state === "draft") return "Not published yet";
    if (x.state === "scheduled") return "Scheduled" + (x.scheduled_for ? " for " + P.when(a, x.scheduled_for) : "");
    if (x.state === "withdrawn") return "Withdrawn" + (x.withdrawn_at ? " " + P.when(a, x.withdrawn_at) : "");
    return "Published " + P.when(a, x.published_at);
  }

  function allList(a, list) {
    if (!list.length) return P.p("No announcements yet");
    return a.K.list({
      label: "All announcements",
      items: list.map(function (x) {
        var go = SHOWN.indexOf(x.state) >= 0 ? P.recordGo("W29", "announcement", x.id) : null;
        var item = { title: latest(x).title, meta: stateText(a, x) };
        if (go) item.go = go;
        return item;
      }),
    });
  }
  function history(a, x) {
    if (!x) return P.p("No versions yet");
    var items = x.revisions.slice().reverse().map(function (r) { return { title: "Version " + r.rev, meta: P.when(a, r.at) }; });
    return a.K.list({ label: "Version history", items: items });
  }
  function audienceText(a) {
    var course = a.sel.course(a.view, a.who.courseId);
    var n = a.sel.enrolled(a.view, a.who.courseId, "student").length;
    return "Everyone in " + course.code + ": " + n + (n === 1 ? " learner" : " learners");
  }

  function editor(a, x) {
    var l = x ? latest(x) : null;
    var timing = a.K.choiceGroup({
      legend: "When to publish", name: P.id(a, "timing"), id: P.id(a, "timing"), type: "radio",
      options: [{ id: P.id(a, "timing-now"), value: "now", label: "Publish now", checked: true }, { id: P.id(a, "timing-later"), value: "later", label: "Schedule for later" }],
    });
    return P.stack(a, [
      a.K.field({ label: "Title", id: P.id(a, "title"), value: a.state === "invalid" || !l ? "" : l.title, error: a.state === "invalid" ? "Add a title" : undefined }),
      a.K.field({ label: "Message", type: "textarea", id: P.id(a, "body"), value: l ? l.body : "" }),
      P.p("Audience: " + audienceText(a)), timing,
    ]);
  }

  function stateTop(a) {
    if (a.state === "saving") return a.K.saveStatus("saving");
    if (a.state === "offline") return P.offlineNotice(a) + a.K.flag("lastKnown");
    if (a.state !== "saveFailed") return "";
    return a.K.saveStatus("failed") + a.K.notice({
      tone: "error", title: "Your changes were not saved. Learners still see the last published version",
      actions: [{ label: "Retry save", note: "Preview only: nothing is saved in this prototype" }],
    });
  }

  function button(a, label, suffix, opener, note) {
    var reason = blocked(a);
    if (reason) return a.K.button({ label: label, disabled: true, reason: reason, id: P.id(a, suffix) });
    if (opener) return a.K.button({ label: label, kind: suffix === "publish-btn" ? "primary" : "secondary", act: "open-dialog", target: P.id(a, opener) });
    return a.K.button({ label: label, note: note });
  }
  function actions(a, x) {
    var out = [button(a, "Save draft", "save", null, "Preview only: nothing is saved in this prototype")];
    if (x && x.state === "withdrawn") out.push(button(a, "Publish again as a new version", "republish", null, "Preview only: nothing is published in this prototype"));
    else out.push(button(a, x && x.state === "published" ? "Publish update…" : "Publish…", "publish-btn", "publish"));
    if (x && x.state === "published") out.push(button(a, "Withdraw…", "withdraw-btn", "withdraw"));
    return P.stack(a, out);
  }

  function dialogs(a, x) {
    if (blocked(a)) return "";
    var title = x ? latest(x).title : "New announcement";
    var publish = a.K.dialog(a.ctx, {
      id: P.id(a, "publish"), title: "Publish this announcement?", open: a.variant === "publish",
      body: a.K.kv([{ label: "Title", value: title }, { label: "Audience", value: audienceText(a) }, { label: "Timing", value: "Publish now" }]) +
        P.p("Delivery follows each person's notification settings; publishing is recorded separately."),
      actions: [{ label: "Publish", kind: "primary", id: P.id(a, "publish-go"), note: "Preview only: nothing is published in this prototype" }],
    });
    if (!x || x.state !== "published") return publish;
    return publish + a.K.dialog(a.ctx, {
      id: P.id(a, "withdraw"), title: "Withdraw this announcement?", kind: "destructive", open: a.variant === "withdraw",
      body: P.p("Learners will see a Withdrawn notice in place of the text. The history is kept."),
      actions: [{ label: "Withdraw announcement", kind: "primary", id: P.id(a, "withdraw-go"), note: "Preview only: nothing is withdrawn in this prototype" }],
    });
  }

  function links(a, x) {
    var go = x && SHOWN.indexOf(x.state) >= 0 ? P.recordGo("W29", "announcement", x.id) : null;
    return P.links(a, [{ label: "Announcements", go: "W28" }, go ? { label: "View as published", go: go } : null]);
  }

  function rail(a, x) {
    return P.stack(a, [P.p(stateText(a, x)), a.K.section({ title: "Versions", level: 2, body: history(a, x) }), a.K.section({ title: "All announcements", level: 2, body: allList(a, anns(a)) })]);
  }

  function instructorFull(a, x) {
    var main = P.stack(a, [stateTop(a), editor(a, x), actions(a, x), links(a, x)]);
    return { body: a.K.rail(a.ctx, { main: main, rail: rail(a, x), railLabel: "Status and history" }), dialog: dialogs(a, x) };
  }

  function instructorReview(a, x) {
    var reason = reviewBlocked(a);
    var withdraw = reason ? { label: "Withdraw announcement", disabled: true, reason: reason, id: P.id(a, "withdraw-off") }
      : { label: "Withdraw announcement", note: "Preview only: nothing is withdrawn in this prototype" };
    var protect = x && x.state === "published" ? [withdraw] : [];
    var result = P.p((x ? latest(x).title : "New announcement") + " · " + stateText(a, x));
    var text = x && x.state === "published" ? P.p(latest(x).body) : "";
    var top = reason ? stateTop(a) : "";
    return P.stack(a, [P.handoff(a, { title: "Open on a larger screen", lastResult: result, protectiveActions: protect }), top, text, history(a, x), allList(a, anns(a)), links(a, x)]);
  }

  function taView(a) {
    var shown = anns(a).filter(function (x) { return SHOWN.indexOf(x.state) >= 0; });
    var notice = a.K.notice({ tone: "info", title: "Publishing announcements is the instructor's step", body: P.p("You can read the published announcements.") });
    return P.stack(a, [P.bareHandoff(a), notice, allList(a, shown), P.links(a, [{ label: "Announcements", go: "W28" }])]);
  }

  function view(a) {
    if (!a.who.courseId) return { body: P.stack(a, [P.bareHandoff(a), P.permissionNotice(a, "You are not teaching this course")]), dialog: "" };
    var gate = P.staffGate(a, null);
    if (gate) return { body: gate, dialog: "" };
    if (a.state === "loading") return { body: P.stack(a, [P.bareHandoff(a), P.loading(a, "the announcement editor")]), dialog: "" };
    if (a.role === "ta") return { body: taView(a), dialog: "" };
    var x = subject(a);
    return a.tier === "full" ? instructorFull(a, x) : { body: instructorReview(a, x), dialog: "" };
  }

  WB.definePage("W55", {
    states: STATES,
    na: P.na(STATES, {
      destructive: "Withdrawing keeps the full history; nothing is deleted",
      conflict: "One instructor authors announcements in this prototype",
      firstUseEmpty: "The editor starts a new announcement when there is none; the list shows the empty course",
    }),
    variants: { publish: "Publish dialog open", withdraw: "Withdraw dialog open" },
    render: function (a) {
      var v = view(a);
      return P.shell(a, { title: "Announcement editor", body: v.body, dialog: v.dialog || undefined }, { section: "announcements" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg4-community/W56.js */
/* W56 Discussion setup and moderation (Phase 3 seg4). Instructor and TA. The subject is the W31 anchor topic when it
   is visible at the clock. Hide, Lock and setup changes are preview only; there are no report records, so the
   reported list is empty. A TA has no moderation scope. iPad and iPhone are the review tier with the instructor's
   "Lock replies" protective action. Rules: pages/seg4-community/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "firstUseEmpty", "invalid", "conflict", "offline", "permissionUnavailable"];
  var BLOCK = { invalid: "Add a reason learners can read first", conflict: "Refresh the thread first", offline: "You're offline" };
  var COLS = [
    { key: "topic", label: "Topic", primary: true }, { key: "audience", label: "Audience" }, { key: "replies", label: "Replies", numeric: true },
    { key: "last", label: "Last activity" }, { key: "state", label: "State" },
  ];

  function topics(a) { return a.sel.visibleTopics(a.view, a.who.courseId, a.who.personId); }
  function subject(a) {
    var id = a.sel.anchorFor("W31").record.id;
    return topics(a).filter(function (t) { return t.id === id; })[0] || null;
  }
  function blocked(a) { return Object.prototype.hasOwnProperty.call(BLOCK, a.state) ? BLOCK[a.state] : ""; }
  // R06: on the review tier every blocking state but form validation (no form is drawn there) blocks the protective action.
  function reviewBlocked(a) { return a.state === "invalid" ? "" : blocked(a); }

  function table(a) {
    var rows = a.state === "firstUseEmpty" ? [] : topics(a).map(function (t) {
      var last = a.sel.lastActivity(a.view, t.id);
      var go = P.recordGo("W31", "discussion", t.id);
      var cells = {
        topic: esc(t.title), audience: esc(t.audience === "group" ? "Group only" : "Whole course"),
        replies: esc(String(a.sel.replyCount(a.view, t.id))), last: last ? esc(P.when(a, last)) : "", state: t.replies_closed ? a.K.flag("closed") : esc("Open"),
      };
      return go ? { id: t.id, cells: cells, go: go } : { id: t.id, cells: cells };
    });
    var empty = { title: "No discussions yet" };
    if (a.role === "instructor" && a.tier === "full") empty.action = { label: "Create discussion", note: "Preview only: no discussion is created in this prototype" };
    return a.K.table(a.ctx, { id: P.id(a, "topics"), caption: "Discussions", columns: COLS, rows: rows, empty: empty });
  }

  function control(a, label, suffix, note) {
    var reason = blocked(a);
    if (reason) return a.K.button({ label: label, kind: "quiet", disabled: true, reason: reason, id: P.id(a, suffix) });
    return a.K.button({ label: label, kind: "quiet", note: note });
  }
  function postItem(a, post, editable) {
    var person = a.sel.person(a.view, post.author_id);
    var role = person ? WB.ROLE_LABELS[person.role] || "" : "";
    var hide = editable ? control(a, "Hide post…", "hide-" + post.id, "Preview only: nothing is hidden in this prototype") : undefined;
    return { title: P.personName(a, post.author_id) + " · " + role, meta: P.when(a, post.at) + " · " + post.body, trailing: hide };
  }

  function stateTop(a) {
    if (a.state === "offline") return P.offlineNotice(a) + a.K.flag("lastKnown");
    if (a.state !== "conflict") return "";
    return a.K.notice({
      tone: "warning", title: "This thread changed while you were deciding. Refresh before acting",
      actions: [{ label: "Refresh", note: "Preview only: the thread is not reloaded in this prototype" }],
    });
  }

  function thread(a, t) {
    if (!t) return P.p("The moderated thread has not started at this point.");
    var lock = t.replies_closed ? "Reopen replies" : "Lock replies";
    var reason = a.K.field({ label: "Reason shown to learners", id: P.id(a, "reason"), error: a.state === "invalid" ? "Add a reason learners can read" : undefined });
    var posts = a.K.list({ label: "Posts in this thread", items: t.posts.map(function (p) { return postItem(a, p, true); }) });
    var body = P.stack(a, [posts, reason, control(a, lock, "lock", "Preview only: replies do not change in this prototype")]);
    return a.K.section({ title: "Thread: " + t.title, level: 2, body: body });
  }
  function reported(a) {
    return a.K.section({ title: "Reported posts", level: 2, body: a.K.empty({ title: "No reported posts", body: P.p("Posts that learners report appear here.") }) });
  }
  function links(a, t) {
    var go = t ? P.recordGo("W31", "discussion", t.id) : null;
    return P.links(a, [{ label: "Discussions", go: "W30" }, go ? { label: "Open thread", go: go } : null]);
  }

  function instructorFull(a) {
    var t = a.state === "firstUseEmpty" ? null : subject(a);
    var parts = a.state === "firstUseEmpty" ? [table(a)] : [stateTop(a), table(a), thread(a, t), reported(a)];
    return P.stack(a, parts.concat([links(a, t)]));
  }

  function instructorReview(a) {
    var t = a.state === "firstUseEmpty" ? null : subject(a);
    var reason = reviewBlocked(a);
    var lock = reason ? { label: "Lock replies", disabled: true, reason: reason, id: P.id(a, "lock-off") }
      : { label: "Lock replies", note: "Preview only: replies do not change in this prototype" };
    var protect = t && !t.replies_closed ? [lock] : [];
    var result = t ? P.p(t.title + " · " + (t.replies_closed ? "Replies closed" : "Replies open")) : "";
    var handoff = P.handoff(a, { title: "Open on a larger screen", lastResult: result, protectiveActions: protect });
    return P.stack(a, [handoff, reason ? stateTop(a) : "", table(a), links(a, t)]);
  }

  function taView(a) {
    var notice = a.K.notice({ tone: "info", title: "You have no moderation scope in this course", body: P.p("A grading task does not include moderation.") });
    return P.stack(a, [P.bareHandoff(a), notice, a.K.flag("readOnly"), table(a), P.links(a, [{ label: "Discussions", go: "W30" }])]);
  }

  function body(a) {
    var gate = P.staffGate(a, null);
    if (gate) return gate;
    if (a.state === "loading") return P.stack(a, [P.bareHandoff(a), P.loading(a, "discussion setup")]);
    if (a.role === "ta") return taView(a);
    return a.tier === "full" ? instructorFull(a) : instructorReview(a);
  }

  var PREVIEW = "Setup changes are preview only in this prototype";
  WB.definePage("W56", {
    states: STATES,
    na: P.na(STATES, { saving: PREVIEW, saveFailed: PREVIEW }),
    render: function (a) {
      return P.shell(a, { title: "Discussion setup", body: body(a) }, { section: "discussions" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg5-authoring/W35.js */
/* W35 Course builder (Phase 3 seg5). Instructor edits; an active TA reads the outline. Modules are the course's
   module records (assumption A3); only the module W37 draws links to W37 (A5). Publishing has no result
   record, so it is disabled with a reason (S5-1). iPad and iPhone are the review tier. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "firstUseEmpty", "conflict", "offline", "permissionUnavailable"];
  var PREVIEW = "Preview only: nothing changes in this prototype";
  var KINDS = { assignment: "Assignment", lab: "Lab", groupAssignment: "Group assignment", quiz: "Quiz" };

  function canEdit(a) { return a.role === "instructor" && a.tier === "full"; }
  function modules(a) {
    return a.view.data.coursework.modules.filter(function (m) { return m.course_id === a.who.courseId; })
      .slice().sort(function (x, y) { return x.position - y.position; });
  }
  function drawnModule(a) { return a.sel.currentModule(a.view, a.who.courseId) || modules(a)[0] || null; }
  function itemGo(a, item) { return WB.Teaching.go(a, item.kind === "quiz" ? "W41" : "W40", { assessmentId: item.id, learnerId: null, receiptId: null }); }
  function dueText(a, it) {
    var q = it.quiz_id ? a.sel.quiz(a.view, it.quiz_id) : null;
    var at = q ? q.close : it.due;
    return at ? P.when(a, at) : "";
  }
  function items(a, m) {
    return m.item_ids.map(function (id) { return a.sel.assessment(a.view, id); }).filter(Boolean);
  }

  function table(a, m) {
    var cols = [{ key: "title", label: "Item", primary: true }, { key: "kind", label: "Type" }, { key: "due", label: "Due or closes" }];
    if (canEdit(a)) cols.push({ key: "act", label: "Actions" });
    var rows = items(a, m).map(function (it) {
      var cells = { title: esc(it.title), kind: esc(KINDS[it.kind] || ""), due: esc(dueText(a, it)) };
      if (canEdit(a)) cells.act = a.state === "offline" || a.state === "conflict"
        ? a.K.button({ label: "Hide from learners", kind: "quiet", disabled: true, reason: a.state === "offline" ? "You're offline" : "Reload the current version first", id: P.id(a, "hide-" + it.id) })
        : a.K.button({ label: "Hide from learners", kind: "quiet", note: PREVIEW });
      var go = itemGo(a, it);
      return go ? { id: it.id, cells: cells, go: go } : { id: it.id, cells: cells };
    });
    return a.K.table(a.ctx, { id: P.id(a, "mod-" + m.id), caption: "Items in " + m.title, columns: cols, rows: rows, empty: { title: "This module has no items yet" } });
  }

  function moduleCard(a, m, drawn) {
    var moves = canEdit(a) ? [a.K.button({ label: "Move up", kind: "quiet", note: PREVIEW }), a.K.button({ label: "Move down", kind: "quiet", note: PREVIEW })].join("") : "";
    return a.K.card({ title: m.title, go: drawn && drawn.id === m.id ? "W37" : undefined, body: table(a, m), footer: moves || undefined });
  }

  function links(a) {
    var staff = [{ label: "Course settings", go: "W36" }, { label: "Files", go: "W39" }, { label: "Rubrics", go: "W43" }];
    if (a.role !== "instructor") return P.links(a, staff);
    return P.links(a, staff.concat([
      { label: "All assessments", go: WB.Teaching.go(a, "W18", { assessmentId: null, receiptId: null, learnerId: null }) }, { label: "Gradebook", go: WB.Teaching.go(a, "W51", { assessmentId: null, receiptId: null, learnerId: null }) }, { label: "People", go: WB.Teaching.go(a, "W45", { assessmentId: null, receiptId: null, learnerId: null }) },
      { label: "Question bank", go: "W42" }, { label: "Copy course", go: "W59" }, { label: "Import or export", go: "W60" },
      { label: "Preview published course", go: P.recordGo("W14", "course", a.who.courseId) },
    ]).filter(function (l) { return l.go; }));
  }

  function publish(a) {
    if (!canEdit(a)) return "";
    var reason = a.state === "offline" ? "You're offline. Nothing has been published" : a.state === "conflict" ? "Reload the current version first" : "Nothing is waiting to be published";
    return P.stack(a, [
      a.K.button({ label: "Add module", note: PREVIEW }),
      a.K.button({ label: "Publish selected", kind: "primary", disabled: true, reason: reason, id: P.id(a, "publish") }),
    ]);
  }

  function top(a) {
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.saveStatus("savedLocal")]);
    if (a.state === "conflict") {
      var acts = canEdit(a) ? [{ label: "Reload current version", note: PREVIEW }, { label: "Compare", note: PREVIEW }] : [];
      return a.K.notice({ tone: "warning", title: "Another staff member changed this outline", actions: acts });
    }
    return a.role === "ta" ? P.stack(a, [a.K.flag("readOnly"), P.p("Editing this course is the instructor's step")]) : "";
  }

  function empty(a) {
    return a.K.empty({ title: "No modules yet", body: a.role === "instructor" ? P.links(a, [{ label: "Import a course package", go: "W60" }]) : P.p("The instructor has not added modules.") });
  }

  function outline(a) {
    var list = modules(a);
    if (a.state === "firstUseEmpty" || !list.length) return empty(a);
    var drawn = drawnModule(a);
    return P.stack(a, list.map(function (m) { return moduleCard(a, m, drawn); }));
  }

  function full(a) {
    var c = a.sel.course(a.view, a.who.courseId);
    var rail = P.stack(a, [a.K.kv([{ label: "Course", value: c.code + " " + c.title }, { label: "Term", value: c.term }]), links(a)]);
    return P.stack(a, [top(a), a.K.rail(a.ctx, { main: outline(a), rail: rail, railLabel: "Inspector" }), publish(a)]);
  }

  // R06: a review-tier protective action follows the same blocking states as the web controls.
  function guarded(a, action, key, reasons) {
    var reason = Object.prototype.hasOwnProperty.call(reasons, a.state) ? reasons[a.state] : "";
    return reason ? { label: action.label, disabled: true, reason: reason, id: P.id(a, key) } : action;
  }
  function review(a) {

<script>/* pages/seg5-authoring/W43.js */
/* W43 Rubric library (Phase 3 seg5). One card per published assessment rubric. A rubric is "In use" when scored

<script>/* pages/seg5-authoring/W45.js */

<script>/* pages/seg5-authoring/W46.js */
/* W46 Learner allowances (Phase 3 seg5). Anchor: the student persona's Quiz 3 allowance. The instructor sees the

   primary. A TA sees only the effective time, and only for a learner in an active task (A6). */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "firstUseEmpty", "invalid", "destructive", "offline", "permissionUnavailable"];
  var PREVIEW = "Preview only: nothing changes in this prototype";

  // R01: the frame role alone is not membership. The viewer must hold that role in the quiz's course before any
  // allowance field is read.

  }
  function ctx(a) {

  }
  function denied(a) { return P.stack(a, [P.bareHandoff(a), P.permissionNotice(a, "You are not teaching this course")]); }

      { label: "Effective time", value: minutes(a, c) },
      { label: "Latest start for full time", value: P.when(a, a.sel.lateStartThreshold(a.view, c.quizId, c.learner)) },

      { label: "Note", value: c.al.note }, { label: "Basis reference (instructor only)", value: c.al.basis_reference_instructor_only },

  }

      a.K.field({ id: P.id(a, "extra"), label: "Extra minutes", type: "number" }),
      a.K.field({ id: P.id(a, "mult"), label: "Time multiplier", type: "number", error: bad ? "Use extra minutes or a multiplier, not both" : undefined }),

    ]);

    if (!c.al || a.state === "firstUseEmpty") return P.stack(a, [P.bareHandoff(a), a.K.empty({ title: "No allowance recorded for this learner" }), pending(a), link]);

<script>/* pages/seg5-authoring/W59.js */
/* W59 Course copy and rollover (Phase 3 seg5). Instructor only (TA: no access by default). Copied counts come from

<script>/* pages/seg6-grading/W48.js */
/* W48 Grading queue (Phase 3 spine). Instructor and TA. Anchor: the problem-set assessment. One row per receipt the viewer may
   see (receiptsFor is TA-scoped), review state from gradeDraftFor, progress from receivedProgress and

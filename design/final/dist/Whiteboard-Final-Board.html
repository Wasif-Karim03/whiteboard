/* system/tokens.css */
/* Whiteboard final design tokens (Phase 2a, 15 Nov 2026).
   Ported from design/system/tokens.css (legacy, left untouched). Every token is --wb-*.
   Teal accent only, light and dark; no other themes or palettes (BD7).
   Contrast pairs are checked by design/final/tools/check_tokens.mjs (static colour math, not a browser test).
   Where a legacy or board colour failed a checked pair it was shifted by the smallest lightness step in the
   same hue that passes, and the original is kept in a comment for owner review. */

:root {
  color-scheme: light;
  /* Neutrals */
  --wb-bg: #f3f4f5;            /* page / grouped background */
  --wb-surface: #ffffff;       /* cards, lists, sheets */
  --wb-surface-2: #f7f8f8;     /* inset areas, table stripes */
  --wb-fill: #e9ebec;          /* control fills, segmented track */
  --wb-separator: #dfe2e4;     /* hairlines (decorative, not a control boundary) */
  --wb-border: #81888d;        /* legacy: #868c91 (2.84:1 on --wb-fill); input/control boundaries >= 3:1 */
  --wb-text: #16191b;
  --wb-text-2: #575e63;        /* secondary text: >= 4.5:1 on surface and bg */
  /* Identity: Whiteboard teal */
  --wb-accent: #007176;        /* fills and links */
  --wb-accent-text: #006a6f;
  --wb-on-accent: #ffffff;
  --wb-accent-tint: #e2f2f2;
  /* Semantic status: always paired with an icon and words, never colour alone */
  --wb-success: #17703a;  --wb-success-bg: #e5f3e9;
  --wb-warning: #855000;  --wb-warning-bg: #fcefdb;
  --wb-error: #b0251c;    --wb-error-bg: #fcebe9;
  --wb-info: #0c5f9e;     --wb-info-bg: #e4eff9;
  --wb-neutral: #4a5157;  --wb-neutral-bg: #eceef0;  /* held, queued, not released */
  --wb-focus: #0a66d8;
  --wb-scrim: rgb(0 0 0 / 0.32);
  --wb-shadow-1: 0 1px 2px rgb(16 24 28 / 0.06), 0 1px 1px rgb(16 24 28 / 0.04);
  --wb-shadow-2: 0 8px 28px rgb(16 24 28 / 0.12), 0 1px 3px rgb(16 24 28 / 0.08);
  /* Course colours (banner and card fills; art and text use --wb-on-course) */
  --wb-course-phys: #2f6fde;   /* board: #2F6FDE */
  --wb-course-math: #7a4fd6;   /* board: #7A4FD6 */
  --wb-course-chem: #0c8577;   /* board: #0E9F8E (3.3:1 with white text) */
  --wb-course-cs: #16191b;     /* board: #16191B */
  --wb-on-course: #ffffff;
  /* Calendar event kinds (marks and edges, >= 3:1 on surface; always with a label) */
  --wb-kind-exam: #c0362c;     /* board: #C0362C */
  --wb-kind-quiz: #d87f27;     /* board: #D9822B (2.93:1 on surface) */
  --wb-kind-asg: #2f6fde;      /* board: #2F6FDE */
  --wb-kind-cls: #6b7280;      /* board: #6B7280 */
  --wb-kind-off: #0e9f8e;      /* board: #0E9F8E */
  --wb-kind-priv: #7a4fd6;     /* board: #7A4FD6 */
  /* Device frames drawn around native presentations (decorative) */
  --wb-device-frame: #1d2124;
  --wb-device-screen: #f3f4f5;

  /* Type: system font so iOS gets SF Pro and Dynamic Type metrics */
  --wb-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --wb-font-round: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --wb-scale: 1;               /* text-size multiplier; data-text="larger" previews larger Dynamic Type */

  /* Spacing: 4-pt grid */
  --wb-space-1: 4px; --wb-space-2: 8px; --wb-space-3: 12px; --wb-space-4: 16px; --wb-space-5: 20px;
  --wb-space-6: 24px; --wb-space-8: 32px; --wb-space-10: 40px; --wb-space-14: 56px;

  /* Radii */
  --wb-radius-control: 8px; --wb-radius-card: 12px; --wb-radius-inset: 10px; --wb-radius-sheet: 16px; --wb-radius-pill: 999px;

  /* Motion: short, purposeful; zero under reduced motion */
  --wb-motion-fast: 120ms; --wb-motion-base: 200ms; --wb-motion-slow: 320ms;
  --wb-motion-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

  /* Hit targets: WCAG 2.2 target size on web, 44 pt on iOS. --wb-hit is set per shell. */
  --wb-hit-web: 24px; --wb-hit-ios: 44px; --wb-control-web: 36px;
  --wb-hit: var(--wb-hit-web);

  /* Safe areas (set by the iPhone shell) */
  --wb-safe-top: 0px; --wb-safe-bottom: 0px;
}

/* system/base.css */
/* Whiteboard final system: reset, type scale, focus, visually hidden text, icons and reduced motion.
   Media queries are used only for prefers-color-scheme (tokens.css) and prefers-reduced-motion. */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--wb-bg);
  color: var(--wb-text);
  font-family: var(--wb-font);
  font-size: calc(15px * var(--wb-scale));
  line-height: 1.45;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure, fieldset { margin: 0; }
ul, ol { padding: 0; list-style: none; }
fieldset { border: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }
a { color: var(--wb-accent-text); text-underline-offset: 2px; }
table { border-collapse: collapse; }
[hidden] { display: none !important; }

/* Type scale: every size follows --wb-scale (larger Dynamic Type preview). */
h1, .wb-h1 { font-size: calc(26px * var(--wb-scale)); line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
h2, .wb-h2 { font-size: calc(19px * var(--wb-scale)); line-height: 1.25; font-weight: 650; }
h3, .wb-h3 { font-size: calc(16px * var(--wb-scale)); line-height: 1.3; font-weight: 650; }
h4 { font-size: calc(15px * var(--wb-scale)); font-weight: 650; }
small, .wb-small { font-size: calc(13px * var(--wb-scale)); }

/* Focus is always visible on keyboard focus; never removed. */
:focus-visible { outline: 2px solid var(--wb-focus); outline-offset: 2px; }

/* Visually hidden but read by assistive technology. */
.wb-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.wb-skip { position: absolute; left: var(--wb-space-2); top: var(--wb-space-2); z-index: 50; padding: var(--wb-space-2) var(--wb-space-3); background: var(--wb-surface); border-radius: var(--wb-radius-control); transform: translateY(-200%); }
.wb-skip:focus-visible { transform: none; }

/* Icons: 24-unit line symbols drawn in the current text colour. */
.wb-icon {
  width: calc(18px * var(--wb-scale));
  height: calc(18px * var(--wb-scale));
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.wb-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* system/components-core.css */
/* Whiteboard final system: core components (buttons, statuses, flags, notices, cards, sections, rows,
   chips, tabs, segmented control, avatar, empty state, disclosure, toast, locked note). */

/* ---------- Buttons ---------- */
.wb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--wb-space-2);
  min-height: var(--wb-hit);
  height: max(var(--wb-hit), var(--wb-control-web));
  padding: 0 var(--wb-space-4);
  border: 1px solid transparent;
  border-radius: var(--wb-radius-control);
  font-weight: 600;
  font-size: calc(15px * var(--wb-scale));
  text-decoration: none;
  transition: background-color var(--wb-motion-fast) var(--wb-motion-ease);
}
.wb-btn--primary { background: var(--wb-accent); color: var(--wb-on-accent); }
.wb-btn--secondary { background: var(--wb-fill); color: var(--wb-accent-text); border-color: var(--wb-border); }
.wb-btn--quiet { background: transparent; color: var(--wb-accent-text); }
.wb-btn--danger { background: var(--wb-error); color: var(--wb-surface); }
.wb-btn[aria-disabled="true"] { background: var(--wb-fill); color: var(--wb-text-2); border-color: var(--wb-separator); cursor: not-allowed; }
.wb-btn__label { white-space: nowrap; }
.wb-iconbtn { min-height: var(--wb-hit); min-width: var(--wb-hit); width: max(var(--wb-hit), var(--wb-control-web)); padding: 0; }
.wb-btnwrap { display: inline-flex; flex-direction: column; align-items: flex-start; gap: var(--wb-space-1); }
.wb-btn__reason { font-size: calc(13px * var(--wb-scale)); color: var(--wb-text-2); }
.wb-link { display: inline-flex; align-items: center; gap: var(--wb-space-1); color: var(--wb-accent-text); font-weight: 500; }
.wb-link[aria-current="page"] { font-weight: 700; color: var(--wb-text); }

/* ---------- Statuses, flags and badges: icon plus words, colour secondary ---------- */
.wb-status, .wb-flag, .wb-badge, .wb-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--wb-space-1);
  padding: 2px var(--wb-space-2);
  border-radius: var(--wb-radius-pill);
  font-size: calc(13px * var(--wb-scale));
  font-weight: 600;
  line-height: 1.35;
}
.wb-status .wb-icon, .wb-flag .wb-icon, .wb-badge .wb-icon, .wb-chip .wb-icon { width: calc(15px * var(--wb-scale)); height: calc(15px * var(--wb-scale)); }
.wb-status--success, .wb-badge--success, .wb-notice--success { background: var(--wb-success-bg); color: var(--wb-success); }
.wb-status--warning, .wb-badge--warning, .wb-flag--warning, .wb-chip--warning, .wb-notice--warning { background: var(--wb-warning-bg); color: var(--wb-warning); }
.wb-status--error, .wb-badge--error, .wb-notice--error { background: var(--wb-error-bg); color: var(--wb-error); }
.wb-status--info, .wb-badge--info, .wb-notice--info { background: var(--wb-info-bg); color: var(--wb-info); }
.wb-status--neutral, .wb-badge--neutral, .wb-flag--neutral, .wb-chip--neutral, .wb-notice--neutral { background: var(--wb-neutral-bg); color: var(--wb-neutral); }
.wb-badge--accent, .wb-flag--accent, .wb-notice--accent { background: var(--wb-accent-tint); color: var(--wb-accent-text); }
.wb-status__label { white-space: nowrap; }
.wb-status__late { display: inline-flex; align-items: center; gap: 2px; margin-left: var(--wb-space-1); padding-left: var(--wb-space-2); border-left: 1px solid currentColor; color: var(--wb-warning); }
.wb-status__detail { font-weight: 400; color: var(--wb-text-2); }
.wb-flag { border: 1px solid var(--wb-separator); }

/* ---------- Notices ---------- */
.wb-notice { display: flex; gap: var(--wb-space-3); padding: var(--wb-space-3) var(--wb-space-4); border-radius: var(--wb-radius-card); }
.wb-notice__content { display: grid; gap: var(--wb-space-1); color: var(--wb-text); }
.wb-notice__title { font-weight: 650; }
.wb-notice__body, .wb-card__body, .wb-empty__body { display: grid; gap: var(--wb-space-2); }
.wb-notice__actions { display: flex; flex-wrap: wrap; gap: var(--wb-space-2); margin-top: var(--wb-space-2); }

/* ---------- Cards and sections ---------- */
.wb-card { display: grid; gap: var(--wb-space-2); padding: var(--wb-space-4); background: var(--wb-surface); border-radius: var(--wb-radius-card); box-shadow: var(--wb-shadow-1); }
.wb-card__title { font-size: calc(16px * var(--wb-scale)); }
.wb-card__link { color: inherit; text-decoration: none; }
.wb-card__link:hover { text-decoration: underline; }
.wb-card__footer { padding-top: var(--wb-space-2); border-top: 1px solid var(--wb-separator); color: var(--wb-text-2); }
.wb-section { display: grid; gap: var(--wb-space-3); }
.wb-section__head { display: flex; align-items: center; justify-content: space-between; gap: var(--wb-space-3); }
.wb-section__title { font-size: calc(19px * var(--wb-scale)); }
.wb-section__actions { display: flex; gap: var(--wb-space-2); }

/* ---------- Rows and lists ---------- */
.wb-list { background: var(--wb-surface); border-radius: var(--wb-radius-card); overflow: hidden; box-shadow: var(--wb-shadow-1); }
.wb-row + .wb-row { border-top: 1px solid var(--wb-separator); }
.wb-row, .wb-rowlink { display: flex; align-items: center; gap: var(--wb-space-3); padding: var(--wb-space-3) var(--wb-space-4); }
.wb-row:has(> .wb-rowlink) { padding: 0; }
.wb-rowlink { flex: 1; min-height: var(--wb-hit); color: inherit; text-decoration: none; }
.wb-rowlink:hover { background: var(--wb-surface-2); }
.wb-row__text { display: grid; flex: 1; min-width: 0; }
.wb-row__title { font-weight: 600; }
.wb-row__meta { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
.wb-row__leading, .wb-row__trailing { display: inline-flex; align-items: center; gap: var(--wb-space-2); color: var(--wb-text-2); }

/* ---------- Chips ---------- */
.wb-chips { display: flex; flex-wrap: wrap; gap: var(--wb-space-2); }

/* ---------- Tabs and segmented control ---------- */
.wb-tabs { border-bottom: 1px solid var(--wb-separator); }
.wb-tabs__list { display: flex; gap: var(--wb-space-1); overflow-x: auto; }
.wb-tab {
  display: inline-flex;
  align-items: center;
  min-height: var(--wb-hit);
  padding: var(--wb-space-2) var(--wb-space-3);
  color: var(--wb-text-2);
  font-weight: 600;
  text-decoration: none;
  border-bottom: 2px solid transparent;
}
.wb-tab[aria-current="page"] { color: var(--wb-accent-text); border-bottom-color: var(--wb-accent); }
.wb-seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--wb-fill); border-radius: var(--wb-radius-control); }
.wb-seg__opt { min-height: var(--wb-hit); padding: 0 var(--wb-space-3); border: 0; border-radius: calc(var(--wb-radius-control) - 2px); background: transparent; color: var(--wb-text); font-weight: 600; }
.wb-seg__opt[aria-pressed="true"] { background: var(--wb-surface); box-shadow: var(--wb-shadow-1); }

/* ---------- Avatar, empty state, disclosure ---------- */
.wb-avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--wb-accent-tint); color: var(--wb-accent-text); font-weight: 700; font-size: calc(13px * var(--wb-scale)); }
.wb-empty { display: grid; justify-items: center; gap: var(--wb-space-2); padding: var(--wb-space-8) var(--wb-space-4); text-align: center; color: var(--wb-text-2); }
.wb-empty .wb-icon { width: 32px; height: 32px; }
.wb-empty__title { font-weight: 650; color: var(--wb-text); }
.wb-disclosure { border: 1px solid var(--wb-separator); border-radius: var(--wb-radius-card); background: var(--wb-surface); }
.wb-disclosure__summary { display: flex; align-items: center; min-height: var(--wb-hit); padding: var(--wb-space-2) var(--wb-space-4); font-weight: 600; cursor: pointer; }
.wb-disclosure__body { padding: 0 var(--wb-space-4) var(--wb-space-4); }

/* ---------- Toast and locked note ---------- */
.wb-toastwrap { position: absolute; left: 50%; bottom: calc(var(--wb-space-6) + var(--wb-safe-bottom)); transform: translateX(-50%); z-index: 40; }
.wb-toast { display: inline-flex; align-items: center; gap: var(--wb-space-3); padding: var(--wb-space-2) var(--wb-space-2) var(--wb-space-2) var(--wb-space-4); background: var(--wb-text); color: var(--wb-surface); border-radius: var(--wb-radius-pill); box-shadow: var(--wb-shadow-2); }
.wb-toast .wb-btn--quiet { color: var(--wb-surface); }
.wb-toast__text { font-weight: 500; }
.wb-locked { display: flex; gap: var(--wb-space-3); padding: var(--wb-space-3) var(--wb-space-4); border: 1px dashed var(--wb-border); border-radius: var(--wb-radius-card); color: var(--wb-text-2); }
.wb-locked__content { display: grid; gap: var(--wb-space-1); }
.wb-locked__reason { color: var(--wb-text); font-weight: 600; }
.wb-locked__owner { font-size: calc(13px * var(--wb-scale)); }

/* system/components-forms.css */
/* Whiteboard final system: form controls. Every control has a visible label; help, reason and error
   text sit under it and are tied in with aria-describedby by the kit. */

.wb-field { display: grid; gap: var(--wb-space-1); }
.wb-field__label { font-weight: 600; font-size: calc(14px * var(--wb-scale)); }
.wb-field__req { font-weight: 400; color: var(--wb-text-2); }
.wb-field__help { display: flex; align-items: center; gap: var(--wb-space-1); color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
.wb-field__error { display: flex; align-items: center; gap: var(--wb-space-1); color: var(--wb-error); font-size: calc(13px * var(--wb-scale)); font-weight: 600; }

.wb-input, .wb-select {
  width: 100%;
  min-height: var(--wb-hit);
  height: max(var(--wb-hit), var(--wb-control-web));
  padding: 0 var(--wb-space-3);
  border: 1px solid var(--wb-border);
  border-radius: var(--wb-radius-control);
  background: var(--wb-surface);
  color: var(--wb-text);
}
.wb-textarea { height: auto; min-height: calc(var(--wb-hit) * 2); padding: var(--wb-space-2) var(--wb-space-3); resize: vertical; }
.wb-select { appearance: auto; }
.wb-input[aria-invalid="true"], .wb-select[aria-invalid="true"] { border-color: var(--wb-error); border-width: 2px; }
.wb-input:disabled, .wb-select:disabled { background: var(--wb-fill); color: var(--wb-text-2); cursor: not-allowed; }

/* Checkbox, radio and toggle */
.wb-field--check { grid-template-columns: auto 1fr; align-items: center; column-gap: var(--wb-space-2); }
.wb-field--check > .wb-field__help, .wb-field--check > .wb-field__error { grid-column: 2; }
.wb-check {
  min-height: var(--wb-hit);
  min-width: var(--wb-hit);
  width: calc(20px * var(--wb-scale));
  height: calc(20px * var(--wb-scale));
  margin: 0;
  accent-color: var(--wb-accent);
}
/* The toggle input is the hit target (at least var(--wb-hit)); the 44 x 26 track and knob are drawn inside it. */
.wb-toggle { appearance: none; width: 44px; height: max(26px, var(--wb-hit)); background: transparent; border: 0; position: relative; cursor: pointer; }
.wb-toggle::before { content: ""; position: absolute; top: 50%; left: 0; width: 44px; height: 26px; box-sizing: border-box; transform: translateY(-50%); border-radius: var(--wb-radius-pill); background: var(--wb-fill); border: 1px solid var(--wb-border); }
.wb-toggle::after { content: ""; position: absolute; top: calc(50% - 10px); left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--wb-surface); box-shadow: var(--wb-shadow-1); transition: transform var(--wb-motion-fast) var(--wb-motion-ease); }
.wb-toggle:checked::before { background: var(--wb-accent); border-color: var(--wb-accent); }
.wb-toggle:checked::after { transform: translateX(18px); }
.wb-choicegroup { display: grid; gap: var(--wb-space-1); }
.wb-choicegroup > legend { margin-bottom: var(--wb-space-1); }
.wb-choice { display: flex; align-items: center; gap: var(--wb-space-2); }
.wb-choice__label { flex: 1; padding: var(--wb-space-1) 0; }
.wb-sort { max-width: 320px; margin-bottom: var(--wb-space-3); }

/* system/components-data.css */
/* Whiteboard final system: data display (table, compact row-cards, key-value list, stat, progress, split panes). */

/* ---------- Table (regular size class) ---------- */
.wb-table-wrap { overflow-x: auto; background: var(--wb-surface); border-radius: var(--wb-radius-card); box-shadow: var(--wb-shadow-1); }
.wb-table { width: 100%; font-size: calc(14px * var(--wb-scale)); }
.wb-table caption { padding: var(--wb-space-3) var(--wb-space-4); text-align: left; font-weight: 650; }
.wb-table th, .wb-table td { padding: var(--wb-space-2) var(--wb-space-4); text-align: left; border-top: 1px solid var(--wb-separator); vertical-align: middle; }
.wb-table thead th { color: var(--wb-text-2); font-weight: 600; background: var(--wb-surface-2); }
.wb-table tbody th { font-weight: 600; }
.wb-table tbody tr:nth-child(even) { background: var(--wb-surface-2); }
.wb-table tr.is-selected { background: var(--wb-accent-tint); }
.wb-table__num { text-align: right; font-variant-numeric: tabular-nums; }
.wb-sortbtn { display: inline-flex; align-items: center; gap: var(--wb-space-1); min-height: var(--wb-hit); padding: 0; border: 0; background: transparent; color: inherit; font-weight: inherit; }
th[aria-sort="ascending"] .wb-sortbtn, th[aria-sort="descending"] .wb-sortbtn { color: var(--wb-accent-text); }

/* ---------- Row-cards (compact size class) ---------- */
.wb-rowcards { display: grid; gap: var(--wb-space-2); }
.wb-rowcard { display: grid; gap: var(--wb-space-2); padding: var(--wb-space-3) var(--wb-space-4); background: var(--wb-surface); border-radius: var(--wb-radius-card); box-shadow: var(--wb-shadow-1); }
.wb-rowcard.is-selected { outline: 2px solid var(--wb-accent); }
.wb-rowcard__title { font-weight: 650; line-height: 1.3; font-size: calc(16px * var(--wb-scale)); }
.wb-rowcard__fields { display: grid; gap: var(--wb-space-1); }

/* ---------- Key-value list ---------- */
.wb-kv { display: grid; gap: var(--wb-space-2); }
.wb-kv__row { display: grid; grid-template-columns: minmax(96px, 1fr) 2fr; gap: var(--wb-space-3); }
.wb-kv__row dt { color: var(--wb-text-2); }
.wb-kv__row dd { color: var(--wb-text); }

/* ---------- Stat and progress ---------- */
.wb-stat { display: grid; gap: 2px; }
.wb-stat__label { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
.wb-stat__value { font-size: calc(24px * var(--wb-scale)); font-weight: 700; font-variant-numeric: tabular-nums; }
.wb-stat__note { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
.wb-progress { display: grid; gap: var(--wb-space-1); }
.wb-progress__head { display: flex; justify-content: space-between; gap: var(--wb-space-3); font-size: calc(13px * var(--wb-scale)); }
.wb-progress__label { font-weight: 600; }
.wb-progress__value { color: var(--wb-text-2); font-variant-numeric: tabular-nums; }
.wb-progress__track { height: 8px; border-radius: var(--wb-radius-pill); background: var(--wb-fill); overflow: hidden; border: 1px solid var(--wb-border); }
.wb-progress__bar { display: block; height: 100%; background: var(--wb-accent); }

/* ---------- Split panes ---------- */
.wb-split { display: grid; gap: var(--wb-space-4); }
.wb-split--columns { grid-template-columns: minmax(280px, 2fr) 3fr; }
.wb-split--splitview { grid-template-columns: minmax(300px, 1fr) 2fr; gap: 0; }
.wb-split--splitview > .wb-split__pane + .wb-split__pane { border-left: 1px solid var(--wb-separator); padding-left: var(--wb-space-4); }
.wb-split--push { grid-template-columns: 1fr; }
.wb-split__pane { display: grid; align-content: start; gap: var(--wb-space-3); min-width: 0; }
.wb-split__pane--list { padding-right: var(--wb-space-4); }
.wb-split--push > .wb-split__pane--list { padding-right: 0; }
.wb-split__pane--detail { min-height: 0; }
.wb-split__title { font-size: calc(17px * var(--wb-scale)); }

/* ---------- Layout primitives (K.stack, K.grid, K.rail; columns chosen by the size class in the kit) ---------- */
.wb-stack { display: grid; align-content: start; }
.wb-stack--sm { gap: var(--wb-space-2); }
.wb-stack--md { gap: var(--wb-space-4); }
.wb-stack--lg { gap: var(--wb-space-6); }
.wb-grid { display: grid; gap: var(--wb-space-4); }
.wb-grid--c1 { grid-template-columns: minmax(0, 1fr); }
.wb-grid--c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.wb-grid--c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.wb-grid--c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.wb-grid__cell { min-width: 0; }
.wb-rail { display: grid; gap: var(--wb-space-6); align-items: start; }
.wb-rail--side { grid-template-columns: minmax(0, 1fr) 18rem; }
.wb-rail--stacked { grid-template-columns: minmax(0, 1fr); gap: var(--wb-space-4); }
.wb-rail__main, .wb-rail__aside { display: grid; gap: var(--wb-space-4); min-width: 0; }

/* system/components-signature.css */
/* Whiteboard final system: signature components (receipt slip, work trail, context line, save status,
   honest figure, timer, course banner and card, logo). */

/* ---------- Receipt slip: plain, selectable facts ---------- */
.wb-receipt { display: grid; gap: var(--wb-space-3); padding: var(--wb-space-4); background: var(--wb-surface); border: 1px solid var(--wb-separator); border-left: 4px solid var(--wb-success); border-radius: var(--wb-radius-card); user-select: text; }
.wb-receipt__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wb-space-2); color: var(--wb-success); font-weight: 700; }
.wb-receipt__title { font-size: calc(16px * var(--wb-scale)); }
.wb-receipt__ref { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.02em; }
.wb-receipt__tz { color: var(--wb-text-2); }
.wb-receipt__files { display: grid; gap: 2px; }
.wb-receipt__fields { font-size: calc(14px * var(--wb-scale)); }

/* ---------- Work trail ---------- */
.wb-trail { display: grid; gap: var(--wb-space-2); counter-reset: wb-trail; }
.wb-trail__step { display: grid; grid-template-columns: auto 1fr; column-gap: var(--wb-space-2); align-items: center; color: var(--wb-text-2); }
.wb-trail__step--done { color: var(--wb-success); }
.wb-trail__step--current { color: var(--wb-accent-text); font-weight: 650; }
.wb-trail__step--todo { color: var(--wb-text-2); }
.wb-trail__label { color: var(--wb-text); }
.wb-trail__meta { grid-column: 2; font-size: calc(13px * var(--wb-scale)); color: var(--wb-text-2); }

/* ---------- Context line and breadcrumbs ---------- */
.wb-context { display: grid; gap: var(--wb-space-1); }
.wb-context__line { display: flex; flex-wrap: wrap; align-items: center; gap: 0 var(--wb-space-1); color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
.wb-context__part { color: var(--wb-text); }
.wb-context__sep { color: var(--wb-text-2); }
.wb-context__role { display: inline-flex; align-items: center; gap: var(--wb-space-1); margin-left: var(--wb-space-3); }
.wb-crumbs ol { display: flex; flex-wrap: wrap; gap: var(--wb-space-1); font-size: calc(13px * var(--wb-scale)); color: var(--wb-text-2); }
.wb-crumbs li + li::before { content: "/"; margin-right: var(--wb-space-1); color: var(--wb-text-2); }
.wb-crumbs .wb-link { min-height: var(--wb-hit); }

/* ---------- Save status (C12) ---------- */
.wb-save { display: inline-flex; align-items: center; gap: var(--wb-space-1); font-size: calc(13px * var(--wb-scale)); font-weight: 600; }
.wb-save--neutral { color: var(--wb-text-2); }
.wb-save--success { color: var(--wb-success); }
.wb-save--warning { color: var(--wb-warning); }
.wb-save--error { color: var(--wb-error); }
.wb-save__label { white-space: nowrap; }

/* ---------- Honest figure and timer ---------- */
.wb-figure { display: grid; gap: 2px; }
.wb-figure__label { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
.wb-figure__value { font-size: calc(24px * var(--wb-scale)); font-weight: 700; font-variant-numeric: tabular-nums; }
.wb-figure__basis { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
.wb-timer { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--wb-space-2); }
.wb-timer__label { color: var(--wb-text-2); }
.wb-timer__value { font-weight: 700; font-variant-numeric: tabular-nums; }
.wb-timer__ends { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }

/* ---------- Course colours, banner and card ---------- */
.wb-course--phys { --wb-course: var(--wb-course-phys); }
.wb-course--math { --wb-course: var(--wb-course-math); }
.wb-course--chem { --wb-course: var(--wb-course-chem); }
.wb-course--cs { --wb-course: var(--wb-course-cs); }
.wb-course-banner, .wb-course-card__art { position: relative; overflow: hidden; background: var(--wb-course); color: var(--wb-on-course); }
.wb-course-banner { display: flex; align-items: flex-end; min-height: 140px; padding: var(--wb-space-4); border-radius: var(--wb-radius-card); }
.wb-course-banner--regular { min-height: 160px; }
.wb-course-banner--compact { min-height: 112px; }
.wb-course-banner .wb-art, .wb-course-card__art .wb-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.wb-art__node { fill: var(--wb-course); }
.wb-course-banner__text { position: relative; display: grid; gap: 2px; }
.wb-course-banner__code { font-size: calc(13px * var(--wb-scale)); font-weight: 700; letter-spacing: 0.04em; }
.wb-course-banner__title { font-size: calc(22px * var(--wb-scale)); font-weight: 750; line-height: 1.2; }
.wb-course-banner__meta { font-size: calc(13px * var(--wb-scale)); }
.wb-course-card { display: grid; background: var(--wb-surface); border-radius: var(--wb-radius-card); overflow: hidden; box-shadow: var(--wb-shadow-1); }
.wb-course-card__art { height: 88px; padding: var(--wb-space-3); display: flex; align-items: flex-end; }
.wb-course-card__code { position: relative; font-weight: 700; font-size: calc(13px * var(--wb-scale)); }
.wb-course-card__title { padding: var(--wb-space-3) var(--wb-space-4) 0; font-size: calc(16px * var(--wb-scale)); }
.wb-course-card__meta { padding: 0 var(--wb-space-4) var(--wb-space-3); color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }

/* ---------- Logo (Board mark only, BD7) ---------- */
.wb-logo { display: inline-flex; align-items: center; gap: var(--wb-space-2); color: var(--wb-text); }
.wb-logo__mark { display: inline-grid; place-items: center; border-radius: 28%; background: var(--wb-accent); color: var(--wb-on-accent); }
.wb-logo__mark svg { width: 62%; height: 62%; }
.wb-logo__word { font-weight: 800; letter-spacing: -0.055em; }
.wb-logo--sm .wb-logo__mark { width: 28px; height: 28px; }
.wb-logo--sm .wb-logo__word { font-size: 21px; }
.wb-logo--md .wb-logo__mark { width: 36px; height: 36px; }
.wb-logo--md .wb-logo__word { font-size: 27px; }
.wb-logo--lg .wb-logo__mark { width: 52px; height: 52px; }
.wb-logo--lg .wb-logo__word { font-size: 38px; }

/* system/components-overlay.css */
/* Whiteboard final system: overlays and action placement (scrim, modal, form sheet, popover, bottom sheet,
   full screen, toolbar, dock, More actions menu, handoff panel). Overlays sit inside the device frame. */

.wb-scrim { position: absolute; inset: 0; z-index: 30; background: var(--wb-scrim); }
.wb-dialog {
  position: absolute;
  z-index: 31;
  display: flex;
  flex-direction: column;
  gap: var(--wb-space-3);
  padding: var(--wb-space-5);
  background: var(--wb-surface);
  color: var(--wb-text);
  box-shadow: var(--wb-shadow-2);
}
/* Each dialog fits its frame (max-height): the title and action row stay put and only the body scrolls. */
.wb-dialog__head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--wb-space-3); }
.wb-dialog__title { font-size: calc(19px * var(--wb-scale)); }
.wb-dialog__body { flex: 1 1 auto; min-height: 0; overflow: auto; display: grid; align-content: start; gap: var(--wb-space-3); }
.wb-dialog__actions { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--wb-space-2); }
.wb-dialog--modal { top: 50%; left: 50%; width: min(520px, calc(100% - var(--wb-space-8))); max-height: calc(100% - var(--wb-space-8)); transform: translate(-50%, -50%); border-radius: var(--wb-radius-sheet); }
.wb-dialog--formsheet { top: 50%; left: 50%; width: min(540px, calc(100% - var(--wb-space-10))); max-height: calc(100% - var(--wb-space-10)); transform: translate(-50%, -50%); border-radius: var(--wb-radius-sheet); }
.wb-dialog--popover { top: calc(var(--wb-space-14) + var(--wb-space-2)); right: var(--wb-space-4); width: 320px; max-height: calc(100% - var(--wb-space-14) - var(--wb-space-6)); border-radius: var(--wb-radius-card); border: 1px solid var(--wb-separator); }
.wb-dialog--sheet { left: 0; right: 0; bottom: 0; padding-bottom: calc(var(--wb-space-5) + var(--wb-safe-bottom)); border-radius: var(--wb-radius-sheet) var(--wb-radius-sheet) 0 0; max-height: 88%; }
.wb-dialog--sheet .wb-dialog__actions { flex-direction: column-reverse; align-items: stretch; }
.wb-dialog--fullscreen { inset: 0; max-height: 100%; padding-top: calc(var(--wb-space-5) + var(--wb-safe-top)); border-radius: 0; }
.wb-dialog--destructive .wb-dialog__title { color: var(--wb-error); }
.wb-dialog--confirm, .wb-dialog--form, .wb-dialog--capture { border-top: 0; }
.wb-dialog__grabber { flex: none; align-self: center; width: 36px; height: 5px; border-radius: var(--wb-radius-pill); background: var(--wb-border); }

/* ---------- Action placement ---------- */
.wb-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wb-space-2); }
.wb-dock {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--wb-space-2);
  padding: var(--wb-space-2) var(--wb-space-4);
  background: var(--wb-surface);
  border-top: 1px solid var(--wb-separator);
}
/* Labels wrap inside their button and never clip; the first action takes a full row when the dock is narrow. */
.wb-dock > .wb-btn { flex: 1 1 auto; min-width: 0; height: auto; min-height: var(--wb-hit); padding-block: var(--wb-space-2); }
.wb-dock > .wb-btn:first-child { flex: 1 1 100%; }
.wb-dock .wb-btn__label { white-space: normal; overflow-wrap: anywhere; text-align: center; }
/* A disabled action sits in a .wb-btnwrap with its reason text: the wrapper takes the same item sizing as a button. */
.wb-dock > .wb-btnwrap { flex: 1 1 auto; min-width: 0; }
.wb-dock > .wb-btnwrap:first-child { flex: 1 1 100%; }
.wb-dock .wb-btnwrap > .wb-btn { width: 100%; height: auto; min-height: var(--wb-hit); }
.wb-dock .wb-btn__reason { white-space: normal; overflow-wrap: anywhere; }
/* margin-left:auto keeps "More actions" at the right end of whatever row it wraps onto, so its right-anchored menu opens inward. */
.wb-more { position: relative; flex: none; margin-left: auto; }
.wb-more__summary { display: inline-flex; align-items: center; gap: var(--wb-space-1); min-height: var(--wb-hit); min-width: var(--wb-hit); padding: 0 var(--wb-space-2); color: var(--wb-accent-text); font-weight: 600; cursor: pointer; list-style: none; }
.wb-more__menu { position: absolute; right: 0; bottom: calc(100% + var(--wb-space-2)); display: grid; gap: var(--wb-space-1); min-width: 200px; max-width: calc(393px - 2 * var(--wb-space-4)); padding: var(--wb-space-2); background: var(--wb-surface); border-radius: var(--wb-radius-card); box-shadow: var(--wb-shadow-2); }

/* ---------- Handoff panel (BD6 review and handoff tiers) ---------- */
.wb-handoff { display: grid; gap: var(--wb-space-3); padding: var(--wb-space-4); background: var(--wb-surface-2); border: 1px solid var(--wb-separator); border-radius: var(--wb-radius-card); }
.wb-handoff--review { border-left: 4px solid var(--wb-accent); }
.wb-handoff__title { display: flex; align-items: center; gap: var(--wb-space-2); font-weight: 700; }
.wb-handoff__result { padding: var(--wb-space-3); background: var(--wb-surface); border-radius: var(--wb-radius-inset); }
.wb-handoff__note { color: var(--wb-text-2); }
.wb-handoff__hint { font-weight: 600; color: var(--wb-accent-text); }

/* system/shell-web.css */
/* Whiteboard final system: web shell. 1280 px frame, or the 390 px narrow frame via [data-width="narrow"]
   (the compact render context, not a media query). Targets at least 24 px (WCAG 2.2). */

.wb-frame { position: relative; overflow: hidden; background: var(--wb-bg); color: var(--wb-text); font-family: var(--wb-font); }
.wb-frame--web { --wb-hit: var(--wb-hit-web); width: 1280px; min-height: 800px; border: 1px solid var(--wb-separator); border-radius: var(--wb-radius-card); }
.wb-frame--web[data-width="narrow"] { width: 390px; min-height: 844px; }
.wb-frame[data-mode="access"] { display: grid; }

.wb-web { display: grid; grid-template-columns: 248px 1fr; min-height: inherit; }
.wb-web__content { display: grid; grid-template-rows: auto auto 1fr; min-width: 0; }
.wb-web--narrow { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }

/* ---------- Sidebar and nav ---------- */
.wb-sidebar { display: flex; flex-direction: column; gap: var(--wb-space-4); padding: var(--wb-space-4) var(--wb-space-3); background: var(--wb-surface-2); border-right: 1px solid var(--wb-separator); }
.wb-nav { display: grid; gap: var(--wb-space-1); }
.wb-nav__list, .wb-nav ul { display: grid; gap: 2px; }
.wb-nav--tools::before, .wb-nav--course::before { content: attr(aria-label); padding: var(--wb-space-2) var(--wb-space-3) 0; color: var(--wb-text-2); font-size: calc(12px * var(--wb-scale)); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.wb-navitem {
  display: flex;
  align-items: center;
  gap: var(--wb-space-3);
  min-height: var(--wb-hit);
  padding: var(--wb-space-2) var(--wb-space-3);
  border-radius: var(--wb-radius-control);
  color: var(--wb-text);
  font-weight: 550;
  text-decoration: none;
}
.wb-navitem:hover { background: var(--wb-fill); }
.wb-navitem[aria-current="page"] { background: var(--wb-accent-tint); color: var(--wb-accent-text); font-weight: 700; }
.wb-navitem__label { flex: 1; }
.wb-sidebar__foot { margin-top: auto; display: grid; gap: var(--wb-space-2); }
.wb-roletag { display: inline-flex; align-self: start; padding: 2px var(--wb-space-2); border-radius: var(--wb-radius-pill); background: var(--wb-neutral-bg); color: var(--wb-neutral); font-size: calc(12px * var(--wb-scale)); font-weight: 700; }

/* ---------- Header, utility links, course tabs, main ---------- */
.wb-header { display: grid; gap: var(--wb-space-2); padding: var(--wb-space-4) var(--wb-space-6) var(--wb-space-3); background: var(--wb-surface); border-bottom: 1px solid var(--wb-separator); }
.wb-header__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wb-space-3); }
.wb-header__title { flex: 1; min-width: 0; }
.wb-backlink { display: inline-flex; align-items: center; gap: var(--wb-space-1); min-height: var(--wb-hit); color: var(--wb-accent-text); font-weight: 600; text-decoration: none; }
.wb-utility { display: block; }
.wb-utility__list { display: flex; gap: var(--wb-space-1); }
.wb-utility--header .wb-navitem { padding: var(--wb-space-1) var(--wb-space-2); }
.wb-utility--menu .wb-utility__list, .wb-utility--sidebar .wb-utility__list { flex-direction: column; }
.wb-navitem--utility { font-weight: 500; }
.wb-header + .wb-tabs, .wb-web__content > .wb-tabs { padding: 0 var(--wb-space-6); background: var(--wb-surface); }
.wb-main { display: grid; align-content: start; gap: var(--wb-space-5); padding: var(--wb-space-6); min-width: 0; }

/* ---------- Narrow web: top bar with Menu, bottom bar ---------- */
.wb-topbar { display: flex; align-items: center; justify-content: space-between; padding: var(--wb-space-2) var(--wb-space-4); background: var(--wb-surface); border-bottom: 1px solid var(--wb-separator); }
.wb-web--narrow .wb-header { padding: var(--wb-space-3) var(--wb-space-4); }
.wb-web--narrow .wb-main { padding: var(--wb-space-4); }
.wb-menu { position: relative; }
.wb-menu__summary { display: inline-flex; align-items: center; gap: var(--wb-space-2); min-height: var(--wb-hit); padding: 0 var(--wb-space-3); border-radius: var(--wb-radius-control); font-weight: 600; cursor: pointer; list-style: none; }
.wb-menu__panel { position: absolute; right: 0; top: calc(100% + var(--wb-space-1)); z-index: 20; display: grid; gap: var(--wb-space-3); width: 300px; padding: var(--wb-space-3); background: var(--wb-surface); border-radius: var(--wb-radius-card); box-shadow: var(--wb-shadow-2); }
.wb-bottombar { position: sticky; bottom: 0; background: var(--wb-surface); border-top: 1px solid var(--wb-separator); }
.wb-bottombar__list, .wb-tabbar__list { display: grid; grid-template-columns: repeat(5, 1fr); }
.wb-tabitem {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-height: var(--wb-hit);
  padding: var(--wb-space-2) var(--wb-space-1);
  color: var(--wb-text-2);
  font-size: calc(11px * var(--wb-scale));
  font-weight: 600;
  text-decoration: none;
}
.wb-tabitem[aria-current="page"] { color: var(--wb-accent-text); }
.wb-tabitem .wb-icon { width: calc(22px * var(--wb-scale)); height: calc(22px * var(--wb-scale)); }

/* ---------- Access mode (sign-in, invite, failed handoff, expired session) ---------- */
.wb-access { display: grid; justify-items: center; align-content: center; gap: var(--wb-space-6); padding: var(--wb-space-10) var(--wb-space-4); min-height: inherit; }
.wb-access__main { width: min(420px, 100%); padding: var(--wb-space-6); background: var(--wb-surface); border-radius: var(--wb-radius-sheet); box-shadow: var(--wb-shadow-1); }
.wb-access__title { font-size: calc(24px * var(--wb-scale)); }
.wb-access__links ul { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--wb-space-2); }

/* system/shell-ipad.css */
/* Whiteboard final system: iPad shell (planned native iPadOS presentation, no Safari chrome).
   1194×834 landscape and 834×1194 portrait via [data-orientation]. 44 pt targets. */

.wb-frame--ipad {
  --wb-hit: var(--wb-hit-ios);
  width: 1194px;
  height: 834px;
  border: 12px solid var(--wb-device-frame);
  border-radius: 36px;
  background: var(--wb-device-screen);
  font-family: var(--wb-font);
}
.wb-frame--ipad[data-orientation="portrait"] { width: 834px; height: 1194px; }

.wb-ipad { display: flex; height: 100%; }
.wb-sidebar--ipad { width: 300px; flex: none; padding-top: var(--wb-space-6); overflow: auto; }
.wb-ipad__content { display: flex; flex-direction: column; flex: 1; min-width: 0; overflow: auto; }
.wb-header--ipad { padding: var(--wb-space-4) var(--wb-space-6) var(--wb-space-3); }
.wb-header--ipad .wb-header__title { font-size: calc(28px * var(--wb-scale)); }
.wb-ipad__content > .wb-tabs { padding: 0 var(--wb-space-6); background: var(--wb-surface); }
.wb-frame--ipad[data-orientation="portrait"] .wb-sidebar--ipad { position: absolute; inset: 0 auto 0 0; z-index: 25; box-shadow: var(--wb-shadow-2); }
.wb-sidebar__close { display: flex; justify-content: flex-end; padding: 0 var(--wb-space-3); }

/* Tools popover anchored to its summary */
.wb-popover { position: relative; }
.wb-popover__summary { display: inline-flex; align-items: center; gap: var(--wb-space-2); min-height: var(--wb-hit); padding: 0 var(--wb-space-3); border-radius: var(--wb-radius-control); color: var(--wb-accent-text); font-weight: 600; cursor: pointer; list-style: none; }
.wb-popover__panel { position: absolute; right: 0; top: calc(100% + var(--wb-space-2)); z-index: 20; width: 280px; padding: var(--wb-space-2); background: var(--wb-surface); border: 1px solid var(--wb-separator); border-radius: var(--wb-radius-card); box-shadow: var(--wb-shadow-2); }

/* system/shell-iphone.css */
/* Whiteboard final system: iPhone shell (planned native iOS presentation, 393×852, no Safari chrome).
   Safe areas as --wb-safe-top and --wb-safe-bottom; status bar, nav bar, dock, tab bar, home indicator.
   44 pt targets. */

.wb-frame--iphone {
  --wb-hit: var(--wb-hit-ios);
  --wb-safe-top: 54px;
  --wb-safe-bottom: 34px;
  display: flex;
  flex-direction: column;
  width: 393px;
  height: 852px;
  border: 10px solid var(--wb-device-frame);
  border-radius: 54px;
  background: var(--wb-device-screen);
  font-family: var(--wb-font);
}

.wb-statusbar { display: flex; align-items: flex-end; justify-content: space-between; flex: none; height: var(--wb-safe-top); padding: 0 var(--wb-space-8) var(--wb-space-2); font-weight: 600; font-size: 16px; }
.wb-statusbar__time { font-variant-numeric: tabular-nums; }
.wb-statusbar__icons { width: 64px; height: 12px; border-radius: 4px; background: var(--wb-text); opacity: 0.85; }
.wb-iphone { display: flex; flex-direction: column; flex: 1; min-height: 0; position: relative; }

/* ---------- Nav bar ---------- */
.wb-navbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--wb-space-2); padding: var(--wb-space-1) var(--wb-space-3); background: var(--wb-bg); }
.wb-navbar__lead { justify-self: start; }
.wb-navbar__trail { justify-self: end; display: flex; align-items: center; gap: var(--wb-space-1); position: relative; }
.wb-navbar__title { font-size: calc(17px * var(--wb-scale)); font-weight: 650; text-align: center; }
.wb-navbar__back { display: inline-flex; align-items: center; gap: 2px; min-height: var(--wb-hit); color: var(--wb-accent-text); font-size: calc(17px * var(--wb-scale)); text-decoration: none; }
.wb-titlebtn { display: inline-flex; align-items: center; gap: var(--wb-space-1); min-height: var(--wb-hit); padding: 0 var(--wb-space-2); border: 0; background: transparent; color: var(--wb-text); font-weight: 650; }
.wb-iconlink { display: inline-grid; place-items: center; min-height: var(--wb-hit); min-width: var(--wb-hit); color: var(--wb-accent-text); }
.wb-sectionmenu, .wb-accountmenu { position: absolute; top: calc(100% + var(--wb-space-1)); z-index: 20; min-width: 240px; padding: var(--wb-space-2); background: var(--wb-surface); border-radius: var(--wb-radius-card); box-shadow: var(--wb-shadow-2); }
/* The section menu is placed in .wb-iphone (below the nav bar) so its height is bounded by the frame and it scrolls. */
.wb-sectionmenu { left: 50%; transform: translateX(-50%); top: calc(var(--wb-hit) + 3 * var(--wb-space-1)); max-height: calc(100% - var(--wb-hit) - 4 * var(--wb-space-1) - var(--wb-safe-bottom)); overflow-y: auto; overscroll-behavior: contain; }
.wb-accountmenu { right: 0; display: grid; gap: var(--wb-space-2); }

/* ---------- Content, dock, tab bar, home indicator ---------- */
.wb-main--iphone { flex: 1; overflow: auto; padding: var(--wb-space-4); }
.wb-frame--iphone .wb-dock { flex: none; }
.wb-tabbar { flex: none; background: var(--wb-surface); border-top: 1px solid var(--wb-separator); padding-bottom: var(--wb-safe-bottom); }
.wb-homeindicator { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: var(--wb-radius-pill); background: var(--wb-text); transform: translateX(-50%); z-index: 45; }
.wb-frame--iphone[data-mode="access"] .wb-iphone { padding-bottom: var(--wb-safe-bottom); }

/* system/viewer.css */
/* Whiteboard final system: viewer chrome for the Phase 2c outputs (prototype bar, tour panel, stage, board
   gallery and spec page). Tokens only; the bar wraps with flex-wrap, so there are no width media queries.
   The stage never scales its frame, so browser zoom testing stays honest. */

.wb-viewer { margin: 0; background: var(--wb-bg); color: var(--wb-text); }
.wb-vbar, .wb-tour, .wb-board, .wb-spec { --wb-hit: var(--wb-hit-web); }

/* Skip control: visually hidden until it takes keyboard focus. */
.wb-vskip { position: absolute; left: var(--wb-space-2); top: var(--wb-space-2); z-index: 10; min-height: var(--wb-hit-web); padding: var(--wb-space-1) var(--wb-space-3); border: 1px solid var(--wb-border); border-radius: var(--wb-radius-control); background: var(--wb-surface); color: var(--wb-text); transform: translateY(-200%); }
.wb-vskip:focus { transform: none; }

/* Prototype bar */
.wb-vbar { display: flex; flex-direction: column; gap: var(--wb-space-2); padding: var(--wb-space-3) var(--wb-space-4); background: var(--wb-surface); border-bottom: 1px solid var(--wb-separator); }
.wb-vbar__title { font-size: calc(15px * var(--wb-scale)); font-weight: 650; }
.wb-vbar__row { display: flex; flex-wrap: wrap; gap: var(--wb-space-3) var(--wb-space-5); align-items: flex-end; }
.wb-vbar__field { display: flex; flex-direction: column; gap: var(--wb-space-1); min-width: 0; }
.wb-vbar__field label, .wb-vbar__group legend { font-size: calc(13px * var(--wb-scale)); font-weight: 600; color: var(--wb-text-2); }
.wb-vbar__field--inline { flex-direction: row; align-items: center; gap: var(--wb-space-2); min-height: var(--wb-hit-web); }
.wb-vbar__field--tour { flex-direction: row; align-items: flex-end; gap: var(--wb-space-2); }
.wb-vbar__group { display: flex; flex-wrap: wrap; gap: var(--wb-space-1) var(--wb-space-3); align-items: center; }
.wb-vbar__group legend { width: 100%; margin-bottom: var(--wb-space-1); }
.wb-vbar__choice { display: inline-flex; align-items: center; gap: var(--wb-space-1); min-height: var(--wb-hit-web); }
.wb-vbar__select { min-height: var(--wb-hit-web); max-width: 100%; padding: 0 var(--wb-space-2); border: 1px solid var(--wb-border); border-radius: var(--wb-radius-control); background: var(--wb-surface); color: var(--wb-text); }
.wb-vbar__note { font-size: calc(13px * var(--wb-scale)); color: var(--wb-text-2); }
.wb-vbar input[type="radio"], .wb-vbar input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--wb-accent); }

/* Status line, tour panel and stage */
.wb-vstatus { margin: 0; padding: var(--wb-space-2) var(--wb-space-4); font-size: calc(13px * var(--wb-scale)); color: var(--wb-text-2); border-bottom: 1px solid var(--wb-separator); }
.wb-tourwrap { padding: var(--wb-space-3) var(--wb-space-4) 0; }
.wb-tour { display: flex; flex-direction: column; gap: var(--wb-space-2); padding: var(--wb-space-3) var(--wb-space-4); border: 1px solid var(--wb-accent); border-radius: var(--wb-radius-card); background: var(--wb-accent-tint); }
.wb-tour__title { font-size: calc(16px * var(--wb-scale)); }
.wb-tour__note { color: var(--wb-text-2); }
.wb-tour__actions { display: flex; flex-wrap: wrap; gap: var(--wb-space-2); align-items: flex-start; }
.wb-viewer-stage { overflow: auto; padding: var(--wb-space-4); }

/* Board gallery: frames are scaled pictures; the links under them open the prototype. */
.wb-board { --wb-board-scale: 0.32; display: flex; flex-direction: column; gap: var(--wb-space-6); padding: var(--wb-space-4); }
.wb-board__index ul { display: flex; flex-wrap: wrap; gap: var(--wb-space-1) var(--wb-space-4); }
.wb-board__index > ul { flex-direction: column; gap: var(--wb-space-3); }
.wb-board__group h3 { margin-bottom: var(--wb-space-1); }
.wb-board__section { display: flex; flex-direction: column; gap: var(--wb-space-3); padding-top: var(--wb-space-4); border-top: 1px solid var(--wb-separator); content-visibility: auto; contain-intrinsic-size: auto 640px; }
.wb-board__meta { display: flex; flex-direction: column; gap: var(--wb-space-2); max-width: 72ch; }
.wb-board__na { display: flex; flex-direction: column; gap: var(--wb-space-1); }
.wb-board__controls { display: flex; flex-wrap: wrap; gap: var(--wb-space-3); }
.wb-board__figs { display: flex; flex-wrap: wrap; gap: var(--wb-space-4); align-items: flex-start; }
.wb-board__fig { display: flex; flex-direction: column; gap: var(--wb-space-2); }
.wb-board__viewport { overflow: hidden; border: 1px solid var(--wb-separator); border-radius: var(--wb-radius-inset); background: var(--wb-surface-2); }
.wb-board__viewport[data-platform="web"] { width: calc(1280px * var(--wb-board-scale)); height: calc(800px * var(--wb-board-scale)); }
.wb-board__viewport[data-platform="ipad"] { width: calc(1194px * var(--wb-board-scale)); height: calc(834px * var(--wb-board-scale)); }
.wb-board__viewport[data-platform="iphone"] { width: calc(393px * var(--wb-board-scale)); height: calc(852px * var(--wb-board-scale)); }
.wb-board__frame { width: max-content; transform: scale(var(--wb-board-scale)); transform-origin: top left; pointer-events: none; }
.wb-board__caption, .wb-board__links { font-size: calc(13px * var(--wb-scale)); color: var(--wb-text-2); }

/* Spec page: generic styling for the inlined spec fragments. */
.wb-spec { max-width: 1120px; margin: 0 auto; padding: var(--wb-space-6) var(--wb-space-4); display: flex; flex-direction: column; gap: var(--wb-space-6); }
.wb-spec h1 { font-size: calc(22px * var(--wb-scale)); }
.wb-spec h2, .wb-spec h3, .wb-spec h4 { margin: var(--wb-space-3) 0 var(--wb-space-2); }
.wb-spec p, .wb-spec ul, .wb-spec ol { margin: 0 0 var(--wb-space-2); }
.wb-spec ul, .wb-spec ol { padding-left: var(--wb-space-5); list-style: disc; }
.wb-spec ol { list-style: decimal; }
.wb-spec table { width: 100%; margin: 0 0 var(--wb-space-3); font-size: calc(13px * var(--wb-scale)); }
.wb-spec th, .wb-spec td { padding: var(--wb-space-1) var(--wb-space-2); border: 1px solid var(--wb-separator); text-align: left; vertical-align: top; }
.wb-spec th { background: var(--wb-surface-2); }
.wb-spec pre { overflow: auto; padding: var(--wb-space-2); background: var(--wb-surface-2); border-radius: var(--wb-radius-inset); }
.wb-spec code { font-size: 0.92em; }
.wb-spec__toc ul { list-style: none; padding-left: 0; display: flex; flex-wrap: wrap; gap: var(--wb-space-1) var(--wb-space-3); }
.wb-spec__section { padding-top: var(--wb-space-4); border-top: 1px solid var(--wb-separator); }
.wb-spec__fragment { overflow-x: auto; }

/* system/workspace.css */
/* Whiteboard workspace refresh. Product hierarchy and live-preview reflow; the reference spec keeps its
   original stylesheet. Existing contrast-tested semantic tokens, no remote fonts or assets. */

/* A quiet preview utility, separate from product navigation. */
.wb-previewbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 24px; background: var(--wb-surface); border-bottom: 1px solid var(--wb-separator); }
.wb-previewbar__identity { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.wb-previewbar__identity h2 { font-size: calc(13px * var(--wb-scale)); font-weight: 500; color: var(--wb-text-2); }
.wb-previewbar__identity .wb-logo__word { font-size: 18px; letter-spacing: -0.04em; }
.wb-previewbar__identity .wb-logo__mark { width: 24px; height: 24px; }
.wb-previewbar__settings { margin-left: auto; }
.wb-previewbar__settings > summary { display: flex; align-items: center; gap: 8px; min-height: var(--wb-control-web); padding: 0 14px; color: var(--wb-text); background: var(--wb-surface-2); border: 1px solid var(--wb-border); border-radius: var(--wb-radius-control); cursor: pointer; font-size: calc(13px * var(--wb-scale)); font-weight: 600; list-style: none; }
.wb-previewbar__settings > summary::-webkit-details-marker { display: none; }
.wb-previewbar__settings > summary .wb-icon { width: 16px; height: 16px; }
.wb-previewbar__settings[open] { width: 100%; }
.wb-previewbar__settings[open] > summary { width: fit-content; margin-left: auto; }
.wb-previewbar__settings[open] > summary::after { content: "Close"; padding-left: 12px; color: var(--wb-text-2); font-weight: 400; }
.wb-previewbar__panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); align-items: end; gap: 20px 24px; padding: 24px 0 12px; }
.wb-previewbar__panel > * { min-width: 0; }
.wb-previewbar__panel .wb-vbar__field--tour { grid-column: 1 / -1; justify-content: flex-end; }
.wb-previewbar__panel .wb-vbar__field--tour select { min-width: 180px; }
.wb-previewbar__panel .wb-vbar__select { min-height: 36px; font-size: calc(13px * var(--wb-scale)); }
.wb-previewbar__panel .wb-vbar__choice { font-size: calc(13px * var(--wb-scale)); }
.wb-previewbar__panel .wb-vbar__field--inline { align-self: center; }
.wb-vstatus { padding: 6px 24px; font-size: calc(11px * var(--wb-scale)); background: var(--wb-surface); }
.wb-viewer-stage { padding: 0; container: wb-stage / inline-size; }
.wb-viewer-stage > .wb-frame--web[data-width="regular"] { width: 100%; min-height: calc(100dvh - 88px); border: 0; border-radius: 0; }
.wb-viewer-stage > .wb-frame--web[data-width="narrow"], .wb-viewer-stage > .wb-frame--ipad, .wb-viewer-stage > .wb-frame--iphone { margin: 24px auto; }
.wb-frame--web { container: wb-screen / inline-size; }

/* Application shell: stable navigation, then the workspace. */
.wb-web { grid-template-columns: 224px minmax(0, 1fr); }
.wb-web--narrow { grid-template-columns: minmax(0, 1fr); }
.wb-web__content { grid-template-rows: auto auto 1fr; }
.wb-sidebar { padding: 28px 16px 20px; gap: 32px; background: var(--wb-surface); }
.wb-sidebar > .wb-logo { padding: 0 12px; }
.wb-sidebar .wb-logo__word { font-size: 21px; letter-spacing: -0.045em; font-weight: 750; }
.wb-sidebar .wb-logo__mark { width: 29px; height: 29px; border-radius: 9px; }
.wb-nav__list, .wb-nav ul { gap: 6px; }
.wb-navitem { min-height: max(var(--wb-hit), 42px); padding: 10px 12px; font-size: calc(14px * var(--wb-scale)); font-weight: 500; color: var(--wb-text-2); border-radius: 9px; }
.wb-navitem .wb-icon { width: 19px; height: 19px; }
.wb-navitem[aria-current="page"] { color: var(--wb-on-accent); background: var(--wb-accent); font-weight: 650; }
.wb-nav--tools::before, .wb-nav--course::before { padding: 0 12px 8px; text-transform: none; letter-spacing: 0; font-size: calc(12px * var(--wb-scale)); font-weight: 500; }
.wb-sidebar__foot { border-top: 1px solid var(--wb-separator); padding: 18px 12px 0; }
.wb-roletag { border-radius: 6px; padding: 5px 10px; font-weight: 550; width: fit-content; }
.wb-header { gap: 10px; padding: 18px 28px 16px; }
.wb-header__row { gap: 16px; }
.wb-header__title { font-size: calc(25px * var(--wb-scale)); font-weight: 700; letter-spacing: -0.035em; line-height: 1.2; }
.wb-utility--header .wb-navitem { min-height: max(var(--wb-hit), 36px); padding: 8px; font-size: calc(13px * var(--wb-scale)); }
.wb-utility--header .wb-navitem .wb-icon { width: 17px; height: 17px; }
.wb-utility--header .wb-navitem:not([aria-current="page"]):hover { color: var(--wb-accent-text); }
.wb-main { padding: 24px 28px 48px; gap: 28px; line-height: 1.55; width: 100%; max-width: 1160px; margin-inline: auto; }
.wb-main > .wb-stack--md { gap: 28px; }
.wb-header + .wb-tabs, .wb-web__content > .wb-tabs { padding-inline: 36px; }
.wb-tabs__list { gap: 12px; }
.wb-tab { padding: 12px 4px; margin-right: 12px; font-size: calc(14px * var(--wb-scale)); }
.wb-tab[aria-current="page"] { font-weight: 700; }
.wb-context__line { font-size: calc(12px * var(--wb-scale)); }
.wb-context__role { margin-left: auto; }
.wb-crumbs ol { font-size: calc(12px * var(--wb-scale)); }
.wb-backlink { font-size: calc(13px * var(--wb-scale)); }

/* Task-first hierarchy. Context is quiet; the next action earns the emphasis. */
.wb-page-intro { color: var(--wb-text-2); font-size: calc(15px * var(--wb-scale)); max-width: 68ch; }
.wb-overview { display: grid; align-content: start; gap: 24px; min-width: 0; }
.wb-priority { padding: 24px; border: 1px solid var(--wb-separator); border-radius: 14px; background: var(--wb-surface); }
.wb-priority .wb-section__title { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); font-weight: 650; }
.wb-priority .wb-section > .wb-stack, .wb-priority .wb-section__body { gap: 12px; }
.wb-priority .wb-section > p:first-of-type { font-size: calc(22px * var(--wb-scale)); font-weight: 650; letter-spacing: -0.02em; }
.wb-priority .wb-section > p:first-of-type .wb-link, .wb-priority .wb-section > p:first-of-type a { color: var(--wb-text); text-decoration: none; }
.wb-priority .wb-section > p:first-of-type a:hover { color: var(--wb-accent-text); text-decoration: underline; }
.wb-priority .wb-status { width: fit-content; }
.wb-workspace-section { padding: 22px 24px; border: 1px solid var(--wb-separator); border-radius: 14px; background: var(--wb-surface); display: grid; gap: 20px; }
.wb-workspace-section .wb-progress { padding-top: 4px; }
.wb-workspace-section .wb-progress__track { height: 6px; border: 0; }
.wb-workspace-section .wb-stat { padding: 0; border: 0; background: transparent; }
.wb-stat { gap: 6px; padding: 18px 20px; border: 1px solid var(--wb-separator); border-radius: 12px; background: var(--wb-surface); }
.wb-stat__label { font-size: calc(12px * var(--wb-scale)); font-weight: 500; }
.wb-stat__value { font-size: calc(27px * var(--wb-scale)); font-weight: 650; letter-spacing: -0.03em; line-height: 1.15; }
.wb-stat__note { font-size: calc(12px * var(--wb-scale)); }
.wb-section { gap: 16px; }
.wb-section__title { font-size: calc(17px * var(--wb-scale)); letter-spacing: -0.015em; font-weight: 650; }
.wb-rail { gap: 28px; }
.wb-rail--side { grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); }
.wb-rail__main { gap: 24px; }
.wb-rail__aside { gap: 24px; }
.wb-rail__aside > .wb-stack { gap: 26px; }
.wb-rail__aside .wb-section__title { font-size: calc(14px * var(--wb-scale)); }
.wb-rail__aside .wb-list { box-shadow: none; background: transparent; border: 0; border-radius: 0; }
.wb-rail__aside .wb-row, .wb-rail__aside .wb-rowlink { padding-inline: 0; }
.wb-rail__aside .wb-row__title { font-size: calc(13px * var(--wb-scale)); font-weight: 550; }
.wb-rail__aside .wb-row__meta { font-size: calc(12px * var(--wb-scale)); }
.wb-tasklist .wb-list { border: 1px solid var(--wb-separator); }
.wb-tasklist .wb-rowlink { padding-block: 18px; }
.wb-tasklist .wb-row__meta { margin-top: 4px; }

/* Calendar workspace: dates and event timing are the structure, with details available on demand. */
.wb-main:has(.wb-calendar) { max-width: none; }

<script>/* kit/core.js */
/* Whiteboard final kit: core helpers, render context and the shared status vocabulary (BD39).
   Plain script, no dependencies; runs in a browser or a bare node:vm context. Renderers return HTML
   strings, never mutate their arguments and give identical output for identical input. */
(function (root) {
  "use strict";
  var WB = (root.WB = root.WB || {});
  var K = (WB.K = WB.K || {});
  WB.shells = WB.shells || {};

  var ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  WB.esc = function (x) {
    if (x === null || x === undefined) return "";
    return String(x).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  };

  WB.fail = function (fn, what) {
    throw new Error("WB.K." + fn + ": " + what);
  };

  // Escaped attribute string. Skips null, undefined and false; true renders a bare boolean attribute.
  WB.attrs = function (obj) {
    var out = "";
    Object.keys(obj || {}).forEach(function (k) {
      var v = obj[k];
      if (v === null || v === undefined || v === false) return;
      out += v === true ? " " + k : " " + k + '="' + WB.esc(v) + '"';
    });
    return out;
  };

  // Throws unless every named field is present and not an empty string.
  WB.need = function (fn, o, keys) {
    if (!o || typeof o !== "object") WB.fail(fn, "options object is required");
    keys.forEach(function (k) {
      if (o[k] === undefined || o[k] === null || o[k] === "") WB.fail(fn, "missing required field '" + k + "'");
    });
  };

  WB.oneOf = function (fn, what, value, list) {
    if (list.indexOf(value) < 0) WB.fail(fn, "unknown " + what + " '" + value + "'");
    return value;
  };

  // Allowed: #fragment, a scheme-less relative path, https: and mailto:. Whitespace and control characters
  // are stripped and the scheme compared case-insensitively before matching; anything else throws.
  WB.safeHref = function (href, fn) {
    var name = fn || "href";
    if (typeof href !== "string" || href === "") WB.fail(name, "href must be a non-empty string");
    var clean = href.replace(/[\s\u0000-\u001f\u007f]/g, "").toLowerCase();
    var scheme = /^([a-z][a-z0-9+.-]*):/.exec(clean);
    if (scheme && scheme[1] !== "https" && scheme[1] !== "mailto") WB.fail(name, "scheme '" + scheme[1] + ":' is not allowed");
    if (!scheme && clean.indexOf("//") === 0) WB.fail(name, "protocol-relative href is not allowed");
    if (clean === "") WB.fail(name, "href is empty after cleaning");
    return href;
  };

  // A go target is "<pageId>[:<variant-or-state>][~<scenario>]"; its href is the viewer route "#/<go>".
  WB.goHref = function (go, fn) {
    if (typeof go !== "string" || !/^[A-Za-z0-9_-]+(:[A-Za-z0-9_.-]+)?(~[a-z0-9_]+)?(\?(tc|ta|tl|tr)=[A-Za-z0-9_-]*(&(tc|ta|tl|tr)=[A-Za-z0-9_-]*)*)?$/.test(go)) WB.fail(fn || "go", "invalid go target '" + go + "'");
    return "#/" + go;
  };

  // Ids are always caller-supplied (never generated).
  WB.checkId = function (fn, id) {
    if (typeof id !== "string" || !/^[A-Za-z][\w-]*$/.test(id)) WB.fail(fn, "a caller-supplied id is required (letters, digits, - and _)");
    return id;
  };

  function freezeAll(list) {
    list.forEach(function (x) { Object.freeze(x); });
    return Object.freeze(list);
  }

  WB.PLATFORMS = Object.freeze(["web", "ipad", "iphone"]);
  WB.ROLES = Object.freeze(["student", "instructor", "ta", "guest"]);
  WB.STAFF = Object.freeze(["instructor", "ta"]);
  WB.ROLE_LABELS = Object.freeze({ student: "Student", instructor: "Instructor", ta: "TA", guest: "Guest" });
  WB.TIERS = Object.freeze(["full", "review", "handoff"]);
  WB.TONES = Object.freeze(["accent", "success", "warning", "error", "info", "neutral"]);
  WB.ACTS = Object.freeze(["open-dialog", "close-dialog", "toggle", "sort", "back"]);

  // Render context: every adaptive and shell function takes this as its first argument.
  WB.ctx = function (o) {
    WB.need("ctx", o, ["platform", "role"]);
    WB.oneOf("ctx", "platform", o.platform, WB.PLATFORMS);
    WB.oneOf("ctx", "role", o.role, WB.ROLES);
    var tier = o.tier === undefined ? "full" : WB.oneOf("ctx", "tier", o.tier, WB.TIERS);
    var orientation = null;
    var sizeClass = "compact";
    if (o.platform === "web") {
      if (o.width !== undefined) WB.oneOf("ctx", "width", o.width, ["regular", "narrow"]);

  K.button = function (o) {
    if (!o || typeof o !== "object") WB.fail("button", "options object is required");

    if (NEEDS_TARGET.indexOf(o.act) >= 0 && !o.target) WB.fail("button", "act '" + o.act + "' requires target");
    if (o.disabled) {
      if (!o.reason) WB.fail("button", "disabled requires a reason");
      WB.checkId("button", o.id);
    } else if (o.id !== undefined) {
      WB.checkId("button", o.id);
    }
    var reasonId = o.disabled ? o.id + "-reason" : null;
    var cls = "wb-btn wb-btn--" + kind + (o.iconOnly ? " wb-iconbtn" : "");

      type: "button",
      class: cls,
      id: o.id,
      "aria-label": o.ariaLabel,
      "aria-disabled": o.disabled ? "true" : null,
      "aria-describedby": reasonId,
      "aria-expanded": o.expanded === undefined ? null : String(Boolean(o.expanded)),

      "data-act": o.act,
      "data-target": o.target,
      "data-note": o.note,
    });

    var btn = "<button" + a + ">" + inner + "</button>";
    if (!o.disabled) return btn;
    return '<span class="wb-btnwrap">' + btn + '<span class="wb-btn__reason" id="' + esc(reasonId) + '">' + esc(o.reason) + "</span></span>";
  };

  // Navigation is always a link (A-R8). go renders the viewer route "#/<go>".
  K.link = function (o) {
    WB.need("link", o, ["label"]);
    var a = nav("link", o);
    return "<a" + attrs({ class: "wb-link", href: a.href, "data-go": a["data-go"], "aria-current": o.current ? "page" : null }) + ">" + (o.icon ? K.icon(o.icon) : "") + esc(o.label) + "</a>";
  };

  }

  // Work status: text plus icon plus tone (UX rule 1). Throws when the ctx role may not see it (BD39).
  K.status = function (key, ctx, opts) {
    WB.checkCtx("status", ctx);
    var s = WB.STATUS[key];
    if (!s) WB.fail("status", "unknown status key '" + key + "'");
    if (s.modifier) WB.fail("status", "'" + key + "' is a modifier; pass late: true with Received");
    var o = opts || {};
    if (!WB.statusVisible(key, ctx.role, o)) WB.fail("status", "'" + key + "' is not visible to " + ctx.role);
    if (o.late && key !== "received" && key !== "receivedNotReleased") WB.fail("status", "late is allowed only with Received");
    return (
      '<span class="wb-status wb-status--' + s.tone + '">' + K.icon(s.icon) + '<span class="wb-status__label">' + esc(s.label) + "</span>" +
      (o.late ? lateChip() : "") + (o.detail ? '<span class="wb-status__detail">' + o.detail + "</span>" : "") + "</span>"
    );
  };

  K.flag = function (key) {
    var f = WB.FLAGS[key];
    if (!f) WB.fail("flag", "unknown flag '" + key + "'");
    return '<span class="wb-flag wb-flag--' + f.tone + '">' + K.icon(f.icon) + esc(f.label) + "</span>";
  };

  // Counts and labels that are not work statuses.
  K.badge = function (o) {
    WB.need("badge", o, ["label", "tone"]);
    return '<span class="wb-badge wb-badge--' + tone("badge", o.tone) + '">' + (o.icon ? K.icon(o.icon) : "") + esc(o.label) + "</span>";

  K.notice = function (o) {
    WB.need("notice", o, ["tone", "title"]);
    var t = tone("notice", o.tone);
    return (
      '<div class="wb-notice wb-notice--' + t + '" role="' + (t === "error" ? "alert" : "status") + '">' + K.icon(o.icon || TONE_ICON[t]) +
      '<div class="wb-notice__content"><p class="wb-notice__title">' + esc(o.title) + "</p>" +
      (o.body ? '<div class="wb-notice__body">' + o.body + "</div>" : "") +
      (o.actions && o.actions.length ? '<div class="wb-notice__actions">' + buttons("notice", o.actions) + "</div>" : "") +
      "</div></div>"
    );
  };

  K.card = function (o) {
    WB.need("card", o, ["body"]);
    var h = headingTag("card", o.level === undefined ? 2 : o.level);
    var title = "";
    if (o.title) {
      var inner = o.go ? '<a class="wb-card__link" href="' + WB.goHref(o.go, "card") + '" data-go="' + esc(o.go) + '">' + esc(o.title) + "</a>" : esc(o.title);
      title = "<" + h + ' class="wb-card__title">' + inner + "</" + h + ">";
    } else if (o.go) {
      WB.fail("card", "go requires a title for the link name");
    }
    return '<article class="wb-card">' + title + '<div class="wb-card__body">' + o.body + "</div>" + (o.footer ? '<div class="wb-card__footer">' + o.footer + "</div>" : "") + "</article>";
  };

  K.section = function (o) {
    WB.need("section", o, ["title", "body"]);
    var h = headingTag("section", o.level === undefined ? 2 : o.level);
    var acts = o.actions && o.actions.length ? '<div class="wb-section__actions">' + buttons("section", o.actions) + "</div>" : "";
    return '<section class="wb-section"><div class="wb-section__head"><' + h + ' class="wb-section__title">' + esc(o.title) + "</" + h + ">" + acts + "</div>" + o.body + "</section>";
  };

  K.list = function (o) {
    WB.need("list", o, ["label"]);
    if (!Array.isArray(o.items)) WB.fail("list", "items must be an array");
    var rows = o.items.map(function (it) {
      WB.need("list", it, ["title"]);
      var inner =
        (it.leading ? '<span class="wb-row__leading">' + it.leading + "</span>" : "") +
        '<span class="wb-row__text"><span class="wb-row__title">' + esc(it.title) + "</span>" + (it.meta ? '<span class="wb-row__meta">' + esc(it.meta) + "</span>" : "") + "</span>" +
        (it.trailing ? '<span class="wb-row__trailing">' + it.trailing + "</span>" : "");
      if (!it.go && !it.href) return '<li class="wb-row">' + inner + "</li>";
      var a = nav("list", it);
      return '<li class="wb-row"><a' + attrs({ class: "wb-rowlink", href: a.href, "data-go": a["data-go"] }) + ">" + inner + K.icon("chev-r") + "</a></li>";
    });
    return '<ul class="wb-list" aria-label="' + esc(o.label) + '">' + rows.join("") + "</ul>";
  };

  K.kv = function (items) {
    if (!Array.isArray(items) || !items.length) WB.fail("kv", "items must be a non-empty array");
    return (
      '<dl class="wb-kv">' +
      items.map(function (it) {
        WB.need("kv", it, ["label", "value"]);
        return '<div class="wb-kv__row"><dt>' + esc(it.label) + "</dt><dd>" + esc(it.value) + "</dd></div>";
      }).join("") +
      "</dl>"
    );
  };

  K.tabs = function (o) {
    WB.need("tabs", o, ["label"]);
    if (!Array.isArray(o.items) || !o.items.length) WB.fail("tabs", "items must be a non-empty array");
    var lis = o.items.map(function (it) {
      WB.need("tabs", it, ["id", "label"]);
      var a = nav("tabs", it);
      return "<li><a" + attrs({ class: "wb-tab", href: a.href, "data-go": a["data-go"], "aria-current": it.current ? "page" : null }) + ">" + esc(it.label) + "</a></li>";
    });
    return '<nav class="wb-tabs" aria-label="' + esc(o.label) + '"><ul class="wb-tabs__list">' + lis.join("") + "</ul></nav>";
  };

  K.segmented = function (o) {
    WB.need("segmented", o, ["label", "name"]);
    if (!Array.isArray(o.options) || o.options.length < 2) WB.fail("segmented", "options needs at least two entries");
    var opts = o.options.map(function (op) {
      WB.need("segmented", op, ["value", "label"]);
      return "<button" + attrs({ type: "button", class: "wb-seg__opt", "aria-pressed": op.selected ? "true" : "false", "data-name": o.name, "data-value": op.value }) + ">" + esc(op.label) + "</button>";

  };

  K.chips = function (o) {
    WB.need("chips", o, ["label"]);
    if (!Array.isArray(o.items)) WB.fail("chips", "items must be an array");
    return (
      '<ul class="wb-chips" aria-label="' + esc(o.label) + '">' +
      o.items.map(function (c) {
        WB.need("chips", c, ["label"]);
        var t = c.tone === undefined ? "neutral" : tone("chips", c.tone);
        return '<li class="wb-chip wb-chip--' + t + '">' + (c.icon ? K.icon(c.icon) : "") + esc(c.label) + "</li>";
      }).join("") +
      "</ul>"
    );
  };

  K.avatar = function (o) {
    WB.need("avatar", o, ["name"]);
    var initials = String(o.name).trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join("");

  };

  K.empty = function (o) {
    WB.need("empty", o, ["title"]);
    return (
      '<div class="wb-empty">' + K.icon(o.icon || "folder") + '<p class="wb-empty__title">' + esc(o.title) + "</p>" +
      (o.body ? '<div class="wb-empty__body">' + o.body + "</div>" : "") + (o.action ? WB.renderAction("empty", o.action) : "") + "</div>"

      '<div class="wb-progress"><div class="wb-progress__head"><span class="wb-progress__label">' + esc(o.label) + '</span><span class="wb-progress__value">' +

      "<div" + attrs({ class: "wb-progress__track", role: "progressbar", "aria-label": o.label, "aria-valuemin": "0", "aria-valuemax": String(max), "aria-valuenow": String(value) }) + ">" +

    WB.need("stat", o, ["label", "value"]);
    return '<div class="wb-stat"><span class="wb-stat__label">' + esc(o.label) + '</span><span class="wb-stat__value">' + esc(o.value) + "</span>" + (o.note ? '<span class="wb-stat__note">' + esc(o.note) + "</span>" : "") + "</div>";
  };

  K.disclosure = function (o) {
    WB.need("disclosure", o, ["summary", "body"]);
    WB.checkId("disclosure", o.id);

  };

  K.toast = function (o) {
    WB.need("toast", o, ["text"]);

  };

  // Rule 8: say who owns a locked thing and offer "Request change" instead of a dead control.
  K.lockedNote = function (o) {
    WB.need("lockedNote", o, ["owner", "reason"]);
    var req = o.requestGo ? '<a class="wb-link" href="' + WB.goHref(o.requestGo, "lockedNote") + '" data-go="' + esc(o.requestGo) + '">Request change</a>' : "";

  var FIELD_TYPES = ["text", "email", "password", "number", "date", "time", "textarea", "select", "checkbox", "toggle"];

  var AUTOCOMPLETE = [["email", "email"], ["password", "current-password"]];
  function autocompleteFor(type) {
    var hit = AUTOCOMPLETE.filter(function (p) { return p[0] === type; })[0];
    return hit ? hit[1] : null;

  function hints(id, o) {
    var help = o.help ? '<p class="wb-field__help" id="' + esc(id) + '-help">' + esc(o.help) + "</p>" : "";
    var reason = o.disabled ? '<p class="wb-field__help" id="' + esc(id) + '-reason">' + K.icon("lock") + esc(o.reason) + "</p>" : "";
    var error = o.error ? '<p class="wb-field__error" id="' + esc(id) + '-error">' + K.icon("alert") + esc(o.error) + "</p>" : "";
    var ids = [o.help ? id + "-help" : null, o.disabled ? id + "-reason" : null, o.error ? id + "-error" : null].filter(Boolean);
    return { html: help + reason + error, describedby: ids.length ? ids.join(" ") : null };
  }

  function table(a, id, other) {
    var columns = [
      { key: "learner", label: "Learner", primary: true }, { key: "item", label: "Assignment" }, { key: "ref", label: "Receipt" },
      { key: "at", label: "Accepted" }, { key: "status", label: "Status" }, { key: "review", label: "Review" },
    ];
    return a.K.table(a.ctx, { id: P.id(a, other ? "other-queue" : "queue"), caption: other ? "Other assignment submissions" : "Submissions to grade", columns: columns, rows: rows(a, id), empty: emptyFor(a) });
  }

  function otherAssignments(a) {
    if (a.selection) return "";
    var id = motionId(a);
    if (!activeTask(a, id) || !rows(a, id).length) return "";
    var it = a.sel.assessment(a.view, id);
    return a.K.section({ title: "Other assignment: " + it.title, body: table(a, id, true), level: 2 });
  }

  // Instructor only: enrolled learners with no receipt for the assessment, as plain text with their status.
  function notIn(a) {
    if (a.role !== "instructor" || a.state === "firstUseEmpty" || a.state === "filteredEmpty") return "";
    var gb = a.sel.gradebook(a.view, a.who.courseId, a.who);
    var ids = a.sel.receiptsFor(a.view, itemId(a), a.who).reduce(function (out, r) { return out.concat(r.captured_members || [r.owner_id]); }, []);
    var items = (gb ? gb.rows : []).filter(function (row) { return ids.indexOf(row.personId) < 0; }).map(function (row) {
      var sub = a.sel.submissionFor(a.view, row.personId, itemId(a));
      return { title: row.name, meta: sub && sub.manual ? "Manual grade; no uploaded submission required" : undefined, trailing: sub ? P.status(a, sub, false) : "", go: WB.Teaching.go(a, "W49", { assessmentId: itemId(a), learnerId: row.personId, receiptId: null }) };
    });
    return items.length ? a.K.section({ title: "No uploaded receipt", body: a.K.list({ label: "Learners with no receipt", items: items }), level: 2 }) : "";
  }

  function links(a) {
    if (a.role === "ta") return P.p("Releasing feedback is the instructor's step");
    return P.links(a, [{ label: "Release feedback", go: "W53" }, { label: "Grading allocation", go: "W57" }]);
  }

  // SPINE-09: both tiers show the offline notice and the last-known flag.
  function offlineTop(a) {
    return a.state === "offline" ? P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]) : "";
  }

  function full(a) {
    var access = mainAccess(a);
    return P.stack(a, [offlineTop(a), access || P.stack(a, [stats(a), table(a, itemId(a), false), notIn(a), links(a)]), otherAssignments(a)]);
  }

  function review(a) {
    var hold = a.role === "instructor" ? [{ label: "Hold release for this assessment", note: "Preview only: nothing is held in this prototype" }] : [];
    var access = mainAccess(a);
    var handoff = P.handoff(a, { title: "Open on a larger screen", lastResult: access ? "" : progressText(a), protectiveActions: access ? [] : hold });
    return P.stack(a, [handoff, offlineTop(a), access || P.stack(a, [table(a, itemId(a), false), links(a)]), otherAssignments(a)]);
  }

  function body(a) {
    var gate = P.staffGate(a, null);
    if (gate) return gate;
    if (a.state === "loading") return P.stack(a, [P.handoff(a, { title: "Open on a larger screen" }), P.loading(a, "the grading queue")]);
    return a.tier === "full" ? full(a) : review(a);
  }

  WB.definePage("W48", {
    states: STATES,
    na: P.na(STATES, { invalid: "The queue takes no typed input; marks are entered in the grader" }),
    render: function (a) {
      var it = a.sel.assessment(a.view, itemId(a));
      return P.shell(a, { title: "Grading queue: " + it.title, body: body(a) }, { page: "W48" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg6-grading/W49.js */
/* W49 Grader (Phase 3 spine). Instructor and TA. Anchor: the persona's problem-set receipt; variants ben (no review
   yet) and group (the group receipt at its home clock). Marks and comments come from gradeDraftFor; a partial TA task
   limits pages, tags, criteria and comments to its questions (R01). Nothing is released from here. Mark bounds are
   help text (kit request 3); the page viewer is listed as text (kit request 2). Contract: pages/SPINE.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["permissionUnavailable", "conflict", "loading", "invalid", "saving", "saveFailed", "offline"];
  var OUTSIDE = "Other questions are outside your grading task";

  function isGroup(a) { var r = a.selection && a.selection.receiptId ? P.receiptById(a, a.selection.receiptId) : null; return r ? Boolean(r.group_id) : a.variant === "group"; }
  function itemId(a) { if (a.selection && a.selection.assessmentId) return a.selection.assessmentId; return a.sel.anchorFor("W19", isGroup(a) ? "motion" : null).record.id; }
  function receipt(a) {
    if (a.selection) {
      if (a.selection.receiptId) return P.receiptById(a, a.selection.receiptId);
      return a.sel.receiptsFor(a.view, itemId(a), a.who).filter(function (r) { return (r.captured_members || [r.owner_id]).indexOf(a.selection.learnerId) >= 0; }).slice().sort(function (x, y) { return y.attempt - x.attempt; })[0] || null;
    }
    return P.receiptById(a, a.sel.anchorFor("W49", a.variant).record.id);
  }
  function has(o, k) { return Boolean(o) && Object.prototype.hasOwnProperty.call(o, k); }

  // The question ids this viewer may see: null means all of them (instructor or a whole-assessment task).
  function keep(a, it) {
    if (a.role !== "ta") return null;
    var s = a.sel.taScope(a.view, it.id, a.who);
    return s && !s.allQuestions ? s.questionIds : null;
  }

  function criteria(a, it, kept) {
    var rubric = a.sel.rubricFor(a.view, it.id, a.who);
    var list = rubric && rubric.criteria ? rubric.criteria : [];
    return kept ? list.filter(function (c) { return kept.indexOf(c.question_id) >= 0; }) : list;
  }

  function ownerName(a, it, r) {
    if (!r.group_id) return P.personName(a, r.owner_id);
    return a.sel.receiptGroupLabel(a.view, a.who, r.id) || r.group_id;
  }

  function submissionPane(a, it, r, kept) {
    var rows = [{ label: "Learner", value: ownerName(a, it, r) }, { label: "Receipt", value: r.id }, { label: "Accepted", value: P.when(a, r.accepted_at) }];
    r.files.forEach(function (f) { rows.push({ label: f.name, value: P.fileMeta(a, f) }); });
    if (r.captured_members) rows.push({ label: "Members", value: r.captured_members.map(function (m) { return P.personName(a, m); }).join(", ") });
    var answers = a.sel.teachingQuizAnswers(a.view, a.who, r.id);
    var answerBlock = answers.length ? a.K.section({ title: "Submitted answers", body: a.K.kv(answers.map(function (answer) { return { label: "Question " + answer.item_id, value: String(answer.value) }; })), level: 2 }) : "";
    var tags = P.tagRows(r.page_tags, kept);
    var tagged = tags.length ? a.K.section({ title: "Pages and questions", body: a.K.kv(tags), level: 2 }) : "";
    return P.stack(a, [a.K.kv(rows), answerBlock, tagged, P.p("The page viewer is not drawn in this prototype.")]);
  }

  function draftOf(a, r) {
    var d = r.group_id ? null : a.sel.gradeDraftFor(a.view, r.owner_id, r.assessment_id, a.who);
    return d && d.receipt_id === r.id ? d : null;
  }

  function readOnlyReason(a) {
    if (a.state === "offline") return "You're offline. Marks cannot be saved";
    return a.state === "saving" ? "Already saving" : null;
  }

  function criterionBlock(a, c, draft, first) {
    var lock = readOnlyReason(a);
    var mark = a.K.field({
      id: P.id(a, "q-" + c.question_id), label: "Mark for question " + c.question_id, type: "number", min: 0, max: c.max, step: 1, help: "0 to " + c.max,
      value: draft && has(draft.marks, c.question_id) ? draft.marks[c.question_id] : undefined,
      error: first && a.state === "invalid" ? "Enter a mark from 0 to " + c.max : undefined, disabled: Boolean(lock), reason: lock || undefined,
    });
    var note = a.K.field({
      id: P.id(a, "c-" + c.question_id), label: "Comment for question " + c.question_id, type: "textarea",
      value: draft && has(draft.comments, c.question_id) ? draft.comments[c.question_id] : undefined, disabled: Boolean(lock), reason: lock || undefined,
    });
    return a.K.section({ title: "Question " + c.question_id + ": " + c.title + " (" + c.max + " points)", body: mark + note, level: 2 });
  }

  // R16: what the learner sees right now, from the released projection.
  function visibility(a, r) {
    if (r.group_id) return P.p("Graded is not released. The learner sees nothing until the instructor releases it");
    if (a.selection) {
      var list = a.sel.releasesFor(a.view, r.assessment_id, a.who) || [];
      var exact = list.some(function (rel) { return rel.entries.some(function (entry) { return entry.person_id === r.owner_id && entry.receipt_id === r.id; }); });
      if (!exact) return P.p("No released feedback is linked to this attempt. Other attempts may have a released result.");
    }
    var res = a.sel.resultFor(a.view, r.owner_id, r.assessment_id, a.who);
    if (!res || res.status === null) return P.p("Graded is not released. The learner sees nothing until the instructor releases it");
    if (!res.staffOutcome) return P.p("Released " + P.when(a, res.releasedAt) + ". The learner sees this version");
    return P.p("The learner still sees the released version from " + P.when(a, res.releasedAt) + ". This change is held until released");
  }

  // SPINE-12: the release link goes only to the W53 destination for this receipt's assessment; none means no link.
  function releaseLink(a, r) {
    var go = a.selection ? WB.Teaching.go(a, "W53", { assessmentId: r.assessment_id, receiptId: null, learnerId: null }) : P.recordGo("W53", "assessment", r.assessment_id);
    return go ? P.links(a, [{ label: "Go to release", go: go }]) : "";
  }

  // J03: only an instructor may preview changes to the rubric belonging to this receipt.
  function rubricLink(a, r) {
    if (a.role !== "instructor") return "";
    var rubric = a.sel.rubricFor(a.view, r.assessment_id, a.who);
    var go = rubric ? P.recordGo("W50", "rubric", rubric.id) : null;
    return go ? P.links(a, [{ label: "Preview rubric-change impact", go: go }]) : "";
  }

  function saveState(a) {
    var map = { conflict: "conflict", saveFailed: "failed", saving: "saving", offline: "savedLocal" };
    return a.K.saveStatus(has(map, a.state) ? map[a.state] : "saved");
  }

  function saveReason(a) {
    return readOnlyReason(a) || (a.state === "invalid" ? "Fix the mark first" : a.state === "conflict" ? "Resolve the competing review first" : null);
  }

  // SPINE-07: completion needs a saved draft with a mark for every question in scope, separate from saving.
  function completeReason(a, draft, list) {
    var reason = saveReason(a) || (a.state === "saveFailed" ? "Save the marks first" : null);
    if (reason) return reason;
    var unmarked = list.filter(function (c) { return !draft || !has(draft.marks, c.question_id); });
    return !draft || unmarked.length ? "Enter a mark for every question first" : null;
  }

  function saveButtons(a, draft, list) {
    var note = "Preview only: nothing is saved in this prototype";
    var reason = saveReason(a);
    var save = reason ? a.K.button({ label: "Save marks", disabled: true, reason: reason, id: P.id(a, "save") }) : a.K.button({ label: "Save marks", kind: "primary", note: note });
    var done = completeReason(a, draft, list);
    var complete = done ? a.K.button({ label: "Mark review complete", disabled: true, reason: done, id: P.id(a, "complete") }) : a.K.button({ label: "Mark review complete", note: note });
    return a.K.stack(a.ctx, { items: [save, complete], gap: "sm" });
  }

  function summary(a, r, draft, partial) {
    var bits = [];
    if (!draft) bits.push(P.p("Not reviewed yet"));
    if (partial) bits.push(P.p(OUTSIDE));
    if (draft && !partial && draft.total) bits.push(a.K.kv([{ label: "Total", value: P.score(draft.total.score, draft.total.max) }]));
    if (draft && draft.reviewer_id) bits.push(P.p("Reviewed by " + P.personName(a, draft.reviewer_id) + (draft.reviewed_at ? ", " + P.when(a, draft.reviewed_at) : "")));
    var sub = r.group_id ? null : a.sel.submissionFor(a.view, r.owner_id, r.assessment_id);
    if (sub && (!sub.receipt_id || sub.receipt_id === r.id)) bits.push(P.status(a, sub, false));
    return P.stack(a, bits);
  }

  // A TA task that does not cover every question: totals and the overall comment stay hidden (R01).
  function isPartial(a, r, draft, kept) {
    var res = r.group_id ? null : a.sel.resultFor(a.view, r.owner_id, r.assessment_id, a.who);
    return Boolean(kept) || Boolean(draft && draft.partial) || Boolean(res && res.scoreWithheld);
  }

  function markingPane(a, it, r, kept) {
    var draft = draftOf(a, r);
    var partial = isPartial(a, r, draft, kept);
    var list = criteria(a, it, kept);
    var blocks = list.map(function (c, i) { return criterionBlock(a, c, draft, i === 0); });
    var lock = readOnlyReason(a);
    var overall = partial ? "" : a.K.field({
      id: P.id(a, "overall"), label: "Overall comment", type: "textarea", value: draft ? draft.overall_comment : undefined, disabled: Boolean(lock), reason: lock || undefined,
    });
    var release = a.role === "instructor" ? releaseLink(a, r) : P.p("Releasing feedback is the instructor's step");
    return P.stack(a, [saveState(a), summary(a, r, draft, partial)].concat(blocks).concat([overall, saveButtons(a, draft, list), visibility(a, r), release]));
  }

  // SPINE-03: resolving writes the review, so it is offered only on the full tier; review tiers keep Compare.
  function conflictButtons(a) {
    var note = "Preview only: nothing changes in this prototype";
    var compare = a.K.button({ label: "Compare", note: note });
    if (a.role !== "instructor") return [compare, a.K.button({ label: "Ask the instructor to resolve", note: note })];
    if (a.tier !== "full") return [compare];
    return [a.K.button({ label: "Keep mine", note: note }), a.K.button({ label: "Use theirs", note: note }), compare];
  }

  function conflictNotice(a) {
    var s = a.sel.failureSample(a.view, "score-conflict", a.who);
    var rec = receipt(a);
    if (!s || !rec || s.assessment_id !== rec.assessment_id || s.person_id !== rec.owner_id) return a.K.notice({ tone: "warning", title: "This review has a conflicting revision", body: P.p("No saved conflict example is recorded for this submission. Keep the current version until the conflict is resolved.") });
    var body = P.p("Question " + s.question_id + ": " + P.personName(a, s.mine.reviewer_id) + " saved " + s.mine.score + " at " + P.when(a, s.mine.savedAt) + ". " +
      P.personName(a, s.theirs.reviewer_id) + " saved " + s.theirs.score + " at " + P.when(a, s.theirs.savedAt) + " (revision " + s.theirs.revision + ").");
    var buttons = conflictButtons(a);
    var extra = a.role === "instructor" ? "" : P.p("Only the instructor can resolve a competing review");
    return a.K.notice({ tone: "warning", title: "Someone else changed this review", body: body + extra + a.K.stack(a.ctx, { items: buttons, gap: "sm" }) });
  }

  function saveFailedNotice(a) {
    var title = "Marks were not saved";
    if (a.tier !== "full") return a.K.notice({ tone: "error", title: title, body: P.p("Open the grader on a larger screen to save them again.") });
    return a.K.notice({ tone: "error", title: title, body: P.p("Your marks are still on this page."), actions: [{ label: "Retry save", note: "Preview only: nothing is saved in this prototype" }] });
  }

  function stateNotice(a) {
    if (a.state === "conflict") return conflictNotice(a);
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]);
    if (a.state === "saveFailed") return saveFailedNotice(a);
    return "";
  }

  function full(a, it, r) {
    var kept = keep(a, it);
    var list = submissionPane(a, it, r, kept);
    var detail = markingPane(a, it, r, kept);
    var layout = a.ctx.sizeClass === "regular"
      ? a.K.split(a.ctx, { id: P.id(a, "grader"), listLabel: "Submission", detailLabel: "Marking", list: list, detail: detail })
      : P.stack(a, [a.K.section({ title: "Submission", body: list, level: 2 }), a.K.section({ title: "Marking", body: detail, level: 2 })]);
    return P.stack(a, [stateNotice(a), layout]);
  }

  // SPINE-04: the summary and overall comment for viewers who see every question; a partial task sees neither.
  function readOnlySummary(a, r, draft, kept) {
    var partial = isPartial(a, r, draft, kept);
    var overall = !partial && draft && draft.overall_comment ? a.K.kv([{ label: "Overall comment", value: draft.overall_comment }]) : "";
    return P.stack(a, [summary(a, r, draft, partial), overall]);
  }

  function readOnlyMarks(a, it, r, kept) {
    var draft = draftOf(a, r);
    var rows = criteria(a, it, kept).map(function (c) {
      var mark = draft && has(draft.marks, c.question_id) ? P.score(draft.marks[c.question_id], c.max) : "Not marked";
      var note = draft && has(draft.comments, c.question_id) ? " · " + draft.comments[c.question_id] : "";
      return { label: "Question " + c.question_id + ": " + c.title, value: mark + note };
    });
    return rows.length ? a.K.kv(rows) : P.p("Not reviewed yet");
  }

  function review(a, it, r) {
    var kept = keep(a, it);
    var note = "Preview only: nothing changes in this prototype";
    var protect = [{ label: "Flag for instructor review", note: note }];
    if (a.role === "instructor") protect.push({ label: "Hold this result", note: note });
    var handoff = P.handoff(a, { title: "Open on a larger screen", protectiveActions: protect });
    var release = a.role === "instructor" ? releaseLink(a, r) : "";
    var marks = P.stack(a, [readOnlySummary(a, r, draftOf(a, r), kept), readOnlyMarks(a, it, r, kept)]);
    return P.stack(a, [handoff, stateNotice(a), submissionPane(a, it, r, kept), marks, visibility(a, r), release]);
  }

  function missing(a) {
    if (!isGroup(a)) return P.stack(a, [P.bareHandoff(a), P.permissionNotice(a)]);
    var empty = a.K.empty({ title: "No group receipt at this time", body: P.p("The group has not handed in yet at this point.") });
    return P.stack(a, [P.bareHandoff(a), empty, P.offHome(a, "The group receipt arrives later in the prototype")]);
  }

  function body(a, it) {
    var gate = P.staffGate(a, it.id);
    if (gate) return gate;
    if (a.state === "loading") return P.stack(a, [P.bareHandoff(a), P.loading(a, "the submission")]);
    var r = receipt(a);
    if (!r) return a.selection && a.selection.learnerId ? WB.Teaching.gradeRecord(a, it, a.selection.learnerId) : missing(a);
    return P.stack(a, [WB.Teaching.attempts(a, r), a.tier === "full" ? full(a, it, r) : review(a, it, r), WB.Teaching.feedback(a, it, r), rubricLink(a, r)]);
  }

  WB.definePage("W49", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "The grader opens one submission; an empty queue is drawn on the grading queue" }),
    variants: { ben: WB.manifest.anchors.W49.variants.ben.label, group: WB.manifest.anchors.W49.variants.group.label },
    render: function (a) {
      var it = a.sel.assessment(a.view, itemId(a));
      return P.shell(a, { title: "Grade: " + it.title, body: body(a, it), back: { label: "Grading queue", go: a.selection ? WB.Teaching.go(a, "W48", { learnerId: null, receiptId: null }) : "W48" } }, { page: "W48" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg6-grading/W50.js */
/* W50 Rubric-change impact preview (Phase 3, seg6-grading). Instructor and TA. Anchor: the problem-set rubric. No
   candidate rubric version exists in the fixtures, so the page draws the current version, who a change would
   recalculate (held results only) and the released snapshots it can never touch; Apply stays disabled. A TA
   sees only the assigned questions and their own progress. Notes: pages/seg6-grading/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "conflict", "offline", "permissionUnavailable"];
  var NO_CANDIDATE = "No candidate version to apply";
  var NOTE = "Preview only: nothing is recalculated in this prototype";

  function rubricId(a) { return a.sel.anchorFor("W50").record.id; }
  function itemOf(a) {
    var id = rubricId(a);
    return P.assessments(a).filter(function (x) { return x.rubric_id === id; })[0] || null;
  }

  function criteriaTable(a, rubric, keep) {
    var rows = rubric.criteria.filter(function (c) { return !keep || keep.indexOf(c.question_id) >= 0; }).map(function (c) {
      return { id: c.question_id, cells: { q: esc("Question " + c.question_id), title: esc(c.title), max: esc(String(c.max)) } };
    });
    return a.K.table(a.ctx, {
      id: P.id(a, "criteria"), caption: "Current version " + rubric.version,
      columns: [{ key: "q", label: "Question", primary: true }, { key: "title", label: "Criterion" }, { key: "max", label: "Points", numeric: true }],
      rows: rows, empty: { title: "No criteria", body: P.p("This rubric has no criteria in your scope.") },
    });
  }

  function candidate(a) {
    var go = P.recordGo("W44", "rubric", rubricId(a));
    return a.K.empty({ title: "No candidate version saved", body: P.p("A change is drafted in the rubric editor first."), action: go ? { label: "Edit rubric", go: go } : undefined });
  }

  function impactRows(a, item) {
    var receipts = a.sel.receiptsFor(a.view, item.id, a.who);
    return (a.sel.releaseReady(a.view, item.id, a.who) || []).map(function (r) {
      var d = a.sel.gradeDraftFor(a.view, r.personId, item.id, a.who);
      var rec = receipts.filter(function (x) { return x.owner_id === r.personId; })[0];
      var go = rec ? P.recordGo("W49", "receipt", rec.id) : null;
      var cells = { learner: esc(P.personName(a, r.personId)), now: esc(marked(d) ? P.score(d.total.score, d.total.max) : ""), effect: esc(effectText(r, d)) };
      return go ? { id: r.personId, cells: cells, go: go } : { id: r.personId, cells: cells };
    });
  }
  // R09: release readiness is not the draft. A draft with marks but an incomplete review is still affected.
  function marked(d) { return Boolean(d && d.total && Object.keys(d.marks || {}).length); }
  function effectText(r, d) {
    if (r.included) return "Held: would be recalculated";
    if (marked(d)) return "Marked, review not complete: its marks would be recalculated";
    return "Not scored yet: nothing to recalculate";
  }

  function impactTable(a, item) {
    return a.K.table(a.ctx, {
      id: P.id(a, "impact"), caption: "Results a change would recalculate",
      columns: [{ key: "learner", label: "Learner", primary: true }, { key: "now", label: "Current draft" }, { key: "effect", label: "Effect" }],
      rows: impactRows(a, item), empty: { title: "Nothing held", body: P.p("No held result would be recalculated.") },
    });
  }

  function snapshots(a, item) {
    var list = a.sel.releasesFor(a.view, item.id, a.who) || [];
    if (!list.length) return a.K.empty({ title: "Nothing released yet", body: P.p("Released snapshots are listed here and never change.") });

<script>/* pages/seg6-grading/W51.js */
/* W51 Staff gradebook (Phase 3 spine). Instructor and TA, course-level. Every cell comes from gradebook (TA-scoped:
   only task items and learners, no totals). Web draws the whole table; iPad and iPhone draw one learner, the
   student persona's row, or the first row when that learner is outside a TA's scope. Contract: pages/SPINE.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["firstUseEmpty", "loading", "filteredEmpty", "offline", "permissionUnavailable"];
  var NOT_IN_TOTAL = "Not in the total until released";

  function anchorLearner(a) {
    var r = P.receiptById(a, a.sel.anchorFor("W49", null).record.id);
    return r ? r.owner_id : null;
  }

  // One cell as {text, html}: text for read-only lists, html for the table. Null cells stay blank (R13).
  function cellOf(a, row, item) {
    var c = row.cells[item.id];
    if (!c) return { text: "", html: "" };
    if (c.scoreWithheld) return { text: "Outside your grading task", html: esc("Outside your grading task") };
    var sub = a.sel.submissionFor(a.view, row.personId, item.id);
    var status = sub ? P.status(a, sub, false) : "";
    if (c.score !== null && c.score !== undefined) {
      var score = P.score(c.score, item.max);
      var held = c.held ? " " + a.K.badge({ label: "Not released", tone: "neutral" }) : "";
      return { text: score + (c.held ? " · Not released" : ""), html: esc(score) + held, status: status };
    }
    if (c.status === null && !c.held) {
      return sub && sub.receipt_id ? { text: NOT_IN_TOTAL, html: status + " " + esc(NOT_IN_TOTAL), status: status } : { text: "", html: "" };
    }
    // SPINE-06: a status-only outcome (excused, missing) shows just its status, plus the held indicator.
    return { text: c.held ? "Not released" : "", html: status + (c.held ? " " + a.K.badge({ label: "Not released", tone: "neutral" }) : ""), status: status };
  }

  function columns(a, gb) {
    var cols = [{ key: "learner", label: "Learner", primary: true }].concat(gb.items.map(function (it) { return { key: "i-" + it.id, label: it.title + " (" + it.max + ")" }; }));
    if (a.role !== "instructor") return cols;
    return cols.concat([{ key: "total", label: "Total (staff, includes held)" }, { key: "released", label: "Released total" }]);
  }

  function tableRow(a, gb, row, linkFor) {
    var cells = { learner: a.K.link({ label: row.name, go: WB.Teaching.go(a, "W45", { learnerId: row.personId, assessmentId: null, receiptId: null }) }) };
    gb.items.forEach(function (it) {
      var html = cellOf(a, row, it).html;
      var receipts = a.sel.receiptsFor(a.view, it.id, a.who).filter(function (r) { return (r.captured_members || [r.owner_id]).indexOf(row.personId) >= 0; });
      var receipt = receipts.slice().sort(function (x, y) { return y.attempt - x.attempt; })[0];
      var dest = WB.Teaching.go(a, "W49", { assessmentId: it.id, learnerId: row.personId, receiptId: receipt ? receipt.id : null });
      var legacy = !a.selection && it.id === P.assessmentId(a) && row.personId === linkFor ? "W49" : null;
      var go = " " + a.K.link({ label: "Open in grader", ariaLabel: "Open " + it.title + " for " + row.name, go: legacy || dest });
      cells["i-" + it.id] = html + go;
    });
    if (a.role === "instructor") {
      cells.total = esc(row.total || "");
      cells.released = esc(row.releasedTotal || "");
    }
    return { id: row.personId, cells: cells };
  }

  function filterEmpty() {
    return { title: "No learners match the filter", body: P.p("Other learners are still in the course."), action: { label: "Clear filters", note: "Preview only: filters are not wired" } };
  }

  function table(a, gb) {
    var linkFor = anchorLearner(a);
    var rows = a.state === "filteredEmpty" ? [] : gb.rows.map(function (r) { return tableRow(a, gb, r, linkFor); });
    var empty = a.state === "filteredEmpty" ? filterEmpty() : { title: "No learners yet", body: P.p("Learners appear here once they are enrolled.") };
    return a.K.table(a.ctx, { id: P.id(a, "gradebook"), caption: "Gradebook", columns: columns(a, gb), rows: rows, empty: empty });
  }

  function learnerRow(a, gb) {
    var id = P.learnerId(a);
    return gb.rows.filter(function (r) { return r.personId === id; })[0] || gb.rows[0] || null;
  }

  function learnerList(a, gb, row) {
    var items = gb.items.map(function (it) {
      var c = cellOf(a, row, it);
      return { title: it.title, meta: c.text || undefined, trailing: c.status || undefined, go: WB.Teaching.go(a, "W49", { assessmentId: it.id, learnerId: row.personId, receiptId: null }) };
    });
    var totals = a.role === "instructor" ? a.K.kv([{ label: "Total (staff, includes held)", value: row.total || "No calculable grade" }, { label: "Released total", value: row.releasedTotal || "No released results" }]) : "";
    return P.stack(a, [a.K.section({ title: row.name, body: a.K.list({ label: "Grade items for " + row.name, items: items }), level: 2 }), totals]);
  }

  function single(a, gb) {
    var hold = a.role === "instructor" ? [{ label: "Hold this learner's pending results", note: "Preview only: nothing is held in this prototype" }] : [];
    var handoff = P.handoff(a, { title: "Open on a larger screen", protectiveActions: hold });
    // SPINE-10: a filter that matches nobody wins before a learner is chosen, so no grades are drawn.
    if (a.state === "filteredEmpty") return P.stack(a, [handoff, a.K.empty(filterEmpty())]);
    var row = learnerRow(a, gb);
    if (!row) return a.K.empty({ title: "No learners yet", body: P.p("Learners appear here once they are enrolled.") });
    return P.stack(a, [handoff, WB.Teaching.picker(a, "W51", row.personId), P.links(a, [{ label: "Student course record", go: WB.Teaching.go(a, "W45", { learnerId: row.personId, assessmentId: null, receiptId: null }) }]), learnerList(a, gb, row)]);
  }

  function links(a) {
    if (a.role !== "instructor") return P.p("Releasing feedback is the instructor's step");
    return P.links(a, [{ label: "Release feedback", go: "W53" }, { label: "Grading policy", go: "W52" }]);
  }

  function top(a) {
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]);
    if (a.state !== "firstUseEmpty") return "";
    return a.K.notice({ tone: "info", title: "Empty categories", body: P.p("A category with no released results is left out of the total until something is released.") });
  }

  function body(a) {
    var gate = P.staffGate(a, null);
    if (gate) return gate;
    if (a.state === "loading") return P.stack(a, [P.bareHandoff(a), P.loading(a, "the gradebook")]);
    var gb = a.sel.gradebook(a.view, a.who.courseId, a.who);
    if (!gb) return P.stack(a, [P.bareHandoff(a), P.permissionNotice(a)]);
    var main = a.platform === "web" ? table(a, gb) : single(a, gb);
    return P.stack(a, [top(a), main, links(a)]);
  }

  WB.definePage("W51", {
    states: STATES,
    na: P.na(STATES, { invalid: "Cells are read-only here; marks are entered in the grader" }),
    render: function (a) { return P.shell(a, { title: a.page.title, body: body(a) }, { page: "W51" }); },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* pages/seg6-grading/W52.js */
/* W52 Grading policy setup (Phase 3, seg6-grading; decisions 3.10 and 6.01). Instructor and TA. Anchor: the course
   grading policy. No selector exposes the weights or rules, so the page draws the category mapping from the
   gradebook, the policy version from the release preview and the calculation preview from courseTotal and
   categoryPercent (null shows "No calculable grade"). A TA reads the mapping only: no totals and no learner.
   No letter grade is drawn anywhere. Notes: pages/seg6-grading/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["invalid", "loading", "conflict", "offline", "permissionUnavailable"];
  var LABELS = { assignments: "Assignments", labs: "Labs", quizzes: "Quizzes" };
  var NO_GRADE = "No calculable grade";
  var NO_LETTERS = "This policy sets no letter boundaries, so no page shows a letter grade";

  function label(id) { return Object.prototype.hasOwnProperty.call(LABELS, id) ? LABELS[id] : id; }
  function totalText(t) { return t && t.display ? t.display : NO_GRADE; }
  function pctText(a, v) { return v === null || v === undefined ? NO_GRADE : a.sel.pct(v); }

  // Grade items grouped by category, in gradebook order.
  function groups(gb) {
    var out = [];
    gb.items.forEach(function (it) {
      var g = out.filter(function (x) { return x.id === it.category; })[0];
      if (g) g.items.push(it);
      else out.push({ id: it.category, items: [it] });
    });
    return out;
  }

  function mapping(a, gb) {
    var policy = a.sel.gradingPolicy(a.view, a.who.courseId, a.who);
    var rows = groups(gb).map(function (g) {
      var points = g.items.reduce(function (n, it) { return n + it.max; }, 0);
      var titles = g.items.map(function (it) { return it.title; }).join(", ");
      return { id: g.id, cells: { cat: esc(label(g.id)), items: esc(titles), points: esc(String(points)), weight: esc(policy && policy.categories.filter(function (c) { return c.id === g.id; })[0] ? String(policy.categories.filter(function (c) { return c.id === g.id; })[0].weight) + "%" : "Not configured") } };
    });
    return a.K.table(a.ctx, {
      id: P.id(a, "mapping"), caption: "Category mapping",
      columns: [{ key: "cat", label: "Category", primary: true }, { key: "items", label: "Assessments" }, { key: "points", label: "Points possible", numeric: true }, { key: "weight", label: "Weight" }],
      rows: rows, empty: { title: "No grade items", body: P.p("Grade items appear here once assessments are published.") },
    });
  }

  // The first assessment with a release-ready result: its preview carries the applied policy version.
  function readyItem(a) {
    var hit = null;
    P.assessments(a).forEach(function (item) {
      if (hit) return;
      var row = (a.sel.releaseReady(a.view, item.id, a.who) || []).filter(function (r) { return r.included; })[0];
      if (row) hit = { item: item, personId: row.personId };
    });
    return hit;
  }

  function source(a, ready) {
    var pv = ready ? a.sel.releasePreview(a.view, a.who.courseId, ready.personId, ready.item.id, a.who) : null;
    var policy = a.sel.gradingPolicy(a.view, a.who.courseId, a.who);
    var rules = policy ? a.K.kv([{ label: "Ungraded work", value: "Excluded from the total" }, { label: "Excused work", value: "Removed from the denominator" }, { label: "Missing work", value: "Zero only after release" }, { label: "Rounding", value: String(policy.rounding.digits) + " decimal places at the final total" }]) : "";
    return rules + (pv && pv.inputs ? a.K.kv([{ label: "Policy version", value: String(pv.inputs.policy.version) }]) : "");
  }

  function preview(a, gb) {
    var learner = P.learnerId(a);
    var course = a.who.courseId;
    var staff = a.sel.courseTotal(a.view, course, learner, a.who);
    var rel = a.sel.courseTotal(a.view, course, learner, a.who, { as: "learner" });
    var cats = groups(gb).reduce(function (list, g) {
      return list.concat([
        { label: label(g.id) + " (working)", value: pctText(a, a.sel.categoryPercent(a.view, course, learner, g.id, a.who)) },
        { label: label(g.id) + " (released)", value: pctText(a, a.sel.categoryPercent(a.view, course, learner, g.id, a.who, { as: "learner" })) },
      ]);
    }, []);
    var grid = a.K.grid(a.ctx, {
      cols: 3, compactCols: 1, items: [
        a.K.figure({ label: "Working total", value: totalText(staff), basis: "Released and held results" }),
        a.K.figure({ label: "Released total", value: totalText(rel), basis: "Released results only" }),
        a.K.stat({ label: "Represented weight", value: staff ? String(staff.representedWeight) : NO_GRADE }),
      ],
    });
    var body = P.p("Calculation preview for " + P.personName(a, learner)) + grid + (cats.length ? a.K.kv(cats) : "");
    return a.K.section({ title: "Calculation preview", body: body, level: 2 });
  }

  function letters(a) { return a.K.section({ title: "Letter grade", body: P.p(NO_LETTERS), level: 2 }); }

  function top(a) {
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]);
    if (a.state === "invalid") return a.K.notice({ tone: "error", title: "Category weights do not add up to the whole course", body: P.p("The entered weights are not drawn: there is no sample record.") });
    if (a.state === "conflict") return a.K.notice({ tone: "error", title: "The calculation preview is out of date", body: P.p("Another change was applied after this preview.") });
    return "";
  }

  function actions(a) {
    var reasons = { invalid: "Fix the category weights first", conflict: "Recompute the preview first", offline: "You're offline" };
    var reason = Object.prototype.hasOwnProperty.call(reasons, a.state) ? reasons[a.state] : "There is no working change to apply";
    return P.stack(a, [
      a.K.button({ label: "Apply policy version", kind: "primary", disabled: true, reason: reason, id: P.id(a, "apply") }),
      a.K.button({ label: "Preview calculation", note: "Preview only: nothing is recomputed in this prototype" }),
      a.K.button({ label: "Edit weights", note: "Preview only: weights are not drawn; see the kit request" }),
    ]);
  }

  function links(a, ready) {
    if (a.role !== "instructor") return P.links(a, [{ label: "Gradebook", go: "W51" }]);
    var go = ready ? WB.Teaching.go(a, "W53", { assessmentId: ready.item.id, learnerId: null, receiptId: null }) : null;
    return P.links(a, [{ label: "Gradebook", go: "W51" }, go ? { label: "Release feedback: " + ready.item.title, go: go } : null, { label: "Course settings", go: "W36" }]);
  }

  // R06: a review-tier protective action follows the same blocking states as the web controls.
  function guarded(a, action, key, reasons) {
    var reason = Object.prototype.hasOwnProperty.call(reasons, a.state) ? reasons[a.state] : "";
    return reason ? { label: action.label, disabled: true, reason: reason, id: P.id(a, key) } : action;
  }
  function instructor(a, gb) {
    var ready = readyItem(a);
    var keep = [guarded(a, { label: "Keep the current policy version", note: "Preview only: nothing is changed in this prototype" }, "keep", { offline: "You're offline", conflict: "Recompute the preview first" })];
    if (a.tier !== "full") {
      return P.stack(a, [P.handoff(a, { title: "Open on a larger screen", protectiveActions: keep }), top(a), source(a, ready), mapping(a, gb), preview(a, gb), letters(a), links(a, ready)]);
    }

  }

  // BD23, BD33: read-only mapping of the TA's own items, whatever the token; no totals and no learner.
  function ta(a, gb) {
    return P.stack(a, [
      P.bareHandoff(a),
      a.K.notice({ tone: "info", title: "Read-only: the instructor sets the grading policy" }),
      gb ? mapping(a, gb) : P.p("No grade items are in your grading tasks"),
      P.p("A worked example for an example learner is not drawn yet"), letters(a), links(a, null),
    ]);
  }

  // R01: the frame role alone is not membership; the viewer must hold that role in the course.
  function member(a) { return a.sel.verifiedRole(a.view, a.who, a.who.courseId) === a.role; }
  function denied(a) { return P.stack(a, [P.bareHandoff(a), P.permissionNotice(a, "You are not teaching this course")]); }
  function body(a) {
    var gate = P.staffGate(a, null);
    if (gate) return gate;
    if (!member(a)) return denied(a);
    if (a.state === "loading") return P.stack(a, [P.bareHandoff(a), P.loading(a, "the grading policy")]);
    var gb = a.sel.gradebook(a.view, a.who.courseId, a.who);
    if (a.role === "ta") return ta(a, gb);
    if (!gb) return P.stack(a, [P.bareHandoff(a), P.permissionNotice(a)]);
    return instructor(a, gb);
  }

  WB.definePage("W52", {
    states: STATES,
    na: P.na(STATES, {
      saving: "Weights cannot be edited in this prototype, so nothing is saved", saveFailed: "Weights cannot be edited in this prototype, so nothing is saved",
      firstUseEmpty: "The course already has an applied policy version", success: "No working change exists to apply",
    }),
    render: function (a) { return P.shell(a, { title: a.page.title, body: body(a) }, { page: "W52" }); },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg6-grading/W53.js */
/* W53 Exact feedback release (Phase 3 spine). Anchor: the problem-set assessment. Instructor only for release: the scope is the
   fixed list of releaseReady included rows (R02), the exact preview comes from releasePreview, and Release opens
   only after the preview is acknowledged (R14). A stale preview or being offline always blocks it. iPad is review
   only; iPhone is a handoff with "Keep everything held". A TA sees only their own review progress. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["conflict", "loading", "offline", "success", "permissionUnavailable"];
  var ACKED = ["acknowledged", "confirm"];
  var REASONS = { notReady: "Review not complete" };
  var STEP = "Releasing feedback is the instructor's step";

  function itemId(a) { return P.assessmentId(a); }
  function has(o, k) { return Boolean(o) && Object.prototype.hasOwnProperty.call(o, k); }

  function rowsOf(a) {
    var ready = a.sel.releaseReady(a.view, itemId(a), a.who) || [];
    return {
      included: ready.filter(function (r) { return r.included; }),
      held: ready.filter(function (r) { return !r.included; }),
    };
  }

  function preview(a, r) { return a.sel.releasePreview(a.view, a.who.courseId, r.personId, itemId(a), a.who); }
  function fingerprints(a, rows) { return rows.included.map(function (r) { return preview(a, r).fingerprint; }); }

  function trail(a) {
    var current = ACKED.indexOf(a.variant) >= 0 ? 3 : 2;
    var labels = ["Scope", "Exceptions", "Exact preview", "Confirm"];
    return a.K.trail({ label: "Release steps", steps: labels.map(function (l, i) { return { label: l, state: i < current ? "done" : i === current ? "current" : "todo" }; }) });
  }

  function scope(a, rows) {
    if (!rows.included.length) return a.K.empty({ title: "Nothing ready", body: P.p("No reviewed result is waiting to be released.") });
    var items = rows.included.map(function (r) { return { title: P.personName(a, r.personId), meta: r.revised ? "Correction to an earlier release" : "Reviewed" }; });
    return a.K.section({ title: "Release scope", body: P.p("Release scope is fixed in this prototype: every reviewed result listed here") + a.K.list({ label: "Results to release", items: items }), level: 2 });
  }

  function heldBack(a, rows) {
    if (!rows.held.length) return "";
    var receipts = a.sel.receiptsFor(a.view, itemId(a), a.who);
    var items = rows.held.map(function (r) {
      var rec = receipts.filter(function (x) { return x.owner_id === r.personId; })[0];
      var go = rec ? P.recordGo("W49", "receipt", rec.id) : null;
      var item = { title: P.personName(a, r.personId), meta: Object.prototype.hasOwnProperty.call(REASONS, r.reason) ? REASONS[r.reason] : "Not ready" };
      return go ? { title: item.title, meta: item.meta, go: go } : item;
    });
    return a.K.section({ title: "Held back", body: a.K.list({ label: "Held back from this release", items: items }), level: 2 });
  }

  // SPINE-01: per-question marks and comments from the fingerprint-bound payload, labelled by the rubric.
  function questionRows(a, p) {
    var draft = p && p.inputs ? p.inputs.draft : null;
    var rubric = a.sel.rubricFor(a.view, itemId(a), a.who);
    if (!draft || !rubric) return [];
    return rubric.criteria.map(function (c) {
      var q = c.question_id;
      var mark = has(draft.marks, q) ? P.score(draft.marks[q], c.max) : "Not marked";
      var note = has(draft.comments, q) ? draft.comments[q] : "";
      return { q: q, label: "Question " + q + ": " + c.title, mark: mark, note: note };
    });
  }

  function questionList(a, p) {
    var rows = questionRows(a, p);
    if (!rows.length) return "";
    var kv = rows.map(function (x) { return { label: x.label, value: x.note ? x.mark + " · " + x.note : x.mark }; });
    return a.K.section({ title: "Marks and comments to release", body: a.K.kv(kv), level: 4 });
  }

  function previewBlock(a, r) {
    var p = preview(a, r);
    var d = a.sel.gradeDraftFor(a.view, r.personId, itemId(a), a.who);
    var rows = [
      { label: "Learner", value: P.personName(a, r.personId) }, { label: "Receipt", value: p.inputs.receipt.id },
      { label: "Rubric version", value: String(p.inputs.rubricVersion) }, { label: "Policy version", value: String(p.inputs.policy.version) },
    ];
    if (d && d.total) rows.push({ label: "Score", value: P.score(d.total.score, d.total.max) });
    if (d && d.overall_comment) rows.push({ label: "Comment", value: d.overall_comment });
    rows.push({ label: "Fingerprint", value: p.fingerprint });
    var figs = a.K.grid(a.ctx, { cols: 2, compactCols: 1, items: [
      a.K.figure({ label: "Course total before", value: p.before || "No released results", basis: "Released results only" }),
      a.K.figure({ label: "Course total after release", value: p.after || "No calculable grade", basis: "Released results plus this release" }),
    ] });
    return a.K.section({ title: "Exact preview: " + P.personName(a, r.personId), body: a.K.kv(rows) + questionList(a, p) + figs, level: 3 });
  }

  function history(a) {
    var list = (a.sel.releasesFor(a.view, itemId(a), a.who) || []).slice().reverse();
    if (!list.length) return a.K.section({ title: "Release history", body: P.p("No release yet"), level: 2 });
    var items = list.map(function (rel, i) {
      var names = rel.entries.map(function (e) { return P.personName(a, e.person_id); }).join(", ");
      var meta = [P.when(a, rel.released_at), P.personName(a, rel.actor_id), names, i === 0 ? "" : "Earlier version, still on record"].filter(Boolean).join(" · ");
      var item = { title: "Version " + rel.version, meta: meta };
      return i === 0 ? { title: item.title, meta: meta, go: a.selection ? WB.Teaching.go(a, "W23", { assessmentId: itemId(a), learnerId: rel.entries[0].person_id, receiptId: null }) : "W23" } : item;
    });
    return a.K.section({ title: "Release history", body: a.K.list({ label: "Releases, newest first", items: items }), level: 2 });
  }

  function staleNotice(a) {
    var s = a.sel.failureSample(a.view, "release-preview-stale", a.who);
    if (!s || s.assessment_id !== itemId(a)) return a.K.notice({ tone: "error", title: "The preview is out of date", body: P.p("Refresh the exact preview before releasing. No changed-result example is recorded for this assessment.") });
    var changed = s.changed.map(function (c) { return P.personName(a, c.person_id) + ", question " + c.question_id; }).join("; ");
    var body = P.p("Changed: " + changed + ". Changed at " + P.when(a, s.changedAt) + ", after the preview at " + P.when(a, s.previewedAt) + ".") +
      P.p("Preview revision " + s.preview_revision + ", current revision " + s.current_revision + ".");
    return a.K.notice({ tone: "error", title: "The preview is out of date", body: body, actions: [{ label: "Refresh preview", note: "Preview only: nothing is recalculated in this prototype" }] });
  }

  function blockReason(a, rows) {
    if (!rows.included.length) return "Nothing is ready to release";
    if (a.selection && ["ps4", "math-assignment"].indexOf(itemId(a)) < 0) return "No release outcome is modeled for this assessment";
    if (a.state === "conflict") return "The preview is out of date. Refresh it first";
    if (a.state === "offline") return "You're offline. Nothing can be released";
    return null;
  }

  // SPINE-01: the confirm dialog names what is released per learner: total, per-question marks, comment count.
  function dialogSummary(a, r) {
    var d = a.sel.gradeDraftFor(a.view, r.personId, itemId(a), a.who);
    var qs = questionRows(a, preview(a, r));
    var marks = qs.map(function (x) { return "Question " + x.q + ": " + x.mark; }).join("; ");
    var notes = qs.filter(function (x) { return x.note; }).length;
    var comments = notes ? notes + (notes === 1 ? " question comment" : " question comments") : "";
    var parts = [d && d.total ? P.score(d.total.score, d.total.max) : "", marks, comments, d && d.overall_comment ? "overall comment" : ""];
    return { label: P.personName(a, r.personId), value: parts.filter(Boolean).join(" · ") || "Reviewed" };
  }

  function dialog(a, rows) {
    var names = rows.included.map(function (r) { return P.personName(a, r.personId); });
    var held = rows.held.map(function (r) { return P.personName(a, r.personId); });
    var summary = rows.included.map(function (r) { return dialogSummary(a, r); });
    var rowsKv = [{ label: "Recipients", value: names.length + ": " + names.join(", ") }].concat(held.length ? [{ label: "Held back", value: held.join(", ") }] : [])
      .concat(summary).concat([{ label: "Fingerprint", value: fingerprints(a, rows).join(", ") }]);
    return a.K.dialog(a.ctx, {
      id: P.id(a, "release"), title: "Release this exact snapshot", open: a.variant === "confirm", cancelLabel: "Return without applying changes",
      body: a.K.kv(rowsKv) + P.p("Graded is not released. Delivery is separate"),
      actions: [{ id: P.id(a, "release-go"), label: "Release reviewed snapshot", kind: "primary", go: a.selection ? WB.Teaching.go(a, "W53~" + (itemId(a) === "math-assignment" ? "math_released" : "ps4_released"), { learnerId: null, receiptId: null }) : "W53~ps4_released" }],
    });
  }

  function control(a, rows) {
    var reason = blockReason(a, rows);
    var ack = !reason && ACKED.indexOf(a.variant) >= 0;
    var box = rows.included.length ? a.K.field({
      // SPINE-08: the box only shows the variant; the links below switch between unacknowledged and acknowledged.
      id: P.id(a, "ack"), type: "checkbox", checked: ack, disabled: true, reason: reason || "Use the link below to change this",
      label: "I have checked this exact preview (fingerprint " + fingerprints(a, rows).join(", ") + ")",
    }) : "";
    if (reason) return { html: P.stack(a, [box, a.K.button({ label: "Release reviewed results", disabled: true, reason: reason, id: P.id(a, "release-btn") })]), dialog: null };
    if (!ack) {
      var off = a.K.button({ label: "Release reviewed results", disabled: true, reason: "Acknowledge the exact preview first", id: P.id(a, "release-btn") });
      return { html: P.stack(a, [box, off, P.links(a, [{ label: "I have checked it", go: "W53:acknowledged" }])]), dialog: null };
    }
    var opener = a.K.button({ label: "Release reviewed results", kind: "primary", act: "open-dialog", target: P.id(a, "release") });
    var undo = P.links(a, [{ label: "Not checked yet", go: "W53" }]);
    return { html: P.stack(a, [box, opener, undo]), dialog: dialog(a, rows) };
  }

  function successNotice(a) {
    if (a.state !== "success") return "";
    var latest = (a.sel.releasesFor(a.view, itemId(a), a.who) || []).slice(-1)[0];
    if (!latest) return "";
    var names = latest.entries.map(function (e) { return P.personName(a, e.person_id); }).join(", ");
    return a.K.notice({ tone: "success", title: "Version " + latest.version + " released", body: P.p("Released to " + names + " at " + P.when(a, latest.released_at) + ".") });
  }

  function topNotices(a) {
    if (a.state === "conflict") return staleNotice(a);
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]);
    return successNotice(a);
  }

  function instructorWeb(a, rows) {
    var c = control(a, rows);
    var previews = rows.included.map(function (r) { return previewBlock(a, r); });
    var main = P.stack(a, [topNotices(a), trail(a), scope(a, rows), heldBack(a, rows)].concat(previews).concat([history(a)]));
    return { body: a.K.rail(a.ctx, { main: main, rail: a.K.section({ title: "Release", body: c.html, level: 2 }), railLabel: "Release" }), dialog: c.dialog };
  }

  function instructorIpad(a, rows) {
    var off = a.K.button({ label: "Release reviewed results", disabled: true, reason: "Release from the web app", id: P.id(a, "release-btn") });
    var previews = rows.included.map(function (r) { return previewBlock(a, r); });
    return { body: P.stack(a, [topNotices(a), scope(a, rows), heldBack(a, rows)].concat(previews).concat([history(a), off])), dialog: null };
  }

  function keepHandoff(a) {
    var keep = [{ label: "Keep everything held", note: "Preview only: nothing changes in this prototype" }];
    return P.handoff(a, { title: "Open on a larger screen", protectiveActions: keep });
  }

  function instructorPhone(a, rows) {
    return { body: P.stack(a, [keepHandoff(a), topNotices(a), scope(a, rows), heldBack(a, rows), history(a)]), dialog: null };
  }

  function taView(a) {
    var rp = a.sel.reviewProgress(a.view, itemId(a), a.who);
    var text = rp ? P.p("You have reviewed " + rp.reviewed + " of " + rp.of) : "";
    return { body: P.stack(a, [P.bareHandoff(a), text, P.p(STEP), P.links(a, [{ label: "Grading queue", go: "W48" }])]), dialog: null };
  }

  function view(a) {
    // T5: an active TA with this task sees only their progress, whatever the token.
    if (a.role === "ta" && !P.taEnded(a) && !P.taTaskEnded(a, itemId(a)) && !P.taUnallocated(a, itemId(a))) return taView(a);
    var gate = P.staffGate(a, itemId(a));
    if (gate) return { body: gate, dialog: null };
    if (a.state === "loading") return { body: P.stack(a, [keepHandoff(a), P.loading(a, "the release preview")]), dialog: null };
    if (!a.sel.canRelease(a.view, a.who, a.who.courseId)) return { body: P.stack(a, [P.bareHandoff(a), P.permissionNotice(a)]), dialog: null };
    var rows = rowsOf(a);
    if (a.platform === "web") return instructorWeb(a, rows);
    return a.platform === "ipad" ? instructorIpad(a, rows) : instructorPhone(a, rows);
  }

  WB.definePage("W53", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "With nothing reviewed the release scope says Nothing ready; there is no separate first-use view" }),
    variants: { acknowledged: "Preview acknowledged: Release enabled", confirm: "Release dialog open" },
    render: function (a) {
      var it = a.sel.assessment(a.view, itemId(a));
      var v = view(a);
      var out = { title: "Release feedback: " + it.title, body: v.body };
      if (v.dialog) out.dialog = v.dialog;
      return P.shell(a, out, { page: "W53" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg6-grading/W54.js */
/* W54 Grade correction and regrade review (Phase 3, seg6-grading; decision 6.04). Instructor and TA, course-level.
   No review request record exists, so the page says so and shows, inline, the released Quiz 2 snapshot a request
   would concern (amendment A8: no W27 or W23 link). Every decision control is disabled with its reason; a
   correction stays held until released separately. A TA sees no learner, score or receipt. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "offline", "permissionUnavailable", "firstUseEmpty"];
  var NO_REQUEST = "There is no open request";

  function receiptOf(a) {
    var receipt = a.selection && a.selection.receiptId ? P.receiptById(a, a.selection.receiptId) : P.receiptById(a, a.sel.anchorFor("W27", "quiz2").record.id);
    return receipt && receipt.course_id === a.who.courseId && (!a.selection || !a.selection.assessmentId || a.selection.assessmentId === receipt.assessment_id) && (!a.selection || !a.selection.learnerId || a.selection.learnerId === receipt.owner_id) ? receipt : null;
  }

  function request(a) {
    return a.K.empty({ title: "No review request is on record at this point", body: P.p("A request starts from released feedback. The released result it would concern is shown below.") });
  }

  function evidence(a, rec) {
    var itemId = rec.assessment_id;
    var learner = rec.owner_id;
    var res = a.sel.resultFor(a.view, learner, itemId, a.who);
    if (!res || res.status === null) return a.K.notice({ tone: "info", title: "Feedback for this work has not been released, so no review can be requested" });
    var snaps = (a.sel.releasesFor(a.view, itemId, a.who) || []).filter(function (s) {
      return s.entries.some(function (e) { return e.person_id === learner; });
    });
    var rows = [
      { label: "Learner", value: P.personName(a, learner) },
      { label: "Assessment", value: a.sel.assessment(a.view, itemId).title },
      { label: "Receipt", value: rec.id },
    ];
    var last = snaps[snaps.length - 1];
    if (last) rows.push({ label: "Released snapshot", value: "Version " + last.version + " · " + P.when(a, last.released_at) });
    if (res.score !== null) rows.push({ label: "Released score", value: P.score(res.score, res.max) });
    if (res.comment) rows.push({ label: "Released comment", value: res.comment });
    if (snaps.length) rows.push({ label: "Earlier versions stay on record", value: snaps.map(function (s) { return "Version " + s.version; }).join(", ") });
    return a.K.section({ title: "Released result", body: a.K.kv(rows), level: 2 });
  }

  function decision(a) {
    var off = function (label, reason, key) { return a.K.button({ label: label, disabled: true, reason: reason, id: P.id(a, key) }); };
    return P.stack(a, [
      off("Start review", NO_REQUEST, "start"), off("Request typed clarification", NO_REQUEST, "clarify"),
      off("Save correction as held", NO_REQUEST, "hold"), off("Decline with reason", NO_REQUEST, "decline"),
      off("Release approved correction", "No completed held correction", "release"),
      P.p("A correction stays held until it is released separately"),
    ]);
  }

  // Record-true course links: the release and queue pages open the problem-set record they are labelled with.
  function links(a) {
    var id = a.selection ? P.assessmentId(a) : a.sel.anchorFor("W53").record.id;
    var title = a.sel.assessment(a.view, id).title;
    var release = a.selection ? WB.Teaching.go(a, "W53", { assessmentId: id, learnerId: null, receiptId: null }) : P.recordGo("W53", "assessment", id);
    var queue = a.selection ? WB.Teaching.go(a, "W48", { assessmentId: id, learnerId: null, receiptId: null }) : P.recordGo("W48", "assessment", id);
    return P.links(a, [
      release ? { label: "Release feedback: " + title, go: release } : null,
      { label: "Gradebook", go: "W51" }, queue ? { label: "Grading queue: " + title, go: queue } : null,
    ]);
  }

  function top(a) { return a.state === "offline" ? P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]) : ""; }

  // R06: a review-tier protective action follows the same blocking states as the web controls.
  function guarded(a, action, key, reasons) {
    var reason = Object.prototype.hasOwnProperty.call(reasons, a.state) ? reasons[a.state] : "";
    return reason ? { label: action.label, disabled: true, reason: reason, id: P.id(a, key) } : action;
  }
  function instructor(a, rec) {
    if (a.tier !== "full") {
      var keep = [guarded(a, { label: "Keep the current result as released", note: "Preview only: nothing is changed in this prototype" }, "keep", { offline: "You're offline" })];
      return P.stack(a, [P.handoff(a, { title: "Open on a larger screen", protectiveActions: keep }), top(a), request(a), evidence(a, rec), links(a)]);
    }
    var main = P.stack(a, [top(a), request(a), evidence(a, rec), links(a)]);
    return a.K.rail(a.ctx, { main: main, rail: decision(a), railLabel: "Decision" });
  }

  // R01: the frame role alone is not membership; the viewer must hold that role in the course.
  function member(a) { return a.sel.verifiedRole(a.view, a.who, a.who.courseId) === a.role; }
  function denied(a) { return P.stack(a, [P.bareHandoff(a), P.permissionNotice(a, "You are not teaching this course")]); }
  function body(a) {
    if (P.taEnded(a)) return P.stack(a, [P.bareHandoff(a), P.taEndedNotice(a, null)]);
    if (a.state === "permissionUnavailable") return P.stack(a, [P.bareHandoff(a), P.permissionNotice(a, a.role === "instructor" ? "You are not teaching this course" : null)]);
    if (!member(a)) return denied(a);
    var rec = receiptOf(a);
    if (a.role === "ta") return P.stack(a, [P.bareHandoff(a), rec ? "" : P.unallocatedNotice(a), P.p("Only the instructor decides a correction")]);
    if (a.state === "loading") return P.stack(a, [P.bareHandoff(a), P.loading(a, "review requests")]);
    if (!rec) return P.stack(a, [P.bareHandoff(a), request(a), links(a)]);
    return instructor(a, rec);
  }

  WB.definePage("W54", {
    states: STATES,
    na: P.na(STATES, {
      invalid: "No review request is on record, so no decision can be typed or saved", saving: "No review request is on record, so no decision can be typed or saved",
      saveFailed: "No review request is on record, so no decision can be typed or saved", conflict: "No review request is on record, so no decision can be typed or saved",
      success: "No decision can be recorded without a request",
    }),
    render: function (a) { return P.shell(a, { title: a.page.title, body: body(a) }, { page: "W54" }); },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg6-grading/W57.js */
/* W57 Grading allocation and deadline planner (Phase 3, seg6-grading; decision 2.11). Instructor and TA. Anchor:
   the TA's problem-set grading task. The instructor sees every TA task with progress, learners, the staff grading
   due time beside the student due and close times, and a derived access check; the plan is preview only. A TA
   sees only their own tasks, each checked for active access first (amendment A6), and cannot edit deadlines. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "invalid", "offline", "permissionUnavailable", "firstUseEmpty"];
  var EARLY = "Access ends before grading is due";

  function instructorTasks(a) {
    var out = [];
    a.sel.enrolled(a.view, a.who.courseId, "ta").forEach(function (taId) {
      P.assessments(a).forEach(function (item) {
        var task = a.sel.gradingTaskFor(a.view, taId, item.id);
        if (task) out.push({ task: task, item: item });
      });
    });
    return out;
  }
  function ownTasks(a) {
    return P.assessments(a).map(function (item) {
      var access = a.sel.taTaskAccess(a.view, item.id, a.who);
      return access.task ? { task: access.task, item: item, active: access.active } : null;
    }).filter(Boolean);
  }
  function names(a, ids) { return ids.map(function (id) { return P.personName(a, id); }).join(", "); }
  function early(a, task) { return a.sel.isBefore(task.access_end, task.grading_due); }
  function questions(a, task) {
    var qs = a.sel.teachingTaskQuestions(a.view, a.who, task);
    return qs && qs.length ? P.questionsText(qs.map(function (q) { return q.id; })) : "Not listed for this task";
  }

  function progress(a, t) {
    var got = a.sel.receivedProgress(a.view, t.item.id, a.who);
    var done = a.sel.reviewProgress(a.view, t.item.id, a.who);
    return [got ? got.received + " of " + got.of + " received" : "", done ? done.reviewed + " of " + done.of + " reviewed" : ""].filter(Boolean).join(" · ");
  }

  function allocation(a, tasks) {
    var rows = tasks.map(function (t) {
      return {
        id: t.task.id, cells: {
          ta: esc(P.personName(a, t.task.ta_id)), item: esc(t.item.title),
          learners: esc(names(a, t.task.learner_ids)), questions: esc(questions(a, t.task)), end: esc(P.when(a, t.task.access_end)),
        },
      };
    });
    return a.K.table(a.ctx, {
      id: P.id(a, "allocation"), caption: "Allocation",
      columns: [
        { key: "ta", label: "Teaching assistant", primary: true }, { key: "item", label: "Assessment" },
        { key: "learners", label: "Learners" }, { key: "questions", label: "Questions" }, { key: "end", label: "Access ends" },
      ],
      rows: rows, empty: { title: "No grading tasks yet" },
    }) + a.K.section({ title: "Assessment-wide progress", level: 2, body: a.K.kv(tasks.filter(function (t, i) {
        return tasks.findIndex(function (other) { return other.item.id === t.item.id; }) === i;
      }).map(function (t) { return { label: t.item.title, value: progress(a, t) || "No progress available" }; })) });
  }

  function timeline(a, t) {

    late_quiz_start: "Late quiz start",

  function has(obj, key) {

  }

  function journey(jid) {
    return WB.manifest.journeys.filter(function (j) { return j.id === jid; })[0] || null;
  }

  // Looked up at call time from the manifest, so route.js does not depend on tours.js load order.
  function tourStep(jid, k) {
    var tours = WB.viewer.tours;
    if (tours && typeof tours.step === "function") return tours.step(jid, k);
    var j = journey(jid);
    return j && k >= 1 && k <= j.steps.length ? j.steps[k - 1] : null;

  function normalize(WBx, vs) {
    var W = WBx || WB;
    var notes = [];
    var page = isPage(W, vs.page) ? W.manifest.pagesById[vs.page] : null;
    var next = merge(vs, {});
    if (next.selection && ["W05", "W06", "W07", "W08", "W09", "W10", "W11", "W12"].indexOf(next.page) >= 0) next.selection = null;
    if (page && page.optional && !next.opt) next.opt = true;
    if (next.j) {
      var step = tourStep(next.j, next.k);
      if (!step || step.page !== next.page || step.role !== next.role) {
        next.j = null;
        next.k = null;
        notes.push(TOUR_ENDED);
      }
    } else {
      next.k = null;
    }
    return { vs: Object.freeze(next), notes: notes };
  }

  var CHOICES = {
    p: ["platform", ["web", "ipad", "iphone"], "platform"],
    w: ["width", ["regular", "narrow"], "web width"],
    o: ["orientation", ["landscape", "portrait"], "iPad orientation"],
    r: ["role", ["student", "instructor", "ta", "guest"], "role"],
    a: ["appearance", ["system", "light", "dark"], "appearance"],
    x: ["text", ["default", "larger"], "text size"],
  };

  function readParam(acc, key, value) {
    if (key === "v") return acc;
    var selectionKeys = { tc: "courseId", ta: "assessmentId", tl: "learnerId", tr: "receiptId" };
    if (has(selectionKeys, key)) {
      var selection = merge(acc.vs.selection || {}, {});
      selection[selectionKeys[key]] = value;
      return withSet(acc, "selection", Object.freeze(selection));
    }
    var c = has(CHOICES, key) ? CHOICES[key] : null;
    if (c) {
      if (c[1].indexOf(value) < 0) return withNote(acc, "Unknown " + c[2] + " in link");
      return withSet(acc, c[0], value);
    }
    if (key === "c") return WB.sel.scenarioIds().indexOf(value) >= 0 ? withSet(acc, "scenario", value) : withNote(acc, "Unknown scenario in link");
    if (key === "opt") return value === "1" || value === "0" ? withSet(acc, "opt", value === "1") : withNote(acc, "Unknown optional-pages setting in link");
    if (key === "j") return journey(value) ? withSet(acc, "j", value) : withNote(acc, "Unknown journey in link");
    if (key === "k") return /^[1-9]\d{0,2}$/.test(value) ? withSet(acc, "k", Number(value)) : withNote(acc, "Unknown tour step in link");

  function safeDecode(s) {

  }

  function readQuery(start, query) {
    return query.split("&").filter(Boolean).reduce(function (acc, part) {
      var eq = part.indexOf("=");
      var key = eq < 0 ? part : part.slice(0, eq);
      return readParam(acc, safeDecode(key), safeDecode(eq < 0 ? "" : part.slice(eq + 1)));
    }, { vs: start, notes: [] });
  }

  // "<page>[:<token>][~<scenario>]". The scenario suffix (Phase 2 gate M10) is split off first; an unknown
  // one adds a note and leaves the scenario unset (the current one is kept).
  function readScenario(path) {
    var tilde = path.lastIndexOf("~");
    if (tilde < 0) return { path: path, scenario: null, notes: [] };
    var id = safeDecode(path.slice(tilde + 1));
    var known = WB.sel.scenarioIds().indexOf(id) >= 0;
    return { path: path.slice(0, tilde), scenario: known ? id : null, notes: known ? [] : ["Unknown scenario in link"] };
  }

  function readPath(raw) {
    var sc = readScenario(raw);
    var path = sc.path;
    var colon = path.indexOf(":");
    var pageId = safeDecode(colon < 0 ? path : path.slice(0, colon));
    var token = colon < 0 ? null : safeDecode(path.slice(colon + 1));
    if (!isPage(WB, pageId)) return { page: DEFAULTS.page, token: null, scenario: sc.scenario, notes: sc.notes.concat(["Unknown page in link"]) };
    if (token !== null && !TOKEN.test(token)) return { page: pageId, token: null, scenario: sc.scenario, notes: sc.notes.concat(["Unknown view in link"]) };
    return { page: pageId, token: token, scenario: sc.scenario, notes: sc.notes };
  }

  // Returns {vs, notes, bare} or null for a hash that does not start with "#/".
  function parseHash(hash, opts) {
    if (typeof hash !== "string" || hash.indexOf("#/") !== 0) return null;
    var body = hash.slice(2);
    var q = body.indexOf("?");
    var contextual = q >= 0 && body.slice(q + 1).split("&").every(function (x) { return /^(tc|ta|tl|tr)=/.test(x); });
    var bare = q < 0 || contextual;
    var p = readPath(q < 0 ? body : body.slice(0, q));
    var current = opts && opts.current;
    var set = p.scenario ? { page: p.page, token: p.token, scenario: p.scenario } : { page: p.page, token: p.token };
    // A complete hash reads its query after the path, so its c= parameter wins over a ~scenario suffix.
    var read = contextual ? readQuery(merge(current || DEFAULTS, merge(set, { selection: {} })), body.slice(q + 1)) : bare
      ? { vs: merge(current || DEFAULTS, set), notes: [] }
      : readQuery(merge(DEFAULTS, set), body.slice(q + 1));
    var n = normalize(WB, read.vs);
    return { vs: n.vs, notes: p.notes.concat(read.notes, n.notes), bare: bare };
  }

  function formatHash(vs) {
    var parts = ["v=1"];
    if (vs.platform !== "web") parts.push("p=" + vs.platform);
    if (vs.width === "narrow") parts.push("w=narrow");
    if (vs.orientation === "portrait") parts.push("o=portrait");
    if (vs.role !== "student") parts.push("r=" + vs.role);
    if (vs.scenario !== "default") parts.push("c=" + encodeURIComponent(vs.scenario));
    if (vs.appearance !== "system") parts.push("a=" + vs.appearance);
    if (vs.text === "larger") parts.push("x=larger");
    if (vs.opt) parts.push("opt=1");
    var fields = { courseId: "tc", assessmentId: "ta", learnerId: "tl", receiptId: "tr" };
    Object.keys(fields).forEach(function (key) { if (vs.selection && vs.selection[key] !== undefined && vs.selection[key] !== null) parts.push(fields[key] + "=" + encodeURIComponent(vs.selection[key])); });
    if (vs.j) parts.push("j=" + vs.j, "k=" + vs.k);

  }

    return {
      platform: vs.platform,
      width: vs.platform === "web" ? vs.width : undefined,

  }

  // The shared link formatter for the board and the spec: always a complete, normalised hash.
  function prototypeHref(vs, file) {
    return (file || "Whiteboard-Final.html") + formatHash(normalize(WB, merge(DEFAULTS, vs)).vs);
  }

  function classifyToken(entry, token) {
    if (!token) return "none";
    if (entry.states.indexOf(token) >= 0) return "state";
    if (has(entry.variants, token)) return "variant";
    if (has(entry.na, token)) return "na";
    return "unknown";

  function isPlainClick(evt) {
    return Boolean(evt) && evt.button === 0 && !evt.metaKey && !evt.ctrlKey && !evt.shiftKey && !evt.altKey && !evt.defaultPrevented;
  }

  function shouldIntercept(evt, href) {
    return isPlainClick(evt) && typeof href === "string" && href.indexOf("#/") === 0;
  }

  function roleHome(role) {
    return role === "guest" ? "W01" : "W05";
  }

  function sidebarFocusTarget(ns, opening) {
    return ns + (opening ? "-sidebar-close" : "-sidebar-toggle");
  }

  V.DEFAULTS = DEFAULTS;
  V.SCENARIO_LABELS = SCENARIO_LABELS;
  V.TOUR_ENDED = TOUR_ENDED;
  V.has = has;
  V.isPage = isPage;
  V.merge = merge;
  V.normalize = normalize;
  V.parseHash = parseHash;
  V.formatHash = formatHash;

  V.prototypeHref = prototypeHref;

  V.roleHome = roleHome;
  V.sidebarFocusTarget = sidebarFocusTarget;

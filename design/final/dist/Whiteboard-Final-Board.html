<script>/* viewer/compose.js */
/* Whiteboard Phase 2c viewer: composes one device frame for a view state (team plan Step 4). Pure, no DOM.
   renderFrame resolves the page entry, the tier and the render context (inactive width or orientation is
   never passed), shows a role-blocked notice when the role switch does not fit the page, classifies the
   token, calls the page render with frozen arguments, validates its return and wraps it in K.shell. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var V = (WB.viewer = WB.viewer || {});
  var STAGE_NS = "p";
  var views = {};

  function fail(what) {
    throw new Error("WB.viewer.renderFrame: " + what);
  }

  function ctxFor(W, vs, tier) {
    var ac = V.activeContext(vs);
    var input = { platform: ac.platform, role: vs.role, tier: tier };
    if (ac.width !== undefined) input.width = ac.width;
    if (ac.orientation !== undefined) input.orientation = ac.orientation;
    return W.ctx(input);
  }

  // scenarioView deep-clones and projects the data, so each scenario is resolved once per WB.
  function viewFor(W, scenario) {
    if (!Object.prototype.hasOwnProperty.call(views, scenario)) {
      var next = V.merge(views, {});
      next[scenario] = W.sel.scenarioView(scenario);
      views = next;
    }
    return views[scenario];
  }

  function stateLabel(W, id) {
    var s = W.manifest.states.filter(function (x) { return x.id === id; })[0];
    return s ? s.label : id;
  }

  function roleList(W, roles) {
    return roles.map(function (r) { return W.ROLE_LABELS[r]; }).join(", ");
  }

  function blockedFrame(W, vs, page, ctx, ns) {
    var K = W.K;
    var home = V.roleHome(vs.role);
    var body =
      K.notice({
        tone: "info",
        title: W.ROLE_LABELS[vs.role] + " can't open this page",
        body: "<p>Prototype role switch: this page is for " + W.esc(roleList(W, page.roles)) + ".</p>",
      }) +
      "<p>" + K.link({ label: "Go to " + W.manifest.pagesById[home].title, go: home }) + "</p>";
    var opts = vs.role === "guest"
      ? { ns: ns, mode: "access", title: page.title, body: body }
      : { ns: ns, title: page.title, body: body, hrefs: W.manifest.navigation.hrefs, navActive: null };
    return K.shell(ctx, opts);
  }

  function tokenArgs(W, entry, token) {
    var kind = V.classifyToken(entry, token);
    if (kind === "state") return { state: token, variant: null, notes: [] };
    if (kind === "variant") return { state: null, variant: token, notes: [] };
    if (kind === "na") return { state: null, variant: null, notes: [stateLabel(W, token) + " does not apply here: " + entry.na[token]] };
    if (kind === "unknown") return { state: null, variant: null, notes: ["Unknown view"] };
    return { state: null, variant: null, notes: [] };
  }

  function checkResult(r, tier) {
    if (!r || typeof r !== "object" || Array.isArray(r) || Object.prototype.toString.call(r) !== "[object Object]") fail("render must return a plain object");
    if (typeof r.title !== "string" || typeof r.body !== "string") fail("render must return string title and body");
    if (Object.prototype.hasOwnProperty.call(r, "ns") || Object.prototype.hasOwnProperty.call(r, "hrefs")) fail("render must not return ns or hrefs");
    if (tier !== "full" && r.body.indexOf("wb-handoff--" + tier) < 0) fail("the " + tier + " tier body must include K.handoff");
    return r;
  }

  function renderFrame(W, vs, opts) {
    var ns = (opts && opts.ns) || STAGE_NS;
    var entry = W.pageFor(vs.page);
    var page = entry.page;
    var tier = page.platforms[vs.platform];
    var ctx = ctxFor(W, vs, tier);
    var base = { title: page.title, pageId: page.id, tier: tier };
    if (page.roles.indexOf(vs.role) < 0) {
      var blocked = blockedFrame(W, vs, page, ctx, ns);
      return Object.freeze(V.merge(base, { html: blocked, notes: [], openDialogs: [], blocked: true }));
    }
    var t = tokenArgs(W, entry, vs.token);
    var view = viewFor(W, vs.scenario);
    var selected = W.sel.resolveTeachingSelection(view, vs.role, vs.selection, vs.page, t.variant);
    if (selected && !selected.allowed) {
      var denied = W.P.stack({ K: W.K, ctx: ctx }, [tier === "full" ? "" : W.K.handoff(ctx, { title: "Open on a larger screen" }), W.K.notice({ tone: "info", title: "This record is not available in your course or grading scope" })]);
      return Object.freeze(V.merge(base, { title: "Record unavailable", html: W.K.shell(ctx, { ns: ns, title: "Record unavailable", body: denied, hrefs: W.manifest.navigation.hrefs }), notes: t.notes, openDialogs: [], blocked: false }));
    }
    var args = Object.freeze({
      page: page, ctx: ctx, platform: ctx.platform, sizeClass: ctx.sizeClass, orientation: ctx.orientation, tier: tier,
      role: vs.role, state: t.state, variant: t.variant, scenario: vs.scenario, view: view, who: selected ? selected.who : W.sel.viewerFor(view, vs.role),
      selection: selected ? selected.selection : null,
      sel: W.sel, K: W.K, WB: W, ns: ns + "-c",
      calendar: opts && opts.calendar ? opts.calendar : null,
    });
    var r = checkResult(entry.render(args), tier);
    var html = W.Teaching.contextHTML(args, W.K.shell(ctx, V.merge(r, { ns: ns, hrefs: W.manifest.navigation.hrefs })));
    return Object.freeze(V.merge(base, { title: r.title, html: html, notes: t.notes, openDialogs: V.openDialogIds(html), blocked: false }));
  }

  // 16 rows for the situations menu: applicable states, or the N/A reason.
  function stateOptions(entry) {
    return WB.manifest.states.map(function (s) {
      var applicable = entry.states.indexOf(s.id) >= 0;
      return { id: s.id, label: s.label, applicable: applicable, reason: applicable ? "" : entry.na[s.id] };
    });
  }

  V.STAGE_NS = STAGE_NS;
  V.renderFrame = renderFrame;
  V.stateOptions = stateOptions;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* viewer/tours.js */
/* Whiteboard Phase 2c viewer: guided tours over the twelve journeys J01–J12 (team plan Step 4, R8).
   Pure, no DOM. A tour step fixes the page and the role; the panel is "" when no tour is active. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var V = (WB.viewer = WB.viewer || {});
  var esc = WB.esc;

  function list() {
    return WB.manifest.journeys;
  }

  function find(jid) {
    return list().filter(function (j) { return j.id === jid; })[0] || null;
  }

  function step(jid, k) {
    var j = find(jid);
    if (!j || typeof k !== "number" || k % 1 !== 0 || k < 1 || k > j.steps.length) return null;
    return j.steps[k - 1];
  }

  // The view for step k: the step's page, role, scenario and token (a variant or null), other settings kept.
  function viewFor(jid, k, vs) {
    var s = step(jid, k);
    if (!s) return null;
    var page = WB.manifest.pagesById[s.page];
    return Object.freeze(V.merge(vs, { page: s.page, role: s.role, scenario: s.scenario, token: s.token || null, j: jid, k: k, opt: Boolean(vs.opt || page.optional) }));
  }

  function button(act, label, reason) {
    var id = "v-" + act;
    var attrs = WB.attrs({ type: "button", class: "wb-btn wb-btn--secondary", "data-v-act": act, disabled: Boolean(reason), "aria-describedby": reason ? id + "-reason" : null });
    var btn = "<button" + attrs + '><span class="wb-btn__label">' + esc(label) + "</span></button>";
    if (!reason) return btn;
    return '<span class="wb-btnwrap">' + btn + '<span class="wb-btn__reason" id="' + id + '-reason">' + esc(reason) + "</span></span>";
  }

  function panel(W, vs) {
    if (!vs || !vs.j) return "";
    var j = find(vs.j);
    var s = step(vs.j, vs.k);
    if (!j || !s) return "";
    var n = j.steps.length;
    var page = W.manifest.pagesById[s.page];
    var prev = vs.k > 1 ? j.steps[vs.k - 2] : null;
    var switched = prev && prev.role !== s.role
      ? '<p class="wb-tour__note">Role switched to ' + esc(W.ROLE_LABELS[s.role]) + " for this step</p>"
      : "";
    return (
      '<section class="wb-tour" aria-label="' + esc("Guided tour: " + j.id + " " + j.title) + '">' +
      '<h2 class="wb-tour__title" id="v-tour-title" tabindex="-1">' +
      esc("Step " + vs.k + " of " + n + " · " + page.id + " " + page.title + " · as " + W.ROLE_LABELS[s.role]) + "</h2>" +
      switched +
      '<div class="wb-tour__actions">' +
      button("tour-prev", "Previous", vs.k === 1 ? "First step" : null) +
      button("tour-next", "Next", vs.k === n ? "Last step" : null) +
      button("tour-end", "End tour", null) +
      "</div></section>"
    );
  }

  V.tours = Object.freeze({ list: list, step: step, viewFor: viewFor, panel: panel });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* viewer/bar.js */
/* Whiteboard Phase 2c viewer: the prototype bar (team plan Step 4, R2, R14). Pure, no DOM.
   barModel describes every state-dependent part of the bar; renderBar is built from it, and the DOM glue's
   syncBar applies the same model to the live controls, so a fresh render and a synced bar always agree.
   Every id is prefixed "v-". The journey select is a picker only: its value is the active tour, else the
   pending pick. A sync that shows the active tour discards the pending pick (journeyPick), so the displayed
   value is always the one "Start tour" dispatches. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var V = (WB.viewer = WB.viewer || {});
  var esc = WB.esc;
  var attrs = WB.attrs;

  var SEGMENT_LABELS = ["Segment 1 · Access and account", "Segment 2 · Home and course", "Segment 3 · Submit and results", "Segment 4 · Community and groups", "Segment 5 · Authoring", "Segment 6 · Grading and insights"];
  var OPTIONAL_LABEL = "Optional pages (off by default)";
  var PLATFORMS = [["web", "Web"], ["ipad", "iPad"], ["iphone", "iPhone"]];
  var WIDTHS = [["regular", "Regular 1280"], ["narrow", "Narrow 390"]];
  var ORIENTATIONS = [["landscape", "Landscape"], ["portrait", "Portrait"]];
  var APPEARANCES = [["system", "System"], ["light", "Light"], ["dark", "Dark"]];
  var TEXTS = [["default", "Default"], ["larger", "Larger"]];

  function option(value, label, selected, disabled) {
    return "<option" + attrs({ value: value, selected: Boolean(selected), disabled: Boolean(disabled) }) + ">" + esc(label) + "</option>";
  }

  function pageOptionsHtml(W, vs) {
    var groups = SEGMENT_LABELS.map(function (label, i) {
      var pages = W.manifest.pages.filter(function (p) { return !p.optional && p.segment === i + 1; });
      return { label: label, pages: pages };
    });
    if (vs.opt) groups.push({ label: OPTIONAL_LABEL, pages: W.manifest.pages.filter(function (p) { return p.optional; }) });
    return groups.map(function (g) {
      return '<optgroup label="' + esc(g.label) + '">' + g.pages.map(function (p) { return option(p.id, p.id + " · " + p.title, p.id === vs.page); }).join("") + "</optgroup>";
    }).join("");
  }

  // "Default", the 16 situations (N/A ones disabled with their reason) and the page's own views.
  function stateMenuHtml(entry, vs) {
    var token = vs && vs.token;
    var kind = V.classifyToken(entry, token);
    var current = kind === "state" || kind === "variant" ? token : "";
    var states = V.stateOptions(entry).map(function (s) {
      var label = s.applicable ? s.label : s.label + " (not applicable: " + s.reason + ")";
      return option(s.id, label, s.id === current, !s.applicable);
    }).join("");
    var variantIds = Object.keys(entry.variants);
    var variants = variantIds.length
      ? '<optgroup label="Page views">' + variantIds.map(function (v) { return option(v, entry.variants[v], v === current); }).join("") + "</optgroup>"
      : "";
    return option("", "Default", current === "") + '<optgroup label="Situations">' + states + "</optgroup>" + variants;
  }

  // The journey select's displayed value and the pending pick that survives this sync. An active tour wins
  // and clears the pick; otherwise the pick is shown and kept.
  function journeyPick(vs, pending) {
    if (vs.j) return { value: vs.j, pending: "" };
    var p = pending || "";
    return { value: p, pending: p };
  }

  function barModel(W, vs, opts) {
    var entry = W.pageFor(vs.page);
    var kind = V.classifyToken(entry, vs.token);
    var pick = journeyPick(vs, opts && opts.pendingJourney);
    return {
      values: {
        page: vs.page, platform: vs.platform, width: vs.width, orientation: vs.orientation, role: vs.role,
        scenario: vs.scenario, state: kind === "state" || kind === "variant" ? vs.token : "",
        appearance: vs.appearance, text: vs.text, opt: Boolean(vs.opt), journey: pick.value,
      },
      pendingJourney: pick.pending,
      hidden: { width: vs.platform !== "web", orientation: vs.platform !== "ipad" },
      pageOptionsHtml: pageOptionsHtml(W, vs),
      stateOptionsHtml: stateMenuHtml(entry, vs),
    };
  }

  function radios(id, legend, key, choices, value, hidden) {
    var items = choices.map(function (c) {
      var rid = id + "-" + c[0];
      return '<span class="wb-vbar__choice"><input' + attrs({ type: "radio", id: rid, name: id, value: c[0], "data-v-key": key, checked: c[0] === value }) + '><label for="' + rid + '">' + esc(c[1]) + "</label></span>";
    }).join("");
    return "<fieldset" + attrs({ class: "wb-vbar__group", id: id, hidden: Boolean(hidden) }) + "><legend>" + esc(legend) + "</legend>" + items + "</fieldset>";
  }

  function select(id, label, key, optionsHtml) {
    return '<div class="wb-vbar__field"><label for="' + id + '">' + esc(label) + "</label><select" + attrs({ id: id, class: "wb-vbar__select", "data-v-key": key }) + ">" + optionsHtml + "</select></div>";
  }

  function simpleOptions(pairs, value) {
    return pairs.map(function (p) { return option(p[0], p[1], p[0] === value); }).join("");
  }

  function scenarioOptions(W, value) {
    var clocks = W.data.scenarios.clocks;
    return W.sel.scenarioIds().map(function (id) { return option(id, V.SCENARIO_LABELS[id] + " · " + W.sel.fmtDateTime(clocks[id]), id === value); }).join("");
  }

  function journeyOptions(W, value) {

  }

  function renderBar(W, vs, opts) {

    var optBox = '<div class="wb-vbar__field wb-vbar__field--inline"><input' + attrs({ type: "checkbox", id: "v-opt", "data-v-key": "opt", checked: v.opt }) + '><label for="v-opt">Show optional pages</label></div>';
    var start = "<button" + attrs({ type: "button", class: "wb-btn wb-btn--secondary", "data-v-act": "tour-start" }) + '><span class="wb-btn__label">Start tour</span></button>';
    return (
      '<header class="wb-previewbar" aria-labelledby="v-bar-title"><div class="wb-previewbar__identity">' + '<span class="wb-previewbar__label">Fictional demo</span>' +
      '<h2 class="wb-sr" id="v-bar-title">Prototype controls · fictional data</h2></div>' +
      '<details class="wb-previewbar__settings" id="v-settings"><summary id="v-settings-toggle">' + W.K.icon("tool") + 'Preview settings</summary><div class="wb-previewbar__panel">' +
      select("v-page", "Page", "page", m.pageOptionsHtml) + optBox +
      radios("v-platform", "Platform", "platform", PLATFORMS, v.platform, false) +
      radios("v-width", "Web width", "width", WIDTHS, v.width, m.hidden.width) +
      radios("v-orient", "iPad orientation", "orientation", ORIENTATIONS, v.orientation, m.hidden.orientation) +
      select("v-role", "Role switch (not sign-in)", "role", simpleOptions(roles, v.role)) +
      select("v-scenario", "Scenario clock", "scenario", scenarioOptions(W, v.scenario)) +
      select("v-state", "Other situations", "state", m.stateOptionsHtml) +
      radios("v-appearance", "Appearance", "appearance", APPEARANCES, v.appearance, false) +
      radios("v-text", "Text size", "text", TEXTS, v.text, false) +
      '<div class="wb-vbar__field wb-vbar__field--tour">' + select("v-journey", "Journey", "journey", journeyOptions(W, v.journey)) + start + "</div>" +

  V.TEXTS = Object.freeze(TEXTS.slice());

  V.journeyPick = journeyPick;
  V.stateMenuHtml = stateMenuHtml;
  V.renderBar = renderBar;

<script>/* viewer/interact.js */
/* Whiteboard Phase 2c viewer: pure interaction rules for the DOM glue (team plan Step 4, R1–R4, R8, R9,
   R11, R13, R15). reduce() turns one action into the next view state plus history and focus instructions;
   every result passes through normalize. renderPlan() says which regions must re-render. activation()
   decides what a click on a stage control does, checking disabled controls first. No DOM. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var V = (WB.viewer = WB.viewer || {});

  var GENERIC_BLOCKED = "Not available right now. The reason is shown beside it.";
  var PREVIEW = "Preview only: this action does nothing in the prototype";
  var OPTIONAL_OFF = "Optional pages are off";
  var BAR_CHOICES = {
    platform: ["web", "ipad", "iphone"],
    width: ["regular", "narrow"],
    orientation: ["landscape", "portrait"],
    role: ["student", "instructor", "ta", "guest"],
    appearance: ["system", "light", "dark"],
    text: ["default", "larger"],
  };
  var CONTEXT_LABELS = { web: { regular: "Web", narrow: "Web narrow" }, ipad: { landscape: "iPad landscape", portrait: "iPad portrait" }, iphone: "iPhone" };

  function contextLabel(vs) {
    var ac = V.activeContext(vs);
    if (ac.platform === "web") return CONTEXT_LABELS.web[ac.width];
    if (ac.platform === "ipad") return CONTEXT_LABELS.ipad[ac.orientation];
    return CONTEXT_LABELS.iphone;
  }

  function statusLine(W, vs, notes) {
    var page = W.manifest.pagesById[vs.page];
    var parts = [page.id + " " + page.title, contextLabel(vs), W.ROLE_LABELS[vs.role], V.SCENARIO_LABELS[vs.scenario]];
    if (vs.token) parts.push(vs.token);
    return parts.concat(notes).join(" · ");
  }

  function finish(W, vs, history, focus, notes) {
    var n = V.normalize(W, vs);
    var all = notes.concat(n.notes);
    return Object.freeze({ vs: n.vs, history: history, focus: focus, status: statusLine(W, n.vs, all), notes: all });
  }

  function viewChanged(prev, next) {
    return !prev || prev.page !== next.page || prev.token !== next.token || JSON.stringify(prev.selection) !== JSON.stringify(next.selection);
  }

  function fromHash(W, vs, hash) {
    var p = V.parseHash(hash, { current: vs || undefined });
    if (!p) return null;
    return finish(W, p.vs, p.bare ? "replace" : "none", viewChanged(vs, p.vs) ? "h1" : "none", p.notes);
  }

  function fromLink(W, vs, href) {
    var p = V.parseHash(href, { current: vs || undefined });
    if (!p) return null;
    return finish(W, p.vs, "push", "h1", p.notes);
  }

  function barValue(W, vs, key, value) {
    if (key === "page") {
      if (!V.isPage(W, value)) throw new Error("WB.viewer.reduce: unknown page '" + value + "'");
      return { vs: V.merge(vs, { page: value, token: null, selection: null }), notes: [] };
    }
    if (key === "state") return { vs: V.merge(vs, { token: value ? String(value) : null }), notes: [] };
    if (key === "scenario") {
      if (W.sel.scenarioIds().indexOf(value) < 0) throw new Error("WB.viewer.reduce: unknown scenario '" + value + "'");
      return { vs: V.merge(vs, { scenario: value }), notes: [] };
    }
    if (key === "opt") return optValue(W, vs, value === true || value === "true" || value === "1");
    if (!V.has(BAR_CHOICES, key) || BAR_CHOICES[key].indexOf(value) < 0) throw new Error("WB.viewer.reduce: bad bar setting " + key + "='" + value + "'");
    var set = {};
    set[key] = value;
    if (key === "role") set.selection = null;
    return { vs: V.merge(vs, set), notes: [] };
  }

  function optValue(W, vs, on) {
    if (on || !W.manifest.pagesById[vs.page].optional) return { vs: V.merge(vs, { opt: on }), notes: [] };
    return { vs: V.merge(vs, { opt: false, page: V.roleHome(vs.role), token: null }), notes: [OPTIONAL_OFF] };
  }

  function fromTour(W, vs, op, jid) {
    if (op === "end") return finish(W, V.merge(vs, { j: null, k: null }), "replace", "journey", []);
    var target = op === "start" ? { jid: jid, k: 1 } : vs.j ? { jid: vs.j, k: vs.k + (op === "next" ? 1 : -1) } : null;
    var next = target && V.tours.viewFor(target.jid, target.k, V.merge(vs, { selection: null }));
    if (!next) return finish(W, vs, "none", "none", [op === "start" ? "Choose a journey first" : "No tour step there"]);
    var moved = vs.page !== next.page || vs.role !== next.role || vs.token !== next.token || vs.scenario !== next.scenario;
    return finish(W, next, "push", moved ? "h1" : "tour", []);
  }

  function reduce(W, vs, action) {
    var cur = vs || V.DEFAULTS;
    if (action.type === "hash") return fromHash(W, vs, action.hash);
    if (action.type === "link") return fromLink(W, cur, action.href);
    if (action.type === "bar") {
      var b = barValue(W, cur, action.key, action.value);
      return finish(W, b.vs, "replace", "control", b.notes);
    }
    if (action.type === "tour") return fromTour(W, cur, action.op, action.jid);
    if (action.type === "back") return finish(W, V.merge(cur, { token: null }), "push", "h1", []);
    throw new Error("WB.viewer.reduce: unknown action '" + action.type + "'");
  }

  function frameKey(vs) {
    var ac = V.activeContext(vs);
    return [vs.page, vs.token, vs.role, vs.scenario, ac.platform, ac.width, ac.orientation, JSON.stringify(vs.selection || null)].join("|");
  }

  function renderPlan(prev, next) {
    if (!prev) return Object.freeze({ frame: true, tour: true, theme: true });
    return Object.freeze({
      frame: frameKey(prev) !== frameKey(next),
      tour: [prev.j, prev.k, prev.page, prev.role].join("|") !== [next.j, next.k, next.page, next.role].join("|"),
      theme: prev.appearance !== next.appearance || prev.text !== next.text,
    });
  }

  var DOM_ACTS = ["open-dialog", "close-dialog", "toggle"];

  // Input: {tag, ariaDisabled, disabled, act, target, note, reasonText, href}. Disabled is checked first.
  function activation(a) {
    if (a.ariaDisabled === "true" || a.disabled === true) return { kind: "blocked", status: a.reasonText || a.note || GENERIC_BLOCKED };
    if (a.tag === "a") {
      var href = typeof a.href === "string" ? a.href : "";
      if (href.indexOf("#/") === 0) return { kind: "link" };
      if (href.charAt(0) === "#" && href.length > 1) return { kind: "in-page", target: href.slice(1) };
      return { kind: "native" };
    }
    if (DOM_ACTS.indexOf(a.act) >= 0) return { kind: a.act, target: a.target };
    if (a.act === "back") return { kind: "back" };
    if (a.tag === "button") return { kind: "preview", status: a.note || PREVIEW };
    return { kind: "native" };
  }

  function sortSelectOutcome(o) {
    return { status: o.note || PREVIEW, value: o.renderedValue };
  }

  // Ids of role="dialog" elements rendered without the hidden attribute (kit/adaptive.js K.dialog markup).
  function openDialogIds(html) {
    var out = [];
    var tags = String(html).match(/<div\b[^>]*\brole="dialog"[^>]*>/g) || [];
    tags.forEach(function (tag) {
      var id = /\bid="([^"]+)"/.exec(tag);
      if (id && !/\shidden(?=[\s>])/.test(tag)) out.push(id[1]);
    });
    return out;
  }

  function dialogFocusPlan(o) {
    var opener = o.opener;
    var returnTo = opener && opener.connected && opener.focusable ? "opener" : o.hasH1 ? "h1" : "stage";
    return { initial: "first-focusable", fallbackInitial: o.dialogId + "-title", returnTo: returnTo };
  }

  var DIALOG_MISSING = "This dialog is not drawn in the prototype yet.";

  // One modal at a time. Input: {currentId, currentOpener: {connected, focusable} | null, nextId, nextExists,
  // openerInsideCurrent}. Opening B over A hides A and its scrim first; B's return-focus opener is never an
  // element inside the hidden A: it is A's opener while valid, else none (closing then falls back to h1/stage).
  function modalTransition(o) {
    if (!o.nextExists) return { open: false, hide: [], returnOpener: "none", status: DIALOG_MISSING };
    var current = o.currentId || null;
    var hide = current && current !== o.nextId ? [current] : [];
    if (!current || !o.openerInsideCurrent) return { open: true, hide: hide, returnOpener: "new", status: "" };
    var co = o.currentOpener;
    var keep = co && co.connected && co.focusable ? "current" : "none";
    return { open: true, hide: hide, returnOpener: keep, status: "" };
  }

  function skipsTab(d) {
    return Boolean(d.hidden) || Boolean(d.disabled) || String(d.tabindex) === "-1";
  }

  function radioGroup(d) {
    return d.tag === "input" && d.type === "radio" && d.name ? d.name : null;
  }

  // The sequential Tab stops among focusable candidates, as indexes in document order. Input: a list of
  // {tag, type, name, checked, disabled, tabindex, hidden}. Hidden, disabled and tabindex=-1 entries are
  // skipped; radios sharing a name are one stop: the checked one, else the first. Positive tabindex is not
  // reordered (the kit emits none).
  function tabStops(list) {
    var groupStop = {};
    list.forEach(function (d, i) {
      var g = radioGroup(d);
      if (!g || skipsTab(d)) return;
      if (!V.has(groupStop, g) || (d.checked && !list[groupStop[g]].checked)) groupStop[g] = i;
    });
    var out = [];
    list.forEach(function (d, i) {
      if (skipsTab(d)) return;
      var g = radioGroup(d);
      if (!g || groupStop[g] === i) out.push(i);
    });
    return out;
  }

  // The dialog Tab trap at its boundaries. Input: the candidate list, the index of the focused element in it
  // (-1 when it is not a candidate), whether focus is inside the dialog, and Shift. A focused radio counts as
  // its group's stop. Returns {prevent, focus}: focus is a candidate index to move to, or -1.
  function trapStep(list, activeIndex, inside, shift) {
    var stops = tabStops(list);
    if (!stops.length) return { prevent: true, focus: -1 };
    var first = stops[0];
    var last = stops[stops.length - 1];
    if (!inside) return { prevent: true, focus: shift ? last : first };
    var at = activeIndex;
    var g = activeIndex >= 0 ? radioGroup(list[activeIndex]) : null;
    if (g) at = stops.filter(function (i) { return radioGroup(list[i]) === g; })[0];
    if (shift && at === first) return { prevent: true, focus: last };
    if (!shift && at === last) return { prevent: true, focus: first };
    return { prevent: false, focus: -1 };
  }

  // One menu at a time: opening B closes the tracked A; closing a menu that is not tracked keeps the tracked one.
  function menuToggle(openId, id, opening) {
    if (opening) return Object.freeze({ close: Object.freeze(openId && openId !== id ? [openId] : []), openId: id });
    return Object.freeze({ close: Object.freeze([]), openId: openId === id ? null : openId });
  }

  // The menu handler acts only on an Escape nobody handled, with no modal open and a tracked menu.
  function menuEscapes(o) {
    return o.key === "Escape" && !o.defaultPrevented && !o.modal && Boolean(o.openId);
  }

  V.tabStops = tabStops;
  V.trapStep = trapStep;
  V.menuToggle = menuToggle;
  V.menuEscapes = menuEscapes;
  V.GENERIC_BLOCKED = GENERIC_BLOCKED;
  V.modalTransition = modalTransition;
  V.PREVIEW = PREVIEW;
  V.statusLine = statusLine;
  V.reduce = reduce;
  V.renderPlan = renderPlan;
  V.activation = activation;
  V.sortSelectOutcome = sortSelectOutcome;
  V.openDialogIds = openDialogIds;
  V.dialogFocusPlan = dialogFocusPlan;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* viewer/board.js */
/* Whiteboard Phase 2c viewer: the board gallery (team plan Step 4, R10). Pure, no DOM.
   One section per page: metadata, role and situation selects, three scaled frames (web regular, iPad
   landscape, iPhone) and links that open the same view in the prototype in all five contexts. The figure and
   link containers are the only parts that change with the selects, and the selects sit outside them.
   Frames are inert and aria-hidden: the board is a visual overview read through its prototype links. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var V = (WB.viewer = WB.viewer || {});
  var esc = WB.esc;
  var attrs = WB.attrs;

  var LINK_CONTEXTS = [
    ["web-regular", "Open web in prototype", { platform: "web" }],
    ["web-narrow", "Open narrow web in prototype", { platform: "web", width: "narrow" }],
    ["ipad-landscape", "Open iPad in prototype", { platform: "ipad" }],
    ["ipad-portrait", "Open iPad portrait in prototype", { platform: "ipad", orientation: "portrait" }],
    ["iphone", "Open iPhone in prototype", { platform: "iphone" }],
  ];
  var FIGURES = [["web", "web-regular", "Web"], ["ipad", "ipad-landscape", "iPad landscape"], ["iphone", "iphone", "iPhone"]];
  var TIER_LABELS = { full: "Full", review: "Review and protect", handoff: "Handoff" };

  function viewOf(page, o, extra) {
    return V.merge({ page: page.id, token: o.token || null, role: o.role, opt: page.optional }, extra);
  }

  function boardLinks(W, pageId, o) {
    var page = W.manifest.pagesById[pageId];
    return Object.freeze(LINK_CONTEXTS.map(function (c) {
      return Object.freeze({ context: c[0], label: c[1], href: V.prototypeHref(viewOf(page, o, c[2])) });
    }));
  }

  function linkHtml(row) {
    return WB.K.link({ label: row.label, href: row.href });
  }

  function byContext(links, context) {
    return links.filter(function (l) { return l.context === context; })[0];
  }

  function figure(W, page, o, links, f) {
    var vs = V.merge(V.DEFAULTS, viewOf(page, o, { platform: f[0] }));
    var frame = V.renderFrame(W, V.normalize(W, vs).vs, { ns: "b-" + page.id + "-" + f[0] });
    return (
      '<figure class="wb-board__fig">' +
      '<div class="wb-board__viewport" data-platform="' + f[0] + '">' +
      '<div class="wb-board__frame" data-platform="' + f[0] + '" aria-hidden="true" inert>' + frame.html + "</div></div>" +
      '<figcaption class="wb-board__caption">' + esc(f[2] + " · " + TIER_LABELS[page.platforms[f[0]]]) + " · " + linkHtml(byContext(links, f[1])) + "</figcaption></figure>"
    );
  }

  function boardSectionParts(W, pageId, o) {
    var page = W.manifest.pagesById[pageId];
    var links = boardLinks(W, pageId, o);
    return {
      figuresHtml: FIGURES.map(function (f) { return figure(W, page, o, links, f); }).join(""),
      linksHtml: "Also: " + linkHtml(byContext(links, "web-narrow")) + " · " + linkHtml(byContext(links, "ipad-portrait")),
    };
  }

  function naList(W, entry) {
    var rows = V.stateOptions(entry).filter(function (s) { return !s.applicable; });
    if (!rows.length) return "<p>Every situation applies to this page.</p>";
    return '<ul class="wb-board__na">' + rows.map(function (s) { return "<li><strong>" + esc(s.label) + "</strong>: " + esc(s.reason) + "</li>"; }).join("") + "</ul>";
  }

  function meta(W, page, entry) {
    var K = W.K;
    var tiers = W.PLATFORMS.map(function (p) { return (p === "web" ? "Web" : p === "ipad" ? "iPad" : "iPhone") + " " + TIER_LABELS[page.platforms[p]]; }).join(" · ");
    var na = V.stateOptions(entry).filter(function (s) { return !s.applicable; }).length;
    return (
      '<div class="wb-board__meta">' +
      K.kv([{ label: "Roles", value: page.roles.map(function (r) { return W.ROLE_LABELS[r]; }).join(", ") }, { label: "Tier", value: tiers }, { label: "Route", value: page.route }]) +
      K.disclosure({ id: "board-" + page.id + "-na", summary: "Situations that do not apply (" + na + ")", body: naList(W, entry) }) +
      "</div>"
    );
  }

  function controls(W, page, entry, o) {
    var id = page.id;
    var roles = page.roles.map(function (r) { return "<option" + attrs({ value: r, selected: r === o.role }) + ">" + esc(W.ROLE_LABELS[r]) + "</option>"; }).join("");
    var sel = function (key, label, html) {
      var sid = "bd-" + id + "-" + key;
      return '<div class="wb-vbar__field"><label for="' + sid + '">' + esc(label) + "</label><select" + attrs({ id: sid, class: "wb-vbar__select", "data-board": id, "data-board-key": key }) + ">" + html + "</select></div>";
    };
    return '<div class="wb-board__controls">' + sel("role", "Role", roles) + sel("state", "Situation", V.stateMenuHtml(entry, { token: o.token || null })) + "</div>";
  }

  function boardSection(W, pageId, o) {
    var page = W.manifest.pagesById[pageId];
    var entry = W.pageFor(pageId);
    var parts = boardSectionParts(W, pageId, o);
    return (
      '<section class="wb-board__section" id="board-' + pageId + '" aria-labelledby="board-' + pageId + '-title">' +
      '<h2 class="wb-board__title" id="board-' + pageId + '-title">' + esc(pageId + " · " + page.title) + "</h2>" +
      meta(W, page, entry) + controls(W, page, entry, o) +
      '<div class="wb-board__figs" id="board-' + pageId + '-figures">' + parts.figuresHtml + "</div>" +
      '<p class="wb-board__links" id="board-' + pageId + '-links">' + parts.linksHtml + "</p></section>"
    );
  }

  function indexGroup(label, pages) {
    return (
      '<li class="wb-board__group"><h3>' + esc(label) + "</h3><ul>" +
      pages.map(function (p) { return '<li><a href="#board-' + p.id + '">' + esc(p.id + " · " + p.title) + "</a></li>"; }).join("") + "</ul></li>"
    );
  }

  function boardIndex(W) {
    var groups = V.SEGMENT_LABELS.map(function (label, i) {
      return indexGroup(label, W.manifest.pages.filter(function (p) { return !p.optional && p.segment === i + 1; }));
    });
    var optional = indexGroup(V.OPTIONAL_LABEL, W.manifest.pages.filter(function (p) { return p.optional; }));
    return '<nav class="wb-board__index" aria-labelledby="b-index-title"><h2 id="b-index-title">Pages</h2><ul>' + groups.join("") + optional + "</ul></nav>";
  }

  function boardRadios(id, legend, choices) {
    return (
      '<fieldset class="wb-vbar__group" id="' + id + '"><legend>' + esc(legend) + "</legend>" +
      choices.map(function (c, i) {
        var rid = id + "-" + c[0];
        return '<span class="wb-vbar__choice"><input' + attrs({ type: "radio", id: rid, name: id, value: c[0], checked: i === 0 }) + '><label for="' + rid + '">' + esc(c[1]) + "</label></span>";
      }).join("") + "</fieldset>"
    );
  }

  function boardBar() {
    return (
      '<header class="wb-vbar" aria-labelledby="b-bar-title"><h1 class="wb-vbar__title" id="b-bar-title">Prototype board · fictional data</h1>' +
      '<div class="wb-vbar__row">' + boardRadios("b-appearance", "Appearance", V.APPEARANCES) + boardRadios("b-text", "Text size", V.TEXTS) +
      '<p class="wb-vbar__note">Frames are pictures; use the links under each frame to open a page in the prototype.</p></div></header>'
    );
  }

  V.boardLinks = boardLinks;
  V.boardSectionParts = boardSectionParts;
  V.boardSection = boardSection;
  V.boardIndex = boardIndex;
  V.boardBar = boardBar;
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* viewer/gallery.js */
/* Whiteboard Phase 2c viewer: DOM glue for Whiteboard-Final-Board.html (team plan Step 5, R10).
   Renders the board bar, the index and one section per page into #b-root. A role or situation change in a
   section replaces only that section's figure and link containers, so its selects and focus stay put.
   Board frames are inert, so no dialog lifecycle is needed. Browser behaviour is unverified until Phase 6. */
(function (root) {
  "use strict";
  if (typeof document === "undefined") return;
  var WB = root.WB;
  var V = WB.viewer;
  var SECTION_SELECT = /^bd-([WO]\d\d)-(role|state)$/;

  function $(id) { return document.getElementById(id); }

  function errorNotice(err) {
    var text = err && err.message ? err.message : String(err);
    return WB.K.notice({ tone: "error", title: "This part of the board could not be drawn", body: "<p>" + WB.esc(text) + "</p>" });
  }

  function sectionHtml(page) {
    try {
      return V.boardSection(WB, page.id, { role: page.roles[0], token: null });
    } catch (err) {
      return '<section class="wb-board__section" id="board-' + page.id + '" aria-label="' + page.id + '">' + errorNotice(err) + "</section>";
    }
  }

  function refreshSection(pageId) {
    var role = $("bd-" + pageId + "-role").value;
    var token = $("bd-" + pageId + "-state").value || null;
    try {
      var parts = V.boardSectionParts(WB, pageId, { role: role, token: token });
      $("board-" + pageId + "-figures").innerHTML = parts.figuresHtml;
      $("board-" + pageId + "-links").innerHTML = parts.linksHtml;
    } catch (err) {
      $("board-" + pageId + "-figures").innerHTML = errorNotice(err);
    }
  }

  function applyTheme(name, value) {
    var html = document.documentElement;
    if (name === "b-appearance") {
      if (value === "system") html.removeAttribute("data-theme");
      else html.setAttribute("data-theme", value);
    } else if (name === "b-text") {
      if (value === "larger") html.setAttribute("data-text", "larger");
      else html.removeAttribute("data-text");
    }
  }

  function onChange(e) {
    var t = e.target;
    var m = SECTION_SELECT.exec(t.id || "");
    if (m) { refreshSection(m[1]); return; }
    if (t.type === "radio") applyTheme(t.name, t.value);
  }

  function start() {
    var rootEl = $("b-root");
    rootEl.innerHTML =
      V.boardBar() + '<main class="wb-board" id="b-main">' + V.boardIndex(WB) +
      WB.manifest.pages.map(sectionHtml).join("") + "</main>";
    rootEl.addEventListener("change", onChange);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
</body></html>

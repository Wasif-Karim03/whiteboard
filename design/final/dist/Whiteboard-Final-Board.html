  }

  function nextAction(a, it, draft, receipt) {
    if (it.submission_mode === "none") return a.K.notice({ tone: "info", title: "No hand-in required", body: P.p("Use this practice to prepare. It does not contribute to your course grade.") });
    var sfx = P.suffix(a);
    if (released(a, it) && !sfx) return a.K.actions(a.ctx, [{ label: "View feedback", go: "W23", kind: "primary" }]);
    if (receipt) return a.K.actions(a.ctx, [{ label: "View receipt", go: a.selection ? WB.Teaching.go(a, "W22", { assessmentId: it.id, receiptId: receipt.id, learnerId: null }) : P.recordGo("W22", "receipt", receipt.id) || "W22", kind: "primary" }]);
    if (P.closed(a, it)) {
      var view = draft ? { label: "View your draft", go: "W20" + sfx } : null;
      return P.stack(a, [P.closedButton(a, it, "submit"), P.links(a, [view, { label: "Ask for help with a closed assignment", go: "W12" }])]);
    }
    if (draft) return a.K.actions(a.ctx, [{ label: "Continue work", go: "W20" + sfx, kind: "primary" }, { label: "Review and submit", go: "W21" + sfx }]);
    if (!P.recordGo("W19", "assessment", it.id)) return a.K.button({ label: "Add work", disabled: true, reason: "A hand-in flow is not modeled for this assignment", id: P.id(a, "unmodeled-submit") });
    return a.K.actions(a.ctx, [{ label: "Add work", go: "W20" + sfx, kind: "primary" }]);
  }

  function groupPart(a, it) {
    var g = a.sel.groupFor(a.view, a.who.personId, it.group_set_id);
    if (!g) return { html: a.K.notice({ tone: "info", title: "You are not in a group for this assignment", body: P.p("Ask the instructor to add you to a group.") }), ok: false };
    var names = g.members.map(function (m) { return P.personName(a, m); }).filter(Boolean).join(", ");
    return { html: a.K.kv([{ label: "Group", value: g.name }, { label: "Members", value: names }]) + P.links(a, [{ label: "Group workspace", go: "W34" }]), ok: true };
  }

  function studentRail(a, it) {
    var draft = P.draftOf(a);
    var receipt = P.receiptOf(a);
    var group = P.suffix(a) ? groupPart(a, it) : { html: "", ok: true };
    var action = group.ok ? nextAction(a, it, draft, receipt) : "";
    return P.stack(a, [P.status(a, P.ownSubmission(a, it.id), true), group.html, action, trail(a, it, draft, receipt)]);
  }

  function staffRail(a, it) {
    if (P.taEnded(a)) return P.taEndedNotice(a, it.id);
    if (P.taTaskEnded(a, it.id)) return P.taTaskEndedNotice(a, it.id);
    if (P.taUnallocated(a, it.id)) return P.unallocatedNotice(a);
    if (a.role === "ta") {
      var access = a.sel.taTaskAccess(a.view, it.id, a.who);
      if (!access.active || !a.sel.taScope(a.view, it.id, a.who)) return P.unallocatedNotice(a);
    }
    var queue = a.role === "instructor" && a.selection ? WB.Teaching.go(a, "W48", { assessmentId: it.id, receiptId: null, learnerId: null }) : P.recordGo("W48", "assessment", it.id);
    var edit = a.role === "instructor" ? a.selection ? WB.Teaching.go(a, "W40", { assessmentId: it.id, receiptId: null, learnerId: null }) : P.recordGo("W40", "assessment", it.id) : null;
    return P.stack(a, [P.links(a, [edit ? { label: "Edit assignment", go: edit } : null, queue ? { label: "Grading queue", go: queue } : null]),
      queue ? "" : P.p("The grading queue for this assignment is not drawn in this prototype")]);
  }

  function content(a, it) {
    var rail = a.role === "student" ? studentRail(a, it) : staffRail(a, it);
    return P.stack(a, [facts(a, it, true), rail, mainPart(a, it)]);
  }

  function notYet(a, it) {
    var body = it.opens ? P.p("Opens " + P.when(a, it.opens) + ". You can read the facts now; adding work starts then.") : P.p("This assignment is not open yet.");
    var access = P.taEnded(a) ? P.taEndedNotice(a, it.id) : P.taTaskEnded(a, it.id) ? P.taTaskEndedNotice(a, it.id) : P.taUnallocated(a, it.id) ? P.unallocatedNotice(a) : "";
    return P.stack(a, [access, a.K.notice({ tone: "info", title: "This assignment opens later", body: body }), facts(a, it, true), mainPart(a, it)]);
  }

  function body(a, it) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "This assignment is not available for your course role");
    if (a.state === "loading") return P.stack(a, [P.taTaskEnded(a, it.id) ? P.taTaskEndedNotice(a, it.id) : "", P.loading(a, "the assignment")]);
    if (a.state === "notYetAvailable") return notYet(a, it);
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown"), content(a, it)]);
    return content(a, it);
  }

  WB.definePage("W19", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "An assignment page always has its assignment; an empty course is drawn on the coursework list" }),
    variants: { motion: WB.manifest.anchors.W19.variants.motion.label },
    render: function (a) {
      var it = item(a);
      var gate = P.publicationGate(a, it);
      if (gate) return gate;
      return P.shell(a, { title: it.title, body: body(a, it), crumbs: [{ label: "Coursework", go: "W18" }] }, { section: "coursework" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* pages/seg3-submit/W20.js */
/* W20 Add work (Phase 3 spine). Student only. Anchor: the persona's problem-set draft (manifest/anchors.js),
   variant motion (the group draft). The file tray, page tags and save status come from the draft; failure states come
   from WB.sel.failureSample. Nothing is sent from this page. File picking is preview-only (kit request 1). */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "invalid", "saving", "saveFailed", "offline", "deviceDenied"];

  function sample(a, id) { return a.sel.failureSample(a.view, id, a.who); }

  function tags(a, draft) {
    var rows = P.tagRows(draft.page_tags);
    return a.K.section({ title: "Pages and questions", body: rows.length ? a.K.kv(rows) : P.p("No pages tagged yet"), level: 2 });
  }

  function pickers(a, cameraDenied) {
    var choose = a.K.button({ label: "Choose files", note: "Preview only: no file picker in this prototype" });
    var photo = cameraDenied ? "" : a.K.button({ label: "Take photo", note: "Preview only: the camera is not used in this prototype" });
    return a.K.stack(a.ctx, { items: [choose, photo].filter(Boolean), gap: "sm" });
  }

  // The way on to W21, or a disabled control saying why not (closed first, then the state).
  function onward(a, it, blockReason) {
    var sfx = P.suffix(a);
    var back = { label: "Back to assignment", go: "W19" + sfx };
    if (P.closed(a, it)) return P.stack(a, [P.closedButton(a, it, "review"), P.links(a, [back])]);
    if (blockReason) {
      var off = a.K.button({ label: "Review and submit", disabled: true, reason: blockReason, id: P.id(a, "review") });
      return P.stack(a, [off, P.links(a, [back])]);
    }
    return a.K.section({ title: "Next", body: P.p("Nothing is handed in until you submit on the next page."), actions: [{ label: "Review and submit", go: "W21" + sfx, kind: "primary" }, back] });
  }

  function invalidNotice(a) {
    var s = sample(a, "unsupported-file");
    if (!s) return { html: P.permissionNotice(a), block: null };
    var body = P.p(s.file.name + " is a " + s.file.kind + " file. " + P.fileRuleText(s.rule)) + P.p("Your other files are kept.");
    return { html: a.K.notice({ tone: "error", title: "This file type cannot be handed in", body: body }), block: "Remove the unsupported file first" };
  }

  function saveFailed(a) {
    var s = sample(a, "upload-interrupted");
    if (!s) return { html: P.permissionNotice(a), block: null };
    var label = s.file.name + ": " + a.sel.fmtBytes(s.sent_bytes) + " of " + a.sel.fmtBytes(s.file.bytes) + " sent";
    var retry = a.K.button({ label: "Retry upload", note: "Preview only: nothing is uploaded in this prototype" });
    var body = a.K.progress({ label: label, value: s.sent_bytes, max: s.file.bytes }) + P.p("Your draft is kept. Nothing was handed in.") + retry;
    return { html: a.K.saveStatus("failed") + a.K.notice({ tone: "error", title: "The upload stopped", body: body }), block: "Finish or retry the upload first" };
  }

    var s = sample(a, "offline-draft");
    if (!s) return { html: P.permissionNotice(a), block: null };
    var files = s.pending_files + (s.pending_files === 1 ? " file waits" : " files wait") + " on this device.";
    var body = P.p("Saved on this device. Not synced, not handed in.") + P.p(files);
    return { html: a.K.saveStatus("savedLocal", { time: a.sel.fmtTime(s.queuedAt) }) + a.K.notice({ tone: "warning", title: "You're offline", body: body }), block: "Reconnect to review and submit" };
  }

  function stateTop(a, draft) {
    if (a.state === "invalid") return invalidNotice(a);
    if (a.state === "saveFailed") return saveFailed(a);
    if (a.state === "offline") return offline(a);
    if (a.state === "saving") return { html: a.K.saveStatus("saving") + P.p("Saving to your draft. The newest change is still on this device."), block: "Wait for the save to finish" };
    var saved = a.K.saveStatus("saved", { time: a.sel.fmtTime(draft.saved_at) });
    if (a.state === "deviceDenied") {
      var body = P.p("Camera access is off for this browser. You can still choose files.");
      return { html: saved + a.K.notice({ tone: "info", title: "Camera is not available", body: body }), block: null };
    }
    return { html: saved, block: null };
  }

  function content(a, it, draft) {
    var top = stateTop(a, draft);
    var tagged = [];
    (draft.page_tags || []).forEach(function (t) { tagged = tagged.concat(t.questions); });
    var missing = (it.questions || []).map(function (q) { return q.id; }).filter(function (id) { return tagged.indexOf(id) < 0; });
    var details = tags(a, draft);
    if (a.state !== "invalid" && !missing.length) details = a.K.disclosure({ id: P.id(a, "tag-details"), summary: "Pages and question tags", body: details });
    var gap = missing.length ? a.K.notice({ tone: "warning", title: "Some questions have no page", body: P.p(P.questionsText(missing) + " have no page yet.") }) : "";
    return P.stack(a, [top.html, gap, P.tray(a, draft, true), onward(a, it, top.block), pickers(a, a.state === "deviceDenied"), details]);
  }

  function body(a, it) {
    if (a.state === "loading") return P.loading(a, "your draft");

  }

  WB.definePage("W20", {
    states: STATES,
    na: P.na(STATES, {
      firstUseEmpty: "A new draft starts from the assignment page; this page always opens on one draft",
      conflict: "Draft edits from two devices are drawn on the review page, where the attempt is sent",
    }),
    variants: { motion: WB.manifest.anchors.W20.variants.motion.label },
    render: function (a) {
      var it = a.sel.assessment(a.view, P.assessmentId(a));
      var gate = P.publicationGate(a, it);
      if (gate) return gate;
      return P.shell(a, { title: "Add work: " + it.title, body: body(a, it), back: { label: "Assignment", go: "W19" + P.suffix(a) } }, { section: "coursework" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg3-submit/W21.js */
/* W21 Review and submit (Phase 3 spine). Student only; anchor and home as W20, variant motion. Submit is the
   committing action: unconfirmed by default (R11), an enabled dialog opener on the reviewed presentation
   variants, and the dialog drawn open on confirm. Closed, offline, conflict, saving and a coverage gap always win
   over the reviewed variants. The only link to the receipt sits inside the dialog. Contract: pages/SPINE.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "invalid", "saving", "conflict", "offline"];
  var REVIEWED = ["reviewed", "motion-reviewed", "confirm"];

  function isMotion(a) { return P.suffix(a) !== ""; }
  function reviewed(a) { return REVIEWED.indexOf(a.variant) >= 0; }

  function filesRows(a, draft) {
    return draft.files.map(function (f, i) { return { label: "File " + (i + 1), value: f.name + " · " + P.fileMeta(a, f) }; });
  }

  function payload(a, it, draft) {
    var rows = [{ label: "Assignment", value: it.title }, { label: "Attempt", value: String(draft.attempt) }]
      .concat(filesRows(a, draft))
      .concat([{ label: "Total pages", value: String(P.pageCount(draft.files)) }]);
    if (it.due) rows.push({ label: "Due", value: P.when(a, it.due) });
    if (draft.assessment_version !== undefined) rows.push({ label: "Assignment version", value: String(draft.assessment_version) });
    return rows;
  }

  function groupRows(a, draft) {
    if (!draft.captured_members) return [];
    var names = draft.captured_members.map(function (m) { return P.personName(a, m); }).filter(Boolean).join(", ");
    return [{ label: "Handed in for", value: names }, { label: "Group membership version", value: String(draft.membership_version) }];
  }

  // Questions with no tagged page; null when the assessment has no question list (R06).
  function gaps(it, draft) {
    if (!it.questions) return null;
    var tagged = [];
    (draft.page_tags || []).forEach(function (t) { tagged = tagged.concat(t.questions); });
    return it.questions.map(function (q) { return q.id; }).filter(function (q) { return tagged.indexOf(q) < 0; });
  }

  function coverage(a, it, draft) {
    var missing = gaps(it, draft);
    if (missing === null) return "";
    var tags = P.tagRows(draft.page_tags);
    var text = missing.length ? P.p(P.questionsText(missing) + " have no page yet.") : P.p("Every question has a page");
    var tone = missing.length && a.state === "invalid" ? a.K.notice({ tone: "error", title: "Some questions have no page", body: text }) : text;
    return a.K.section({ title: "Question coverage", body: tone + (tags.length ? a.K.kv(tags) : ""), level: 2 });
  }

  function blockReason(a, it, draft) {
    if (a.state === "offline") return "You're offline. Nothing has been sent";
    if (a.state === "conflict") {
      var s = a.sel.failureSample(a.view, "attempt-concurrent-submit", a.who);
      return s ? "Attempt " + s.attempt + " is already in" : "This attempt is already in";
    }
    if (a.state === "saving") return "Already sending";
    // SPINE-02: a coverage gap blocks Submit whatever the state token or variant.
    var missing = gaps(it, draft);
    return missing && missing.length ? "Add a page for " + P.questionsText(missing) + " first" : null;
  }

  function stateNotice(a) {
    if (a.state === "offline") return a.K.notice({ tone: "warning", title: "You're offline", body: P.p("Your draft is saved on this device. Nothing has been sent, and nothing is sent in the background.") });
    if (a.state === "saving") return a.K.notice({ tone: "info", title: "Sending. Not received yet", body: P.p("Your work counts as handed in only when a receipt is shown.") });
    if (a.state !== "conflict") return "";
    var s = a.sel.failureSample(a.view, "attempt-concurrent-submit", a.who);
    if (!s) return P.permissionNotice(a);
    return a.K.notice({
      tone: "warning", title: "This attempt was already accepted at " + P.when(a, s.acceptedAt) + " from another session",

  function dialog(a, it, draft) {

    return a.K.dialog(a.ctx, {

  // SPINE-13: while the submission is sending, Edit work and Cancel review are disabled with the reason.
  function navigation(a, sfx) {

    var reason = "Your submission is still sending";
    return a.K.stack(a.ctx, {
      items: [
        a.K.button({ label: "Edit work", disabled: true, reason: reason, id: P.id(a, "edit-work") }),
        a.K.button({ label: "Cancel review", disabled: true, reason: reason, id: P.id(a, "cancel-review") }),

      gap: "sm",
    });
  }

  function commit(a, it, draft) {

    var links = navigation(a, sfx);
    if (P.closed(a, it)) return { html: P.stack(a, [P.closedButton(a, it, "submit-btn"), links]), dialog: null };
    var reason = blockReason(a, it, draft);
    var ok = !reason && reviewed(a);
    // SPINE-08: the box only shows the variant; the links below switch between unreviewed and reviewed.
    var box = a.K.field({ id: P.id(a, "reviewed-box"), type: "checkbox", label: "I have reviewed this exact attempt", checked: ok, disabled: true, reason: reason || "Use the link below to change this" });
    if (reason) return { html: P.stack(a, [box, a.K.button({ label: "Submit attempt", disabled: true, reason: reason, id: P.id(a, "submit-btn") }), links]), dialog: null };
    if (!ok) {
      var off = a.K.button({ label: "Submit attempt", disabled: true, reason: "Confirm you have reviewed this exact attempt first", id: P.id(a, "submit-btn") });
      var go = isMotion(a) ? "W21:motion-reviewed" : "W21:reviewed";
      return { html: P.stack(a, [box, off, P.links(a, [{ label: "I have reviewed it", go: go }]), links]), dialog: null };
    }
    var opener = a.K.button({ label: "Submit attempt", kind: "primary", act: "open-dialog", target: P.id(a, "submit") });
    var undo = P.links(a, [{ label: "Not reviewed yet", go: "W21" + sfx }]);
    return { html: P.stack(a, [box, opener, undo, links]), dialog: dialog(a, it, draft) };
  }

  function content(a, it, draft) {
    var head = a.K.kv(payload(a, it, draft).concat(groupRows(a, draft)));
    var c = commit(a, it, draft);
    var main = P.stack(a, [stateNotice(a), head, P.tray(a, draft, false), coverage(a, it, draft)]);
    return { body: a.K.rail(a.ctx, { main: main, rail: a.K.section({ title: "Submit", body: c.html, level: 2 }), railLabel: "Submit" }), dialog: c.dialog };
  }

  function view(a, it) {
    if (a.state === "loading") return { body: P.loading(a, "your attempt"), dialog: null };
    var draft = P.draftOf(a);
    if (!draft) return { body: P.noDraft(a), dialog: null };
    return content(a, it, draft);
  }

  WB.definePage("W21", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "Review always starts from one draft; with no draft the page says so and links back" }),
    variants: {
      motion: WB.manifest.anchors.W21.variants.motion.label, reviewed: "Reviewed: Submit enabled", "motion-reviewed": "Group draft, reviewed",
      confirm: "Submit dialog open",
    },
    render: function (a) {
      var it = a.sel.assessment(a.view, P.assessmentId(a));

      if (a.state !== "saving") out.back = { label: "Add work", go: "W20" + P.suffix(a) };
      if (v.dialog) out.dialog = v.dialog;

    },
  });

</script>
<script>/* pages/seg3-submit/W22.js */
/* W22 Receipt (Phase 3 spine). Student only. Anchor: the persona's problem-set receipt; variant group (the group
   receipt at its own home clock). The receipt is read through receiptsFor at the current clock; when it is not
   there yet the page says so and shows no reference (rule R-truth). Contract: pages/SPINE.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "offline", "success", "permissionUnavailable"];

  function isGroup(a) { return a.variant === "group"; }
  function itemId(a) { return a.selection && a.selection.assessmentId ? a.selection.assessmentId : a.sel.anchorFor("W19", isGroup(a) ? "motion" : null).record.id; }

  function receipt(a) {
    if (a.selection && !a.selection.receiptId) return P.receiptOf(a);
    var anchor = a.sel.anchorFor("W22", isGroup(a) ? "group" : null);
    var id = a.selection && a.selection.receiptId ? a.selection.receiptId : anchor.record.id;
    return a.sel.receiptsFor(a.view, itemId(a), a.who).filter(function (r) { return r.id === id; })[0] || null;
  }

  function slip(a, it, r) {
    var course = a.sel.course(a.view, a.who.courseId);
    return a.K.receipt({
      ref: r.id, item: it.title, course: course.code, acceptedAt: a.sel.fmtDateTime(r.accepted_at), timeZone: a.sel.zoneAbbr(r.accepted_at),
      attempt: r.attempt, files: r.files.map(function (f) { return f.name; }), late: Boolean(r.late),
    });
  }

  function extras(a, r) {
    var rows = r.files.map(function (f) { return { label: f.name, value: P.fileMeta(a, f) }; });
    rows = rows.concat(P.tagRows(r.page_tags));
    if (r.assessment_version !== undefined) rows.push({ label: "Assignment version", value: String(r.assessment_version) });
    var actor = P.personName(a, r.actor_id);
    if (actor) rows.push({ label: "Handed in by", value: actor });
    if (r.captured_members) {
      rows.push({ label: "Handed in for", value: r.captured_members.map(function (m) { return P.personName(a, m); }).filter(Boolean).join(", ") });
      rows.push({ label: "Group membership version", value: String(r.membership_version) });
    }
    return a.K.kv(rows);
  }

  function links(a, it, receipt) {
    var res = isGroup(a) ? null : a.sel.resultFor(a.view, a.who.personId, it.id, a.who);
    var released = (a.sel.releasesFor(a.view, it.id, a.who) || []).slice().reverse().reduce(function (found, rel) {
      return found || rel.entries.filter(function (entry) { return entry.person_id === a.who.personId; })[0] || null;
    }, null);
    var sub = a.sel.submissionFor(a.view, a.who.personId, it.id);
    var matches = released && (released.receipt_id ? released.receipt_id === receipt.id : sub && sub.receipt_id === receipt.id);
    var out = res && res.status !== null && matches ? { label: "View feedback", go: a.selection ? WB.Teaching.go(a, "W23", { assessmentId: it.id, receiptId: receipt.id }) : "W23" } : null;
    return P.links(a, [{ label: "Back to the assignment", go: P.recordGo("W19", "assessment", it.id) || WB.Teaching.go(a, "W19", { assessmentId: it.id, receiptId: null }) }, out, { label: "Coursework", go: "W18" }]);
  }

  function present(a, it, r) {
    var top = a.state === "success"
      ? a.K.notice({ tone: "success", title: "Handed in", body: P.p("Receipt " + r.id + " was issued at " + P.when(a, r.accepted_at) + ".") })
      : a.state === "offline" ? P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown")]) : "";
    var main = P.stack(a, [top, slip(a, it, r), P.p("This receipt does not change")]);
    var rail = P.stack(a, [P.status(a, P.ownSubmission(a, it.id), true), extras(a, r), links(a, it, r)]);
    return a.K.rail(a.ctx, { main: main, rail: rail, railLabel: "Details" });
  }

  function absent(a, it) {
    var empty = a.K.empty({ title: "No confirmed receipt", body: P.p("Nothing has been handed in for this attempt yet.") });
    return P.stack(a, [empty, P.status(a, P.ownSubmission(a, it.id), true), P.offHome(a, "The receipt is issued later in the prototype")]);
  }

  function body(a, it) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "This receipt belongs to another person");
    if (a.state === "loading") return P.loading(a, "the receipt");
    var r = receipt(a);
    return r ? present(a, it, r) : absent(a, it);
  }

  WB.definePage("W22", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "A receipt page is about one receipt; without it the page says no receipt exists" }),
    variants: { group: WB.manifest.anchors.W22.variants.group.label },
    render: function (a) {
      var it = a.sel.assessment(a.view, itemId(a));
      var gate = P.publicationGate(a, it, receipt(a));
      if (gate) return gate;
      return P.shell(a, { title: "Receipt: " + it.title, body: body(a, it) }, { section: "coursework" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

<script>/* pages/seg3-submit/W23.js */
/* W23 Released feedback (Phase 3 spine). Student and instructor preview. Anchor: the first problem-set release.
   Only the released projection is drawn: resultFor status, score, comment and question comments, plus marks from
   the learner's entry in the latest release snapshot. Before release nothing about the result is shown. The page
   viewer is listed as text (kit request 2). Contract: pages/SPINE.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["loading", "offline", "permissionUnavailable"];

  function learner(a) { return a.role === "student" ? a.who.personId : P.learnerId(a); }
  function totalOpts(a) { return a.role === "instructor" ? { as: "learner" } : undefined; }

  // The learner's entry in the newest snapshot that holds one, with that snapshot's version.
  function snapshot(a, itemId, personId) {
    var list = a.sel.releasesFor(a.view, itemId, a.who) || [];
    var hit = null;
    list.forEach(function (rel) {
      var e = rel.entries.filter(function (x) { return x.person_id === personId; })[0];
      if (e) hit = { version: rel.version, entry: e };
    });
    return hit;
  }

  function questionTable(a, it, res, snap) {
    var rubric = a.sel.rubricFor(a.view, it.id, a.who);
    if (!rubric || !rubric.criteria) return "";
    var marks = snap && snap.entry.marks ? snap.entry.marks : {};
    var comments = res.questionComments || {};
    var rows = rubric.criteria.map(function (c) {
      var mark = Object.prototype.hasOwnProperty.call(marks, c.question_id) ? P.score(marks[c.question_id], c.max) : "";
      var note = Object.prototype.hasOwnProperty.call(comments, c.question_id) ? comments[c.question_id] : "";
      return { id: "q" + c.question_id, cells: { q: esc("Question " + c.question_id), title: esc(c.title), mark: esc(mark), note: esc(note) } };
    });
    var columns = [{ key: "q", label: "Question", primary: true }, { key: "title", label: "Criterion" }, { key: "mark", label: "Mark" }, { key: "note", label: "Comment" }];
    return a.K.table(a.ctx, { id: P.id(a, "questions"), caption: "Feedback by question", columns: columns, rows: rows, empty: { title: "No questions", body: P.p("This assignment has no question list.") } });
  }

  function pagesText(a, personId, it, snap) {
    var r = a.role === "student" && snap && snap.entry.receipt_id ? a.sel.receiptById(a.view, snap.entry.receipt_id, a.who) : null;
    if (!r) return "";
    var names = r.files.map(function (f) { return f.name + " (" + P.fileMeta(a, f) + ")"; }).join(", ");
    return P.p("Pages you handed in: " + names + ". The page viewer is not drawn in this prototype.");
  }

  function totalFigure(a, personId) {
    var t = a.sel.courseTotal(a.view, a.who.courseId, personId, a.who, totalOpts(a));
    return t && !t.empty ? a.K.figure({ label: "Course total", value: t.display, basis: "Released results only" }) : "";
  }

  function releasedView(a, it, res, personId) {
    var snap = snapshot(a, it.id, personId);
    if (a.selection && a.selection.receiptId && (!snap || snap.entry.receipt_id !== a.selection.receiptId)) return a.K.empty({ title: "No released feedback for this attempt" });
    var score = res.score === null || res.score === undefined ? a.K.status(res.status, a.ctx, { released: true, own: a.role === "student" }) : a.K.figure({ label: "Score", value: P.score(res.score, res.max), basis: "Released " + P.when(a, res.releasedAt) });
    var main = P.stack(a, [
      res.comment ? a.K.section({ title: "Overall comment", body: P.p(res.comment), level: 2 }) : "",
      questionTable(a, it, res, snap), snap ? P.p("Version " + snap.version) : "", pagesText(a, personId, it, snap),
    ]);
    var ask = a.role === "student" ? a.K.button({ label: "Ask about this feedback", note: "Preview only: no message is sent in this prototype" }) : "";
    var receiptGo = snap && snap.entry.receipt_id ? (a.selection ? WB.Teaching.go(a, "W22", { assessmentId: it.id, learnerId: personId, receiptId: snap.entry.receipt_id }) : P.recordGo("W22", "receipt", snap.entry.receipt_id)) : null;
    var back = a.role === "student" ? [receiptGo ? { label: "Receipt", go: receiptGo } : null, { label: "My grades", go: "W24" }] : [{ label: "Learner grades", go: "W24" }, { label: "Release feedback", go: "W53" }];
    var rail = P.stack(a, [score, totalFigure(a, personId), P.links(a, back), ask]);
    return a.K.rail(a.ctx, { main: main, rail: rail, railLabel: "Result" });
  }

  function heldView(a, it) {
    if (a.role === "instructor") {
      return a.K.empty({ title: "Nothing has been released for this assignment", body: P.p("The learner sees feedback only after it is released."), action: { label: "Release feedback", go: "W53" } });
    }
    var r = P.receiptOf(a);
    return P.stack(a, [
      P.status(a, P.ownSubmission(a, it.id), true), P.p("Feedback has not been released"),
      r ? P.links(a, [{ label: "View receipt", go: P.recordGo("W22", "receipt", r.id) || "W22" }]) : "",
      P.offHome(a, "Feedback is released later in the prototype"),
    ]);
  }

  function content(a, it) {
    var personId = learner(a);
    var res = a.sel.resultFor(a.view, personId, it.id, a.who);
    if (!res) return P.permissionNotice(a);
    var inner = res.status === null ? heldView(a, it) : releasedView(a, it, res, personId);
    if (a.role !== "instructor") return inner;
    return P.stack(a, [a.K.flag("preview"), P.p("Previewing as " + P.personName(a, personId)), inner]);
  }

  function body(a, it) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "This feedback belongs to another person");
    if (a.state === "loading") return P.loading(a, "your feedback");
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown"), content(a, it)]);
    return content(a, it);
  }

  WB.definePage("W23", {
    states: STATES,
    na: P.na(STATES, { firstUseEmpty: "Feedback is about one released result; before release the page says nothing is released" }),
    render: function (a) {
      var it = a.sel.assessment(a.view, P.assessmentId(a));
      var gate = P.publicationGate(a, it);
      if (gate) return gate;
      return P.shell(a, { title: "Feedback: " + it.title, body: body(a, it) }, { section: "coursework" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg3-submit/W24.js */
/* W24 Student course grades (Phase 3 spine). Student and instructor preview. Course total and category figures
   come from courseTotal and categoryPercent (instructor with {as: "learner"}); the table from gradeRows. Rows that
   are not released show the kit's not-released status and no score. Staff outcomes are never read here. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var esc = WB.esc;
  var STATES = ["firstUseEmpty", "loading", "offline", "permissionUnavailable"];

  function learner(a) { return a.role === "student" ? a.who.personId : P.learnerId(a); }
  function opts(a) { return a.role === "instructor" ? { as: "learner" } : undefined; }
  function categoryLabel(id) { return id.charAt(0).toUpperCase() + id.slice(1); }

  function categories(rows) {
    var out = [];
    rows.forEach(function (r) { if (out.indexOf(r.category) < 0) out.push(r.category); });
    return out;
  }

  function figures(a, personId, rows) {
    var total = a.sel.courseTotal(a.view, a.who.courseId, personId, a.who, opts(a));
    var items = [];
    categories(rows).forEach(function (c) {
      var v = a.sel.categoryPercent(a.view, a.who.courseId, personId, c, a.who, opts(a));
      items.push(v === null ? a.K.stat({ label: categoryLabel(c), value: "No released results" }) : a.K.figure({ label: categoryLabel(c), value: a.sel.pct(v), basis: "Released results only" }));
    });
    var figure = total && !total.empty ? a.K.figure({ label: "Course total", value: total.display, basis: "Released results only" }) : P.p("No released results yet");
    var breakdown = items.length ? a.K.grid(a.ctx, { items: items, cols: 4, compactCols: 2 }) : P.p("No categories yet");
    return { total: figure, breakdown: breakdown };
  }

  // The W19 anchor item → W23 only when released; a quiz with a W27 receipt anchor → W27; others plain (PAGES.md).
  function rowGo(a, row, personId) {
    if (a.role !== "student") return null;
    var item = a.sel.assessment(a.view, row.itemId);
    var sub = a.sel.submissionFor(a.view, personId, row.itemId);
    if (!a.selection) {
      if (P.recordGo("W19", "assessment", row.itemId) === "W19") return row.status !== null ? "W23" : null;
      var legacy = sub && sub.receipt_id ? P.recordGo("W27", "receipt", sub.receipt_id) : null;
      if (legacy) return legacy;
    }
    if (item && item.quiz_id) return sub && sub.receipt_id ? WB.Teaching.go(a, "W27", { assessmentId: item.id, learnerId: personId, receiptId: sub.receipt_id }) : null;
    return row.status !== null ? WB.Teaching.go(a, "W23", { assessmentId: row.itemId, learnerId: personId, receiptId: null }) : null;
  }

  function statusCell(a, row, personId) {
    if (a.role === "student") return P.status(a, P.ownSubmission(a, row.itemId), true);
    // Instructor preview: K.status is role-aware, so learner-only labels cannot be drawn for an instructor.
    // A row the learner cannot see yet says so in words; a released row shows its staff status.
    if (row.status === null) return esc("Learner sees: not released yet");
    var sub = a.sel.submissionFor(a.view, personId, row.itemId);
    return sub ? P.status(a, sub, false) : "";
  }

  function tableRow(a, row, personId) {
    var cells = {
      item: esc(row.title), category: esc(categoryLabel(row.category)),
      score: esc(row.status === null ? "" : P.score(row.score, row.max)), status: statusCell(a, row, personId),
    };
    var go = rowGo(a, row, personId);
    return go ? { id: row.itemId, cells: cells, go: go } : { id: row.itemId, cells: cells };
  }

  function table(a, rows, personId) {
    var columns = [{ key: "item", label: "Item", primary: true }, { key: "category", label: "Category" }, { key: "score", label: "Score" }, { key: "status", label: "Status" }];
    return a.K.table(a.ctx, {
      id: P.id(a, "grades"), caption: "Grade items", columns: columns,
      rows: rows.map(function (r) { return tableRow(a, r, personId); }),
      empty: { title: "No grade items yet", body: P.p("Items appear here when the instructor adds them.") },
    });
  }

  function lastRelease(a) {
    var at = a.sel.lastReleaseAt(a.view, a.who.courseId, a.who);
    return at ? P.p("Last release " + P.when(a, at)) : "";
  }

  function content(a) {
    var personId = learner(a);
    var rows = a.sel.gradeRows(a.view, a.who.courseId, personId, a.who);
    if (!rows) return P.permissionNotice(a);
    var published = P.assessments(a);
    rows = rows.filter(function (r) { return published.some(function (it) { return it.id === r.itemId; }); });
    var empty = a.state === "firstUseEmpty"
      ? a.K.notice({ tone: "info", title: "Empty categories", body: P.p("A category with no released results is left out of the total until something is released.") })
      : "";
    var head = a.role === "instructor" ? P.stack(a, [a.K.flag("preview"), P.p("Previewing as " + P.personName(a, personId))]) : "";
    var f = figures(a, personId, rows);
    return P.stack(a, [head, empty, f.total, table(a, rows, personId), lastRelease(a), a.K.disclosure({ id: P.id(a, "categories"), summary: "Category breakdown", body: f.breakdown })]);
  }

  function body(a) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, "These grades belong to another person");
    if (a.state === "loading") return P.loading(a, "grades");
    if (a.state === "offline") return P.stack(a, [P.offlineNotice(a), a.K.flag("lastKnown"), content(a)]);
    return content(a);
  }

  WB.definePage("W24", {
    states: STATES,
    na: P.na(STATES),
    render: function (a) { return P.shell(a, { title: a.page.title, body: body(a) }, { page: "W24" }); },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg3-submit/W25.js */
/* W25 Quiz rules/start (Phase 3 seg3-submit). Student, instructor and TA. Anchor: the quiz assessment, home
   default. Authority branches run first: staff see the published rules only (no learner attempt, allowance or
   receipt). The learner's branch follows the clock (not open, active attempt, received, closed, eligible).
   Start is the committing action: unacknowledged by default, an opener on acknowledged, the dialog open on
   confirm; its primary item is preview-only and a separate link shows an example attempt (amendment A2).
   Contract: pages/SPINE.md and pages/seg3-submit/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "offline", "notYetAvailable", "saveFailed", "conflict", "permissionUnavailable"];
  var ACKNOWLEDGED = ["acknowledged", "confirm"];
  // The scenario where the quiz is open and the learner has no attempt (guarded by tools/seg3-submit.test.mjs).
  var OPEN_CLOCK = "group_submission";
  var SELECTION = { latest: "Your latest attempt counts." };
  var RELEASE = { instructor: "Scores are shown after the instructor releases them." };
  var AI = { not_permitted: "AI tools are not permitted in this quiz." };
  var PREVIEW_NOTE = "Preview only: nothing starts in this prototype";

  function rule(map, key) { return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : ""; }
  function minutes(n) { return String(n) + (n === 1 ? " minute" : " minutes"); }
  function itemOf(a) { return a.sel.assessment(a.view, a.selection && a.selection.assessmentId || a.sel.anchorFor("W25").record.id); }
  function clockTime(a, iso) { return a.sel.fmtTime(iso) + " " + a.sel.zoneAbbr(iso); }

  function rulesRows(a, item, quiz) {
    var rows = [
      { label: "Questions", value: String(quiz.items.length) }, { label: "Points", value: String(item.max) },
      { label: "Question version", value: String(quiz.version) }, { label: "Opens", value: P.when(a, quiz.opens) },
      { label: "Closes", value: P.when(a, quiz.close) }, { label: "Attempts allowed", value: String(quiz.max_attempts) },
    ];
    [["Which attempt counts", rule(SELECTION, quiz.selection)], ["Scores", rule(RELEASE, quiz.release_rule)], ["AI tools", rule(AI, quiz.ai_policy)]]
      .forEach(function (r) { if (r[1]) rows.push({ label: r[0], value: r[1] }); });
    return rows;
  }

  function rulesSection(a, item, quiz, timing) {
    var body = a.K.kv(rulesRows(a, item, quiz)) + timing +
      P.p("Leaving the quiz window is never treated as evidence and never cancels an attempt.");
    return a.K.section({ title: "Rules", body: body });
  }

  // ---------- Learner timing (own id only; never the allowance basis, note or recorder) ----------
  function ownTiming(a, quiz) {
    var me = a.who.personId;
    var allowance = a.sel.allowanceFor(a.view, quiz.id, me);
    var rows = [{ label: "Your time", value: minutes(a.sel.effectiveMinutes(a.view, quiz.id, me)) }];
    if (allowance) {
      var extra = allowance.multiplier ? "× " + allowance.multiplier : "plus " + minutes(allowance.extra_minutes);
      rows.push({ label: "Extra time", value: minutes(quiz.minutes) + " " + extra });
    }
    rows.push({ label: "To get your full time, start by", value: clockTime(a, a.sel.lateStartThreshold(a.view, quiz.id, me)) });
    return (allowance ? a.K.flag("extension") : "") + a.K.kv(rows);
  }

  function publishedTiming(a, quiz) {
    var rows = [
      { label: "Time limit", value: minutes(quiz.minutes) },
      { label: "Full time without extra time if started by", value: clockTime(a, a.sel.lateStartThreshold(a.view, quiz.id, a.who.personId)) },
    ];
    return a.K.kv(rows) + P.p("Personal extra time is not shown in this preview.");
  }

  // ---------- Staff preview (published rules only) ----------
  function staff(a, item, quiz) {
    if (a.state === "permissionUnavailable") return P.permissionNotice(a, a.role === "instructor" ? "You are not teaching this course" : null);
    if (a.state === "loading") return P.loading(a, "the quiz rules");
    var rules = rulesSection(a, item, quiz, publishedTiming(a, quiz));
    if (P.taEnded(a)) return P.stack(a, [P.taEndedNotice(a, null), rules, P.links(a, [{ label: "Coursework", go: "W18" }])]);
    var top = a.K.notice({ tone: "info", title: "Staff preview of the learner rules", body: P.p("Learners see these rules before they start.") });
    var edit = a.role === "instructor" ? P.recordGo("W41", "assessment", item.id) : null;
    var side = a.role === "ta" ? P.p("Quiz timing, extra time and release are the instructor's step.") : "";
    return P.stack(a, [
      a.state === "offline" ? P.offlineNotice(a) : "", a.role === "instructor" ? a.K.flag("preview") : "", top, rules, side,
      P.links(a, [edit ? { label: "Edit quiz", go: edit } : null, { label: "Coursework", go: "W18" }]),
    ]);
  }

  // ---------- Learner Start ----------
  function startOff(a, reason) { return a.K.button({ label: "Start attempt", disabled: true, reason: reason, id: P.id(a, "start-btn") }); }

  function blockOf(a) {
    if (a.state === "offline") return { reason: "You're offline. A timed attempt cannot start", notice: P.offlineNotice(a) };
    if (a.state === "saveFailed") {
      return { reason: "Check before starting again", notice: a.K.notice({ tone: "warning", title: "We could not confirm whether your attempt started",
        body: P.p("Check for an active attempt before starting again."), actions: [{ label: "Check for an active attempt", note: "Preview only: nothing is checked in this prototype" }] }) };
    }
    if (a.state === "conflict") {
      return { reason: "Confirm the current timing first", notice: a.K.notice({ tone: "warning", title: "The quiz timing changed since you opened this page",
        body: P.p("Refresh the rules before you start."), actions: [{ label: "Refresh rules", note: "Preview only: nothing is refreshed in this prototype" }] }) };
    }
    return null;
  }

  function shortNotice(a, quiz, avail) {
    return a.K.notice({ tone: "warning", title: "Only " + minutes(avail) + " are left if you start now",
      body: P.p("The quiz closes at " + P.when(a, quiz.close) + ", so your attempt ends then.") });
  }

  function dialog(a, quiz, avail, full) {
    var rows = [
      { label: "Your time", value: minutes(full) }, { label: "Available if you start now", value: minutes(avail) },
      { label: "Hard close", value: P.when(a, quiz.close) }, { label: "Attempt", value: "1 of " + quiz.max_attempts },
    ];
    if (rule(AI, quiz.ai_policy)) rows.push({ label: "AI tools", value: rule(AI, quiz.ai_policy) });
    var body = (avail < full ? shortNotice(a, quiz, avail) : "") + a.K.kv(rows) +
      P.p("The timer keeps running if you leave or lose connection.") +
      P.p("Nothing starts in this prototype. The example attempt below is a separate record, not the result of this action.");
    return a.K.dialog(a.ctx, {
      id: P.id(a, "start"), title: "Start this attempt", open: a.variant === "confirm", body: body,
      actions: [{ id: P.id(a, "start-go"), label: "Start attempt now", kind: "primary", note: PREVIEW_NOTE }].concat(
        quiz.id === a.sel.anchorFor("W25").record.id ? [{ id: P.id(a, "start-example"), label: "See an example attempt in progress", go: "W26~" + a.sel.anchorFor("W26").home }] : []),
    });
  }

  function eligible(a, quiz) {
    var me = a.who.personId;
    var full = a.sel.effectiveMinutes(a.view, quiz.id, me);
    var avail = a.sel.availableMinutes(a.view, quiz.id, me, a.view.clock);
    var block = blockOf(a);
    var ok = !block && ACKNOWLEDGED.indexOf(a.variant) >= 0;
    var box = a.K.field({ id: P.id(a, "rules-box"), type: "checkbox", label: "I have read the current rules", checked: ok, disabled: true,
      reason: block ? block.reason : "Use the link below to change this" });
    var warn = avail < full ? shortNotice(a, quiz, avail) : "";
    if (block) return { html: P.stack(a, [block.notice, warn, box, startOff(a, block.reason)]), dialog: null };
    if (!ok) {
      return { html: P.stack(a, [warn, box, startOff(a, "Confirm you have read the current rules first"), P.links(a, [{ label: "I have read them", go: "W25:acknowledged" }])]), dialog: null };
    }
    var opener = a.K.button({ label: "Start attempt", kind: "primary", act: "open-dialog", target: P.id(a, "start") });
    return { html: P.stack(a, [warn, box, opener, P.links(a, [{ label: "Not read yet", go: "W25" }])]), dialog: dialog(a, quiz, avail, full) };
  }

  function notOpen(a, quiz) {
    var opens = P.when(a, quiz.opens);
    var notice = a.K.notice({ tone: "info", title: "This quiz opens " + opens, actions: quiz.id === a.sel.anchorFor("W25").record.id ? [{ label: "See this quiz at a clock when it is open", go: "W25~" + OPEN_CLOCK }] : [] });
    return P.stack(a, [a.K.flag("notOpen"), startOff(a, "Opens " + opens), notice]);
  }

  function startPanel(a, quiz) {
    var me = a.who.personId;
    var clock = a.view.clock;
    var attempt = a.sel.attemptFor(a.view, quiz.id, me);
    var av = a.sel.attemptView(a.view, quiz.id, me);
    if (a.sel.isBefore(clock, quiz.opens)) return { html: notOpen(a, quiz), dialog: null };
    if (a.state === "notYetAvailable") return { html: P.offHome(a, "This quiz has already opened at this point"), dialog: null };
    if (av && av.active) return { html: active(a, quiz, attempt, av), dialog: null };
    if (attempt && attempt.received_at) return { html: received(a, quiz, attempt), dialog: null };
    if (attempt) {
      var attemptGo = P.recordGo("W26", "attempt", attempt.id);
      return { html: P.stack(a, [P.p("The time for your attempt is up."), attemptGo ? P.links(a, [{ label: "Check the attempt", go: attemptGo }]) : P.p("This attempt is not drawn in the prototype")]), dialog: null };
    }
    if (!a.sel.isBefore(clock, quiz.close)) return { html: P.stack(a, [a.K.flag("closed"), P.p("This quiz closed " + P.when(a, quiz.close) + ".")]), dialog: null };
    return eligible(a, quiz);
  }

  function active(a, quiz, attempt, av) {
    var started = a.sel.availableMinutes(a.view, quiz.id, a.who.personId, attempt.started_at);
    var full = a.sel.effectiveMinutes(a.view, quiz.id, a.who.personId);
    return P.stack(a, [
      a.K.timer({ label: "Time left", remaining: minutes(Math.ceil(av.secondsLeft / 60)), endsAt: P.when(a, av.deadline) }),
      started < full ? P.p("This attempt started with " + minutes(started) + " available.") : "",
      P.recordGo("W26", "attempt", attempt.id) ? P.links(a, [{ label: "Resume attempt", go: P.recordGo("W26", "attempt", attempt.id) }]) : P.p("This attempt is not drawn in the prototype"),
    ]);
  }

  function received(a, quiz, attempt) {
    var receipt = P.recordGo("W27", "receipt", attempt.receipt_id) || (attempt.receipt_id ? WB.Teaching.go(a, "W27", { assessmentId: itemOf(a).id, learnerId: a.who.personId, receiptId: attempt.receipt_id }) : null);
    var more = attempt.attempt < quiz.max_attempts && a.sel.isBefore(a.view.clock, quiz.close);
    return P.stack(a, [
      P.p("Attempt " + attempt.attempt + " of " + quiz.max_attempts + " is handed in."),
      receipt ? P.links(a, [{ label: "View receipt", go: receipt }]) : "",
      more ? startOff(a, "A second attempt is not drawn in this prototype") : "",
    ]);
  }

  function learner(a, item, quiz) {
    if (a.state === "permissionUnavailable") return { body: P.permissionNotice(a), dialog: null };
    if (a.state === "loading") return { body: P.loading(a, "the quiz rules"), dialog: null };
    var panel = startPanel(a, quiz);
    var rail = a.K.section({ title: "Start", body: P.stack(a, [P.status(a, P.ownSubmission(a, item.id), true), panel.html]), level: 2 });
    var main = P.stack(a, [rulesSection(a, item, quiz, ownTiming(a, quiz)), P.links(a, [{ label: "Coursework", go: "W18" }])]);
    return { body: a.K.rail(a.ctx, { main: main, rail: rail, railLabel: "Start" }), dialog: panel.dialog };
  }

  WB.definePage("W25", {
    states: STATES,
    na: P.na(STATES, {
      success: "Starting leads to the attempt page; this page shows no outcome of its own",
      invalid: "The only input is the rules acknowledgement, which blocks Start instead",
      saving: "Starting is one confirmed step; nothing here saves in the background",
    }),
    variants: { acknowledged: "Rules acknowledged: Start enabled", confirm: "Start dialog open" },
    render: function (a) {
      var item = itemOf(a);
      if (!item || !item.quiz_id) return P.shell(a, { title: "Quiz rules", body: P.permissionNotice(a) }, { section: "coursework" });
      var gate = P.publicationGate(a, item);
      if (gate) return gate;
      var quiz = a.sel.quiz(a.view, item.quiz_id);
      var v = a.role === "student" ? learner(a, item, quiz) : { body: staff(a, item, quiz), dialog: null };
      var out = { title: "Quiz rules: " + item.title, body: v.body };
      if (v.dialog) out.dialog = v.dialog;
      return P.shell(a, out, { section: "coursework" });
    },
  });
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>/* pages/seg3-submit/W26.js */
/* W26 Quiz attempt (Phase 3 seg3-submit). Student only. Anchor: the persona's Quiz 3 attempt, home
   quiz_in_progress. The attempt counts only when its id is the anchor id (rule R-truth); with no attempt, a
   received one or an expired one the page says so and draws no answer fields. Choices are unselected
   placeholders and only acknowledged answers are called saved (amendment A3). Submit is unreviewed by default,
   an opener on reviewed, the dialog open on confirm; its primary item is preview-only and a separate link
   shows an example receipt (A2). Saving, offline, saveFailed and invalid always win. Sign in again is
   preview-only (A1). Contract: pages/SPINE.md and pages/seg3-submit/NOTES.md. */
(function (root) {
  "use strict";
  var WB = root.WB;
  var P = WB.P;
  var STATES = ["loading", "invalid", "saving", "saveFailed", "offline", "sessionExpired"];
  var REVIEWED = ["reviewed", "confirm"];
  var CHOICES = ["Choice A", "Choice B", "Choice C", "Choice D"];
  var CHOICE_KINDS = ["single_choice", "multiple_select"];
  var LOCAL_SAVE = { saving: "saving", offline: "savedLocal", saveFailed: "failed" };
  var ROLE_NOTE = "Preview only: in this prototype, switch the role in the viewer bar or follow the tour";

  function minutes(n) { return String(n) + (n === 1 ? " minute" : " minutes"); }
  function plural(n, one, many) { return String(n) + " " + (n === 1 ? one : many); }
  // Quiz items are {id, kind} objects or plain ids; normalise to objects.
  function items(quiz) { return quiz.items.map(function (x) { return typeof x === "string" ? { id: x, kind: null } : x; }); }
  function answerOf(attempt, itemId) { return attempt.answers.filter(function (x) { return x.item_id === itemId; })[0] || null; }

  function context(a) {
    var item = a.sel.assessment(a.view, a.sel.anchorFor("W25").record.id);
    var quiz = a.sel.quiz(a.view, item.quiz_id);
    var attempt = a.sel.attemptFor(a.view, quiz.id, a.who.personId);
    if (attempt && attempt.id !== a.sel.anchorFor("W26").record.id) attempt = null;
    return { item: item, quiz: quiz, attempt: attempt, av: attempt ? a.sel.attemptView(a.view, quiz.id, a.who.personId) : null };
  }

  // ---------- Per-question view ----------
  function saveLine(a, ans) {
    if (!ans) return P.p("No answer yet");
    if (ans.acknowledged_at) return P.p("Saved answer: " + ans.value) + a.K.saveStatus("saved", { time: a.sel.fmtTime(ans.acknowledged_at) });
    var state = Object.prototype.hasOwnProperty.call(LOCAL_SAVE, a.state) ? LOCAL_SAVE[a.state] : "dirty";
    return P.p("Unsaved draft: not sent (" + ans.value + ")") + a.K.saveStatus(state);
  }

  function control(a, q, n, ans) {
    var base = P.id(a, q.id);
    var label = "Answer to question " + n;
    // R04: the kit has no disabled choice group, so placeholder choices are a plain list nobody can select.
    if (CHOICE_KINDS.indexOf(q.kind) >= 0) {
      return P.stack(a, [
        P.p(label + ": the question content is not in this prototype, so nothing can be chosen here"),
        a.K.list({ label: "Choices are not in this prototype", items: CHOICES.map(function (c) { return { title: c }; }) }),
      ]);
    }
    var error = q.kind === "numeric" && a.state === "invalid" ? "Enter a number, for example 12.5" : undefined;
    return a.K.field({ id: base, label: label, type: q.kind === "numeric" ? "text" : "textarea", value: ans ? ans.value : "", error: error });
  }

  function saveButton(a, q) {
    if (a.state === "offline") return a.K.button({ label: "Save answer", disabled: true, reason: "You're offline. Answers stay on this device", id: P.id(a, q.id + "-save") });
    if (a.state === "saving") return a.K.button({ label: "Save answer", disabled: true, reason: "An answer is still saving", id: P.id(a, q.id + "-save") });
    return a.K.button({ label: "Save answer", note: "Preview only: nothing is saved in this prototype" });
  }

  function questions(a, c) {
    return items(c.quiz).map(function (q, i) {
      var ans = answerOf(c.attempt, q.id);
      return a.K.section({ title: "Question " + (i + 1), body: P.stack(a, [control(a, q, i + 1, ans), saveLine(a, ans), saveButton(a, q)]), level: 2 });
    });
  }

  function statusText(ans) {
    if (!ans) return "No answer";
    return ans.acknowledged_at ? "Saved answer" : "Unsaved draft: not sent";
  }

  function questionList(a, c) {
    var list = a.K.list({ label: "Questions", items: items(c.quiz).map(function (q, i) {
      var ans = answerOf(c.attempt, q.id);
      return { title: "Question " + (i + 1), meta: statusText(ans) };
    }) });
    return a.sizeClass === "compact" ? a.K.disclosure({ id: P.id(a, "qlist"), summary: "Question status", body: list }) : list;
  }

  // ---------- Submit ----------
  function payloadRows(a, c) {
    return items(c.quiz).map(function (q, i) {
      var ans = answerOf(c.attempt, q.id);
      var value = !ans ? "No answer" : ans.acknowledged_at ? ans.value + " · saved " + a.sel.fmtTime(ans.acknowledged_at) : "Unsaved changes: will not be sent";
      return { label: "Question " + (i + 1), value: value };
    });
  }

  function summaryRows(a, c) {
    var total = c.quiz.items.length;
    return [
      { label: "Answered and saved", value: String(c.av.acknowledged) + " of " + total }, { label: "Not answered or not sent", value: String(total - c.av.acknowledged) },
      { label: "Attempt", value: String(c.attempt.attempt) }, { label: "Question version", value: String(c.quiz.version) },
      { label: "Time left", value: minutes(Math.ceil(c.av.secondsLeft / 60)) },
    ];
  }

  function dialog(a, c) {
    var missing = c.quiz.items.length - c.av.acknowledged;
    var warn = missing ? a.K.notice({ tone: "warning", title: plural(missing, "question has", "questions have") + " no saved answer", body: P.p("Only saved answers are sent.") }) : "";
    var body = warn + a.K.kv(payloadRows(a, c)) + a.K.kv(summaryRows(a, c)) + P.p("This cannot be changed after sending.") +
      P.p("Nothing is sent in this prototype. The example receipt below is a separate record, not the result of this action.");
    return a.K.dialog(a.ctx, {
      id: P.id(a, "submit"), title: "Submit this attempt", open: a.variant === "confirm", body: body,
      actions: [
        { id: P.id(a, "submit-go"), label: "Submit attempt", kind: "primary", note: "Preview only: nothing is sent in this prototype" },
        { id: P.id(a, "submit-example"), label: "See an example confirmed receipt", go: "W27~" + a.sel.anchorFor("W27").home },
      ],
    });
  }

  function block(a, c) {
    if (a.state === "saving") {
      return { reason: "An answer is still saving", notice: a.K.notice({ tone: "info", title: "An answer is still saving",
        body: P.p(plural(c.av.unsent, "answer is", "answers are") + " not confirmed yet. The timer has not been reset.") }) };
    }
    if (a.state === "offline") {
      return { reason: "You're offline. Nothing has been sent", notice: a.K.notice({ tone: "warning", title: "You're offline. Nothing has been sent",
        body: P.p("Unsent answers stay on this device only. Nothing is sent in the background. Reconnect before " + P.when(a, c.av.deadline) + ".") }) };
    }
    if (a.state === "saveFailed") {
      return { reason: "Check the status before sending again", notice: a.K.notice({ tone: "warning", title: "We could not confirm your submission",
        body: P.p("Check the status before sending again."), actions: [{ label: "Check status", go: "W27" }] }) };
    }
    if (a.state === "invalid") return { reason: "Fix the marked answer first", notice: "" };
    return null;
  }

  function submitOff(a, reason) { return a.K.button({ label: "Submit attempt", disabled: true, reason: reason, id: P.id(a, "submit-btn") }); }

  function commit(a, c) {
    var b = block(a, c);
    if (b) return { html: P.stack(a, [b.notice, submitOff(a, b.reason)]), dialog: null };
    if (REVIEWED.indexOf(a.variant) < 0) {
      return { html: P.stack(a, [submitOff(a, "Review your answers first"), P.links(a, [{ label: "Review answers", go: "W26:reviewed" }])]), dialog: null };
    }
    var review = a.K.section({ title: "Review", body: a.K.kv(payloadRows(a, c)), level: 3 });
    var opener = a.K.button({ label: "Submit attempt", kind: "primary", act: "open-dialog", target: P.id(a, "submit") });
    return { html: P.stack(a, [review, opener, P.links(a, [{ label: "Not reviewed yet", go: "W26" }])]), dialog: dialog(a, c) };
  }

  function activeView(a, c) {
    var cm = commit(a, c);
    var facts = a.K.kv([
      { label: "Attempt", value: String(c.attempt.attempt) }, { label: "Question version", value: String(c.quiz.version) },
      { label: "Saved answers", value: String(c.av.acknowledged) + " of " + c.quiz.items.length }, { label: "Not sent", value: String(c.av.unsent) },
    ]);
    var rail = P.stack(a, [
      a.K.timer({ label: "Time left", remaining: minutes(Math.ceil(c.av.secondsLeft / 60)), endsAt: P.when(a, c.av.deadline) }),
      facts, questionList(a, c), P.p("Nothing is sent in the background."), a.K.section({ title: "Submit", body: cm.html, level: 2 }),
    ]);
    return { body: a.K.rail(a.ctx, { main: P.stack(a, questions(a, c)), rail: rail, railLabel: "Attempt", railFirst: true }), dialog: cm.dialog };
  }

  // ---------- Not answerable ----------
  function rulesLink(a, c) { return { label: "Quiz rules", go: P.recordGo("W25", "assessment", c.item.id) || "W25" }; }

  function notAnswerable(a, c) {
    if (!c.attempt) {
      return P.stack(a, [P.status(a, P.ownSubmission(a, c.item.id), true), P.links(a, [rulesLink(a, c)]), P.offHome(a, "There is no attempt in progress at this point")]);
    }
    if (c.attempt.received_at) {
      var go = P.recordGo("W27", "receipt", c.attempt.receipt_id);
      return P.stack(a, [P.p("This attempt is already handed in."), go ? P.links(a, [{ label: "View receipt", go: go }]) : "", P.offHome(a, "This attempt is already handed in")]);
    }
    return a.K.notice({
      tone: "warning", title: "Time is up. Your answers are locked",
      body: P.p("The time ended " + P.when(a, c.av.deadline) + ".") + P.p("Only saved answers are finalised; no receipt exists until it is confirmed."),
      actions: [{ label: "Check status", go: "W27" }],
    });
  }

  function expired(a, c) {
    var until = c.av && c.av.active ? " The timer keeps running until " + P.when(a, c.av.deadline) + "." : "";
    return a.K.notice({
      tone: "warning", title: "Sign in again to continue", body: P.p("Your session has ended." + until),
      actions: [{ label: "Sign in again", note: ROLE_NOTE }, { label: "Get help", go: "W12" }],
    });
  }

  function view(a, c) {
    if (a.state === "loading") return { body: P.loading(a, "your attempt"), dialog: null };
    if (a.state === "sessionExpired") return { body: expired(a, c), dialog: null };
    if (!c.attempt || !c.av.active) return { body: notAnswerable(a, c), dialog: null };
    return activeView(a, c);
  }

  WB.definePage("W26", {
    states: STATES,
    na: P.na(STATES, {
      conflict: "One learner owns the attempt; a repeated send resolves to the same receipt",
      success: "The result of submitting is the receipt page",
      firstUseEmpty: "With no attempt the page says so and links to the rules",
    }),
    variants: { reviewed: "Review panel: Submit enabled", confirm: "Submit dialog open" },
    render: function (a) {
      var c = context(a);
      var gate = P.publicationGate(a, c.item);
      if (gate) return gate;
      var v = view(a, c);
      var out = { title: "Quiz attempt: " + c.item.title, body: v.body };
      if (a.state !== "saving") out.back = rulesLink(a, c);
      if (v.dialog) out.dialog = v.dialog;
      return P.shell(a, out, { section: "coursework" });

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whiteboard prototype</title>
<meta name="description" content="Click-through prototype of Whiteboard for a fictional college: eight roles, guided tours, web and planned iPhone. Fictional data; not a working product.">
<style>
/* Whiteboard shared design tokens — batch 01 proposal (15 Oct 2026).
   Status: proposed for owner review; not accepted. Used by design previews only.
   Contrast pairs are checked by design/tools/check_batch01.mjs (static math, not a browser test). */

:root {
  color-scheme: light;
  /* Neutrals */
  --wb-bg: #f3f4f5;            /* page / grouped background */
  --wb-surface: #ffffff;       /* cards, lists, sheets */
  --wb-surface-2: #f7f8f8;     /* inset areas, table stripes */
  --wb-fill: #e9ebec;          /* control fills, segmented track */
  --wb-separator: #dfe2e4;     /* hairlines (decorative, not a control boundary) */
  --wb-border: #868c91;        /* input/control boundaries: >= 3:1 on surface */
  --wb-text: #16191b;
  --wb-text-2: #575e63;        /* secondary text: >= 4.5:1 on surface and bg */
  /* Identity: Whiteboard teal, retained from the showcase */
  --wb-accent: #007176;        /* fills and links */
  --wb-accent-text: #006a6f;
  --wb-on-accent: #ffffff;
  --wb-accent-tint: #e2f2f2;
  /* Semantic status — always paired with an icon and words, never colour alone */
  --wb-success: #17703a;  --wb-success-bg: #e5f3e9;
  --wb-warning: #855000;  --wb-warning-bg: #fcefdb;
  --wb-error: #b0251c;    --wb-error-bg: #fcebe9;
  --wb-info: #0c5f9e;     --wb-info-bg: #e4eff9;
  --wb-neutral: #4a5157;  --wb-neutral-bg: #eceef0;  /* held, queued, not released */
  --wb-focus: #0a66d8;
  --wb-scrim: rgb(0 0 0 / 0.32);
  --wb-shadow-1: 0 1px 2px rgb(16 24 28 / 0.06), 0 1px 1px rgb(16 24 28 / 0.04);
  --wb-shadow-2: 0 8px 28px rgb(16 24 28 / 0.12), 0 1px 3px rgb(16 24 28 / 0.08);

  /* Type — system font so iOS gets SF Pro and Dynamic Type metrics */
  --wb-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --wb-font-round: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --wb-scale: 1;               /* text-size multiplier; 1.24 previews larger Dynamic Type */

  /* Spacing: 4-pt grid */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s14: 56px;

  /* Radii */
  --r-control: 8px; --r-card: 12px; --r-inset: 10px; --r-sheet: 16px; --r-pill: 999px;

  /* Motion: short, purposeful; disabled under reduced motion */
  --m-fast: 120ms; --m-base: 200ms; --m-slow: 320ms;
  --m-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

  /* Hit targets */
  --hit-ios: 44px; --hit-web: 32px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --wb-bg: #0f1112;
  --wb-surface: #1b1e20;
  --wb-surface-2: #222628;
  --wb-fill: #2d3235;
  --wb-separator: #33393c;
  --wb-border: #7d868b;
  --wb-text: #eef1f2;
  --wb-text-2: #a9b1b6;
  --wb-accent: #5cc8c8;
  --wb-accent-text: #6fd3d3;
  --wb-on-accent: #002a2b;
  --wb-accent-tint: #123435;
  --wb-success: #72d58f;  --wb-success-bg: #163020;
  --wb-warning: #f2b252;  --wb-warning-bg: #36260b;
  --wb-error: #ff9d92;    --wb-error-bg: #3f1d1a;
  --wb-info: #86c3f5;     --wb-info-bg: #13283a;
  --wb-neutral: #c3cacf;  --wb-neutral-bg: #2a2f32;
  --wb-focus: #7fb4ff;
  --wb-scrim: rgb(0 0 0 / 0.55);
  --wb-shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
  --wb-shadow-2: 0 10px 32px rgb(0 0 0 / 0.5);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --wb-bg: #0f1112;
    --wb-surface: #1b1e20;
    --wb-surface-2: #222628;
    --wb-fill: #2d3235;
    --wb-separator: #33393c;
    --wb-border: #7d868b;
    --wb-text: #eef1f2;
    --wb-text-2: #a9b1b6;
    --wb-accent: #5cc8c8;
    --wb-accent-text: #6fd3d3;
    --wb-on-accent: #002a2b;
    --wb-accent-tint: #123435;
    --wb-success: #72d58f;  --wb-success-bg: #163020;
    --wb-warning: #f2b252;  --wb-warning-bg: #36260b;
    --wb-error: #ff9d92;    --wb-error-bg: #3f1d1a;
    --wb-info: #86c3f5;     --wb-info-bg: #13283a;
    --wb-neutral: #c3cacf;  --wb-neutral-bg: #2a2f32;
    --wb-focus: #7fb4ff;
    --wb-scrim: rgb(0 0 0 / 0.55);
    --wb-shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
    --wb-shadow-2: 0 10px 32px rgb(0 0 0 / 0.5);
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --m-fast: 0ms; --m-base: 0ms; --m-slow: 0ms; }
}

/* Whiteboard shared components — batch 01 proposal. Web (.w-*) and planned iOS (.i-*) share
   tokens, status language and icons; layout and navigation are deliberately platform-specific. */

.wb { font-family: var(--wb-font); color: var(--wb-text); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wb *, .wb *::before, .wb *::after { box-sizing: border-box; }
.wb h1, .wb h2, .wb h3, .wb h4, .wb p, .wb ul, .wb ol, .wb dl, .wb dd, .wb figure { margin: 0; }
.wb ul, .wb ol { padding: 0; list-style: none; }
.wb button { font: inherit; color: inherit; }
.wb :focus-visible { outline: 3px solid var(--wb-focus); outline-offset: 2px; border-radius: 6px; }
.icon { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Status badges (shared vocabulary) ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 6px; border-radius: var(--r-pill); font-size: calc(12px * var(--wb-scale)); line-height: 1.35; font-weight: 600; white-space: nowrap; background: var(--wb-neutral-bg); color: var(--wb-neutral); }
.badge .icon { width: 13px; height: 13px; stroke-width: 2.2; }
.badge.success { background: var(--wb-success-bg); color: var(--wb-success); }
.badge.warning { background: var(--wb-warning-bg); color: var(--wb-warning); }
.badge.error { background: var(--wb-error-bg); color: var(--wb-error); }
.badge.info { background: var(--wb-info-bg); color: var(--wb-info); }
.badge.accent { background: var(--wb-accent-tint); color: var(--wb-accent-text); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--hit-web); padding: 6px 14px; border: 0; border-radius: var(--r-control); background: var(--wb-fill); color: var(--wb-text); font-size: calc(14px * var(--wb-scale)); font-weight: 600; line-height: 1.2; cursor: pointer; text-decoration: none; transition: background var(--m-fast) var(--m-ease), transform var(--m-fast) var(--m-ease); }
.btn:hover { filter: brightness(0.97); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--wb-accent); color: var(--wb-on-accent); }
.btn.plain { background: transparent; color: var(--wb-accent-text); padding-inline: 6px; }
.btn.destructive { background: transparent; color: var(--wb-error); }
.btn.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--wb-border); }
.btn[aria-disabled="true"] { background: var(--wb-fill); color: var(--wb-text-2); cursor: not-allowed; transform: none; filter: none; }
.btn.lg { min-height: 44px; padding: 10px 18px; font-size: calc(15px * var(--wb-scale)); border-radius: 10px; }
.btn.block { width: 100%; }

/* ---------- Notices ---------- */
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-inset); background: var(--wb-info-bg); color: var(--wb-text); font-size: calc(14px * var(--wb-scale)); line-height: 1.45; }
.notice > .icon { color: var(--wb-info); margin-top: 2px; }
.notice strong { display: block; font-weight: 650; }
.notice.warning { background: var(--wb-warning-bg); } .notice.warning > .icon { color: var(--wb-warning); }
.notice.error { background: var(--wb-error-bg); } .notice.error > .icon { color: var(--wb-error); }
.notice.success { background: var(--wb-success-bg); } .notice.success > .icon { color: var(--wb-success); }
.notice.neutral { background: var(--wb-neutral-bg); } .notice.neutral > .icon { color: var(--wb-neutral); }
.notice .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* ---------- Generic content ---------- */
.meta { color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); line-height: 1.4; }
.eyebrow { color: var(--wb-text-2); font-size: calc(12px * var(--wb-scale)); font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: calc(14px * var(--wb-scale)); }
.facts dt { color: var(--wb-text-2); }
.facts dd { font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--wb-fill); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--wb-accent); border-radius: inherit; }
.course-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.c-phys { background: #2f7f86; } .c-math { background: #6b5bb5; } .c-writ { background: #b5653a; } .c-arch { background: #8a9095; }
.qchips { display: flex; flex-wrap: wrap; gap: 6px; }
.qchip { display: inline-flex; align-items: center; gap: 4px; min-width: 40px; justify-content: center; padding: 3px 8px; border-radius: 6px; font-size: calc(12.5px * var(--wb-scale)); font-weight: 600; background: var(--wb-success-bg); color: var(--wb-success); }
.qchip.missing { background: var(--wb-error-bg); color: var(--wb-error); }

/* Illustrative handwritten page (fictional work, with text alternative nearby) */
.page-thumb { position: relative; aspect-ratio: 8.5 / 11; border-radius: 6px; background: #fdfdfb; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.12), var(--wb-shadow-1); overflow: hidden; }
.page-thumb svg { width: 100%; height: 100%; display: block; }
.page-thumb .pno { position: absolute; left: 6px; top: 6px; padding: 1px 6px; border-radius: 5px; background: rgb(22 25 27 / 0.78); color: #fff; font-size: 11px; font-weight: 700; }
.page-thumb.warn { box-shadow: 0 0 0 2px var(--wb-warning); }

/* ================= WEB SHELL ================= */
.w-app { position: relative; container-type: inline-size; container-name: wapp; display: grid; grid-template-columns: 232px 1fr; min-height: 100%; background: var(--wb-bg); font-size: calc(15px * var(--wb-scale)); line-height: 1.45; }
.w-side { display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; border-right: 1px solid var(--wb-separator); background: var(--wb-surface-2); }
.w-brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-weight: 700; font-size: calc(15px * var(--wb-scale)); }
.w-mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--wb-accent); color: var(--wb-on-accent); font-family: var(--wb-font-round); font-weight: 800; font-size: 15px; }
.w-navlabel { padding: 14px 10px 4px; }
.w-nav a { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 5px 10px; border-radius: 7px; color: var(--wb-text); text-decoration: none; font-size: calc(14px * var(--wb-scale)); }
.w-nav a:hover { background: var(--wb-fill); }
.w-nav a[aria-current="page"] { background: var(--wb-accent-tint); color: var(--wb-accent-text); font-weight: 600; }
.w-nav .icon { color: var(--wb-text-2); }
.w-nav a[aria-current="page"] .icon { color: var(--wb-accent-text); }
.w-side .w-foot { margin-top: auto; }
.w-main { min-width: 0; display: flex; flex-direction: column; }
.w-top { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 24px; border-bottom: 1px solid var(--wb-separator); background: var(--wb-surface); }
.w-menu { display: none; }
.w-crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: calc(13px * var(--wb-scale)); color: var(--wb-text-2); }
.w-crumbs a { color: var(--wb-accent-text); text-decoration: none; }
.w-crumbs a:hover { text-decoration: underline; }
.w-crumbs .icon { width: 12px; height: 12px; }
.w-search { margin-left: auto; display: flex; align-items: center; gap: 8px; width: min(280px, 34%); min-height: 32px; padding: 0 10px; border-radius: 8px; background: var(--wb-fill); color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); border: 0; cursor: pointer; text-align: left; }
.w-iconbtn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--wb-text-2); cursor: pointer; }
.w-iconbtn:hover { background: var(--wb-fill); }
.w-avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 0; background: #d7e7e8; color: #134447; font-weight: 700; font-size: 12px; cursor: pointer; }
.w-banner { display: flex; align-items: center; gap: 10px; padding: 8px 24px; font-size: calc(13px * var(--wb-scale)); background: var(--wb-warning-bg); color: var(--wb-text); }
.w-banner .icon { color: var(--wb-warning); }
.w-content { padding: 28px 32px 48px; max-width: 1080px; width: 100%; }
.w-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.w-head h1 { font-size: calc(26px * var(--wb-scale)); line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.w-head .meta { margin-top: 4px; }
.w-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.w-grid.even { grid-template-columns: 1fr 1fr; }
.w-grid.split { grid-template-columns: 260px minmax(0, 1fr); }
.w-grid.tri { grid-template-columns: minmax(150px, 190px) minmax(0, 1fr) minmax(250px, 300px); }
.w-stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
.w-card { background: var(--wb-surface); border-radius: var(--r-card); box-shadow: var(--wb-shadow-1); padding: 18px 20px; min-width: 0; }
.w-card.flush { padding: 0; overflow: hidden; }
.w-card > h2, .w-card-h { font-size: calc(16px * var(--wb-scale)); font-weight: 650; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.w-card.flush > h2 { padding: 16px 20px 6px; margin: 0; }
.w-list > li { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--wb-separator); min-height: 52px; }
.w-list > li:first-child { border-top: 0; }
.w-list.inset > li { padding-inline: 0; }
.w-list .grow { flex: 1; min-width: 0; }
.w-list .title { font-weight: 600; }
.w-list a.title { color: var(--wb-text); text-decoration: none; }
.w-list a.title:hover { color: var(--wb-accent-text); text-decoration: underline; }
.w-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--wb-separator); margin: -6px 0 22px; overflow-x: auto; }
.w-tabs a { padding: 10px 12px; color: var(--wb-text-2); text-decoration: none; font-size: calc(14px * var(--wb-scale)); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.w-tabs a[aria-current="page"] { color: var(--wb-text); border-color: var(--wb-accent); font-weight: 650; }
.w-seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--wb-fill); }
.w-seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: calc(13px * var(--wb-scale)); font-weight: 500; cursor: pointer; }
.w-seg button[aria-pressed="true"] { background: var(--wb-surface); box-shadow: var(--wb-shadow-1); font-weight: 650; }
.w-sticky { position: sticky; top: 12px; }
.w-pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.w-page { display: grid; gap: 8px; }
.w-page .tools { display: flex; gap: 2px; justify-content: space-between; }
.w-field { display: grid; gap: 4px; font-size: calc(13px * var(--wb-scale)); }
.w-field select, .w-field input { min-height: 32px; border: 1px solid var(--wb-border); border-radius: 7px; background: var(--wb-surface); color: var(--wb-text); padding: 4px 8px; font: inherit; }
.w-field.invalid select { border-color: var(--wb-error); box-shadow: 0 0 0 1px var(--wb-error); }
.w-field .err { color: var(--wb-error); font-weight: 600; }
.w-drop { display: grid; place-items: center; gap: 8px; padding: 28px; border: 1.5px dashed var(--wb-border); border-radius: var(--r-card); text-align: center; color: var(--wb-text-2); }
.w-camera { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-card); background: #1d2224; overflow: hidden; display: grid; place-items: center; }
.w-dialog { position: absolute; inset: 0; display: grid; place-items: center; background: var(--wb-scrim); padding: 24px; z-index: 5; }
.w-dialog > div { width: min(440px, 100%); background: var(--wb-surface); border-radius: 14px; box-shadow: var(--wb-shadow-2); padding: 22px; display: grid; gap: 12px; }
.w-dialog h2 { font-size: calc(18px * var(--wb-scale)); }
.w-dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* Medium web: three-pane feedback keeps the question list and stacks explanation under the page. */
@container wapp (max-width: 1120px) and (min-width: 761px) {
  .w-grid.tri { grid-template-columns: 170px minmax(0, 1fr); }
  .w-grid.tri > :last-child { grid-column: 2; }
}

/* Narrow (responsive mobile web): sidebar becomes a menu disclosure; columns stack.
   Container queries mean the same markup is the narrow-web design, not a native iOS stand-in. */
@container wapp (max-width: 760px) {
  .w-app { grid-template-columns: 1fr; }
  .w-side { display: none; }
  .w-menu { display: grid; }
  .w-top { padding: 8px 12px; gap: 6px; }
  .w-search { width: 32px; padding: 0; justify-content: center; margin-left: auto; }
  .w-search span { display: none; }
  .w-crumbs .crumb-mid { display: none; }
  .w-banner { padding: 8px 16px; }
  .w-content { padding: 20px 16px 40px; }
  .w-head h1 { font-size: calc(23px * var(--wb-scale)); }
  .w-grid, .w-grid.even, .w-grid.split, .w-grid.tri { grid-template-columns: minmax(0, 1fr); }
  .w-sticky { position: static; }
  .w-card { padding: 16px; }
  .w-list > li { padding: 12px 16px; }
  .w-pages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .w-hide-narrow { display: none !important; }
}
@container wapp (min-width: 761px) { .w-only-narrow { display: none !important; } }

/* ================= iOS (PLANNED) SHELL ================= */
.i-app { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--wb-bg); font-size: calc(17px * var(--wb-scale)); line-height: 1.3; overflow: hidden; }
:root[data-theme="dark"] .i-app { --wb-bg: #000; --wb-surface: #1c1c1e; --wb-surface-2: #2c2c2e; --wb-fill: #2c2c2e; --wb-separator: #38383a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .i-app { --wb-bg: #000; --wb-surface: #1c1c1e; --wb-surface-2: #2c2c2e; --wb-fill: #2c2c2e; --wb-separator: #38383a; } }
.i-status { flex: none; height: 54px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 40px; font-size: 16px; font-weight: 600; }
.i-status .sys { display: flex; gap: 6px; align-items: center; }
.i-nav { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; padding: 0 8px; }
.i-nav .back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 2px; border: 0; background: none; color: var(--wb-accent-text); font-size: calc(17px * var(--wb-scale)); cursor: pointer; }
.i-nav .back .icon { width: 22px; height: 22px; stroke-width: 2.4; }
.i-nav .ttl { font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.i-nav .trail { justify-self: end; display: flex; }
.i-iconbtn { display: grid; place-items: center; min-width: 44px; height: 44px; border: 0; background: none; color: var(--wb-accent-text); cursor: pointer; font-size: calc(17px * var(--wb-scale)); }
.i-iconbtn .icon { width: 22px; height: 22px; }
.i-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #d7e7e8; color: #134447; font-size: 13px; font-weight: 700; }
.i-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 16px 24px; scrollbar-width: none; }
.i-scroll::-webkit-scrollbar { display: none; }
.i-large { font-size: calc(34px * var(--wb-scale)); line-height: 1.2; font-weight: 700; letter-spacing: 0.01em; margin: 2px 4px 2px; }
.i-sub { margin: 0 4px 14px; color: var(--wb-text-2); font-size: calc(15px * var(--wb-scale)); }
.i-h { margin: 22px 20px 6px; color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); text-transform: uppercase; letter-spacing: 0.02em; }

/* ================= BATCH 02 ADDITIONS: access, authoring, forms ================= */
a.w-avatar, a.i-iconbtn { text-decoration: none; }
.w-app.staff .w-content { max-width: 1320px; }

/* Focused access shell */
.w-app.w-access { display: flex; flex-direction: column; grid-template-columns: none; }
.w-access-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; }

/* Forms */

.switch { flex: none; position: relative; width: 44px; height: 26px; border: 0; border-radius: 13px; background: var(--wb-fill); box-shadow: inset 0 0 0 1px var(--wb-border); cursor: pointer; padding: 0; }

.w-progress { height: 6px; border-radius: 3px; background: var(--wb-fill); overflow: hidden; }
.w-progress span { display: block; height: 100%; background: var(--wb-accent); border-radius: 3px; }
/* Checks / validation rail */

.i-previewbar button { margin-left: auto; border: 0; border-radius: 999px; background: #fff; color: #3b2f6b; font: 600 13px/1 var(--wb-font); padding: 7px 12px; cursor: pointer; }

/* Rubric matrix */

@container wapp (max-width: 760px) { .w-grid.edit, .w-grid.edit3 { grid-template-columns: minmax(0, 1fr); } }

.i-group > li > .i-fieldrow { margin: -11px -16px; }
.i-bottom .i-btn + .i-btn { margin-top: 8px; }

/* ===================== BATCH 03 ADDITIONS (quiz, discussion, calendar, updates, grading) ===================== */
/* Grading: roster | page evidence | assessment panel. Needs ~1240 px of app width; below that the roster becomes a picker row. */
.w-grid.grade3 { grid-template-columns: minmax(190px, 220px) minmax(0, 1fr) minmax(280px, 330px); }
@container wapp (max-width: 1240px) and (min-width: 761px) { .w-grid.grade3 { grid-template-columns: minmax(0, 1fr) minmax(270px, 310px); } .w-grid.grade3 > :first-child { grid-column: 1 / -1; } .w-roster { display: flex; gap: 6px; overflow-x: auto; } .w-roster li { flex: none; } }
@container wapp (max-width: 760px) { .w-grid.grade3 { grid-template-columns: minmax(0, 1fr); } }
.w-roster { display: grid; gap: 2px; font-size: calc(13.5px * var(--wb-scale)); }

.w-qsel button[aria-pressed="true"] { border-color: var(--wb-accent); box-shadow: 0 0 0 1px var(--wb-accent); background: var(--wb-accent-tint); color: var(--wb-accent-text); }
.w-qsel button .icon { width: 13px; height: 13px; }
.w-score { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.w-score input { width: 64px; font-size: calc(20px * var(--wb-scale)); font-weight: 700; text-align: right; }
.w-total { font-size: calc(28px * var(--wb-scale)); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
/* Gradebook */
.w-gb td, .w-gb th { white-space: nowrap; }
.w-gb .cell { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.w-gb td.focus { box-shadow: inset 0 0 0 2px var(--wb-accent); background: var(--wb-accent-tint); }
.w-gb .vis { color: var(--wb-text-2); font-size: calc(12px * var(--wb-scale)); }
/* Release */
.w-scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.w-scope > div { border-radius: 10px; background: var(--wb-fill); padding: 10px 12px; display: grid; gap: 2px; }
.w-scope b { font-size: calc(22px * var(--wb-scale)); font-variant-numeric: tabular-nums; }
.w-timeline { display: grid; gap: 0; font-size: calc(13.5px * var(--wb-scale)); }
.w-timeline li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--wb-separator); }
.w-timeline li:first-child { border-top: 0; }
.w-timeline .icon { color: var(--wb-text-2); margin-top: 2px; }
/* Quiz attempt */
.w-qcard { display: grid; gap: 10px; }
.w-qcard .qh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.w-choices { display: grid; gap: 6px; }
.w-choices label { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--wb-border); cursor: pointer; min-height: 44px; }

.w-timer { display: grid; gap: 4px; }

.i-timer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; margin: 0 -16px 12px; background: var(--wb-surface); border-bottom: 1px solid var(--wb-separator); font-size: calc(14px * var(--wb-scale)); }
.i-timer b { font-variant-numeric: tabular-nums; font-size: calc(17px * var(--wb-scale)); }
/* Discussion */
.w-thread { display: grid; gap: 12px; }
.w-post { display: grid; grid-template-columns: 36px 1fr; gap: 10px; }

.w-post .who { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.w-post .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--wb-fill); color: var(--wb-text); }
.w-post .av.staff { background: #e4e0f2; color: #3b2f6b; }
.w-post .body { background: var(--wb-surface); border-radius: 12px; padding: 10px 14px; box-shadow: var(--wb-shadow-1); display: grid; gap: 6px; }
.w-post.mine .body { box-shadow: inset 0 0 0 1px var(--wb-accent); }
.w-role { font-size: calc(11.5px * var(--wb-scale)); font-weight: 650; padding: 1px 7px; border-radius: 6px; background: var(--wb-fill); color: var(--wb-text-2); }
.w-role.staff { background: #e4e0f2; color: #3b2f6b; }
.w-composer { display: grid; gap: 8px; }
.w-composer textarea { min-height: 90px; }
@container wapp (max-width: 760px) { .w-post.reply { margin-left: 20px; } }
/* Calendar */
.w-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.w-week .day { display: grid; gap: 4px; align-content: start; min-height: 150px; padding: 8px; border-radius: 10px; background: var(--wb-surface); box-shadow: var(--wb-shadow-1); font-size: calc(12px * var(--wb-scale)); }

.w-week .day.sel { box-shadow: inset 0 0 0 2px var(--wb-accent); }
.w-ev { display: block; padding: 4px 6px; border-radius: 6px; background: var(--wb-fill); color: var(--wb-text); text-decoration: none; border-left: 3px solid var(--wb-border); line-height: 1.3; }
.w-ev.c-phys { border-left-color: var(--wb-accent); } .w-ev.c-math { border-left-color: #6b5bb5; } .w-ev.c-writ { border-left-color: #a8650b; } .w-ev.campus { border-left-color: var(--wb-success); }
.w-ev.due { background: var(--wb-warning-bg); }

.w-ev.chg { box-shadow: inset 0 0 0 1px var(--wb-info); }

.w-agenda { display: grid; gap: 0; }
.w-agenda li { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--wb-separator); }
.w-agenda li:first-child { border-top: 0; }
.w-agenda .time { font-variant-numeric: tabular-nums; color: var(--wb-text-2); font-size: calc(13px * var(--wb-scale)); }
/* Updates feed */
.w-feed li { display: grid; grid-template-columns: 10px 22px 1fr auto; gap: 10px; align-items: start; padding: 12px 4px; border-top: 1px solid var(--wb-separator); }
.w-feed li:first-child { border-top: 0; }
.w-feed .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
.w-feed .unread .dot { background: var(--wb-accent); }
.w-feed .unread .title { font-weight: 650; }
.w-feed .icon { color: var(--wb-text-2); margin-top: 2px; }

/* ===================== BATCH 04 ADDITIONS (people, course copy, insights, timetable, schedule review) ===================== */
.w-cbox, .w-radio { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: calc(14px * var(--wb-scale)); }
.w-cbox input, .w-radio input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--wb-accent); flex: none; }
.w-cbox input:disabled + label, .w-radio input:disabled + label { color: var(--wb-text-2); }
.w-sel, .w-choice { border: 0; padding: 0; margin: 0; min-width: 0; }
.w-choice legend { margin-bottom: 6px; }
.w-opt { display: grid; gap: 4px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--wb-separator); margin-bottom: 8px; }
.w-opt.sel { border-color: var(--wb-accent); box-shadow: inset 0 0 0 1px var(--wb-accent); }
.w-opt > span { padding-left: 26px; }
.w-card.bad { box-shadow: inset 0 0 0 2px var(--wb-error), var(--wb-shadow-1); }
.i-card.bad { box-shadow: inset 0 0 0 2px var(--wb-error); }
.w-quote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--wb-border); display: grid; gap: 4px; }
.w-bars { display: grid; gap: 12px; }
/* Timetable grid (S24): five day columns; meetings are links with full text */
.w-tt { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.w-tt .day h3 { font-size: calc(12.5px * var(--wb-scale)); font-weight: 650; color: var(--wb-text-2); margin-bottom: 6px; }
.w-tt ul { display: grid; gap: 6px; }
.w-tt .mtg { display: grid; gap: 2px; padding: 6px 8px; border-radius: 8px; background: var(--wb-fill); color: var(--wb-text); text-decoration: none; border-left: 3px solid var(--wb-border); font-size: calc(12.5px * var(--wb-scale)); line-height: 1.3; }
.w-tt .mtg.sel { box-shadow: inset 0 0 0 2px var(--wb-accent); }
.w-tt .mtg.conflict { border-left-color: var(--wb-error); box-shadow: inset 0 0 0 2px var(--wb-error); }
.w-tt .flag, .w-tt .prop { display: flex; gap: 4px; align-items: center; font-weight: 600; font-size: calc(11.5px * var(--wb-scale)); }
.w-tt .flag { color: var(--wb-error); } .w-tt .flag.ok { color: var(--wb-success); }
.w-tt .prop { margin-top: 4px; padding: 4px 6px; border: 1px dashed var(--wb-warning); border-radius: 6px; color: var(--wb-text); }
.w-tt .icon { width: 14px; height: 14px; }
@container wapp (max-width: 1100px) { .w-tt { grid-template-columns: minmax(0, 1fr); } .w-tt ul { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

/* ===================== BATCH 05 ADDITIONS (rooms, reservations, events, organizations, check-in) ===================== */
.w-form.one, .w-form.two { grid-column: 1 / -1; }
.w-form.one { grid-template-columns: minmax(0, 1fr); }
.w-row { display: flex; flex-wrap: wrap; gap: 8px; }
.w-ctx { display: flex; gap: 6px; align-items: center; margin: -6px 0 14px; }
.w-back { display: inline-flex; align-items: center; gap: 4px; }
.w-empty { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 8px 0; }
.w-empty > .icon { width: 28px; height: 28px; color: var(--wb-text-2); }
.w-rooms { display: grid; gap: 12px; }
.w-roomcard { display: grid; gap: 8px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--wb-separator); }
.w-roomcard.sel { border-color: var(--wb-accent); box-shadow: inset 0 0 0 1px var(--wb-accent); }
.w-roomcard.dim .rh b { color: var(--wb-text-2); }
.w-roomcard .rh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.w-roomcard .rh b { font-size: calc(16px * var(--wb-scale)); }
.w-roomcard .ra { display: flex; justify-content: flex-end; }
.w-list > li.sel { background: var(--wb-accent-tint); }
.w-evtitle { font-size: calc(20px * var(--wb-scale)); line-height: 1.25; }
.w-capline { display: grid; gap: 6px; font-size: calc(14px * var(--wb-scale)); font-variant-numeric: tabular-nums; }
.w-deps { display: grid; gap: 0; }
.w-deps > li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--wb-separator); }
.w-deps > li:first-child { border-top: 0; }
.w-deps > li > div { display: grid; gap: 4px; justify-items: start; }
.w-deps .icon { color: var(--wb-text-2); margin-top: 2px; }
.w-depcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 10px; }
.w-depcols > section { display: grid; gap: 6px; align-content: start; justify-items: start; padding: 12px; border-radius: 10px; background: var(--wb-fill); }
.w-depcols h3 { display: flex; gap: 6px; align-items: center; font-size: calc(14.5px * var(--wb-scale)); }
@container wapp (max-width: 1000px) { .w-depcols { grid-template-columns: minmax(0, 1fr); } }
.passcode { width: 148px; height: 148px; border-radius: 8px; flex: none; }
.w-pass { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.w-pass .t, .i-pass .t { font-size: calc(18px * var(--wb-scale)); font-weight: 650; }
.w-pass .code { font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
.i-pass { justify-items: center; text-align: center; }
.i-group-form { display: grid; gap: 10px; margin-bottom: 16px; }
.i-scanframe { width: 62%; aspect-ratio: 1; border: 3px solid rgb(255 255 255 / 0.85); border-radius: 22px; }
.i-scanhint { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; }
.i-scanres { display: grid; gap: 10px; padding: 14px 16px; background: var(--wb-bg); color: var(--wb-text); }

/* ===================== BATCH 06 ADDITIONS (support, institution administration, search, help) ===================== */
.w-bound { margin-top: 12px; gap: 12px; }
.w-bound h3 { margin-bottom: 6px; }
.w-bound .w-checks li:not(.ok) .icon { color: var(--wb-text-2); }
.w-choice.need { padding: 10px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--wb-warning); }
.w-concept { display: flex; gap: 6px; align-items: flex-start; margin-top: 16px; }
.w-concept .icon { flex: none; margin-top: 2px; }

/* Click-through prototype shell. Uses the shared tokens; the screens themselves use components.css unchanged. */
html, body { height: 100%; }
body { margin: 0; background: var(--wb-bg); color: var(--wb-text); font-family: var(--wb-font); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--wb-focus); outline-offset: 2px; }
.pt-meta { color: var(--wb-text-2); font-size: 13px; font-weight: 400; }

/* Top bar */
.pt-bar { position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--wb-surface); border-bottom: 1px solid var(--wb-separator); font-size: 14px; }
.pt-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; background: none; border: 0; color: var(--wb-text); font: inherit; font-weight: 700; cursor: pointer; padding: 6px; border-radius: 8px; }
.pt-brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--wb-accent); display: inline-block; }
.pt-chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--wb-fill); color: var(--wb-text-2); white-space: nowrap; }
.pt-where { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 6px; }
.pt-as { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--wb-accent-tint); color: var(--wb-text); margin-left: 6px; }
.pt-dd { position: relative; }
.pt-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--wb-separator); background: var(--wb-surface); color: var(--wb-text); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pt-btn:hover { background: var(--wb-surface-2); }
.pt-btn .caret { font-size: 10px; color: var(--wb-text-2); }
.pt-seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--wb-fill); }
.pt-seg button { min-height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--wb-text-2); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.pt-seg button[aria-pressed="true"] { background: var(--wb-surface); color: var(--wb-text); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.pt-icon { width: 34px; padding: 0; justify-content: center; }
.pt-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: min(380px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow: auto; padding: 6px; border-radius: 12px; background: var(--wb-surface); border: 1px solid var(--wb-separator); box-shadow: var(--wb-shadow-2); }
.pt-dd.right .pt-menu { left: auto; right: 0; }
.pt-menu button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; padding: 9px 10px; border: 0; border-radius: 8px; background: none; color: var(--wb-text); font: inherit; font-size: 14px; cursor: pointer; }
.pt-menu button:hover, .pt-menu button[aria-current="true"] { background: var(--wb-accent-tint); }
.pt-mh { margin: 8px 10px 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--wb-text-2); }

/* Stage */
#pt-view { position: fixed; inset: 52px 0 0 0; overflow: auto; outline: none; }
body.pt-touring #pt-view { bottom: 76px; }
.pt-web { display: flex; }
.pt-webframe { position: relative; flex: 1; min-height: 100%; overflow: auto; }
.pt-webframe > .w-app { min-height: 100%; }
.pt-ios { display: grid; place-items: center; background: radial-gradient(ellipse at 50% 30%, var(--wb-surface-2), var(--wb-bg)); }
.pt-phonewrap { position: relative; }
.pt-phone { position: absolute; left: 0; top: 0; width: 393px; height: 852px; margin: 11px; border-radius: 56px; background: #0b0c0d; box-shadow: 0 0 0 10px #1c1e20, 0 0 0 11px #3a3d40, var(--wb-shadow-2); transform-origin: 0 0; }
.pt-phone .screen { position: absolute; inset: 0; border-radius: 56px; overflow: hidden; background: var(--wb-bg); }
.pt-phone .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 10; pointer-events: none; }

body.pt-fullphone .pt-phonewrap { width: 100%; height: 100%; }
body.pt-fullphone .pt-phone { position: relative; width: 100%; height: 100%; margin: 0; border-radius: 0; box-shadow: none; transform: none; }
body.pt-fullphone .pt-phone .screen { border-radius: 0; }
body.pt-fullphone .pt-phone .island { display: none; }
.pt-handoff { display: inline-flex; margin: 6px 0 4px; padding: 6px 12px; border-radius: 99px; border: 1px dashed var(--wb-accent); background: var(--wb-accent-tint); color: var(--wb-text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }

/* Tour bar */
.pt-tour { position: fixed; inset: auto 0 0 0; height: 76px; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--wb-surface); border-top: 1px solid var(--wb-separator); box-shadow: 0 -6px 20px rgb(0 0 0 / 0.06); }
.pt-tour-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pt-tour-txt b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-dots { display: flex; gap: 5px; flex-wrap: wrap; max-width: 260px; }
.pt-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-fill); box-shadow: inset 0 0 0 1px var(--wb-border); }
.pt-dots i.done { background: var(--wb-accent); box-shadow: none; }
.pt-dots i.cur { background: var(--wb-accent); box-shadow: 0 0 0 3px var(--wb-accent-tint); }
.pt-tour-btns { display: flex; gap: 8px; }
.pt-tbtn { min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--wb-separator); background: var(--wb-surface); color: var(--wb-text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.pt-tbtn.primary { background: var(--wb-accent); border-color: var(--wb-accent); color: var(--wb-surface); }
.pt-tbtn:disabled { opacity: 0.45; cursor: default; }

/* Toast */
.pt-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 12px; max-width: min(600px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 12px; background: var(--wb-text); color: var(--wb-surface); font-size: 14px; line-height: 1.4; box-shadow: var(--wb-shadow-2); opacity: 0; pointer-events: none; transition: opacity var(--m-base) var(--m-ease); }
body.pt-touring .pt-toast { bottom: 92px; }
.pt-toast.on { opacity: 1; pointer-events: auto; }
.pt-toast .pt-tbtn { background: transparent; color: inherit; border-color: currentColor; }

/* Welcome */
.pt-welcome { inset: 0 !important; }
.pt-wel-in { max-width: 1120px; margin: 0 auto; padding: 48px 16px 64px; }
.pt-kicker { margin: 0 0 6px; color: var(--wb-accent); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
.pt-wel-in h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -0.01em; }
.pt-lead { max-width: 760px; margin: 0 0 28px; font-size: 17px; line-height: 1.5; color: var(--wb-text-2); }
.pt-lead b { color: var(--wb-text); }
.pt-roles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.pt-role { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 16px; background: var(--wb-surface); border: 1px solid var(--wb-separator); }
.pt-role p { margin: 0; font-size: 14.5px; line-height: 1.45; }
.pt-rhead { display: flex; align-items: center; gap: 12px; }
.pt-rhead h2 { margin: 0; font-size: 17px; }
.pt-av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--wb-accent-tint); color: var(--wb-text); font-weight: 700; font-size: 14px; }
.pt-primary { align-self: flex-start; min-height: 38px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--wb-accent); color: var(--wb-surface); font: inherit; font-size: 14.5px; font-weight: 650; cursor: pointer; }
.pt-tourlist { list-style: none; margin: 4px 0 0; padding: 10px 0 0; border-top: 1px solid var(--wb-separator); display: grid; gap: 4px; font-size: 14px; }
.pt-link { padding: 2px 0; border: 0; background: none; color: var(--wb-accent); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.pt-link:hover { text-decoration: underline; }
.pt-how { margin-top: 36px; max-width: 760px; }
.pt-how h2 { font-size: 19px; margin: 0 0 8px; }
.pt-how li { margin: 6px 0; line-height: 1.45; }

/* Narrow screens */
@media (max-width: 900px) { .pt-hide-m { display: none !important; } .pt-dots { display: none; } }
@media (max-width: 600px) {
  .pt-bar { gap: 6px; padding: 0 8px; }
  .pt-where, .pt-brand span, .pt-chip { display: none; }
  .pt-btn { padding: 0 9px; }
  .pt-tour { gap: 8px; padding: 0 10px; }
  .pt-tour-txt b { font-size: 14px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pt-tbtn { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) { .pt-toast { transition: none; } }

    support: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l3.9 3.9M14.5 14.5l3.9 3.9M18.4 5.6l-3.9 3.9M9.5 14.5l-3.9 3.9"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    hourglass: '<path d="M7 3h10M7 21h10M8 3v2.5a4 4 0 0 0 1.6 3.2L12 10.5l2.4-1.8A4 4 0 0 0 16 5.5V3M8 21v-2.5a4 4 0 0 1 1.6-3.2L12 13.5l2.4 1.8a4 4 0 0 1 1.6 3.2V21"/>',
    "eye-off": '<path d="M3 3l18 18M10.6 6.1A9.6 9.6 0 0 1 12 6c5 0 8.5 4.5 9.5 6a17 17 0 0 1-2.9 3.4M6.6 7.6C4.4 9 3 11 2.5 12c1 1.5 4.5 6 9.5 6 1.4 0 2.7-.3 3.8-.9"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/>',

    "</defs></svg>";
  K.icons = Object.keys(P);
  const ic = (K.ic = (name, cls = "") => `<svg class="icon ${cls}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`);

  const esc = (K.esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]));

  // ---------- Shared status vocabulary ----------
  // One wording per record status across every screen and platform.
  const STATUS = (K.STATUS = {
    notStarted: ["neutral", "doc", "Not started"],
    draft: ["warning", "doc", "Draft · not submitted"],
    queued: ["warning", "hourglass", "Queued · not received"],
    received: ["success", "check-circle", "Received"],
    notReceived: ["error", "alert", "Not received"],
    held: ["neutral", "eye-off", "Feedback not released"],
    released: ["success", "check", "Feedback released"],
    updated: ["info", "retry", "Feedback updated"],
    excused: ["neutral", "info", "Excused"],
    available: ["info", "clock", "Available"],
    locked: ["neutral", "lock", "Locked"],
    complete: ["success", "check", "Complete"],
    closed: ["neutral", "lock", "Closed"],
    extension: ["accent", "clock", "Extension applied"],
    lastKnown: ["warning", "clock", "Last known"],
    readOnly: ["neutral", "lock", "Read-only"],
    notOpen: ["neutral", "eye-off", "Not open yet"],
    preview: ["warning", "eye", "Instructor preview"],
  });
  const badge = (K.badge = (key, text) => {
    const [kind, icon, label] = STATUS[key] || ["neutral", "info", key];
    return `<span class="badge ${kind}">${ic(icon)}${esc(text || label)}</span>`;
  });

  // ---------- Actions ----------
  // go: "S05:open" navigates the review page to that screen/state. note: preview-only explanation.
  const attrs = (o) => (o.go ? ` data-go="${o.go}"` : "") + (o.note ? ` data-note="${esc(o.note)}"` : "") + (o.label ? ` aria-label="${esc(o.label)}"` : "") + (o.disabled ? ` aria-disabled="true"` : "") + (o.describedby ? ` aria-describedby="${o.describedby}"` : "");
  K.btn = (text, o = {}) => `<button type="button" class="${o.cls || "btn"}"${attrs(o)}>${o.icon ? ic(o.icon) : ""}${text}</button>`;
  // In-page anchor for screens on this page; the other batch page for screens designed elsewhere.
  K.href = (go) => { const id = go.split(":")[0], xb = window.MAP && window.MAP.xb; return xb && xb[id] ? `${xb[id].file}#${go}` : "#" + id; };
  K.link = (text, o = {}) => `<a href="${o.go ? K.href(o.go) : "#"}" class="${o.cls || ""}"${attrs(o)}${o.current ? ' aria-current="page"' : ""}>${o.icon ? ic(o.icon) : ""}${text}</a>`;
  K.notice = (kind, icon, title, body, actions = "") => `<div class="notice ${kind}" role="${kind === "error" ? "alert" : "status"}">${ic(icon)}<div><strong>${title}</strong>${body ? `<span>${body}</span>` : ""}${actions ? `<div class="actions">${actions}</div>` : ""}</div></div>`;
  K.qchips = (covered, missing = []) => `<ul class="qchips" aria-label="Question coverage">${K.D.questions.map((q) => (missing.includes(q.id) ? `<li class="qchip missing">${ic("alert")}${q.id}<span class="sr"> has no page</span></li>` : covered ? `<li class="qchip">${ic("check")}${q.id}<span class="sr"> covered</span></li>` : `<li class="qchip missing">${q.id}</li>`)).join("")}</ul>`;

  // Illustrative handwritten page — decorative; every use sits beside a text label/alternative.
  K.page = (n, q, o = {}) => {
    const lines = [];
    const seed = n * 7 + (q.length || 1);
    for (let i = 0; i < 11; i++) {
      const w = 120 + ((seed * (i + 3) * 37) % 130);
      const y = 70 + i * 26;
      lines.push(`<path d="M28 ${y} q ${w / 4} -6 ${w / 2} 0 t ${w / 2} 0" />`);

      else if (st === "denied") left = card("", notice("warning", "camera", "Camera access is blocked for this site", "You can still submit: upload a PDF or photos of your pages. To scan here instead, allow the camera in your browser’s site settings and reload.", btn("Upload PDF or images", { cls: "btn primary", icon: "upload", go: "S07:ready" }) + btn("How to allow the camera", { cls: "btn", go: "P46:selfservice", note: "P46 Technical help opens at camera permissions; returns here" })) + `<div class="w-drop" style="margin-top:16px">${ic("upload")}<div><b style="color:var(--wb-text)">Drop files here</b><p class="meta">PDF, JPG, PNG or HEIC · up to 25 MB each</p></div></div>`);
      else left = card("", (st === "offline" ? notice("warning", "offline", "You’re offline", "Pages you capture stay in this browser tab until you close it. Nothing is sent until you’re back online and submit.") + '<div style="height:12px"></div>' : "") + viewfinder("Camera preview showing page 3 with edges detected") + `<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px">${btn("Capture page " + (count + 1), { cls: "btn primary lg", icon: "camera", note: "Captures the framed page; it joins the tray below" })}${btn("Upload instead", { cls: "btn lg", icon: "upload", go: "S07:ready" })}</div>`);
      const right = card(`Pages <span class="meta">${count} captured</span>`, (count ? pagesTray(count, st === "selected" ? 3 : 0) : `<p class="meta">No pages yet.</p>`) +
        (st === "selected" ? `<div style="margin-top:12px">${notice("warning", "alert", "Page 3 may be hard to read", "Retake it, or keep it if the writing is clear.", btn("Retake page 3", { cls: "btn", note: "Replaces page 3 only" }) + btn("Keep", { cls: "btn plain", note: "Keeps page 3 as captured" }))}</div>` : "") +
        `<div style="margin-top:14px">${btn(count ? `Review ${count} pages` : "Review pages", { cls: "btn primary block", go: count ? "S07:ready" : null, disabled: !count, note: count ? null : "Capture or upload at least one page first" })}</div>`) +
        card("Tips", guides);
      return web({ nav: "courses", crumbs: [...crumbsA, ["Scan pages"]], url: this.url(), body: webHead("Scan pages", "Problem Set 4 · Attempt 1 · 5 questions to cover") + `<div class="w-grid"><div class="w-stack">${left}</div><div class="w-stack">${right}</div></div>` });
    },
    ios(st) {
      if (st === "undecided" || st === "denied") {
        const denied = st === "denied";
        const content = `<div style="text-align:center;padding:30px 8px 10px;display:grid;justify-items:center;gap:10px"><span style="color:var(--wb-accent-text)">${ic("camera")}</span><h1 class="i-large" style="font-size:28px">${denied ? "Camera access is off" : "Scan your pages"}</h1><p class="i-sub" style="margin:0">${denied ? "You can still submit from Photos or Files. To scan here, turn on Camera for Whiteboard in Settings." : "Whiteboard uses the camera only while you scan pages you choose to submit."}</p></div>` +
          group(denied ? [row("Choose from Photos", "", { lead: ic("photo"), go: "S07:ready" }), row("Choose from Files", "", { lead: ic("folder"), go: "S07:ready" }), row("Open Settings", "Turn on Camera for Whiteboard", { lead: ic("camera"), note: "Opens iOS Settings → Whiteboard; returns to this screen" })] : [row("Choose from Photos instead", "", { lead: ic("photo"), go: "S07:ready" }), row("Choose from Files instead", "", { lead: ic("folder"), go: "S07:ready" })]);
        const alert = st === "undecided" ? `<div class="i-alert-wrap" role="alertdialog" aria-modal="true" aria-labelledby="s06-alert"><div class="i-alert"><div class="body"><p class="sysnote">iOS system prompt</p><h2 id="s06-alert">“Whiteboard” Would Like to Access the Camera</h2><p>Scan handwritten pages for assignments you choose to submit.</p></div><div class="btns"><button type="button" data-go="S06:denied">Don’t Allow</button><button type="button" data-go="S06:ready">Allow</button></div></div></div>` : "";
        return ios({ back: ["Cancel", "S05:open"], title: "Scan", tabs: false, body: content, alert });
      }
      const n = st === "selected" ? 4 : 2;
      const raw = `<div class="i-camera"><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px">${btn("Cancel", { cls: "i-iconbtn", go: "S05:open" })}<span style="font-weight:600">Page ${n + 1}</span>${btn(ic("flash"), { cls: "i-iconbtn", label: "Flash: auto", note: "Flash auto / on / off" })}</div>
        ${st === "offline" ? `<div style="margin:0 12px 6px">${notice("warning", "offline", "Offline", "Pages are saved on this iPhone. Nothing is submitted yet.")}</div>` : ""}
        <div class="viewfinder" role="img" aria-label="Camera viewfinder; page edges detected"><div style="width:72%;aspect-ratio:8.5/11;position:relative">${page("3", "3", { noLabel: true })}<div style="position:absolute;inset:-6px;border:2.5px solid #5cc8c8;border-radius:8px"></div></div><span class="i-pill" style="position:absolute;bottom:12px">${ic("check")}Hold still</span></div>
        <div class="i-tray" aria-label="${n} pages captured">${D.pages.slice(0, n).map(([p, q], i) => page(p, q, { warn: st === "selected" && i === 2 })).join("")}</div>
        ${st === "selected" ? `<div style="margin:0 12px 6px">${notice("warning", "alert", "Page 3 may be blurry", "Tap it to retake, or continue.")}</div>` : ""}
        <div class="controls">${btn(ic("photo"), { cls: "i-iconbtn", label: "Add from Photos", go: "S07:ready" })}<button type="button" class="i-shutter" aria-label="Capture page ${n + 1}" data-note="Captures the framed page"></button>${btn(`Done (${n})`, { cls: "i-iconbtn", go: "S07:ready" })}</div><div class="i-home" aria-hidden="true" style="background:#0b0d0e"></div></div>`;
      return ios({ raw, dark: true });
    },
    notes: {
      ready: { web: "Viewfinder with live edge feedback; capture and ‘Upload instead’ sit together so the alternative is never hidden.", ios: "Full-screen dark capture. Tray shows captured pages; Done (n) goes to review; Photos is one tap away." },
      undecided: { web: "Pre-permission explainer sets expectations before the browser prompt; upload path offered at the same level.", ios: "App explains, then iOS shows the system alert with the purpose string. ‘Don’t Allow’ leads to the recovery screen, not a dead end." },
      denied: { web: "Blocked camera is a warning, not an error: upload becomes the primary action, settings help is secondary.", ios: "Photos and Files first; Settings deep link last. Students are never trapped." },
      offline: { web: "Web is honest about tab-only storage — it doesn’t promise background queueing.", ios: "Captures persist on device; banner says nothing is submitted." },
      selected: { web: "Quality check flags one page with a reason and lets the student keep or retake it.", ios: "Flagged page outlined in the tray, with text notice." },
    },
    a11y: ["Viewfinder has a text label; edge-detection status is spoken text, not only the outline colour.", "Shutter is a labelled button (‘Capture page n’).", "Every camera state offers a non-camera route at equal or higher prominence."],
  });

  /* ============ S07 REVIEW SUBMISSION ============ */
  const tagsFor = (st) => (st === "incomplete" ? [["1", "1a, 1b"], ["2", "2"], ["3", "3"], ["4", ""]] : D.pages);
  reg("S07", {
    states: [
      ["ready", "Ready", 0],
      ["confirm", "Confirm submit", null, "Added: consequential-action confirmation"],
      ["incomplete", "Incomplete", 1],
      ["none", "No pages", 2],
      ["interrupted", "Interrupted", 3],
      ["copy", "Received copy", 4],
      ["queued", "Queued offline", null, "Added from iOS brief: queued ≠ received"],
    ],
    url: () => "app.whiteboard.example/courses/phys-110/assignments/ps4/review",
    web(st) {
      const pages = tagsFor(st);
      const attempt = st === "copy" ? 2 : 1;
      const missing = st === "incomplete" ? ["4"] : [];
      const banner = st === "copy" ? `<div class="w-banner" role="status">${ic("info")}<span>You’re editing a copy. <b>Attempt 1</b> (received Oct 15, 6:30 am) stays on record. Submitting creates <b>Attempt 2</b>.</span></div>` : "";
      let grid;
      if (st === "none") grid = card("", `<div class="w-drop">${ic("doc")}<div><b style="color:var(--wb-text)">No pages yet</b><p class="meta">Scan or upload your work to review it here.</p></div><div style="display:flex;gap:8px">${btn("Scan pages", { cls: "btn primary", icon: "camera", go: "S06:ready" })}${btn("Upload PDF or images", { cls: "btn", icon: "upload", note: "Opens the file picker" })}</div></div>`);
      else grid = card(`Pages in submission order <span class="meta">${pages.length} pages</span>`, `<ol class="w-pages">${pages.map(([p, q], i) => {
        const bad = !q;
        const id = `s07-tag-${p}`;
        return `<li class="w-page">${page(p, q || "?")}<div class="w-field${bad ? " invalid" : ""}"><label for="${id}">Page ${p} answers</label><select id="${id}"${bad ? ` aria-invalid="true" aria-describedby="${id}-err"` : ""}><option>${q || "Choose questions"}</option></select>${bad ? `<span class="err" id="${id}-err">Tag the question this page answers.</span>` : ""}</div><div class="tools">${btn(ic("rotate"), { cls: "w-iconbtn", label: `Rotate page ${p}`, note: "Rotates 90°" })}${btn(ic("up"), { cls: "w-iconbtn", label: `Move page ${p} earlier`, disabled: i === 0 })}${btn(ic("down"), { cls: "w-iconbtn", label: `Move page ${p} later`, disabled: i === pages.length - 1 })}${btn(ic("trash"), { cls: "w-iconbtn", label: `Remove page ${p}`, note: "Removes with Undo available for 10 seconds" })}</div></li>`;
      }).join("")}<li class="w-page">${btn(ic("plus") + "Add page", { cls: "btn outline block", go: "S06:ready" })}</li></ol>`);
      const canSubmit = st === "ready" || st === "copy" || st === "confirm";
      const summary = card("Summary", `<dl class="facts"><dt>Attempt</dt><dd>${attempt}</dd><dt>Pages</dt><dd>${st === "none" ? 0 : pages.length}</dd><dt>Due</dt><dd>${D.a.due}</dd></dl><h3 class="eyebrow" style="margin:14px 0 6px">Questions covered</h3>${st === "none" ? qchips(false) : qchips(true, missing)}` +
        (st === "incomplete" ? `<div style="margin-top:12px">${notice("error", "alert", "Question 4 has no page", "Tag a page for question 4, or add a page that answers it.")}</div>` : "") +
        (st === "interrupted" ? `<div style="margin-top:12px">${notice("error", "alert", "Upload stopped at page 3 of 4", "Nothing has been received yet. Your pages and tags are saved here.", btn("Retry upload", { cls: "btn primary", icon: "retry", go: "S08:received" }))}</div>` : "") +
        (st === "queued" ? `<div style="margin-top:12px">${notice("warning", "offline", "You’re offline", "Web submissions need a connection. Keep this tab open and submit when you’re back online — nothing has been sent.")}</div>` : "") +
        `<div style="margin-top:14px">${btn(`Submit attempt ${attempt}`, { cls: "btn primary lg block", go: canSubmit ? "S07:confirm" : null, disabled: !canSubmit, describedby: "s07-why" })}</div><p class="meta" id="s07-why" style="margin-top:8px">${canSubmit ? "After you submit, these pages are locked. Editing later creates a new attempt." : st === "incomplete" ? "Tag question 4 to submit." : st === "none" ? "Add at least one page to submit." : st === "interrupted" ? "Retry the upload to finish submitting." : "Connect to the internet to submit."}</p>`);
      const overlay = st === "confirm" ? `<div class="w-dialog" role="dialog" aria-modal="true" aria-labelledby="s07-dlg"><div><h2 id="s07-dlg">Submit attempt ${attempt}?</h2><p>4 pages covering all 5 questions will be sent to PHYS 110. You’ll get a receipt with the time and page list.</p><p class="meta">Due ${D.a.due}.</p><div class="row">${btn("Keep reviewing", { cls: "btn", go: "S07:ready" })}${btn("Submit", { cls: "btn primary", go: "S08:received" })}</div></div></div>` : "";
      return web({ nav: "courses", crumbs: [...crumbsA, ["Review"]], url: this.url(), banner, overlay, body: webHead("Review your submission", "Check order and tags. Nothing is sent until you submit.") + `<div class="w-grid"><div class="w-stack">${grid}</div><div class="w-stack w-sticky">${summary}</div></div>` });
    },
    ios(st) {
      const pages = tagsFor(st);
      const attempt = st === "copy" ? 2 : 1;
      const top = st === "copy" ? notice("info", "info", "Editing a copy", "Attempt 1 stays on record. Submitting creates Attempt 2.") : st === "interrupted" ? notice("error", "alert", "Upload stopped at page 3 of 4", "Nothing received yet. Pages and tags are saved.", btn("Retry", { cls: "btn primary", go: "S08:received" })) : st === "queued" ? notice("warning", "hourglass", "Queued · not received", "Attempt 1 will upload when you’re online. You’ll get a receipt only after Whiteboard confirms it.", btn("Cancel queued upload", { cls: "btn", note: "Returns the attempt to draft; nothing was sent" })) : st === "incomplete" ? notice("error", "alert", "Question 4 has no page", "Tag a page to continue.") : "";
      const list = st === "none" ? `<div class="i-card" style="text-align:center;justify-items:center;margin-top:40px">${ic("doc")}<div class="t">No pages yet</div><p class="meta">Scan or choose your work to review it here.</p>${btn("Scan pages", { cls: "i-btn", go: "S06:ready" })}${btn("Choose from Files", { cls: "i-btn secondary", note: "Opens the Files picker" })}</div>`
        : group(pages.map(([p, q]) => `<div style="width:54px">${page(p, q || "?")}</div><div class="grow"><div class="t b">Page ${p}</div><button type="button" class="rowbtn s" style="color:${q ? "var(--wb-accent-text)" : "var(--wb-error)"}" data-note="Opens a question picker (multi-select)">${q ? "Answers " + q : ic("alert") + " Choose questions"}</button></div><span style="color:var(--wb-text-2)" aria-label="Reorder page ${p}" role="img">${ic("grip")}</span>`), { h: "Pages · drag to reorder", foot: "Swipe left on a page to remove it." });
      const can = st === "ready" || st === "copy" || st === "confirm";
      const bottom = st === "none" ? "" : `<div style="display:flex;justify-content:center">${qchips(true, st === "incomplete" ? ["4"] : [])}</div>` + btn(st === "queued" ? "Waiting for connection…" : `Submit attempt ${attempt}`, { cls: "i-btn", go: can ? "S07:confirm" : null, disabled: !can, note: can ? null : "Unavailable until the issue above is fixed" });
      const sh = st === "confirm" ? sheet(`Submit attempt ${attempt}?`, "4 pages · all 5 questions · PHYS 110", btn("Submit", { cls: "i-btn", go: "S08:received" }), "Keep reviewing") : "";
      return ios({ back: ["Cancel", "S05:open"], title: "Review", tabs: false, trail: btn("Add", { cls: "i-iconbtn", go: "S06:ready" }), body: (top ? top + '<div style="height:6px"></div>' : "") + list, bottom, sheet: sh });
    },
    notes: {
      ready: { web: "Readable thumbnails in order; each has a labelled tag control and rotate/move/remove buttons. Summary repeats exactly what will be sent.", ios: "Vertical list with drag handles; tag line is a button opening a multi-select picker. Coverage chips sit above Submit." },
      confirm: { web: "Modal confirmation restates attempt, pages and coverage; ‘Keep reviewing’ is the default focus.", ios: "Half sheet with the same facts; Cancel is labelled ‘Keep reviewing’." },
      incomplete: { web: "Missing tag shown at the field (aria-invalid + message) and in the summary; Submit disabled with a stated reason.", ios: "Untagged row turns red with icon + text; notice at top." },
      none: { web: "Empty state with both capture routes.", ios: "Same; Add in nav bar also works." },
      interrupted: { web: "Interruption is an error with the critical fact first: nothing received. Retry keeps pages and tags.", ios: "Same notice at top; pages remain below." },
      copy: { web: "Persistent banner explains the new-attempt consequence before any edit.", ios: "Info notice at top; title shows Attempt 2." },
      queued: { web: "Web does not background-queue; it says so plainly.", ios: "iOS may queue with a background upload. ‘Queued · not received’ wording is used everywhere until acknowledgment." },
    },
    a11y: ["Each tag select has a visible label and error association.", "Reorder has button alternatives on web; on iOS, drag also needs VoiceOver ‘Move up/down’ custom actions (spec).", "Disabled Submit remains focusable and is described by its reason."],
  });

  /* ============ S08 SUBMISSION RECEIPT ============ */
  const receiptFacts = (ref, at, attempt, n = 4) => `<dl class="facts"><dt>Receipt</dt><dd><code>${ref}</code></dd><dt>Received</dt><dd>${at}</dd><dt>Assignment</dt><dd>${D.a.title}</dd><dt>Attempt</dt><dd>${attempt}</dd><dt>Pages</dt><dd>${n}</dd><dt>Tags</dt><dd>${D.pages.map(([p, q]) => `p${p}: ${q}`).join(" · ")}${n > 4 ? " · p5: 3" : ""}</dd></dl>`;
  reg("S08", {
    states: [
      ["received", "Received", 0],
      ["interrupted", "Interrupted", 1],
      ["pending", "Pending retry", 2],
      ["earlier", "Earlier attempt", 3],
    ],
    url: () => "app.whiteboard.example/courses/phys-110/assignments/ps4/receipt",
    web(st) {
      const next = card("What happens next", `<ol style="display:grid;gap:10px;list-style:decimal;padding-left:18px"><li data-handoff="S17">Course staff (${D.course.instructor} and TA ${D.course.ta}) grade received work in their own workspace.</li><li>Your instructor releases feedback for the course.</li><li>You’ll get an update when it’s released.</li></ol><div style="margin-top:12px;display:flex;align-items:center;gap:8px">${badge("held")}${btn("Check feedback status", { cls: "btn plain", go: "S09:held" })}</div>`);
      let main;
      if (st === "interrupted") main = card("", `<div style="display:flex;gap:12px;align-items:flex-start"><span style="color:var(--wb-error)">${ic("alert")}</span><div><h2 style="font-size:20px">Not submitted</h2><p style="margin-top:4px">No receipt was issued. Your work hasn’t been received.</p></div></div><div style="margin-top:14px">${notice("neutral", "doc", "Your 4 pages and tags are saved", "You have until " + D.a.due + ".")}</div><div style="display:flex;gap:8px;margin-top:14px">${btn("Retry submission", { cls: "btn primary", icon: "retry", go: "S08:received" })}${btn("Review pages", { cls: "btn", go: "S07:interrupted" })}</div>`);
      else if (st === "pending") main = card("", `<div style="display:flex;gap:12px;align-items:flex-start"><span style="color:var(--wb-warning)">${ic("hourglass")}</span><div><h2 style="font-size:20px">Waiting to send</h2><p style="margin-top:4px">Attempt 1 is saved and will retry automatically. <b>This is not a receipt.</b></p></div></div><div style="display:flex;gap:8px;margin-top:14px">${btn("Retry now", { cls: "btn primary", icon: "retry", go: "S08:received" })}${btn("Review pages", { cls: "btn", go: "S07:queued" })}</div>`);
      else {
        const cur = st === "earlier" ? [D.receipt.ref2, D.receipt.at2, 2, 5] : [D.receipt.ref, D.receipt.at, 1, 4];
        main = card("", `<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:14px"><span style="color:var(--wb-success)">${ic("check-circle")}</span><div><h2 style="font-size:20px">Submission received</h2><p class="meta">Keep this receipt. It records exactly what PHYS 110 received.</p></div></div>${receiptFacts(...cur)}<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">${btn("Review received pages", { cls: "btn", go: "S07:copy", note: "Read-only view; editing starts a new attempt" })}${btn("Download receipt", { cls: "btn", icon: "download", note: "Downloads a text receipt (fictional)" })}${btn("Back to assignment", { cls: "btn plain", go: "S05:received" })}</div>`) +
          (st === "earlier" ? card("Earlier attempts", `<ul class="w-list inset"><li><div class="grow"><span class="title">Attempt 1 · <code>${D.receipt.ref}</code></span><div class="meta">${D.receipt.at} · 4 pages · kept on record</div></div>${btn("View", { cls: "btn", note: "Opens the preserved Attempt 1 receipt snapshot" })}</li></ul><p class="meta" style="margin-top:8px">Attempt 2 is the current attempt sent for grading.</p>`) : "");
      }
      return web({ nav: "courses", crumbs: [...crumbsA, ["Receipt"]], url: this.url(), body: webHead(st === "interrupted" || st === "pending" ? "Submission status" : "Receipt", D.a.title) + `<div class="w-grid"><div class="w-stack">${main}</div><div class="w-stack">${st === "received" || st === "earlier" ? next : card("Need help?", `<p class="meta">If retrying doesn’t work, technical help can check your connection and files. Your deadline doesn’t change automatically.</p>${btn("Get technical help", { cls: "btn plain", icon: "help", go: "P46:selfservice" })}`)}</div></div>` });
    },
    ios(st) {
      if (st === "interrupted" || st === "pending") {
        const intr = st === "interrupted";
        return ios({ back: ["Problem Set 4", "S05:open"], title: "Status", tabs: false,
          body: `<div style="text-align:center;padding:28px 8px 6px;display:grid;justify-items:center;gap:8px"><span style="color:var(--wb-${intr ? "error" : "warning"})">${ic(intr ? "alert" : "hourglass")}</span><h1 class="i-large" style="font-size:28px">${intr ? "Not submitted" : "Waiting to send"}</h1><p class="i-sub" style="margin:0">${intr ? "No receipt was issued. Your work hasn’t been received." : "Queued · not received. It uploads when you’re online; this is not a receipt."}</p></div>` +
            group([row("4 pages and tags", "Saved on this iPhone", { lead: ic("doc"), go: intr ? "S07:interrupted" : "S07:queued" }), row("Due", D.a.due)]),
          bottom: btn(intr ? "Retry submission" : "Retry now", { cls: "i-btn", go: "S08:received" }) });
      }
      const e = st === "earlier";
      return ios({ back: ["Problem Set 4", "S05:received"], title: "Receipt", tabs: false,
        body: `<div style="text-align:center;padding:20px 8px 6px;display:grid;justify-items:center;gap:6px"><span style="color:var(--wb-success);font-size:30px">${ic("check-circle")}</span><h1 class="i-large" style="font-size:28px">Received</h1><p class="i-sub" style="margin:0">${e ? D.receipt.at2 : D.receipt.at}</p></div>` +
          group([row("Receipt", `<code>${e ? D.receipt.ref2 : D.receipt.ref}</code>`), row("Attempt", e ? "2 · current" : "1"), row("Pages", e ? "5 · all questions tagged" : "4 · all questions tagged", { go: "S07:copy" })], { h: "Details" }) +
          group([row("Feedback", "Not released yet", { go: "S09:held", trail: badge("held", "Held") })], { h: "Next", foot: "Course staff grade received work; your instructor releases feedback." }) +
          (e ? group([row("Attempt 1", `${D.receipt.ref} · Oct 15 · 4 pages`, { note: "Preserved receipt snapshot" })], { h: "Earlier attempts" }) : ""),
        bottom: btn("Done", { cls: "i-btn secondary", go: "S05:received" }) });
    },
    notes: {
      received: { web: "Receipt reads like a document: reference, time, attempt, pages and tags. ‘What happens next’ names who grades and that release is separate. The S08→S17 staff handoff is explained, never shown as a link.", ios: "Confirmation header, grouped facts, feedback status row. Reached only after server acknowledgment." },
      interrupted: { web: "Different heading (‘Not submitted’), different icon and colour, and no reference number — the absence of a receipt is the message.", ios: "Same; Retry is the single primary action." },
      pending: { web: "Pending uses the queued vocabulary and says ‘This is not a receipt.’", ios: "Queued uploads from iOS land here until acknowledged." },
      earlier: { web: "Current receipt on top; earlier receipts are preserved snapshots, listed separately.", ios: "Earlier attempts section below Next." },
    },
    a11y: ["Receipt reference in code style but plain text (copyable, readable).", "Success/failure headings differ in words, not only icon and colour.", "Focus lands on the heading after submission."],
  });

  /* ============ S09 FEEDBACK ============ */

      const list = group(D4.att.map(([n, s]) => row(esc(n), n === "Daniel Kim" && st === "corrected" ? "Corrected Oct 19 · sign-in p. 2" : "Sign-in sheet", { trail: n === "Daniel Kim" && st === "disputed" ? badge("disputed") : n === "Daniel Kim" && st === "corrected" ? badge("corrected", "Present") : badge(s), go: n === "Daniel Kim" ? "S23:disputed" : undefined, note: n === "Daniel Kim" ? undefined : "Opens a correction" })), { h: `${L.name} · Thu, Oct 15`, foot: st === "delayed" ? "Last entry Fri, Oct 16 · 9:05 am. Lab L01 not entered yet — not counted as absent." : "Source: lab sign-in sheet, entered by Maya Chen." });

      return iStaff({ back: ["Insights", "S23:followup"], title: "Attendance", trail: K.iStaffAvatar, body: seg("Attendance") + (st === "delayed" ? notice("warning", "clock", "Entries may be behind", "Last known record shown.") + '<div style="height:10px"></div>' : "") + list + (st === "corrected" ? group([ival("Changed", "Absent → Present"), ival("By", "Dr. Diane Reyes · Oct 19")], { h: "Daniel Kim · history" }) : "") + foot, sheet: sh });
    },

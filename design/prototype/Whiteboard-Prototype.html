/* batch04/screens_sched.js */
/* Batch 04 academic scheduling screens: S24 academic timetable, S25 schedule-change review.
   Scheduling-office shell from batch04/kit4.js. Scenario: Keene Center 212’s projector fails Tue,
   Oct 13; MATH 220 moves to Keene Center 105 for Oct 15–29. Proposal Wed, Oct 14 · 9:10 am, approved
   4:05 pm, applied in the source Thu, Oct 15 · 7:30 am — the change S12 shows learners at 7:40 am. */
(function () {
  "use strict";
  const K = window.K;
  const { D4, ic, esc, badge, btn, link, notice, card, webHead, ios, group, row, ival, table, tl, radio, cbox, desktopNote, webSched } = K;
  const reg = K.reg;
  const CH = D4.change, R = D4.registrar, T = D4.proposer;
  const iSched = (o) => ios({ tabs: K.SCHEDTABS, ...o });
  const DAYS = [["Mon", "M"], ["Tue", "T"], ["Wed", "W"], ["Thu", "Th"], ["Fri", "F"]];
  const PAT = { MWF: ["Mon", "Wed", "Fri"], TTh: ["Tue", "Thu"], MW: ["Mon", "Wed"], Tue: ["Tue"], Thu: ["Thu"] };
  const onDay = (pat, d) => PAT[pat].includes(d[0]);

  /* ============ S24 ACADEMIC TIMETABLE ============ */
  const refresh = { current: "Mon, Oct 12 · 6:00 am ET", conflict: "Wed, Oct 14 · 6:00 am ET", delayed: "Wed, Oct 14 · 6:00 am ET", proposal: "Wed, Oct 14 · 12:00 pm ET", applied: "Thu, Oct 15 · 7:30 am ET" };
  const mtg = (m, st, p) => {
    const [days, time, course, room, cap, who, flag] = m;
    let cls = "mtg", extra = "", rm = room;
    if (flag === "m220") {
      cls += " sel";
      if (st === "conflict") { cls += " conflict"; extra = `<span class="flag">${ic("alert")}Projector out of service</span>`; }
      if (st === "proposal") extra = `<span class="prop">${ic("pencil")}Proposed: Keene Center 105 · not applied</span>`;
      if (st === "applied") { rm = "Keene Center 105"; extra = `<span class="flag ok">${ic("check")}Changed Oct 15–29 · applied in source</span>`; }
    }
    return `<li><a href="#" class="${cls}"${flag === "m220" ? ' aria-current="true"' : ""} data-note="Selects ${esc(course)} (${esc(days)} ${esc(time)})"><b>${esc(course)}</b><span>${esc(time)}</span><span class="meta">${esc(rm)} · ${esc(cap)}</span>${extra}</a></li>`;
  };
  const grid = (st, p) => `<div class="w-tt" role="group" aria-label="Weekly timetable, Monday to Friday">${DAYS.map((d) => `<section class="day" aria-label="${d[0]}"><h3>${d[0]}</h3><ul>${D4.meetings.filter((m) => onDay(m[0], d)).map((m) => mtg(m, st, p)).join("")}</ul></section>`).join("")}</div>`;
  const cons = (st) => {
    const proj = st === "conflict" || st === "proposal" ? ["err", "Projector · out of service Oct 14–29 (Facilities FN-1187)"] : ["ok", st === "applied" ? "Projector · working in Keene Center 105" : "Projector · working"];
    return K.checks([["ok", `Room free for every meeting`], ["ok", `Capacity ${st === "applied" ? "64" : "60"} ≥ 58 enrolled`], proj, ["ok", "Step-free access"], ["ok", "Instructor has no other meeting"]].map(([k, t]) => [k, t]), "Constraints for MATH 220 lecture");
  };
  const rail24 = (st) => {
    const facts = `<dl class="facts"><dt>When</dt><dd>TTh 10:30–11:45 am</dd><dt>Room</dt><dd>${st === "applied" ? "Keene Center 105 <span class=\"meta\">· Oct 15–29, then 212</span>" : "Keene Center 212"}</dd><dt>Instructor</dt><dd>Dr. Samuel Price</dd><dt>Enrolled</dt><dd>58</dd></dl>`;
    const acts = {
      current: `${btn("Propose a change…", { cls: "btn block", go: "S25:draft" })}${btn("Inspect room options", { cls: "btn plain block", icon: "building", go: "S26:available", note: "Opens Find a room (S26). The S26 preview follows the Physics After Dark scenario; from here it would open prefilled with TTh 10:30–11:45, 58 seats and a projector." })}`,
      conflict: `${btn("Propose a change…", { cls: "btn primary block", go: "S25:draft" })}${btn("Inspect room options", { cls: "btn plain block", icon: "building", go: "S26:available", note: "Opens Find a room (S26) prefilled with TTh 10:30–11:45, 58 seats and a projector. The S26 preview follows the Physics After Dark scenario." })}`,
      delayed: `${btn("Propose a change…", { cls: "btn block", go: "S25:draft", note: "Proposals can be drafted; checks re-run when the source refreshes" })}`,
      proposal: `${notice("warning", "pencil", `Proposal ${CH.ref} open`, `Submitted Wed, Oct 14 · 9:40 am ET by ${T.name}. The source timetable is unchanged until a decision is applied there.`)}<div style="height:8px"></div>${btn("Open review", { cls: "btn block", go: "S25:submitted" })}`,
      applied: `${notice("success", "check", "Applied in the source", `Refreshed copy shows Keene Center 105 for Oct 15–29 (${CH.ref}).`)}<div style="height:8px"></div>${btn("View decision record", { cls: "btn block", go: "S25:applied" })}${K.handoff("S12", "Learners and Dr. Price see it in Calendar (S12) as a changed meeting, because the source applied it — an approval alone notifies no one.")}`,
    }[st];
    return `<div class="w-rail">${card("MATH 220 lecture", `${facts}<h3 class="eyebrow" style="margin:12px 0 4px">Constraints</h3>${cons(st)}<div style="display:grid;gap:8px;margin-top:12px">${acts}</div>`)}${card("Source", `<dl class="facts"><dt>Timetable</dt><dd>${CH.source}</dd><dt>Status</dt><dd>${st === "delayed" ? badge("lastKnown") : badge("applied", "Source snapshot applied")}</dd><dt>Refreshed</dt><dd>${refresh[st]}</dd></dl><p class="meta" style="margin-top:8px">Whiteboard shows a read-only copy. Proposals never edit it.</p>`)}</div>`;
  };
  reg("S24", {
    states: [
      ["current", "Current", 0],
      ["conflict", "Conflict", 1],
      ["delayed", "Source delayed", 2],
      ["proposal", "Proposal open", 3],
      ["applied", "Change applied", 4],
    ],
    url: () => "app.whiteboard.example/scheduling/fall-2026/timetable?buildings=keene,hollis",
    web(st) {
      const banner = st === "delayed" ? `<div class="w-banner" role="status">${ic("clock")}<span><b>Source refresh delayed.</b> Showing the last-known timetable from Wed, Oct 14 · 6:00 am ET. Nothing here was removed; constraint checks re-run when the source responds.</span></div>` : st === "conflict" ? `<div class="w-banner" role="alert" style="background:var(--wb-error-bg, var(--wb-warning-bg))">${ic("alert")}<span><b>1 constraint conflict.</b> MATH 220 lecture needs a projector; Keene Center 212’s is out of service Oct 14–29.</span></div>` : "";
      const right = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="w-seg" role="group" aria-label="View"><button type="button" aria-pressed="true" data-note="Grid by day">Grid</button><button type="button" aria-pressed="false" data-note="Sortable list by room, course or instructor">List</button></div>${btn("Filters · 2", { cls: "btn", icon: "sliders", note: "Buildings: Keene Center, Hollis Hall · Fall 2026 · weekly pattern" })}</div>`;
      return webSched({ crumbs: [["Academic scheduling", "S24:current"], ["Fall 2026 timetable"]], url: this.url(st), banner, body: webHead("Academic timetable", `Fall 2026 · weekly pattern · Keene Center and Hollis Hall · ${st === "delayed" ? "last known" : "source applied"} · refreshed ${refresh[st]}`, right) + `<div class="w-grid edit">${card("", grid(st, "ws24"), { label: "Timetable grid" })}${rail24(st)}</div>` });
    },
    ios(st) {
      const seg = `<div class="i-seg" role="group" aria-label="Day">${DAYS.map((d) => `<button type="button" aria-pressed="${d[0] === "Thu"}" data-note="Shows ${d[0]}">${d[0]}</button>`).join("")}</div>`;
      const rows = D4.meetings.filter((m) => onDay(m[0], DAYS[3])).map((m) => {
        const is = m[6] === "m220";
        const trail = !is ? "" : st === "conflict" ? badge("conflict", "Conflict") : st === "proposal" ? badge("proposalOpen", "Proposal open") : st === "applied" ? badge("applied", "Changed") : st === "delayed" ? badge("lastKnown") : "";
        return row(esc(m[2]), `${m[1]} · ${is && st === "applied" ? "Keene Center 105" : m[3]}`, { trail, go: is ? (st === "proposal" ? "S25:submitted" : st === "applied" ? "S25:applied" : "S25:draft") : undefined, note: is ? undefined : "Opens meeting detail" });
      });
      const sh = st === "conflict" ? K.sheet("MATH 220 lecture", "Thu 10:30–11:45 am · Keene Center 212 · 58 enrolled", group([row("Projector out of service", "Oct 14–29 · Facilities FN-1187", { lead: ic("alert") }), row("Capacity 60 ≥ 58", "", { lead: ic("check") }), row("Instructor free", "", { lead: ic("check") })]) + btn("Propose a Change…", { cls: "i-btn", go: "S25:draft" }), "Close") : "";
      const top = st === "delayed" ? notice("warning", "clock", "Source refresh delayed", "Last known: Wed, Oct 14 · 6:00 am.") : st === "applied" ? notice("success", "check", "Source applied a change", "MATH 220 is in Keene Center 105 Oct 15–29.") : "";
      return iSched({ tab: "timetable", large: "Timetable", sub: `Fall 2026 · refreshed ${refresh[st].replace(" ET", "")}`, trail: K.iAv(R), body: top + (top ? '<div style="height:10px"></div>' : "") + seg + group(rows, { h: "Thursday · Keene + Hollis" }) + `<p class="i-foot" data-handoff="S12">Learners see a meeting change in Calendar (S12) only after the source applies it.</p>` + desktopNote("Comparing simultaneous meetings across the week is easier on the grid.", "app.whiteboard.example/scheduling/fall-2026/timetable"), sheet: sh });
    },
    notes: {
      current: { web: "Read-only source copy as a Mon–Fri grid with a meeting detail rail (constraints, actions) and a Source card (system, status, last refresh). Grid/List toggle for different comparisons.", ios: "Mapped agenda: day filter + meetings list; meeting detail opens a sheet or the change review. Desktop recommended for the grid." },
      conflict: { web: "Constraint violation attached to the specific meeting (red outline + text flag) and repeated in its checklist with the evidence (Facilities notice). Propose a change becomes primary; room options open S26 Find a room (Batch 05).", ios: "Conflict badge on the row; detail sheet lists the failing constraint." },
      delayed: { web: "Source delayed: status banner and ‘Last known’ status; nothing hidden or removed; proposals can still be drafted.", ios: "Warning notice with the last-known time." },
      proposal: { web: "Proposal shown as a dashed ‘Proposed · not applied’ note inside the source meeting, which still shows Keene Center 212. The applied timetable stays distinct from proposals.", ios: "‘Proposal open’ badge; row opens the review." },
      applied: { web: "Refreshed source copy shows Keene Center 105 with ‘applied in source’. Calendar sharing is a handoff (learners see it in S12 because the source changed), never triggered by approval.", ios: "Success notice; row shows the new room." },
    },
    a11y: ["Each day is a labelled region; meetings are links with full text (course, time, room, enrolment).", "Conflict and proposal are text inside the meeting, not border colour alone.", "Grid/List is a pressed-state button group."],
  });

  /* ============ S25 SCHEDULE-CHANGE REVIEW ============ */
  const pick = { draft: "k105", blocked: "k108" };
  const chosen = (st) => D4.rooms.find((r) => r.id === (pick[st] || "k105"));
  const opts = (st, p) => {
    const ro = !(st === "draft" || st === "blocked");
    return `<fieldset class="w-choice"><legend class="sr">Room options for TTh 10:30–11:45 am</legend>${D4.rooms.map((r) => `<div class="w-opt${r.id === chosen(st).id ? " sel" : ""}">${radio(`${p}-room`, `${p}-${r.id}`, `<b>${r.name}</b> <span class="meta">· seats ${r.cap} · ${r.feat} · ${r.free}</span>`, r.id === chosen(st).id, { disabled: ro, describedby: `${p}-${r.id}-r` })}<span id="${p}-${r.id}-r">${r.ok ? badge("pass", "Meets all constraints") : badge("failC", "Rejected · " + r.why)}</span></div>`).join("")}</fieldset>`;
  };
  const consTable = (st) => {
    const r = chosen(st), bad = !r.ok;
    const P = (ok, t) => `${badge(ok ? "pass" : "failC")} <span>${t}</span>`;
    return table("Constraint results: current and proposed", ["Constraint", "Current · Keene Center 212", `Proposed · ${r.name}`], [
      ["Room free · 5 meetings", P(true, "Yes"), P(true, "Yes")],
      ["Capacity ≥ 58 enrolled", P(true, "60 seats"), P(!bad, `${r.cap} seats`)],
      ["Projector", P(false, "Out of service Oct 14–29"), P(true, "Working")],
      ["Step-free access", P(true, "Yes"), P(true, "Yes")],
      ["Instructor available", P(true, "Same time"), P(true, "Same time")],
      ["Source term dates", P(true, "Fall 2026"), P(true, "Oct 15–29 within term")],
    ]);
  };
  const hist = (st) => {
    const h = [["doc", "Draft started", `Wed, Oct 14 · 9:10 am ET · ${T.name}`]];
    if (["submitted", "approved", "applied"].includes(st)) h.unshift(["send", "Submitted for review", `Wed, Oct 14 · 9:40 am ET · ${T.name}`]);
    if (["approved", "applied"].includes(st)) h.unshift(["check", "Approved", `Wed, Oct 14 · 4:05 pm ET · ${R.name} · “Only feasible room with a projector at this time.”`]);
    if (st === "applied") h.unshift(["publish", "Source copy reflects the decision", `Thu, Oct 15 · 7:30 am ET · ${CH.source} refresh · applied by ${R.name}`]);
    if (st === "blocked") h.unshift(["alert", "Keene Center 108 checked · capacity fails", "Wed, Oct 14 · 9:22 am ET · kept as a rejected alternative"]);
    return tl(h);
  };
  const decision = (st) => ({
    draft: `${notice("info", "info", "Submitting doesn’t change the timetable", "The registrar decides; the source changes only when the decision is applied there.")}<div style="height:10px"></div>${btn("Submit for review", { cls: "btn primary block", go: "S25:submitted" })}${btn("Save draft", { cls: "btn block", note: "Saved · not submitted" })}`,
    blocked: `${btn("Submit for review", { cls: "btn primary block", disabled: true, describedby: "ws25-why", note: "Selected room fails capacity" })}<p class="meta" id="ws25-why" style="margin-top:6px">Keene Center 108 seats 40; 58 are enrolled. Choose a room that meets every constraint.</p>`,
    submitted: `<p class="meta" style="margin-bottom:8px">Your decision is recorded here. It doesn’t change the source timetable.</p>${btn("Approve change", { cls: "btn primary block", go: "S25:approved" })}${btn("Return to proposer…", { cls: "btn block", note: "Sends it back to Tom Becker with your note; nothing is applied" })}`,
    approved: `${notice("warning", "hourglass", "Approved · source not yet changed", `${CH.source} still shows Keene Center 212. Learners see nothing yet.`)}<div style="height:10px"></div>${cbox("ws25-ack", `Apply this decision in ${CH.source} for ${CH.span}`, false)}<div style="height:8px"></div>${btn("Apply source copy", { cls: "btn primary block", go: "S25:applied", note: "Sends the decision to the source; this page waits for its refreshed copy" })}`,
    applied: `${notice("success", "check-circle", "Applied · source copy reflects the decision", "Refreshed Thu, Oct 15 · 7:30 am ET: MATH 220 TTh 10:30 in Keene Center 105 for Oct 15–29.")}<div style="height:10px"></div>${btn("Return to timetable", { cls: "btn block", go: "S24:applied" })}${K.handoff("S12", "Learners and Dr. Price now see the change in Calendar (S12) — notified because the source applied it, not because it was approved.")}`,
  })[st];
  reg("S25", {
    states: [
      ["draft", "Draft", 0],
      ["blocked", "Blocked", 1],
      ["submitted", "Submitted", 2],
      ["approved", "Approved", 3],
      ["applied", "Applied", 4],
    ],
    url: () => `app.whiteboard.example/scheduling/changes/${CH.ref.toLowerCase()}`,
    web(st) {
      const mine = st === "draft" || st === "blocked";
      const stat = { draft: "propDraft", blocked: "blocked", submitted: "pending", approved: "approved", applied: "applied" }[st];
      const r = chosen(st);
      const compare = `<div class="w-grid even">${card("Current · source", `<dl class="facts"><dt>Meeting</dt><dd>${CH.now}</dd><dt>Course</dt><dd>${CH.course}</dd><dt>Enrolled</dt><dd>58</dd></dl>`)}${card(`Proposed${st === "applied" ? " · now applied" : ""}`, `<dl class="facts"><dt>Meeting</dt><dd><span class="w-diff"><s>Keene Center 212</s> ${ic("chev-r")} ${r.name}</span></dd><dt>Dates</dt><dd>${CH.span}</dd><dt>Reason</dt><dd>${CH.reason}</dd></dl>`, { cls: r.ok ? "" : "bad" })}</div>`;
      const left = `<div class="w-stack">${compare}${card(mine ? "Choose a feasible option" : "Options considered", opts(st, "ws25"))}${card("Constraint evidence", consTable(st))}</div>`;
      const rail = `<div class="w-rail">${card(mine ? "Proposal" : "Registrar decision", `<div style="display:grid;gap:8px">${decision(st)}</div>`)}${card("History", hist(st))}</div>`;
      return webSched({ nav: "reviews", who: mine ? T : R, crumbs: [["Timetable", "S24:proposal"], ["Change reviews", "S25:submitted"], [CH.ref]], url: this.url(st), body: webHead(`Schedule change ${CH.ref}`, `${CH.course} · ${mine ? T.name + " · " + T.role : "Proposed by " + T.name}`, badge(stat)) + `<div class="w-grid edit">${left}${rail}</div>` });
    },
    ios(st) {
      const mine = st === "draft" || st === "blocked";
      const r = chosen(st);
      const body = `<div class="i-card"><p class="meta">Current · source</p><p><b>Keene Center 212</b> · TTh 10:30–11:45</p><p class="meta">Projector out of service Oct 14–29</p></div><div class="i-card${r.ok ? "" : " bad"}"><p class="meta">Proposed · ${CH.span}</p><p><b>${r.name}</b> · seats ${r.cap}</p>${r.ok ? badge("pass", "Meets all constraints") : badge("failC", "Capacity fails · 40 < 58")}</div>` +
        group([row("Room Free · 5 Meetings", "", { trail: badge("pass") }), row("Capacity ≥ 58", `${r.cap} seats`, { trail: badge(r.ok ? "pass" : "failC") }), row("Projector", "Working", { trail: badge("pass") }), row("Instructor Available", "", { trail: badge("pass") })], { h: "Constraints" }) +
        (mine ? group(D4.rooms.map((x) => row(x.name, x.ok ? "Meets all constraints" : "Rejected · " + x.why, { trail: x.id === r.id ? ic("check") : "", note: "Choose " + x.name })), { h: "Options" }) : "") +
        (st === "applied" ? `<p class="i-foot" data-handoff="S12">Learners see it in Calendar (S12) because the source applied it.</p>` : "") +
        group([row("Return to Timetable", "", { go: st === "applied" ? "S24:applied" : "S24:proposal" })]) + desktopNote("Room, time and capacity comparisons are easier side by side.", "app.whiteboard.example/scheduling/changes/" + CH.ref.toLowerCase());
      const bottom = { draft: btn("Submit for Review", { cls: "i-btn", go: "S25:submitted" }), blocked: btn("Submit for Review", { cls: "i-btn", disabled: true, note: "Selected room fails capacity" }), submitted: btn("Approve Change", { cls: "i-btn", go: "S25:approved" }), approved: btn("Apply Source Copy…", { cls: "i-btn", go: "S25:applied" }), applied: "" }[st];
      const top = { blocked: notice("error", "alert", "Keene Center 108 can’t hold this class", "Seats 40; 58 enrolled."), approved: notice("warning", "hourglass", "Approved · source not changed", "Learners see nothing yet."), applied: notice("success", "check-circle", "Applied in source", "Refreshed Thu, Oct 15 · 7:30 am.") }[st] || "";
      return iSched({ tab: "reviews", back: ["Reviews", "S25:submitted"], title: CH.ref, trail: K.iAv(mine ? T : R), body: (top ? top + '<div style="height:10px"></div>' : "") + body, bottom });
    },
    notes: {
      draft: { web: "Department scheduler Tom Becker drafts: current vs proposed cards, room options each with a constraint verdict, and a constraint evidence table (current vs proposed). Submitting is explicitly not a timetable change.", ios: "Review stack: current and proposed cards, constraint checklist, options, Submit." },
      blocked: { web: "Choosing Keene Center 108 fails capacity (40 < 58): the proposed card and the table cell fail in text; Submit disabled with the reason. The smaller room stays visible as a rejected alternative.", ios: "Error notice; failing row; Submit disabled." },
      submitted: { web: "Registrar Ruth Adeyemi reviews read-only options and evidence; Approve or Return to proposer. The decision is recorded and does not change the source.", ios: "Approve Change at the bottom." },
      approved: { web: "Approval and application are two named transitions: approved state says the source still shows 212 and learners see nothing; Apply source copy needs an explicit acknowledgment.", ios: "Warning notice; Apply Source Copy…" },
      applied: { web: "Applied only when the refreshed source copy reflects the decision (time and system named). Return to the timetable (S24 applied); learner notice is a Calendar handoff (S12).", ios: "Success notice; handoff note; return row." },
    },
    a11y: ["Room options are radios; each option’s verdict is linked by aria-describedby.", "Pass/fail is text in badges inside the table, not colour.", "Disabled Submit keeps its reason visible and described."],
  });
})();

/* batch05/screens_spaces.js */
/* Batch 05 campus spaces: S26 find a room, S27 reservation request. Requester Priya Nair (Physics
   Society events officer) uses the student shell with her organization tools; Event Services approver
   Marcus Bell uses the campus-operations shell. Choosing a room is not a request; a request is not a
   booking; approval is not confirmation — the reservation system (the source) confirms. */
(function () {
  "use strict";
  const K = window.K;
  const { D5, ic, esc, badge, btn, link, notice, card, webHead, web, webOps, ios, group, row, ival, field, cbox, table, tl, checks, desktopNote, handoff, orgNav, iWho } = K;
  const reg = K.reg;
  const N = D5.need, R = D5.res, PN = D5.priya, MB = D5.marcus;
  const iOrg = (o) => ios({ tabs: K.STUDENTTABS, tab: "campus", trail: iWho(PN), ...o });
  const iOps = (o) => ios({ tabs: K.OPSTABS, ...o });
  const officerWeb = (o) => web({ nav: "none", who: PN, groups: orgNav(o.tool, PN), ...o });

  /* ============ S26 FIND A ROOM ============ */
  const loop = (st) => st === "nomatch";
  const room = (id) => D5.rooms.find((r) => r.id === id);
  // Verdict per room for the current criteria. Every requirement stays visible on every result.
  const verdict = (r, st) => {
    if (r.id === "h104") return loop(st) ? ["partial", "Listening support is portable receivers, not an installed loop"] : ["roomFits", "Free 5:00–7:45 pm · Physics Society’s current hold ends 7:15; nothing else booked"];
    if (r.id === "e100") return ["roomBusy", "Writing Center workshop 4:00–6:00 pm overlaps your 5:00–6:00 pm"];
    return ["roomBusy", "Seats 60 (80 needed) · projector out of service Oct 14–29"];
  };
  const featRow = (r, f, st) => {
    const v = r.feats[f];
    const ok = !/^No|Out of service/.test(v) && !(loop(st) && f === "Listening support" && !/loop/.test(v));
    return `<li class="${ok ? "ok" : "err"}">${ic(ok ? "check-circle" : "x")}<span><span class="sr">${ok ? "Meets" : "Doesn’t meet"}: </span>${f} — ${esc(v)}</span></li>`;
  };
  const roomCard = (r, st, p, sel) => {
    const [k, why] = verdict(r, st);
    return `<li class="w-roomcard${sel ? " sel" : ""}${k === "roomBusy" ? " dim" : ""}"><div class="rh"><b>${r.name}</b><span class="meta">Seats ${r.cap}</span>${badge(k)}</div><p class="meta">${why}</p><ul class="w-checks" aria-label="${r.name} requirements">${N.feats.map((f) => featRow(r, f, st)).join("")}</ul><div class="ra">${sel ? badge("roomFits", "Selected") : k === "roomBusy" ? link("Why unavailable", { go: "S26:unavailable" }) : btn(k === "partial" ? "Choose with portable receivers" : "Choose this room", { cls: "btn", go: "S26:selected" })}</div></li>`;
  };
  const criteria = (st, p) => {
    const inc = st === "incomplete";
    return `<div class="w-form one">${field({ id: `${p}-date`, label: "Date", value: N.date, type: "text", req: true })}<div class="w-form two">${field({ id: `${p}-start`, label: "Start", value: N.start, req: true, hint: "Include setup" })}${field({ id: `${p}-end`, label: "End", value: inc ? "" : N.end, req: true, err: inc ? "Add an end time — rooms are checked for the whole interval, not just the start." : "", hint: inc ? "" : "Include teardown" })}</div>${field({ id: `${p}-cap`, label: "People", value: String(N.cap), type: "number", req: true })}
<fieldset class="w-sel"><legend class="eyebrow">Must have</legend>${cbox(`${p}-proj`, "Projector", true)}${cbox(`${p}-bench`, "Demonstration bench", true)}${cbox(`${p}-step`, "Step-free route to seating", true)}</fieldset>
${field({ id: `${p}-listen`, label: "Listening support", type: "select", value: loop(st) ? "Installed hearing loop only" : "Any (installed loop or portable receivers)", options: ["Not needed", "Any (installed loop or portable receivers)", "Installed hearing loop only"], hint: "Requirements are never dropped to find a match." })}
${btn("Check this time", { cls: "btn primary block", disabled: inc, describedby: inc ? `${p}-end-e` : "", note: inc ? "Add an end time first" : "Re-checks every room for 5:00–7:45 pm" })}</div>`;
  };
  const results = (st, p) => {
    if (st === "incomplete") return `<div class="w-empty">${ic("building")}<div><b>Add an end time to see rooms</b><p class="meta">Availability is checked from start to end. Set so far:</p>${checks([["ok", "Wed, Oct 21 from 5:00 pm"], ["ok", "80 people"], ["ok", "Projector, demonstration bench, step-free route, listening support"], ["todo", "End time"]], "Criteria so far")}</div></div>`;
    if (st === "unavailable") {
      const r = room("e100");
      return `<div class="w-stack">${link(`${ic("chev-l")}All results`, { go: "S26:available", cls: "w-back" })}<h3>${r.name} · seats ${r.cap}</h3>${notice("error", "x", "Unavailable for 5:00–7:45 pm", "Writing Center workshop holds Emery Hall 100 from 4:00 to 6:00 pm. That overlaps the first hour of your interval (5:00–6:00 pm).")}${table(`${r.name} on ${N.date}`, ["Time", "Status"], [["4:00–6:00 pm", "Writing Center workshop · booked"], ["6:00–9:00 pm", "Free"]])}<ul class="w-checks" aria-label="Requirements">${N.feats.map((f) => featRow(r, f, st)).join("")}</ul><p class="meta">Even from 6:00 pm this room has no demonstration bench. Options: start at 6:00 pm without the bench demo, or use Hollis Hall 104, which fits the whole interval.</p><div class="w-row">${btn("Use Hollis Hall 104", { cls: "btn primary", go: "S26:selected" })}${btn("Try 6:00–7:45 pm", { cls: "btn", note: "Re-checks with a 6:00 pm start; the bench requirement still applies" })}</div></div>`;
    }
    const sel = st === "selected";
    const head = st === "nomatch" ? notice("warning", "alert", "No room meets every requirement for 5:00–7:45 pm", "Closest options below say exactly what each one is missing. Nothing has been dropped from your criteria.") : sel ? notice("success", "check", "Hollis Hall 104 selected", "Choosing a room doesn’t reserve it. Next, send a request to Event Services.") : `<p class="meta">3 rooms checked for ${N.date}, ${N.start}–${N.end} · 1 fits everything.</p>`;
    return `<div class="w-stack">${head}<ul class="w-rooms" aria-label="Room results">${D5.rooms.map((r) => roomCard(r, st, p, sel && r.id === "h104")).join("")}</ul></div>`;
  };
  reg("S26", {
    states: [
      ["incomplete", "Criteria incomplete", 0],
      ["available", "Available", 1],
      ["unavailable", "Unavailable", 2],
      ["nomatch", "No full match", 3],
      ["selected", "Room selected", 4],
    ],
    url: (st) => "app.whiteboard.example/spaces/find?date=2026-10-21&from=17:00" + (st === "incomplete" ? "" : "&to=19:45") + "&people=80" + (st === "unavailable" ? "&room=emery-100" : ""),
    web(st) {
      const right = st === "selected" ? btn("Request this room", { cls: "btn primary", go: "S27:draft" }) : "";
      const ctx = `<p class="meta w-ctx">${ic("pencil")} For the event draft ${link("Physics After Dark · revision 2", { go: "S30:pending" })}</p>`;
      return officerWeb({ tool: "rooms", crumbs: [["Physics Society", "S29:officer"], ["Find a room"]], url: this.url(st), body: webHead("Find a room", "Checked for the complete interval · requirements stay on every result", right) + ctx + `<div class="w-grid split">${card("Requirements", criteria(st, "w26"))}${card("", results(st, "w26"), { label: "Results" })}</div>` });
    },
    ios(st) {
      if (st === "incomplete") {
        const sh = K.sheet("Requirements", "Wed, Oct 21 · 80 people", group([ival("Date", "Wed, Oct 21"), ival("Start", "5:00 PM"), ival("End", "Not set", { err: true, s: "Needed to check the whole interval", note: "Opens the time picker" }), ival("People", "80"), ival("Must Have", "Projector, bench, step-free"), ival("Listening Support", "Any")]) + `<p class="i-foot" id="i26-why">Add an end time to see rooms.</p>` + btn("Show Rooms", { cls: "i-btn", disabled: true, describedby: "i26-why", note: "Add an end time first" }), "Close");
        return iOrg({ title: "Find a Room", back: ["Campus", "S28:published"], body: `<div class="i-card"><p class="meta">Set your requirements to see rooms.</p></div>`, sheet: sh });
      }
      if (st === "unavailable" || st === "selected") {
        const r = room(st === "selected" ? "h104" : "e100");
        const top = st === "unavailable" ? notice("error", "x", "Unavailable 5:00–7:45 PM", "Writing Center workshop 4:00–6:00 PM overlaps 5:00–6:00 PM.") : notice("success", "check", "Selected", "Not reserved yet — send a request next.");
        return iOrg({ title: r.name, back: ["Rooms", "S26:available"], body: top + '<div style="height:10px"></div>' + group(N.feats.map((f) => row(f, esc(r.feats[f]), { lead: ic(/^No|Out/.test(r.feats[f]) ? "x" : "check") })), { h: `Seats ${r.cap} · requirements` }) + (st === "unavailable" ? group([row("Use Hollis Hall 104", "Fits the whole interval", { go: "S26:selected" })]) : ""), bottom: st === "selected" ? btn("Request This Room", { cls: "i-btn", go: "S27:draft" }) : "" });
      }
      const chips = `<div class="i-chips">${["Wed, Oct 21", "5:00–7:45 PM", "80 people", loop(st) ? "Hearing loop" : "Listening: any", "Projector", "Bench", "Step-free"].map((c) => link(c, { note: "Opens the requirements sheet; choices are kept" })).join("")}</div>`;
      const rows = D5.rooms.map((r) => { const [k, why] = verdict(r, st); return row(`${r.name} · seats ${r.cap}`, why, { trail: badge(k, k === "roomFits" ? "Fits" : k === "partial" ? "Partial" : "Unavailable"), go: r.id === "h104" ? "S26:selected" : "S26:unavailable" }); });
      return iOrg({ title: "Rooms", large: "Rooms", sub: "Checked for the whole interval", back: ["Campus", "S28:published"], body: chips + (loop(st) ? notice("warning", "alert", "No room meets everything", "Each result says what it’s missing.") : "") + group(rows, { h: "3 rooms checked" }) });
    },
    notes: {
      incomplete: { web: "Requirements panel beside results. With no end time the results area says why nothing is shown and lists what is set; the End field carries the error; Check this time is disabled and described by it.", ios: "Requirements sheet with native pickers; Show Rooms disabled with the reason underneath." },
      available: { web: "Every result repeats all four requirements as met/not met in text and names its availability for the whole 5:00–7:45 pm interval. Unavailable rooms stay listed with the reason rather than vanishing.", ios: "Requirement chips persist; result rows carry Fits/Unavailable in words; rows push room detail." },
      unavailable: { web: "Room detail names the conflicting booking and the overlapping minutes, shows the day’s timeline, and offers alternatives without silently changing the request.", ios: "Pushed room detail with the conflict notice and an alternative row." },
      nomatch: { web: "‘Installed hearing loop only’ leaves no full match. The page says so, keeps the requirement, and explains each closest option’s gap — Hollis Hall 104 offers portable receivers; Emery Hall 100 has a loop but a conflict and no bench.", ios: "Warning notice; partial rows say what’s missing." },
      selected: { web: "Choosing Hollis Hall 104 is not a reservation: the notice says the next step is a request to Event Services; Request this room opens S27.", ios: "Room detail with Request This Room at the bottom." },
    },
    a11y: ["Each requirement on each result is a text line with a hidden ‘Meets/Doesn’t meet’ prefix — not colour or icon alone.", "The incomplete End field is linked to the disabled button by aria-describedby.", "Unavailable rooms remain in the list with their reason, so screen-reader counts stay honest."],
  });

  /* ============ S27 RESERVATION REQUEST ============ */
  const mine = (st) => ["draft", "returned", "confirmed"].includes(st);
  const stat27 = { draft: "resDraft", returned: "returned", requested: "requested", approved: "resApproved", confirmed: "resConfirmed" };
  const facts27 = (st) => `<dl class="facts"><dt>Room</dt><dd>${R.room} · seats 80</dd><dt>Date</dt><dd>${R.date}</dd><dt>Interval</dt><dd><span class="w-diff"><s>${R.now}</s> ${ic("chev-r")} ${R.next}</span><span class="meta"> · ${R.setup}</span></dd><dt>People</dt><dd>${R.people}</dd><dt>Requester</dt><dd>${D5.org} · contact ${PN.name}</dd><dt>Purpose</dt><dd>${esc(R.purpose)}</dd></dl>`;
  const draftForm = (st, p) => `<div class="w-form one">${field({ id: `${p}-purpose`, label: "Purpose shown to Event Services", type: "textarea", value: R.purpose, rows: 2 })}<div class="w-form two">${field({ id: `${p}-people`, label: "People", value: "80", type: "number" })}${field({ id: `${p}-setup`, label: "Setup and teardown", value: R.setup })}</div>${field({ id: `${p}-op`, label: "Demonstration bench operator", value: st === "returned" ? "" : "Dr. Lena Vogel (faculty adviser)", req: true, err: st === "returned" ? "Name the staff member who runs the bench demo — Event Services returned the request for this." : "", hint: "Facilities requires a named staff operator for the gas-off bench." })}</div>`;
  const series = () => `<ul class="w-list inset" aria-label="Physics After Dark series · monthly on Wednesdays">${R.series.map(([d, t, k]) => `<li><div class="grow"><span class="title">${d}</span><div class="meta">${t}</div></div>${k === "occ-cx" ? badge("occCancelled") : k === "occ-this" ? badge("requested", "This request") : badge("resConfirmed", "Held")}</li>`).join("")}</ul><p class="meta">Changing or cancelling one date never edits the series or the other dates.</p>`;
  const sourceCard = (st) => `<dl class="facts"><dt>System</dt><dd>${D5.resSource}</dd><dt>Shows</dt><dd>${st === "confirmed" ? `Hollis Hall 104 · 5:00–7:45 pm · confirmation AH-SR-77310` : "Hollis Hall 104 · 5:00–7:15 pm (current hold)"}</dd><dt>Status</dt><dd>${st === "confirmed" ? badge("resConfirmed") : badge("lastKnown", "Unchanged")}</dd></dl><p class="meta" style="margin-top:8px">${st === "confirmed" ? "Recorded Fri, Oct 16 · 4:45 pm by Marcus Bell from the reservation system." : "Whiteboard shows the reservation system’s copy. Approving here doesn’t change it."}</p>`;
  const hist27 = (st) => {
    const h = [["doc", "Request drafted from Find a room", "Thu, Oct 15 · 3:20 pm · Priya Nair"]];
    const add = (x) => h.unshift(x);
    if (st !== "draft") add(["send", "Requested", "Thu, Oct 15 · 3:42 pm · Priya Nair"]);
    if (st === "returned") add(["reply", "Returned with reason", "Fri, Oct 16 · 10:05 am · Marcus Bell · “Name the bench operator.”"]);
    if (["requested", "approved", "confirmed"].includes(st)) { add(["reply", "Returned with reason", "Fri, Oct 16 · 10:05 am · Marcus Bell · “Name the bench operator.”"]); add(["send", "Resubmitted · operator Dr. Lena Vogel", "Fri, Oct 16 · 11:30 am · Priya Nair"]); }
    if (["approved", "confirmed"].includes(st)) add(["check", `Approved · details fingerprint ${R.fp}`, "Fri, Oct 16 · 2:15 pm · Marcus Bell"]);
    if (st === "confirmed") add(["check-circle", "Confirmation recorded · AH-SR-77310", "Fri, Oct 16 · 4:45 pm · Marcus Bell · from the reservation system"]);
    return tl(h);
  };
  const action27 = (st, p) => ({
    draft: `${notice("info", "info", "A request isn’t a booking", "Event Services decides; the room is yours only when the reservation system confirms it.")}<div style="height:8px"></div>${btn("Send request", { cls: "btn primary block", go: "S27:requested" })}${btn("Back to event draft", { cls: "btn block", go: "S30:pending" })}`,
    returned: `${notice("warning", "reply", "Returned by Marcus Bell · Fri, Oct 16 · 10:05 am", "“Name the staff member who will run the bench demo. Facilities needs it before approving gas-off bench use.”")}<div style="height:8px"></div>${btn("Resend request", { cls: "btn primary block", disabled: true, describedby: `${p}-op-e`, note: "Add the bench operator first" })}${btn("Back to event draft", { cls: "btn block", go: "S30:pending" })}`,
    requested: `<p class="meta">Approving records these exact details (fingerprint ${R.fp}). Any later change sends the request back to review.</p>${checks([["ok", "Hollis Hall 104 free 5:00–7:45 pm"], ["ok", "80 people · seats 80"], ["ok", "Step-free route · east entrance"], ["ok", "Bench operator named · Dr. Lena Vogel"]], "Request checks")}<div style="height:8px"></div>${btn("Approve request", { cls: "btn primary block", go: "S27:approved" })}${btn("Return with reason…", { cls: "btn block", go: "S27:returned", note: "Returns it to Priya Nair with your reason; nothing is reserved" })}`,
    approved: `${notice("warning", "hourglass", "Approved · not confirmed", `${D5.resSource} still shows 5:00–7:15 pm. The Physics Society and Student Activities see “Approved · not confirmed”.`)}<div style="height:8px"></div>${field({ id: `${p}-conf`, label: "Reservation system confirmation number", value: "", hint: "Copy it from the reservation system after you update the booking there." })}${btn("Record confirmation", { cls: "btn primary block", go: "S27:confirmed", note: "Records the source’s confirmation; Whiteboard never books the room itself" })}`,
    confirmed: `${notice("success", "check-circle", "Confirmed in source", "Hollis Hall 104 is booked 5:00–7:45 pm on Wed, Oct 21 (AH-SR-77310).")}<div style="height:8px"></div>${btn("Back to event draft", { cls: "btn primary block", go: "S30:ready" })}${btn("Open in Calendar", { cls: "btn block", icon: "calendar", go: "S12:request" })}${handoff("S31", "Student Activities sees this confirmation as the event’s room dependency in its review (S31). They can read it, not change it.")}`,
  })[st];
  reg("S27", {
    states: [
      ["draft", "Draft", 0],
      ["returned", "Returned", 1],
      ["requested", "Requested", 2],
      ["approved", "Approved · source pending", 3],
      ["confirmed", "Confirmed", 4],
    ],
    url: () => `app.whiteboard.example/spaces/requests/${R.ref.toLowerCase()}`,
    web(st) {
      const p = "w27";
      const left = `<div class="w-stack">${card(mine(st) && st !== "confirmed" ? "Request" : "Requested details", (st === "draft" || st === "returned" ? facts27(st) + `<div style="height:12px"></div>` + draftForm(st, p) : facts27(st) + (st !== "requested" ? "" : `<p class="meta" style="margin-top:8px">Bench operator: Dr. Lena Vogel (faculty adviser)</p>`)))}${card("Occurrences", series())}${card("Source", sourceCard(st))}</div>`;
      const rail = `<div class="w-rail">${card(mine(st) ? "Your request" : "Decision", `<div style="display:grid;gap:8px">${action27(st, p)}</div>`)}${card("History", hist27(st))}</div>`;
      const head = webHead(`Room request ${R.ref}`, `${R.room} · ${R.date} · ${D5.org}`, badge(stat27[st]));
      const body = head + `<div class="w-grid edit">${left}${rail}</div>`;
      return mine(st) ? officerWeb({ tool: "requests", crumbs: [["Physics Society", "S29:officer"], ["Room requests", "S27:draft"], [R.ref]], url: this.url(st), body }) : webOps({ nav: "requests", who: MB, crumbs: [["Room requests", "S27:requested"], [R.ref]], url: this.url(st), body });
    },
    ios(st) {
      const steps = [["doc", "Draft", "Thu, Oct 15"], ["send", "Requested", st === "draft" ? "Not yet" : "Thu, Oct 15"], ["check", "Approved", ["approved", "confirmed"].includes(st) ? "Fri, Oct 16 · 2:15 PM" : "Not yet"], ["check-circle", "Confirmed in source", st === "confirmed" ? "AH-SR-77310" : "Not yet"]];
      const top = { returned: notice("warning", "reply", "Returned · name the bench operator", "Marcus Bell · Fri, Oct 16"), approved: notice("warning", "hourglass", "Approved · not confirmed", "Reservation system unchanged."), confirmed: notice("success", "check-circle", "Confirmed in source", "Hollis Hall 104 · 5:00–7:45 PM") }[st] || "";
      const body = (top ? top + '<div style="height:10px"></div>' : "") + `<div class="i-card"><p class="t">${R.room}</p><p class="meta">${R.date}</p><p><s>${R.now}</s> → <b>${R.next}</b></p><p class="meta">80 people · ${D5.org}</p></div>` + group(steps.map(([i, t, m]) => row(t, m, { lead: ic(i) })), { h: "Status" }) + (st === "returned" ? `<div class="i-group-form">${K.ifield("i27-op", "Bench Operator", "", { err: "Name a staff operator" })}</div>` : "") + group(R.series.map(([d, t]) => row(d, t)), { h: "Series · monthly", foot: "Each date changes or cancels on its own." }) + (st === "confirmed" ? group([row("Open in Calendar", "", { go: "S12:request" }), row("Back to Event Draft", "", { go: "S30:ready" })]) : "");
      const bottom = { draft: btn("Send Request", { cls: "i-btn", go: "S27:requested" }), returned: btn("Resend Request", { cls: "i-btn", disabled: true, note: "Add the bench operator first" }), requested: btn("Approve…", { cls: "i-btn", go: "S27:approved", note: "Action sheet: Approve or Return with reason" }), approved: btn("Record Confirmation…", { cls: "i-btn", go: "S27:confirmed" }), confirmed: "" }[st];
      const o = { title: R.ref, back: mine(st) ? ["Campus", "S29:officer"] : ["Requests", "S27:requested"], body, bottom };
      return mine(st) ? iOrg(o) : iOps({ tab: "requests", trail: iWho(MB), ...o });
    },
    notes: {
      draft: { web: "Requester workspace: the requested details (old → new interval), the editable request, the series of occurrences and the source panel. The rail says a request isn’t a booking. Back to event draft keeps the booking context (S27→S30).", ios: "Status timeline, facts and Send Request." },
      returned: { web: "Return reason is quoted with who and when; the field it concerns carries the error; Resend is disabled and described by that error.", ios: "Returned notice; the bench-operator field shows the error; Resend disabled." },
      requested: { web: "Approver (Marcus Bell, Event Services) sees read-only details, checks in text and the fingerprint that approval will record. Approve, or Return with reason.", ios: "Ops tab bar; Approve… opens an action sheet with Return." },
      approved: { web: "Approved and confirmed are separate: the source still shows 5:00–7:15 pm, everyone else sees ‘Approved · not confirmed’, and Record confirmation needs the reservation system’s number.", ios: "Warning notice; Record Confirmation…" },
      confirmed: { web: "Confirmed only when the source’s confirmation is recorded (number, time, who). The requester returns to the event draft (S30 ready) or opens Calendar (S12). Student Activities reads it as a dependency (S31 handoff). The Nov 18 single-date cancellation stays in the series.", ios: "Success notice; Calendar and draft rows." },
    },
    a11y: ["Status is words in the badge and in each timeline step, not colour.", "Old → new interval uses a struck-through old value plus words, so it reads correctly without styling.", "Occurrence rows name the exact date; cancelled dates say ‘series kept’."],
  });
})();

/* batch05/screens_life.js */
/* Batch 05 campus life (1/2): S28 campus event discovery (Aisha), S29 organization home (Aisha as
   visitor → member; Priya as officer), S30 collaborative event composer (Priya). Published details stay
   unchanged until an approved revision is published; capacity never drops below confirmed places. */
(function () {
  "use strict";
  const K = window.K;
  const { D5, ic, esc, badge, btn, link, notice, card, webHead, web, ios, group, row, ival, field, checks, tl, handoff, orgNav, iWho, cap } = K;
  const reg = K.reg;
  const E = D5.events, PN = D5.priya, AR = D5.aisha, V = D5.rev;
  const iStu = (o) => ios({ tabs: K.STUDENTTABS, tab: "campus", trail: K.iAvatar, ...o });
  const iOrg = (o) => ios({ tabs: K.STUDENTTABS, tab: "campus", trail: iWho(PN), ...o });

  /* ============ S28 CAMPUS EVENT DISCOVERY ============ */
  const sel28 = { published: "dark", confirmed: "launch", full: "scope", waitlisted: "scope", cancelled: "drop" };
  const mineSt = (e, st) => e.id === "launch" ? ["going", "Place confirmed"] : e.id === "drop" ? ["evCancelled", "Cancelled"] : e.id === "scope" ? (st === "waitlisted" ? ["waitlisted", `Waitlisted · #${e.pos} of ${e.wait}`] : ["full", "Full · waitlist open"]) : ["placesLeft", `${e.cap - e.conf} places left`];
  const order = ["launch", "dark", "scope", "drop"];

    return `<div class="w-stack"><p class="meta" role="status">9 results for “projectile” · grouped by type</p>${RES.map(([h, i, items]) => card(h, `<ul class="w-list inset">${items.map(([t, m, go, arch]) => `<li>${ic(i)}<div class="grow">${go ? link(t, { cls: "title", go }) : link(t, { cls: "title", note: "Opens the archived course read-only" })}<div class="meta">${m}</div></div>${arch ? badge("archived") : ""}</li>`).join("")}</ul>`)).join("")}</div>`;
  };
  reg("P45", {
    states: [
      ["noquery", "No query", 0],
      ["searching", "Searching", 1],
      ["results", "Results found", 2],
      ["noresults", "No results", 3],
      ["restricted", "Restricted result omitted", 4],
    ],
    url: (st) => "app.whiteboard.example/search" + (q45(st) ? "?q=" + encodeURIComponent(q45(st)).replace(/%20/g, "+") : ""),
    web(st) {
      const box = `<div class="w-field"><label for="w45-q">Search Whiteboard</label><input id="w45-q" type="search" value="${esc(q45(st))}" aria-describedby="w45-h"><span class="hint meta" id="w45-h">Searches only what you can open · press / from any page</span></div>`;
      return web({ nav: "today", crumbs: [["Today", "S01:usual"], ["Search"]], url: this.url(st), body: webHead("Search", "Courses, coursework, events, organizations and services") + `<div class="w-grid split">${card("Filters", box + filters("w45"))}${results45(st)}</div>` });
    },
    ios(st) {
      const bar = `<div class="i-field"><label for="i45-q">Search</label><input id="i45-q" type="search" value="${esc(q45(st))}"></div>`;
      let body;
      if (st === "noquery") body = group([row("problem set 4", "", { lead: ic("history"), go: "S05:open" }), row("Events this week", "", { lead: ic("ticket"), go: "S28:published" }), row("Get support", "", { lead: ic("support"), go: "S34:browsing" })], { h: "Recent and Suggested" });
      else if (st === "searching") body = `<p class="i-foot" role="status">Searching…</p>`;
      else if (st === "noresults") body = `<div class="i-card"><p><b>No results for “projectle”</b></p><p class="meta">Did you mean ${link("projectile", { go: "P45:results" })}?</p></div>`;
      else if (st === "restricted") body = `<div class="i-card"><p><b>No results you can open</b></p><p class="meta">Search shows only what you have access to. Ask the owner if you expected something.</p></div>`;
      else body = `<div class="i-chips">${["All", "Courses", "Coursework", "Events", "Services"].map((c, i) => link(c, { note: i ? "Filters to " + c : "Shows every type", current: i === 0 })).join("")}${link("Filters", { note: "Opens the filter sheet: type, term, archived" })}</div>` + RES.map(([h, i, items]) => group(items.map(([t, m, go, arch]) => row(t, m, { lead: ic(i), go: go || null, note: go ? "" : "Opens the archived course read-only", trail: arch ? badge("archived") : "" })), { h })).join("");
      return iStudent({ title: "Search", back: ["Today", "S01:usual"], body: bar + body });
    },
    notes: {
      noquery: { web: "Full results workspace with recent searches and suggestions; the header search and ‘/’ shortcut open it. Hint states that only permitted material is searched.", ios: "Search pushed from the nav-bar search button on Today/Campus or Account (D51) — no sixth tab; recent and suggested rows." },
      searching: { web: "Progress announced in a status region in words; the bar is secondary.", ios: "‘Searching…’ status line." },
      results: { web: "Grouped by type; every result names its source (course, organization, service) and matching context; archived items carry an Archived badge before opening. Results open S03, S05, S10, S28, S29, S34.", ios: "Filter chips + grouped rows; opening a result pushes its destination and Back returns to the kept query." },
      noresults: { web: "Spelling recovery as a link and the filters to widen; nothing invented.", ios: "Did-you-mean link." },
      restricted: { web: "An officer-only organization record exists but isn’t shown, counted or hinted at. Copy says search covers only what you can open and who to ask (D54).", ios: "Same honest empty state." },
    },
    a11y: ["Result counts and progress are announced through role=status.", "Groups are headed lists; the archived badge is text, read before the link.", "Restricted results leave no trace in counts or headings."],
  });

  /* ============ P46 HELP CENTER AND TECHNICAL SUPPORT ============ */
  const T = D6.support;
  const article = card("If an upload stops partway", `<p class="meta">Help article · updated Oct 2026</p><ol style="margin:8px 0 0 18px;display:grid;gap:4px"><li>Check the upload screen: “Nothing received yet” means your work wasn’t sent.</li><li>Keep the app open and retry; your pages and tags are kept.</li><li>If it stops again on the same page, report it below.</li></ol><p class="meta" style="margin-top:8px">${ic("check-circle")} Service status: all Whiteboard services normal (sample).</p>`);
  const diag = (p, st) => `<fieldset class="w-sel"><legend class="eyebrow">Shared with the IT Service Desk — untick to leave out</legend>${cbox(`${p}-d1`, "Page: PHYS 110 › Problem Set 4 › Upload", true)}${cbox(`${p}-d2`, "Time: Thu, Oct 15 · 6:12 am ET", true)}${cbox(`${p}-d3`, "App and browser version", true)}${cbox(`${p}-d4`, "Upload attempt ID U-88F2", true)}</fieldset><p class="meta">Never included: your pages, answers, grades or messages.</p>`;
  const form46 = (st, p) => `<div class="w-form one">${field({ id: `${p}-where`, label: "Where it happened", type: "select", value: "Assignment upload", options: ["Assignment upload", "Quiz", "Sign-in", "Other"] })}${field({ id: `${p}-what`, label: "What happened", type: "textarea", value: "Upload of Problem Set 4 stops at page 3 of 4 and says “Nothing received yet”. Retried twice on Wi-Fi." })}${diag(p, st)}<div class="w-field"><label for="${p}-file">Screenshot (optional)</label><input id="${p}-file" type="file" aria-describedby="${p}-file-h"><span class="hint meta" id="${p}-file-h">${st === "attachment" ? "Your browser is asking which file to share. Only the file you pick is attached." : "Only attached if you choose a file."}</span></div></div>`;
  reg("P46", {
    states: [
      ["selfservice", "Self-service", 0],
      ["draft", "Draft request", 1],
      ["attachment", "Attachment permission", 2],
      ["submitted", "Submitted", 3],
      ["resolved", "Resolved", 4],
    ],
    url: (st) => "app.whiteboard.example/help" + (st === "selfservice" ? "?q=upload+stopped" : st === "submitted" || st === "resolved" ? "/requests/" + T.ref : "/report"),
    web(st) {
      const crumbs = [["Today", "S01:usual"], ["Help"]];
      const side = card("Other help", `<ul class="w-list inset"><li>${ic("lock")}<div class="grow">${link("Can’t sign in?", { cls: "title", go: "P41:error" })}<div class="meta">Sign-in is run by Alder Hill; their help desk resets passwords.</div></div></li><li>${ic("support")}<div class="grow">${link("Academic support", { cls: "title", go: "S34:browsing" })}<div class="meta">Tutoring and advising are separate from technical help.</div></div></li><li>${ic("today")}<div class="grow">${link("Back to Today", { cls: "title", go: "S01:usual" })}</div></li></ul>`);
      let main;
      if (st === "selfservice") main = `<div class="w-stack">${`<div class="w-field"><label for="w46-q">Search help</label><input id="w46-q" type="search" value="upload stopped"></div>`}${article}${card("Still stuck?", `<p class="meta">Report it to the Alder Hill IT Service Desk. You’ll see what’s shared before sending.</p>${btn("Report an issue", { cls: "btn", go: "P46:draft" })}${link("Track a request", { go: "P46:submitted" })}`)}</div>`;
      else if (st === "draft" || st === "attachment") main = card("Report a technical issue", notice("warning", "pencil", "Draft · nothing submitted", "") + form46(st, "w46") + `<div class="w-row" style="margin-top:12px">${btn("Submit request", { cls: "btn primary", go: "P46:submitted" })}${btn("Discard", { cls: "btn plain", go: "P46:selfservice" })}</div>`);
      else if (st === "submitted") main = card("Request " + T.ref, `<p>${badge("techOpen")}</p><dl class="facts" style="margin-top:10px"><dt>Reference</dt><dd>${T.ref}</dd><dt>Received by</dt><dd>Alder Hill IT Service Desk · Thu, Oct 15 · 6:20 am ET</dd><dt>Shared</dt><dd>Your description, page, time, versions, upload attempt ID</dd></dl>${tl([["send", "Submitted by you", "Thu, Oct 15 · 6:20 am ET"], ["hourglass", "Next: the Service Desk replies", "Usually within 1 business day"]])}<p class="meta" style="margin-top:8px">Your Problem Set 4 receipt status isn’t changed by this request. Check it on the assignment.</p>${link("Open Problem Set 4", { go: "S05:open" })}`);
      else main = card("Request " + T.ref, `<p>${badge("techDone")}</p><blockquote class="w-quote"><span>“The upload stopped because of a fault in large-photo handling, fixed Fri, Oct 16. Please retry; your pages are kept.”</span><span class="meta">Alder Hill IT Service Desk · Fri, Oct 16 · 3:05 pm ET</span></blockquote>${tl([["send", "Submitted by you", "Thu, Oct 15 · 6:20 am ET"], ["key", "Vendor support access approved by Alder Hill (4 hours)", "Fri, Oct 16 · 10:00 am ET"], ["check-circle", "Resolved and closed", "Fri, Oct 16 · 3:05 pm ET"]])}${btn("Reopen if it happens again", { cls: "btn", go: "P46:draft" })}`);
      return web({ nav: "today", crumbs, url: this.url(st), body: webHead(st === "selfservice" ? "Help" : "Technical support", "Help with Whiteboard itself · academic support is separate") + `<div class="w-grid">${main}${side}</div>` });
    },
    ios(st) {
      const back = ["Account", "P44:editable"];
      if (st === "selfservice") return iStudent({ title: "Help", back, body: `<div class="i-field"><label for="i46-q">Search help</label><input id="i46-q" type="search" value="upload stopped"></div>` + group([row("If an upload stops partway", "Article · retry keeps your pages", { lead: ic("doc"), note: "Opens the article" })]) + group([row("Report an Issue", "", { go: "P46:draft" }), row("Can’t sign in?", "Alder Hill sign-in help", { go: "P41:error" }), row("Academic support", "Separate from technical help", { go: "S34:browsing" }), row("Back to Today", "", { go: "S01:usual" })]) });
      const formRows = group([ival("Where", "Assignment upload"), row("What happened", "Upload stops at page 3 of 4…"), ival("Screenshot", st === "attachment" ? "Choosing…" : "None")]) + group(["Page", "Time", "Versions", "Upload ID"].map((t, i) => `<div class="grow"><div class="t">${t}</div></div><input type="checkbox" id="i46-d${i}" checked aria-label="Share ${t}">`), { h: "Shared — untick to leave out", foot: "Never included: your pages, answers, grades or messages." });
      if (st === "draft" || st === "attachment") {
        const alert = st === "attachment" ? `<div class="i-alert-wrap" role="alertdialog" aria-modal="true" aria-labelledby="i46-al"><div class="i-alert"><div class="body"><p class="sysnote">iOS system prompt</p><h2 id="i46-al">“Whiteboard” Would Like to Access Your Photos</h2><p>Only the photo you choose is attached to this help request.</p></div><div class="btns"><button type="button" data-note="Nothing attached; you can still submit">Don’t Allow</button><button type="button" data-note="System choice: limited or full access; then the photo picker opens">Allow</button></div></div></div>` : "";
        return iStudent({ title: "Report an Issue", back: ["Help", "P46:selfservice"], body: notice("warning", "pencil", "Draft · nothing submitted", "") + formRows, bottom: btn("Submit", { cls: "i-btn", go: "P46:submitted" }), alert });
      }
      if (st === "submitted") return iStudent({ title: T.ref, back: ["Help", "P46:selfservice"], body: `<p>${badge("techOpen")}</p><div style="height:10px"></div>` + group([ival("Received by", "IT Service Desk"), ival("Sent", "Oct 15 · 6:20 AM"), row("Next", "The Service Desk replies, usually within 1 business day")], { foot: "Your Problem Set 4 status isn’t changed by this request." }) + group([row("Open Problem Set 4", "", { go: "S05:open" })]) });
      return iStudent({ title: T.ref, back: ["Help", "P46:selfservice"], body: `<p>${badge("techDone")}</p><div class="i-card" style="margin-top:10px"><p>“Fault in large-photo handling, fixed Fri, Oct 16. Please retry; your pages are kept.”</p><p class="meta">IT Service Desk · Oct 16 · 3:05 PM</p></div>` + group([row("Reopen if It Happens Again", "", { go: "P46:draft" })]) });
    },
    notes: {
      selfservice: { web: "Help search with a task article and sample service status; ‘Still stuck?’ leads to a report. Side panel separates sign-in problems (run by Alder Hill, P41) and academic support (S34).", ios: "Help stack reached from Account (P44) or a contextual error link." },
      draft: { web: "Issue form: where, what, and an editable list of exactly which diagnostics are shared, plus what’s never included. Draft badge says nothing is submitted.", ios: "Form rows with per-item share checkboxes." },
      attachment: { web: "Choosing a screenshot opens the browser’s own file chooser; the hint explains only the picked file is attached.", ios: "The app explains first; the Photos prompt appears only when adding an attachment (D55)." },
      submitted: { web: "Reference TS-2026-10482 issued with who received it and what was shared; next-step owner named. It doesn’t change the assignment’s receipt status — that stays on S05.", ios: "Reference detail; Problem Set 4 row." },
      resolved: { web: "Reply quoted with who and when; timeline includes the institution-approved vendor access (S37); closed with a Reopen option.", ios: "Reply card and Reopen row." },
    },
    a11y: ["Every diagnostic item is a labelled checkbox; nothing is shared silently.", "The file input has a visible label and a hint explaining what is attached.", "The status badge and the quoted reply carry their meaning in text."],
  });
})();

</script>
<script>
/* Click-through prototype controller. Renders the approved screen designs full-size and follows
   their links. Local only: no network; the remembered platform/theme are per-viewer conveniences.
   Nothing here is production code and all records are fictional. */
(function () {
  "use strict";
  const K = window.K, MAP = window.MAP, P = window.PROTO;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = K.esc;
  const store = { get(k) { try { return localStorage.getItem("wb-proto-" + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem("wb-proto-" + k, v); } catch {} } };
  const title = (id) => (MAP.screens.find((s) => s.id === id) || { title: id }).title;
  const stateOf = (id, st) => K.screens[id].states.find((s) => s[0] === st) || K.screens[id].states[0];
  const roleBy = (k) => P.roles.find((r) => r.key === k);
  const roleOfScreen = (id) => Object.keys(P.screenRole).find((k) => P.screenRole[k].includes(id));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const S = { role: null, id: null, st: null, platform: store.get("platform") || (innerWidth < 720 ? "ios" : "web"), tour: null, step: 0, as: null };
  const view = $("#pt-view"), toastEl = $("#pt-toast");
  let tt;
  function toast(msg, action) {
    toastEl.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button" class="pt-tbtn" data-act="toast">${esc(action.label)}</button>` : "");
    toastEl._act = action && action.run;
    toastEl.classList.add("on");
    clearTimeout(tt);
    tt = setTimeout(() => toastEl.classList.remove("on"), action ? 7000 : 3600);
  }

  // ---------- Routing: #role/S07:confirm ----------
  const hashFor = () => (S.role ? `#${S.role}/${S.id}:${S.st}` + (S.tour ? `/${S.tour}.${S.step}` : "") : "#");
  function go(id, st, opts = {}) {
    if (!K.screens[id]) return toast("That screen isn’t part of this prototype.");
    S.id = id; S.st = stateOf(id, st)[0];
    S.as = opts.as || null;
    if (S.tour && !opts.fromTour) syncTourStep();
    const h = hashFor();
    if (location.hash !== h) history[opts.replace ? "replaceState" : "pushState"](null, "", h);
    render();
  }
  function fromHash() {
    const [role, scr, tour] = location.hash.slice(1).split("/");
    if (!role || !roleBy(role)) { S.role = null; S.tour = null; return renderWelcome(); }
    S.role = role;
    if (tour) { const [t, n] = tour.split("."); if (P.tours[t]) { S.tour = t; S.step = +n || 0; } } else S.tour = null;
    const [id, st] = (scr || roleBy(role).home).split(":");
    S.id = K.screens[id] ? id : roleBy(role).home.split(":")[0];
    S.st = stateOf(S.id, st)[0];
    S.as = S.tour ? P.tours[S.tour].steps[S.step][2] || null : null;
    render();
  }
  window.addEventListener("popstate", fromHash);

  // ---------- Tours ----------
  function syncTourStep() {
    const steps = P.tours[S.tour].steps;
    const exact = steps.findIndex((s, i) => i >= S.step && s[0] === `${S.id}:${S.st}`);
    const any = exact >= 0 ? exact : steps.findIndex((s) => s[0] === `${S.id}:${S.st}`);
    if (any >= 0) { S.step = any; S.as = steps[any][2] || null; }
  }
  function startTour(key) {
    S.tour = key; S.step = 0;
    closeMenus();
    const [s0, , as] = P.tours[key].steps[0];
    const [id, st] = s0.split(":");
    go(id, st, { as, fromTour: true });
  }
  function tourStep(d) {
    const steps = P.tours[S.tour].steps;
    const n = Math.max(0, Math.min(steps.length - 1, S.step + d));
    S.step = n;
    const [id, st] = steps[n][0].split(":");
    go(id, st, { as: steps[n][2], fromTour: true });
  }
  function endTour() { S.tour = null; S.as = null; history.replaceState(null, "", hashFor()); render(); }

  // ---------- Rendering ----------
  function renderWelcome() {
    document.body.classList.add("pt-welcoming");
    $("#pt-bar").hidden = true;
    $("#pt-tour").hidden = true;
    view.className = "pt-welcome";
    view.innerHTML = `<div class="pt-wel-in">
<p class="pt-kicker">Whiteboard · interactive prototype</p>
<h1>Pick a role and click around</h1>
<p class="pt-lead">This is a click-through prototype of Whiteboard, a learning and campus platform for <b>Alder Hill</b>, a fictional college. Every person, course, grade and record is made up. The buttons work: they move through the designs the way the real product would. Each role has guided tours, or you can explore freely.</p>
<div class="pt-roles">${P.roles.map((r) => `<article class="pt-role"><div class="pt-rhead"><span class="pt-av">${r.initials}</span><div><h2>${esc(r.label)}</h2><p class="pt-meta">${esc(r.person)}</p></div></div><p>${esc(r.blurb)}</p>
<button type="button" class="pt-primary" data-act="role" data-role="${r.key}">Explore as ${esc(r.label.toLowerCase())}</button>
<ul class="pt-tourlist">${r.tours.map((t) => `<li><button type="button" class="pt-link" data-act="tour" data-role="${r.key}" data-tour="${t}">${esc(P.tours[t].title)}</button> <span class="pt-meta">· ${P.tours[t].steps.length} steps</span></li>`).join("")}</ul></article>`).join("")}</div>
<section class="pt-how"><h2>How it works</h2><ul>
<li><b>Web or iPhone.</b> Switch at the top. The iPhone screens show a planned app; no native app exists.</li>
<li><b>Tours</b> walk through one task step by step, sometimes switching to another person’s view so you see both sides.</li>
<li><b>Other situations</b> shows the same screen when something is offline, late, blocked or waiting on someone.</li>
<li>Typing doesn’t save anything, and a few controls only explain where they’d lead. Those show a short note instead.</li></ul>
<p class="pt-meta">A design prototype with fictional data. Not a working product, not connected to any school system, and it makes no claims about real customers or results.</p></section></div>`;
    document.title = "Whiteboard prototype";
    $("#pt-view").focus({ preventScroll: true });
  }

  function render() {
    if (!S.role) return renderWelcome();
    document.body.classList.remove("pt-welcoming");
    $("#pt-bar").hidden = false;
    const def = K.screens[S.id], st = stateOf(S.id, S.st);
    const asKey = S.as || roleOfScreen(S.id);
    const asRole = asKey && asKey !== S.role ? roleBy(asKey) : null;
    // Bar
    $("#pt-role").textContent = roleBy(S.role).label;
    $("#pt-where").innerHTML = `<b>${esc(title(S.id))}</b><span class="pt-meta"> · ${esc(st[1])}</span>` + (asRole ? ` <span class="pt-as">Viewing as ${esc(asRole.label.toLowerCase())}</span>` : "");
    for (const b of document.querySelectorAll("[data-platform]")) b.setAttribute("aria-pressed", String(b.dataset.platform === S.platform));
    // Screen
    const html = S.platform === "web" ? def.web(st[0]) : def.ios(st[0]);
    view.className = S.platform === "web" ? "pt-web" : "pt-ios";
    view.innerHTML = S.platform === "web"
      ? `<div class="pt-webframe pv-frame" role="region" aria-label="${esc(title(S.id))}, web">${html}</div>`
      : `<div class="pt-phonewrap"><div class="pt-phone"><div class="screen pv-frame" role="region" aria-label="${esc(title(S.id))}, planned iPhone"><div style="height:100%">${html}</div></div><div class="island" aria-hidden="true"></div></div></div>`;
    decorateHandoffs();
    fitPhone();
    view.scrollTop = 0;
    const wf = $(".pt-webframe"); if (wf) wf.scrollTop = 0;
    // Tour bar
    const tb = $("#pt-tour");
    if (S.tour) {
      const t = P.tours[S.tour], n = t.steps.length, cur = t.steps[S.step];
      const on = cur[0] === `${S.id}:${S.st}`;
      tb.hidden = false;
      tb.innerHTML = `<div class="pt-tour-txt"><span class="pt-meta">${esc(t.title)} · step ${S.step + 1} of ${n}</span><b>${on ? esc(cur[1]) : "You’ve left the tour path. Next continues it."}</b></div>
<div class="pt-dots" aria-hidden="true">${t.steps.map((_, i) => `<i class="${i < S.step ? "done" : i === S.step ? "cur" : ""}"></i>`).join("")}</div>
<div class="pt-tour-btns"><button type="button" class="pt-tbtn" data-act="prev" ${S.step === 0 && on ? "disabled" : ""}>Back</button>${S.step < n - 1 ? `<button type="button" class="pt-tbtn primary" data-act="next">Next</button>` : `<button type="button" class="pt-tbtn primary" data-act="endtour">Finish</button>`}<button type="button" class="pt-tbtn" data-act="endtour" aria-label="Exit tour">✕</button></div>`;
      if (!on) tb.querySelector('[data-act="next"]') && (tb.querySelector('[data-act="next"]').dataset.act = "resume");
    } else tb.hidden = true;
    document.body.classList.toggle("pt-touring", !!S.tour);
    document.title = `${title(S.id)} · Whiteboard prototype`;
  }

  // Student→staff handoffs are explained in words in the designs. In the prototype, offer to look at the other side.
  function decorateHandoffs() {
    for (const p of view.querySelectorAll("[data-handoff]")) {
      const id = p.dataset.handoff;
      if (!K.screens[id]) continue;
      const b = document.createElement("button");
      b.type = "button"; b.className = "pt-handoff"; b.dataset.act = "handoff"; b.dataset.target = id;
      b.textContent = `See the other side: ${title(id)} →`;
      p.after(b);
    }
  }

  function fitPhone() {
    const wrap = $(".pt-phonewrap"); if (!wrap) return;
    const ph = wrap.firstElementChild;
    const availH = view.clientHeight - 24, availW = view.clientWidth - 24;
    const small = innerWidth < 500;
    document.body.classList.toggle("pt-fullphone", small);
    if (small) { ph.style.transform = ""; wrap.style.height = ""; wrap.style.width = ""; return; }
    const sc = Math.min(1, availH / 874, availW / 415);
    ph.style.transform = `scale(${sc})`;
    wrap.style.width = `${415 * sc}px`; wrap.style.height = `${874 * sc}px`;
  }
  window.addEventListener("resize", fitPhone);

  // ---------- Menus ----------
  function closeMenus() { for (const m of document.querySelectorAll(".pt-menu")) m.hidden = true; for (const b of document.querySelectorAll("[aria-expanded]")) b.setAttribute("aria-expanded", "false"); }
  function openMenu(btn, html) {
    const m = $("#" + btn.getAttribute("aria-controls"));
    const open = m.hidden;
    closeMenus();
    if (!open) return;
    m.innerHTML = html; m.hidden = false; btn.setAttribute("aria-expanded", "true");
    const f = m.querySelector("button"); if (f) f.focus();
  }
  const menuRoles = () => P.roles.map((r) => `<button type="button" data-act="role" data-role="${r.key}" ${r.key === S.role ? 'aria-current="true"' : ""}><b>${esc(r.label)}</b><span class="pt-meta">${esc(r.person)}</span></button>`).join("") + `<button type="button" data-act="home"><b>All roles</b><span class="pt-meta">Back to the start page</span></button>`;
  const menuTours = () => { const r = roleBy(S.role); const other = Object.keys(P.tours).filter((t) => !r.tours.includes(t)); return `<p class="pt-mh">${esc(r.label)}</p>` + r.tours.map((t) => `<button type="button" data-act="tour" data-tour="${t}" ${t === S.tour ? 'aria-current="true"' : ""}><b>${esc(P.tours[t].title)}</b><span class="pt-meta">${esc(P.tours[t].intro)}</span></button>`).join("") + `<p class="pt-mh">Other roles’ tours</p>` + other.map((t) => `<button type="button" data-act="tour" data-tour="${t}"><b>${esc(P.tours[t].title)}</b><span class="pt-meta">${esc(roleBy(P.roles.find((x) => x.tours.includes(t)).key).label)}</span></button>`).join(""); };
  const menuStates = () => `<p class="pt-mh">${esc(title(S.id))} in other situations</p>` + K.screens[S.id].states.map((s) => `<button type="button" data-act="state" data-st="${s[0]}" ${s[0] === S.st ? 'aria-current="true"' : ""}><b>${esc(s[1])}</b>${s[3] ? `<span class="pt-meta">${esc(s[3])}</span>` : ""}</button>`).join("");

  // ---------- Events ----------
  const CLOSERS = /^(cancel|close|done|not now|back|keep editing|dismiss|ok|got it)\b/i;
  document.addEventListener("click", (ev) => {
    const a = ev.target.closest("[data-act]");
    if (a) {
      const act = a.dataset.act;
      if (act === "role") { closeMenus(); S.tour = null; S.role = a.dataset.role; const [id, st] = roleBy(S.role).home.split(":"); return go(id, st); }
      if (act === "home") { closeMenus(); S.role = null; S.tour = null; history.pushState(null, "", "#"); return renderWelcome(); }
      if (act === "tour") { if (a.dataset.role) S.role = a.dataset.role; return startTour(a.dataset.tour); }
      if (act === "state") { closeMenus(); return go(S.id, a.dataset.st); }
      if (act === "platform") { S.platform = a.dataset.platform; store.set("platform", S.platform); return render(); }
      if (act === "next") return tourStep(1);
      if (act === "prev") return tourStep(P.tours[S.tour].steps[S.step][0] === `${S.id}:${S.st}` ? -1 : 0);
      if (act === "resume") return tourStep(P.tours[S.tour].steps[S.step][0] === `${S.id}:${S.st}` ? 1 : 0);
      if (act === "endtour") return endTour();
      if (act === "menu-roles") return openMenu(a, menuRoles());
      if (act === "menu-tours") return openMenu(a, menuTours());
      if (act === "menu-states") return openMenu(a, menuStates());
      if (act === "theme") { const r = document.documentElement; const dark = r.getAttribute("data-theme") === "dark" || (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches); r.setAttribute("data-theme", dark ? "light" : "dark"); store.set("theme", dark ? "light" : "dark"); return; }
      if (act === "text") { const big = document.documentElement.style.getPropertyValue("--wb-scale") === "1.24"; document.documentElement.style.setProperty("--wb-scale", big ? "1" : "1.24"); a.setAttribute("aria-pressed", String(!big)); return; }
      if (act === "handoff") { const id = a.dataset.target; return go(id, K.screens[id].states[0][0], { as: roleOfScreen(id) }); }
      if (act === "toast") { toastEl.classList.remove("on"); return toastEl._act && toastEl._act(); }
    }
    if (!ev.target.closest(".pt-menu")) closeMenus();
    const frame = ev.target.closest(".pv-frame");
    if (!frame) return;
    const f = ev.target.closest("[data-focus]");
    if (f) { const t = frame.querySelector("#" + CSS.escape(f.dataset.focus)); if (t) { t.scrollIntoView({ block: "center" }); t.focus({ preventScroll: true }); } return; }
    const t = ev.target.closest("[data-go],[data-note],a,button");
    if (!t) return;
    if (t.matches("a")) ev.preventDefault();
    if (t.matches("input,select,textarea,label")) return;
    if (t.getAttribute("aria-disabled") === "true") return toast(t.dataset.note || "Not available right now. The reason is shown beside it.");
    if (t.dataset.go) {
      const [id, st] = t.dataset.go.split(":");
      if (K.screens[id]) return go(id, st || K.screens[id].states[0][0]);
    }
    const label = (t.textContent || t.getAttribute("aria-label") || "").trim();
    if (CLOSERS.test(label) && history.length > 1 && S.role) return history.back();
    if (t.dataset.note) return toast(t.dataset.note);
    if (t.matches("button,a")) toast("This control isn’t wired in the prototype.");
  });
  document.addEventListener("submit", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMenus();
    if (!S.tour || e.target.closest("input,textarea,select,[contenteditable]")) return;
    if (e.altKey && e.key === "ArrowRight") tourStep(1);
    if (e.altKey && e.key === "ArrowLeft") tourStep(-1);
  });

  // ---------- Start ----------
  const th = store.get("theme"); if (th) document.documentElement.setAttribute("data-theme", th);
  fromHash();
})();

</script>
</body>
</html>
